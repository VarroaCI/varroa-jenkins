# =============================================================================
# Git SSH Deploy Key Secret — for private bundle or catalog repositories.
#
# Create a deploy key pair:
#   ssh-keygen -t ed25519 -f deploy_key
#
# Add the PUBLIC key (deploy_key.pub) to GitHub:
#   Repo → Settings → Deploy keys → Add deploy key
#
# Create the Secret from the PRIVATE key:
#   kubectl create secret generic git-deploy-key \
#     --from-file=ssh-privatekey=deploy_key \
#     -n varroa
#
# Reference the Secret in your CatalogSource or ComposedBundle:
#   secretRef: git-deploy-key
#
# Key facts:
#   - The key name in the Secret MUST be `ssh-privatekey`
#   - The Secret type is `Opaque` (NOT `kubernetes.io/ssh-auth`)
#   - The Secret must live in the same namespace as the referencing resource
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: git-deploy-key
  namespace: varroa
type: Opaque
data:
  ssh-privatekey: <base64-encoded-private-key>   # ← replace with actual key
