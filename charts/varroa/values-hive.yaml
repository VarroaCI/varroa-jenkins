# =============================================================================
# Hive-mode overlay — use with:
#   helm install varroa charts/varroa -f charts/varroa/values-hive.yaml \
#     --set cluster.name=<name> \
#     --set bus.url=tls://<core>:4222 \
#     [the core's auth.* values]
# =============================================================================

# Hive mode: operator+gateway only, joined to a core's NATS.
mode: hive

# The NATS subchart condition cannot be derived from mode; set explicitly.
# jetStreamReplicas still derives from nats.config.cluster.replicas (default 3)
# even though the local subchart doesn't render — override it if the core's
# actual NATS cluster size differs, e.g. --set nats.config.cluster.replicas=5.
nats:
  enabled: false

# Belt-and-braces (templates already self-gate on mode):
dex: {enabled: false}
bff: {enabled: false}
frontend: {enabled: false}

# Optional: default-deny NetworkPolicy for the hive namespace (operator+gateway).
# The core-NATS egress port is derived from bus.url. coreNatsEgress.cidrs is
# required when networkPolicy.enabled is true; the render fails without it.
#networkPolicy:
#  enabled: true
#  coreNatsEgress:
#    cidrs: ["<core-nats-endpoint-ip>/32"]

# Optional: host pipelines cells on this member. The member writes to the
# core record store directly and renders no recorder or database. See
# docs/install/multi-cluster.md ("Record store").
#recordStore:
#  enabled: true
#  postgres:
#    mode: external
#  blobs:
#    mode: s3
#    s3:
#      url: s3://<core-bucket>?region=<region>&endpoint=<member-reachable-endpoint>
#      existingSecret: <s3-credential-secret>
#      artifactSecret: <artifact-secret-base>
#      # Or, in place of artifactSecret, operator-issued STS credentials:
#      # artifactSTS:
#      #   enabled: true
#      #   issuerSecret: <issuer-secret>
#      #   roleArn: <role-arn>
