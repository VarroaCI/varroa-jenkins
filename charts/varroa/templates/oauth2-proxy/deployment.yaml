{{- if not (include "varroa.isHive" .) }}
{{- if (index .Values "oauth2-proxy").enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "oauth2-proxy") }}
  labels:
    app.kubernetes.io/component: oauth2-proxy
    {{- include "varroa.labels" . | nindent 4 }}
spec:
  replicas: {{ (index .Values "oauth2-proxy").replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: oauth2-proxy
      {{- include "varroa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: oauth2-proxy
        {{- include "varroa.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "varroa.fullname" (dict "Release" .Release "name" "oauth2-proxy") }}
      containers:
        - name: oauth2-proxy
          image: "{{ (index .Values "oauth2-proxy").image.repository }}:{{ (index .Values "oauth2-proxy").image.tag }}"
          imagePullPolicy: {{ (index .Values "oauth2-proxy").image.pullPolicy }}
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=static://200
            - --provider=oidc
            - --oidc-issuer-url={{ (index .Values "oauth2-proxy").config.oidcIssuerUrl }}
            - --client-id={{ (index .Values "oauth2-proxy").config.clientId }}
            - --client-secret={{ (index .Values "oauth2-proxy").config.clientSecret }}
            - --redirect-url={{ (index .Values "oauth2-proxy").config.redirectUrl }}
            - --cookie-domain={{ (index .Values "oauth2-proxy").config.cookieDomain }}
            - --cookie-secret={{ (index .Values "oauth2-proxy").config.cookieSecret }}
            - --scope=openid profile email groups
            - --set-xauthrequest=true
            - --pass-access-token=true
            - --pass-authorization-header=true
            - --set-authorization-header=true
            - --email-domain=*
          ports:
            - name: http
              containerPort: 4180
          {{- with (index .Values "oauth2-proxy").resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}

{{- end }}
