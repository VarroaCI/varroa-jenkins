{{- /*
  JetStream encryption key. The NATS container reads it as JS_KEY through
  nats.container.env, and nats.config.jetstream.merge.key refers to it.
  The key must never change for a given NATS volume: a server that starts
  with a different key skips every stream it cannot decrypt. So the chart
  mints the key once and reuses the stored value on each upgrade. A
  renderer that cannot read the cluster mints a new key on each render.
  Examples are helm template, ArgoCD, and Flux. Such an install sets
  nats.encryption.createSecret to false and supplies the Secret itself.
  The keep policy holds the key after an uninstall, because the NATS
  volumes stay too. No pod carries a checksum annotation of this Secret,
  because a key change must never roll NATS. A missing, null, or non-bool
  createSecret keeps the default, true, so the Secret that JS_KEY names
  always renders unless an operator turns it off with false.
*/ -}}
{{- $encryption := .Values.nats.encryption | default dict -}}
{{- $createSecret := true -}}
{{- if and (hasKey $encryption "createSecret") (kindIs "bool" $encryption.createSecret) -}}
{{-   $createSecret = $encryption.createSecret -}}
{{- end -}}
{{- if and .Values.nats.enabled (not (include "varroa.isHive" .)) $createSecret }}
{{- /*
  A fixed name: nats.container.env in values.yaml names this Secret, and a
  subchart value cannot follow the release name.
*/ -}}
{{- $secretName := "varroa-nats-js-key" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $key := "" -}}
{{- if and $existing $existing.data (index $existing.data "key") -}}
{{-   $key = index $existing.data "key" -}}
{{- else -}}
{{- /*
    No stored key. If the live NATS StatefulSet already reads JS_KEY, its
    volumes hold an encrypted store, and a new key would make NATS skip
    every stream. Refuse the render instead of minting over the lost key.
    A renderer without cluster access sees no StatefulSet and mints.
  */ -}}
{{- /*
    The subchart's StatefulSet name depends on fullnameOverride,
    nameOverride, statefulSet.name, and the release name. Its selector
    labels do not, so the check finds the StatefulSet by those labels.
  */ -}}
{{-   $statefulSets := lookup "apps/v1" "StatefulSet" .Release.Namespace "" -}}
{{-   range $sts := ($statefulSets.items | default list) -}}
{{-     $labels := $sts.metadata.labels | default dict -}}
{{-     if and (eq (index $labels "app.kubernetes.io/component" | default "") "nats") (eq (index $labels "app.kubernetes.io/instance" | default "") $.Release.Name) -}}
{{-       range $c := $sts.spec.template.spec.containers -}}
{{-         range $e := ($c.env | default list) -}}
{{-           if eq $e.name "JS_KEY" -}}
{{-             fail (printf "Secret %s is missing, but the live NATS StatefulSet %s already encrypts JetStream with JS_KEY. Restore the Secret from its backup before you upgrade. A new key loses all JetStream state." $secretName $sts.metadata.name) -}}
{{-           end -}}
{{-         end -}}
{{-       end -}}
{{-     end -}}
{{-   end -}}
{{-   $key = randAlphaNum 64 | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/component: nats
    {{- include "varroa.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  key: {{ $key | quote }}
{{- end }}
