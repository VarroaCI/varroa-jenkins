{{- /*
cells-guard.yaml
Validates the cells.* values the chart seeds into a new CellPool. The tenant
floor mirrors the CellPool CRD; the warm floor mirrors the operator seed
(internal/controller/cells_config.go), which keeps one free cell per profile.
Each value must be a whole number that fits a 32-bit integer: the operator
writes it to an int32 CellPool field, and the operator and the BFF fall back
to a compiled default on an env value they cannot parse. The deployment
templates render each value through varroa.cells.int, so a values-file
number never reaches the env in exponent form. Renders no objects.
*/}}

{{- define "varroa.cells.int" -}}
{{- $v := .value -}}
{{- if kindIs "string" $v -}}
{{- if not (regexMatch "^-?(0|[1-9][0-9]*)$" $v) -}}
{{- fail (printf "%s must be a whole number, got %q" .name $v) -}}
{{- end -}}
{{- if gt (len (trimPrefix "-" $v)) 10 -}}
{{- fail (printf "%s must be at most 2147483647, got %q (the CellPool field is a 32-bit integer)" .name $v) -}}
{{- end -}}
{{- else if not (or (kindIs "int64" $v) (kindIs "float64" $v)) -}}
{{- fail (printf "%s must be a whole number, got %v (%s)" .name $v (kindOf $v)) -}}
{{- else if gt (float64 $v) 2147483647.0 -}}
{{- fail (printf "%s must be at most 2147483647, got %v (the CellPool field is a 32-bit integer)" .name $v) -}}
{{- else if ne (float64 $v) (float64 (int64 $v)) -}}
{{- fail (printf "%s must be a whole number, got %v" .name $v) -}}
{{- end -}}
{{- $n := int64 $v -}}
{{- if gt $n 2147483647 -}}
{{- fail (printf "%s must be at most 2147483647, got %v (the CellPool field is a 32-bit integer)" .name $v) -}}
{{- end -}}
{{- printf "%d" $n -}}
{{- end -}}

{{- define "varroa.cells.guardInt" -}}
{{- $n := int64 (include "varroa.cells.int" .) -}}
{{- if lt $n (int64 .floor) -}}
{{- fail (printf "%s must be at least %d, got %v (%s)" .name (int64 .floor) .value .why) -}}
{{- end -}}
{{- end -}}

{{- include "varroa.cells.guardInt" (dict
      "name" "cells.maxTenantsPerCell"
      "value" .Values.cells.maxTenantsPerCell
      "floor" 1
      "why" "the CellPool CRD refuses a lower value") -}}
{{- include "varroa.cells.guardInt" (dict
      "name" "cells.warmPool.perProfile"
      "value" .Values.cells.warmPool.perProfile
      "floor" 1
      "why" "the operator seeds a pool with at least one warm cell") -}}
