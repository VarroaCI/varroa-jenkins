{{- if and .Values.recordStore.enabled (not (include "varroa.isHive" .)) (eq .Values.recordStore.postgres.mode "cnpg") }}
{{- range $role := list "recorder" "client" "gateway" }}
{{- $password := include "varroa.recordStore.password" (dict "root" $ "role" $role) }}
{{- $username := printf "varroa_%s" $role }}
{{- $dsn := printf "postgres://%s:%s@varroa-recordstore-rw.%s.svc:5432/varroa?sslmode=require" $username $password $.Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "varroa-recordstore-%s" $role }}
  labels:
    {{- include "varroa.labels" $ | nindent 4 }}
  annotations:
    # A kept database still expects this password — deleting the Secret on
    # disable or uninstall would lock the role out of its own data.
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
stringData:
  username: {{ $username | quote }}
  password: {{ $password | quote }}
  dsn: {{ $dsn | quote }}
{{- end }}
{{- end }}
