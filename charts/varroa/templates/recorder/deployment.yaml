{{- if and .Values.recordStore.enabled (not (include "varroa.isHive" .)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: varroa-recorder
  labels:
    app.kubernetes.io/component: varroa-recorder
    {{- include "varroa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.recorder.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: varroa-recorder
      {{- include "varroa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: varroa-recorder
        {{- include "varroa.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: varroa-recorder
      {{- include "varroa.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.recorder.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "varroa.podPlacement" .Values.recorder }}
      containers:
        - name: recorder
          image: "{{ .Values.recorder.image.repository }}:{{ .Values.recorder.image.tag }}"
          imagePullPolicy: {{ .Values.recorder.image.pullPolicy }}
          command: ["/app/varroa-recorder"]
          args:
            - "-bus-ca-file=/etc/nats-creds/ca.crt"
            - "-bus-pass-file=/etc/nats-creds/recorder-password"
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            {{- toYaml .Values.recorder.containerSecurityContext | nindent 12 }}
          env:
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: GIT_CONFIG_NOSYSTEM
              value: "1"
            - name: VARROA_BUS_URL
              value: {{ include "varroa.busURL" (dict "root" $ "tier" "recorder") | quote }}
            - name: VARROA_CLUSTER_NAME
              value: {{ .Values.cluster.name | quote }}
            - name: VARROA_JETSTREAM_REPLICAS
              value: {{ include "varroa.jetStreamReplicas" $ | quote }}
            - name: VARROA_RECORDSTORE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "varroa.recordStore.dsnSecretName" (dict "root" $ "role" "recorder") }}
                  key: {{ include "varroa.recordStore.dsnSecretKey" $ }}
            {{- if eq .Values.recordStore.blobs.mode "postgres" }}
            - name: VARROA_BLOBSTORE_URL
              value: "pgblob:"
            {{- else }}
            - name: VARROA_BLOBSTORE_URL
              value: {{ .Values.recordStore.blobs.s3.url | quote }}
            {{- end }}
            {{- if and (eq .Values.recordStore.blobs.mode "s3") .Values.recordStore.blobs.s3.existingSecret }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.recordStore.blobs.s3.existingSecret }}
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.recordStore.blobs.s3.existingSecret }}
                  key: secret-access-key
            - name: AWS_SESSION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.recordStore.blobs.s3.existingSecret }}
                  key: session-token
                  optional: true
            {{- end }}
            - name: VARROA_RETENTION_RUNS
              value: {{ .Values.recordStore.retention.runs | quote }}
            - name: VARROA_RETENTION_LOGS
              value: {{ .Values.recordStore.retention.logs | quote }}
            - name: VARROA_RETENTION_ARTIFACTS
              value: {{ .Values.recordStore.retention.artifacts | quote }}
            - name: VARROA_RETENTION_ACTIVITY
              value: {{ .Values.recordStore.retention.activity | quote }}
            - name: VARROA_RETENTION_RESTART_SOURCE
              value: {{ .Values.recordStore.retention.restartSource | quote }}
            - name: VARROA_RECORDSTORE_CONFIRMED_GONE_GRACE
              value: {{ .Values.recordStore.cellLoss.confirmedGoneGrace | quote }}
            - name: VARROA_DASHBOARD_URL
              value: {{ .Values.auth.dashboardUrl | default "" | quote }}
            - name: VARROA_TELEMETRY_DISABLED
              value: {{ .Values.telemetry.disabled | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            - name: OTEL_TRACES_ENABLED
              value: {{ and .Values.telemetry.traces.enabled .Values.telemetry.services.recorder.traces.enabled | quote }}
            - name: OTEL_TRACES_SAMPLER_RATIO
              value: {{ .Values.telemetry.services.recorder.traces.samplerRatio | quote }}
            - name: OTEL_METRICS_ENABLED
              value: {{ and .Values.telemetry.metrics.enabled .Values.telemetry.services.recorder.metrics.enabled | quote }}
            - name: OTEL_LOGS_ENABLED
              value: {{ and .Values.telemetry.logs.enabled .Values.telemetry.services.recorder.logs.enabled | quote }}
            - name: OTEL_LOG_LEVEL
              value: {{ .Values.telemetry.logs.level | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.telemetry.resourceAttributes.deploymentName }},cluster.name={{ .Values.telemetry.resourceAttributes.clusterName }}"
            - name: METRICS_TOKEN
              value: {{ .Values.telemetry.metricsToken | quote }}
            {{- range .Values.recorder.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: nats-creds
              mountPath: /etc/nats-creds
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- with .Values.recorder.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.recorder.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nats-creds
          secret:
            secretName: varroa-nats-creds
        - name: tmp
          emptyDir: {}
        {{- with .Values.recorder.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
