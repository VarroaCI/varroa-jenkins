{{- /* The BFF does not run in hive mode, so its OIDC state secret must not
     render there either - matches the guard on bff/deployment.yaml and
     bff/service.yaml. */}}
{{- if not (include "varroa.isHive" .) }}
{{- if eq .Values.auth.mode "oidc" }}
{{- $secretName := printf "%s-oidc-state" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $stateSecret := "" }}
{{- if $existing }}
{{-   $stateSecret = index $existing.data "secret" }}
{{- else }}
{{-   $stateSecret = .Values.auth.oidc.stateSecret | default (randBytes 32 | b64enc) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/component: varroa-bff
    {{- include "varroa.labels" . | nindent 4 }}
data:
  secret: {{ $stateSecret | quote }}
{{- end }}
{{- end }}
