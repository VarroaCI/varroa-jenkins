{{- if not (include "varroa.isHive" .) }}
{{- if .Values.bff.enabled }}
{{- $validRetention := list "off" "7d" "30d" "90d" -}}
{{- if not (has .Values.activity.retention $validRetention) -}}
{{- fail (printf "activity.retention must be one of %v, got %q" $validRetention .Values.activity.retention) -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-bff") }}
  labels:
    app.kubernetes.io/component: varroa-bff
    {{- include "varroa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.bff.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: varroa-bff
      {{- include "varroa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: varroa-bff
        {{- include "varroa.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-bff") }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bff.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- include "varroa.podPlacement" .Values.bff }}
      containers:
        - name: bff
          image: "{{ .Values.bff.image.repository }}:{{ .Values.bff.image.tag }}"
          imagePullPolicy: {{ .Values.bff.image.pullPolicy }}
          command: ["/app/varroa-bff"]
          args:
            - "-port={{ .Values.bff.service.port }}"
            - "-bus-ca-file=/etc/nats-creds/ca.crt"
            {{- if .Values.bff.busURL }}
            - "-bus-url={{ .Values.bff.busURL }}"
            {{- end }}
            - "-auth-mode={{ .Values.auth.mode }}"
            {{- if .Values.auth.bffUrl }}
            - "-bff-url={{ .Values.auth.bffUrl }}"
            {{- end }}
            {{- $cookieDomain := .Values.auth.cookieDomain | default .Values.bff.oidcCookieDomain }}
            {{- if $cookieDomain }}
            - "-oidc-cookie-domain={{ $cookieDomain }}"
            {{- end }}
            {{- $oidcIssuer := .Values.auth.oidc.issuer | default .Values.bff.oidcIssuer | default (and .Values.dex.enabled (.Values.dex.config.issuer | default (printf "https://dex.%s" .Values.global.domain))) }}
            {{- if $oidcIssuer }}
            - "-oidc-issuer={{ $oidcIssuer }}"
            - "-oidc-client-id={{ .Values.auth.oidc.clientId | default .Values.bff.oidcClientId }}"
            - "-oidc-client-secret={{ required "auth.oidc.clientSecret (or bff.oidcClientSecret) must be set" (.Values.auth.oidc.clientSecret | default .Values.bff.oidcClientSecret) }}"
            - "-oidc-redirect-url={{ .Values.auth.oidc.redirectUrl | default .Values.bff.oidcRedirectUrl }}"
            {{- end }}
            {{- $oidcScopes := .Values.auth.oidc.scopes | default "" }}
            {{- if $oidcScopes }}
            - "-oidc-scopes={{ $oidcScopes }}"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.bff.service.port }}
          securityContext:
            {{- toYaml .Values.bff.containerSecurityContext | nindent 12 }}
          env:
            - name: OPERATOR_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: MANAGED_NAMESPACES
              value: {{ join " " .Values.managedNamespaces | quote }}
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: GIT_CONFIG_NOSYSTEM
              value: "1"
            - name: VARROA_BUS_URL
              value: {{ include "varroa.busURL" (dict "root" $ "tier" "bff") | quote }}
            - name: VARROA_CLUSTER_NAME
              value: {{ .Values.cluster.name | quote }}
            - name: VARROA_JETSTREAM_REPLICAS
              value: {{ include "varroa.jetStreamReplicas" $ | quote }}
            - name: BUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: varroa-nats-creds
                  key: bff-password
            - name: VARROA_TELEMETRY_DISABLED
              value: {{ .Values.telemetry.disabled | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            - name: OTEL_TRACES_ENABLED
              value: {{ and .Values.telemetry.traces.enabled .Values.telemetry.services.bff.traces.enabled | quote }}
            - name: OTEL_TRACES_SAMPLER_RATIO
              value: {{ .Values.telemetry.services.bff.traces.samplerRatio | quote }}
            - name: OTEL_METRICS_ENABLED
              value: {{ and .Values.telemetry.metrics.enabled .Values.telemetry.services.bff.metrics.enabled | quote }}
            - name: OTEL_LOGS_ENABLED
              value: {{ and .Values.telemetry.logs.enabled .Values.telemetry.services.bff.logs.enabled | quote }}
            - name: OTEL_LOG_LEVEL
              value: {{ .Values.telemetry.logs.level | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.telemetry.resourceAttributes.deploymentName }},cluster.name={{ .Values.telemetry.resourceAttributes.clusterName }}"
            - name: METRICS_TOKEN
              value: {{ .Values.telemetry.metricsToken | quote }}
            - name: VARROA_OIDC_USER_CLAIM
              value: {{ .Values.auth.oidc.userClaim | default "preferred_username,sub" | quote }}
            - name: VARROA_OIDC_GROUP_CLAIM
              value: {{ .Values.auth.oidc.groupClaim | default "groups" | quote }}
            - name: VARROA_DASHBOARD_URL
              {{- if eq .Values.auth.mode "oidc" }}
              value: {{ required "auth.dashboardUrl must be set for OIDC mode" .Values.auth.dashboardUrl | quote }}
              {{- else }}
              value: {{ .Values.auth.dashboardUrl | default "" | quote }}
              {{- end }}
            - name: VARROA_ACTIVITY_RETENTION
              value: {{ .Values.activity.retention | quote }}
            - name: VARROA_ACTIVITY_MAX_MSGS
              value: {{ .Values.activity.maxMsgs | quote }}
            - name: VARROA_ACTIVITY_MAX_BYTES
              value: {{ .Values.activity.maxBytes | int64 | quote }}
            {{- if eq .Values.auth.mode "oidc" }}
            - name: OIDC_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-oidc-state" $.Release.Name }}
                  key: secret
            {{- end }}
            {{- range .Values.bff.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
{{- if .Values.updateCenter.enabled }}
            - name: VARROA_UPDATE_CENTER_URL
              value: {{ printf "http://varroa-updatecenter.%s.svc:8080" .Release.Namespace | quote }}
            # The BFF is the only component that authenticates a real user, so it
            # is the only one that can attribute a plugin upload — hence it holds
            # the update center's import token.
            - name: VARROA_UPDATE_CENTER_IMPORT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: varroa-updatecenter-import-token
                  key: token
{{- end }}
          volumeMounts:
            - name: nats-creds
              mountPath: /etc/nats-creds
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.bff.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nats-creds
          secret:
            secretName: varroa-nats-creds
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-bff") }}
  labels:
    app.kubernetes.io/component: varroa-bff
    {{- include "varroa.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-bff") }}
  minReplicas: {{ .Values.bff.hpa.minReplicas }}
  maxReplicas: {{ .Values.bff.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}

{{- end }}
