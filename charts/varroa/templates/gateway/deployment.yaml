{{- if .Values.gateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-gateway") }}
  labels:
    app.kubernetes.io/component: varroa-gateway
    {{- include "varroa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: varroa-gateway
      {{- include "varroa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: varroa-gateway
        {{- include "varroa.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-gateway") }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command: ["/app/varroa-gateway"]
          args:
            - "-grpc-port={{ .Values.gateway.service.grpcPort }}"
            - "-bus-ca-file=/etc/nats-creds/ca.crt"
            {{- if .Values.gateway.busURL }}
            - "-bus-url={{ .Values.gateway.busURL }}"
            {{- end }}
            - "-gateway-endpoint={{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-gateway") }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.service.grpcPort }}"
          ports:
            - name: grpc
              containerPort: {{ .Values.gateway.service.grpcPort }}
            - name: verify
              containerPort: 9092
          securityContext:
            {{- toYaml .Values.gateway.containerSecurityContext | nindent 12 }}
          env:
            - name: OPERATOR_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: GIT_CONFIG_NOSYSTEM
              value: "1"
            - name: VARROA_BUS_URL
              value: {{ include "varroa.busURL" (dict "root" $ "tier" "gateway") | quote }}
            - name: VARROA_CLUSTER_NAME
              value: {{ .Values.cluster.name | quote }}
            - name: VARROA_JETSTREAM_REPLICAS
              value: {{ include "varroa.jetStreamReplicas" $ | quote }}
            - name: BUS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: varroa-nats-creds
                  key: gateway-password
            - name: VARROA_GATEWAY_ENDPOINT
              value: {{ printf "%s.%s.svc.cluster.local:%d" (include "varroa.fullname" (dict "Release" .Release "name" "varroa-gateway")) .Release.Namespace (int .Values.gateway.service.grpcPort) | quote }}
            - name: VARROA_TELEMETRY_DISABLED
              value: {{ .Values.telemetry.disabled | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            - name: OTEL_TRACES_ENABLED
              value: {{ and .Values.telemetry.traces.enabled .Values.telemetry.services.gateway.traces.enabled | quote }}
            - name: OTEL_TRACES_SAMPLER_RATIO
              value: {{ .Values.telemetry.services.gateway.traces.samplerRatio | quote }}
            - name: OTEL_METRICS_ENABLED
              value: {{ and .Values.telemetry.metrics.enabled .Values.telemetry.services.gateway.metrics.enabled | quote }}
            - name: OTEL_LOGS_ENABLED
              value: {{ and .Values.telemetry.logs.enabled .Values.telemetry.services.gateway.logs.enabled | quote }}
            - name: OTEL_LOG_LEVEL
              value: {{ .Values.telemetry.logs.level | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment={{ .Values.telemetry.resourceAttributes.deploymentName }},cluster.name={{ .Values.telemetry.resourceAttributes.clusterName }}"
            - name: METRICS_TOKEN
              value: {{ .Values.telemetry.metricsToken | quote }}
            {{- range .Values.gateway.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: nats-creds
              mountPath: /etc/nats-creds
              readOnly: true
            - name: tmp
              mountPath: /tmp
          {{- with .Values.gateway.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: nats-creds
          secret:
            secretName: varroa-nats-creds
        - name: tmp
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-gateway") }}
  labels:
    app.kubernetes.io/component: varroa-gateway
    {{- include "varroa.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-gateway") }}
  minReplicas: {{ .Values.gateway.hpa.minReplicas }}
  maxReplicas: {{ .Values.gateway.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
