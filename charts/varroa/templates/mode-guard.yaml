{{- /*
mode-guard.yaml
Validates mode + hive-mode prerequisites. Renders no objects.
*/}}

{{- $mode := .Values.mode | default "full" -}}
{{- if and (ne $mode "full") (ne $mode "hive") -}}
{{- fail (printf "mode must be \"full\" or \"hive\", got %q" $mode) -}}
{{- end -}}

{{- if eq $mode "hive" -}}

{{- $clusterName := .Values.cluster.name | default "" -}}
{{- if empty $clusterName -}}
{{- fail "mode=hive requires cluster.name" -}}
{{- end -}}

{{- $busURL := .Values.bus.url | default "" -}}
{{- if empty $busURL -}}
{{- fail "mode=hive requires bus.url (the core's external NATS endpoint)" -}}
{{- end -}}

{{- if .Values.nats.enabled -}}
{{- fail "mode=hive cannot deploy NATS; set nats.enabled=false (use -f values-hive.yaml)" -}}
{{- end -}}

{{- end -}}

{{- /* nats.external.host is required when nats.external.enabled */ -}}
{{- $external := .Values.nats.external | default dict -}}
{{- if $external.enabled -}}
{{- if empty $external.host -}}
{{- fail "nats.external.enabled requires nats.external.host" -}}
{{- end -}}
{{- end -}}

{{- /*
An explicit jetStreamReplicas must not exceed the NATS server count actually
rendered by the nats-1.2.0 subchart (see varroa.natsServerCount) — JetStream
cannot replicate beyond the number of servers in the cluster. Only checked
when the local NATS subchart is rendered (nats.enabled); in hive mode the
cluster is external and out of this chart's view. This is the guard that
turns issue #433's silent runtime wedge ("replicas > 1 not supported in
non-clustered mode") into an install-time error.
*/ -}}
{{- if .Values.nats.enabled -}}
{{- if not (kindIs "invalid" .Values.jetStreamReplicas) -}}
{{- $serverCount := int (include "varroa.natsServerCount" .) -}}
{{- $explicit := int .Values.jetStreamReplicas -}}
{{- if gt $explicit $serverCount -}}
{{- fail (printf "jetStreamReplicas=%d exceeds the actual NATS server count (%d, from nats.config.cluster.enabled=%v/replicas=%v) — JetStream cannot replicate beyond the number of NATS servers. Lower jetStreamReplicas or raise nats.config.cluster.replicas (with cluster.enabled=true)." $explicit $serverCount .Values.nats.config.cluster.enabled .Values.nats.config.cluster.replicas) -}}
{{- end -}}
{{- end -}}
{{- end -}}

{{- /*
JetStream encryption is always on. The merge keys and the JS_KEY env are
chart defaults, and `helm upgrade --reuse-values` drops new chart defaults.
Without this guard such an upgrade would run NATS with a plain-text store.
*/ -}}
{{- if and .Values.nats.enabled (ne $mode "hive") -}}
{{- $natsConfig := .Values.nats.config | default dict -}}
{{- $jetstream := $natsConfig.jetstream | default dict -}}
{{- $merge := $jetstream.merge | default dict -}}
{{- $natsContainer := .Values.nats.container | default dict -}}
{{- $natsEnv := $natsContainer.env | default dict -}}
{{- if or (ne (toString $merge.key) "<< $JS_KEY >>") (empty $merge.cipher) (not (hasKey $natsEnv "JS_KEY")) -}}
{{- fail "JetStream encryption is not configured: set nats.config.jetstream.merge.cipher, nats.config.jetstream.merge.key (<< $JS_KEY >>), and nats.container.env.JS_KEY. An upgrade with --reuse-values drops these chart defaults; use --reset-then-reuse-values." -}}
{{- end -}}
{{- end -}}

{{- /*
The NATS subchart does not read these keys. Fail the render so a value
set on them does not disappear without notice.
*/ -}}
{{- $natsValues := .Values.nats | default dict -}}
{{- if hasKey $natsValues "image" -}}
{{- fail "nats.image is not read by the NATS subchart; set nats.container.image instead" -}}
{{- end -}}
{{- if hasKey $natsValues "persistence" -}}
{{- fail "nats.persistence is not read by the NATS subchart; set nats.config.jetstream.fileStore.pvc.size and .storageClassName instead" -}}
{{- end -}}
{{- $natsService := $natsValues.service | default dict -}}
{{- range $key := list "port" "monitorPort" -}}
{{- if hasKey $natsService $key -}}
{{- fail (printf "nats.service.%s is not read by the NATS subchart; the chart fixes the client port at 4222 and the monitor port at 8222" $key) -}}
{{- end -}}
{{- end -}}
{{- if hasKey $natsService "type" -}}
{{- fail "nats.service.type is not read by the NATS subchart; set nats.external.enabled and nats.external.serviceType to expose NATS outside the cluster" -}}
{{- end -}}
{{- if ne (dig "config" "nats" "port" 4222 $natsValues | int) 4222 -}}
{{- fail "nats.config.nats.port must stay 4222: the bus URL, the NetworkPolicies, and the external Service name that port" -}}
{{- end -}}
{{- if ne (dig "config" "monitor" "port" 8222 $natsValues | int) 8222 -}}
{{- fail "nats.config.monitor.port must stay 8222: the NetworkPolicies name that port" -}}
{{- end -}}
