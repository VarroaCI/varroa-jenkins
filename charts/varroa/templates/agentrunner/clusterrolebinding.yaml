{{- if and .Values.agentRunner.enabled (not (include "varroa.isHive" .)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-agent") }}
  labels:
    app.kubernetes.io/component: varroa-agent
    {{- include "varroa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-agent") }}
subjects:
  - kind: ServiceAccount
    name: varroa-agent
    namespace: {{ .Release.Namespace }}
{{- end }}
