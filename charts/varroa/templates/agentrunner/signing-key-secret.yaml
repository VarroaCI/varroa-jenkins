{{- if and .Values.agentRunner.enabled (not (include "varroa.isHive" .)) }}
{{- /*
  The key signs the Tenant agent credentials that the runner mints and the BFF
  verifies. A release keeps its stored key across upgrades. A first install
  generates 32 random bytes. The value never appears in a test or a log.
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace "varroa-tenant-agent-signing-key" -}}
{{- $key := "" -}}
{{- if and $existing (hasKey $existing.data "key") -}}
  {{- $key = index $existing.data "key" -}}
{{- else -}}
  {{- $key = randAlphaNum 32 | b64enc -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: varroa-tenant-agent-signing-key
  labels:
    app.kubernetes.io/component: varroa-agent
    {{- include "varroa.labels" . | nindent 4 }}
type: Opaque
data:
  key: {{ $key }}
{{- end }}
