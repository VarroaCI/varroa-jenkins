{{- if and .Values.networkPolicy.enabled .Values.agentRunner.enabled (not (include "varroa.isHive" .)) }}
---
# Policy: Tenant agent runner. It reaches NATS, the BFF MCP endpoint, the record
# store, and the assistant's model providers. It has no git or forge egress:
# the operator owns every forge call.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-np-agentrunner
  labels: {{- include "varroa.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: varroa-agent
  policyTypes:
    - Ingress
    - Egress
  ingress:
{{- if .Values.networkPolicy.metricsIngress }}
    - from:
{{ toYaml .Values.networkPolicy.metricsIngress | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
  egress:
{{- if .Values.nats.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: nats
      ports:
        - protocol: TCP
          port: 4222
{{- end }}
{{ include "varroa.np.apiServerEgress" . | nindent 4 }}
    # The BFF MCP endpoint, the only path a Tenant agent session takes to a tool.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: varroa-bff
      ports:
        - protocol: TCP
          port: 8080
{{ include "varroa.np.telemetryEgress" . | nindent 4 }}
{{ include "varroa.np.recordStorePostgresEgress" . | nindent 4 }}
{{ include "varroa.np.assistantEgress" . | nindent 4 }}
{{- end }}
