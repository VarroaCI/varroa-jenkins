{{- if and .Values.agentRunner.enabled (not (include "varroa.isHive" .)) }}
apiVersion: v1
kind: Service
metadata:
  name: varroa-agent
  labels:
    app.kubernetes.io/component: varroa-agent
    {{- include "varroa.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/component: varroa-agent
    {{- include "varroa.selectorLabels" . | nindent 4 }}
{{- end }}
