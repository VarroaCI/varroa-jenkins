{{- if .Values.operator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-operator") }}
  labels:
    app.kubernetes.io/component: varroa-operator
    {{- include "varroa.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-operator") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-operator") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
