{{- if and .Values.operator.enabled .Values.managedNamespaces }}
{{- $fullName := include "varroa.fullname" (dict "Release" .Release "name" "varroa-operator") }}
{{- $namespaces := prepend .Values.managedNamespaces .Release.Namespace | uniq }}
{{- range $ns := $namespaces }}
---
# Scoped mode: per-namespace operator access, replacing the cluster-wide grants.
# "watch" is granted only for the resources the operator runs informers on
# (BroodSchedule owns cronjobs + secrets); their cache is scoped to these
# namespaces in cmd/operator so the namespace-scoped watch is sufficient.
# pods/exec is required so creating the controller agent Role (which grants pods/exec)
# passes the Kubernetes RBAC escalation check in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullName }}-managed
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/component: varroa-operator
    {{- include "varroa.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "configmaps", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # Preflight quota headroom check for bus-initiated controller creates.
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["get", "list"]
{{- end }}
{{- end }}
