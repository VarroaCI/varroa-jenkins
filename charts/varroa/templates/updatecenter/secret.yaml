{{- if and .Values.updateCenter.enabled (not (include "varroa.isHive" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: varroa-updatecenter-import-token
  labels:
    app.kubernetes.io/component: varroa-updatecenter
    {{- include "varroa.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /*
    Preserve the import token across upgrades. randAlphaNum regenerates on every
    render, so without a lookup each helm upgrade / ArgoCD re-sync would rotate
    the token — the running pod (env injected from this Secret at start, not
    hot-reloaded) would then reject every client that reads the new token. Order:
    explicit value > existing Secret value > freshly generated (first install).
  */ -}}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace "varroa-updatecenter-import-token" -}}
  {{- $token := "" -}}
  {{- if .Values.updateCenter.importToken -}}
  {{-   $token = .Values.updateCenter.importToken | b64enc -}}
  {{- else if and $existing $existing.data (index $existing.data "token") -}}
  {{-   $token = index $existing.data "token" -}}
  {{- else -}}
  {{-   $token = randAlphaNum 32 | b64enc -}}
  {{- end }}
  token: {{ $token | quote }}
{{- end }}
