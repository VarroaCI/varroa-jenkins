{{- if not (include "varroa.isHive" .) }}
{{- if .Values.grafana.enabled }}
{{- $secretName := include "varroa.fullname" (dict "Release" .Release "name" "grafana-admin") }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $password := "" }}
{{- if .Values.grafana.adminPassword }}
{{-   $password = .Values.grafana.adminPassword }}
{{- else if and $existing $existing.data (index $existing.data "admin-password") }}
{{-   $password = index $existing.data "admin-password" | b64dec }}
{{- else }}
{{-   $password = randAlphaNum 20 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/component: grafana
    {{- include "varroa.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ $password | quote }}
{{- end }}
{{- end }}
