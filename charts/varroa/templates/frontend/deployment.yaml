{{- if not (include "varroa.isHive" .) }}
{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "varroa.fullname" (dict "Release" .Release "name" "frontend") }}
  labels:
    app.kubernetes.io/component: frontend
    {{- include "varroa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
      {{- include "varroa.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: frontend
        {{- include "varroa.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "varroa.fullname" (dict "Release" .Release "name" "frontend") }}
      automountServiceAccountToken: false
      {{- with .Values.frontend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.containerSecurityContext | nindent 12 }}
          env:
            - name: VARROA_API_HOST
              value: {{ include "varroa.fullname" (dict "Release" .Release "name" "varroa-bff") | quote }}
          volumeMounts:
            - name: telemetry-config
              mountPath: /usr/share/nginx/html/telemetry-config.js
              subPath: telemetry-config.js
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
            - name: confd
              mountPath: /etc/nginx/conf.d
          ports:
            - name: http
              containerPort: 8080
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: telemetry-config
          configMap:
            name: {{ include "varroa.fullname" (dict "Release" .Release "name" "frontend") }}-telemetry
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: confd
          emptyDir: {}
{{- end }}

{{- end }}
