---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: varroarolebindings.varroa.dev
spec:
  group: varroa.dev
  names:
    kind: VarroaRoleBinding
    listKind: VarroaRoleBindingList
    plural: varroarolebindings
    singular: varroarolebinding
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.roleRef
      name: ROLE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VarroaRoleBinding is the Schema for the varroarolebindings API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VarroaRoleBindingSpec defines the desired state of VarroaRoleBinding.
            properties:
              roleRef:
                type: string
              scope:
                description: |-
                  Scope restricts which namespaces, controllers, or pipelines tenants this
                  binding applies to. A scope names one dimension: tenants, or
                  namespaces/controllerSelector, never both.
                properties:
                  controllerSelector:
                    description: ControllerSelector is an optional label selector
                      over Controller CR labels.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  namespaces:
                    description: Namespaces is an optional allow-list of Kubernetes
                      namespaces.
                    items:
                      type: string
                    type: array
                  tenants:
                    description: Tenants is an optional allow-list of pipelines tenants.
                    items:
                      description: TenantScope names one pipelines tenant and the
                        jobs of it the binding covers.
                      properties:
                        jobs:
                          description: Jobs is an optional list of folder-relative
                            globs. An absent list covers every job.
                          items:
                            maxLength: 512
                            type: string
                          maxItems: 64
                          type: array
                        name:
                          description: Name is a Team name.
                          maxLength: 253
                          type: string
                      required:
                      - name
                      type: object
                    maxItems: 64
                    type: array
                type: object
                x-kubernetes-validations:
                - message: a scope names one dimension
                  rule: '!has(self.tenants) || (!has(self.namespaces) && !has(self.controllerSelector))'
                - message: a scope that names no tenant grants nothing
                  rule: '!has(self.tenants) || size(self.tenants) > 0'
                - message: a grant that names no tenant grants nothing
                  rule: '!has(self.tenants) || self.tenants.all(t, size(t.name) >
                    0)'
                - message: a tenant name is a Team name
                  rule: '!has(self.tenants) || self.tenants.all(t, !t.name.contains(''/''))'
                - message: a grant that matches nothing reads as an oversight
                  rule: '!has(self.tenants) || self.tenants.all(t, !has(t.jobs) ||
                    size(t.jobs) > 0)'
                - message: a grant that matches nothing reads as an oversight
                  rule: '!has(self.tenants) || self.tenants.all(t, !has(t.jobs) ||
                    t.jobs.all(j, size(j) > 0))'
                - message: a pattern is folder relative
                  rule: '!has(self.tenants) || self.tenants.all(t, !has(t.jobs) ||
                    t.jobs.all(j, !j.startsWith(''/'')))'
              subjects:
                items:
                  description: SubjectRef references a subject by kind and name.
                  properties:
                    kind:
                      description: 'Kind is the subject kind: "Group" or "User".'
                      type: string
                    name:
                      description: Name is the OIDC claim value (group name or user
                        subject).
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
            required:
            - roleRef
            - subjects
            type: object
          status:
            description: |-
              Status reports the federation outcome of the binding on each hive. Only
              the core BFF federation pass writes it.
            properties:
              federation:
                description: Federation holds one entry for each hive cluster. The
                  core cluster has no entry.
                items:
                  description: BindingFederationStatus is the federation outcome of
                    a binding on one hive.
                  properties:
                    cluster:
                      description: Cluster is the hive cluster name.
                      type: string
                    lastTransitionTime:
                      description: LastTransitionTime is the time the state, reason,
                        or message last changed.
                      format: date-time
                      type: string
                    message:
                      description: Message is the human-readable detail for the state.
                      type: string
                    reason:
                      description: Reason is a CamelCase code for the state.
                      type: string
                    state:
                      description: State is federated, skipped, or failed.
                      enum:
                      - federated
                      - skipped
                      - failed
                      type: string
                  required:
                  - cluster
                  - lastTransitionTime
                  - state
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - cluster
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation the federation
                  entries describe.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
