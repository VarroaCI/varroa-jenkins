---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: tenants.varroa.dev
spec:
  group: varroa.dev
  names:
    kind: Tenant
    listKind: TenantList
    plural: tenants
    singular: tenant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.namespaces
      name: NAMESPACES
      type: string
    - jsonPath: .spec.roleRef
      name: ROLE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Tenant is a cluster-scoped group of users with namespace-scoped role bindings.
          The operator composes it into a Group + VarroaRoleBinding.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenantSpec defines the desired state of a Tenant.
            properties:
              displayName:
                description: DisplayName is a human-readable display name.
                type: string
              members:
                description: Members is the list of local usernames in this tenant
                  (→ owned local Group).
                items:
                  type: string
                type: array
              namespaces:
                description: |-
                  Namespaces is the required list of Kubernetes namespaces this tenant
                  has RBAC in. Must have at least one entry.
                items:
                  type: string
                type: array
              pipelines:
                description: |-
                  Pipelines, when set, makes this Tenant a pipelines tenant: a placement
                  reconciler binds it to exactly one cell. A Tenant is cluster-scoped, so
                  no namespace default exists for AgentNamespace or ComposedBundleRef.
                properties:
                  agentNamespace:
                    description: |-
                      AgentNamespace is the Kubernetes namespace this tenant's agents run
                      in. Must be one of spec.namespaces.
                    type: string
                  badge:
                    description: Badge turns on the anonymous build status badge of
                      this tenant's jobs.
                    properties:
                      enabled:
                        default: false
                        description: Enabled serves the badge without a session. Default
                          false.
                        type: boolean
                    type: object
                  cellPool:
                    description: |-
                      CellPool names the CellPool the placement pass selects a cell from.
                      An empty value resolves to the profile's default pool: the pool whose
                      name equals Profile. A tenant that needs a cell of its own names a
                      pool whose maxTenantsPerCell is 1.
                    type: string
                  composedBundleRef:
                    description: |-
                      ComposedBundleRef names the ComposedBundle this tenant's items come
                      from. Only its items.yaml is used. When set, its namespace must be
                      non-empty and one of spec.namespaces.
                    properties:
                      name:
                        type: string
                      namespace:
                        description: Namespace of the ComposedBundle. Empty = the
                          controller's own namespace.
                        type: string
                    required:
                    - name
                    type: object
                  concurrency:
                    default: allow
                    description: |-
                      Concurrency selects this tenant's job concurrency policy. "allow"
                      (default) runs builds side by side. "cancelInProgress" cancels the
                      running build of the same job path when a new one starts.
                    enum:
                    - allow
                    - cancelInProgress
                    type: string
                  concurrencyLimits:
                    description: |-
                      ConcurrencyLimits caps how many builds of a named set of this tenant's
                      jobs run at one time. A build over a limit waits in the queue.
                    items:
                      description: TenantConcurrencyLimit caps the builds of a set
                        of jobs that run at once.
                      properties:
                        jobs:
                          description: Jobs holds folder-relative globs (*, **, ?).
                          items:
                            maxLength: 512
                            minLength: 1
                            pattern: ^[^/]
                            type: string
                          maxItems: 64
                          minItems: 1
                          type: array
                        max:
                          description: Max is the number of builds the set runs at
                            one time.
                          format: int32
                          maximum: 1000
                          minimum: 1
                          type: integer
                        name:
                          description: Name identifies the limit in the queue and
                            in the run views.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                      required:
                      - jobs
                      - max
                      - name
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  cronBackstop:
                    default: true
                    description: |-
                      CronBackstop turns the backstop cron scheduler on for this tenant.
                      Nil means on.
                    type: boolean
                  cronCatchUp:
                    default: one
                    description: |-
                      CronCatchUp selects how many missed cron occurrences the backstop
                      fires on wake. "one" (default) fires the newest missed occurrence.
                      "none" fires nothing.
                    enum:
                    - one
                    - none
                    type: string
                  cronGrace:
                    default: 5m
                    description: |-
                      CronGrace bounds how long the backstop waits past a missed cron
                      occurrence before it fires. Default 5m, range 1m to 60m.
                    type: string
                  exports:
                    description: |-
                      Exports declares which of this tenant's jobs and locks it grants to
                      other tenants, and who may use each grant. An absent list exports
                      nothing.
                    items:
                      description: |-
                        TenantExport is one grant a pipelines tenant makes to other tenants: a
                        folder-relative job glob, or a list of prefix-relative lock-name globs,
                        plus the Tenant names allowed to use it. Exactly one of Job or Locks must
                        be set.
                      properties:
                        callers:
                          description: |-
                            Callers lists the Tenant names allowed to use this export. At least
                            one entry is required.
                          items:
                            maxLength: 253
                            type: string
                          maxItems: 64
                          minItems: 1
                          type: array
                        job:
                          description: |-
                            Job is a folder-relative job glob this tenant exports. Exactly one of
                            Job or Locks must be set.
                          maxLength: 512
                          type: string
                        locks:
                          description: |-
                            Locks lists globs over the bare names of this tenant's own locks.
                            Exactly one of Job or Locks must be set.
                          items:
                            maxLength: 512
                            type: string
                          maxItems: 64
                          type: array
                      required:
                      - callers
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one of job or locks must be set
                        rule: (has(self.job)?1:0)+(has(self.locks)?1:0)==1
                      - message: job must be non-empty when set
                        rule: '!has(self.job) || size(self.job) > 0'
                      - message: job must not start with /
                        rule: '!has(self.job) || !self.job.startsWith(''/'')'
                      - message: a locks entry must be non-empty
                        rule: '!has(self.locks) || self.locks.all(l, size(l) > 0)'
                      - message: a callers entry must be non-empty
                        rule: self.callers.all(c, size(c) > 0)
                    maxItems: 64
                    type: array
                  interruptedRetry:
                    default: manual
                    description: |-
                      InterruptedRetry selects whether an interrupted run retries on its
                      own. "manual" (default) leaves the retry to a user. "automatic"
                      retries once.
                    enum:
                    - manual
                    - automatic
                    type: string
                  members:
                    default: 1
                    description: |-
                      Members sets the number of active slots this tenant runs. Each slot
                      holds one cell. A job runs only on its home slot's holder. This field
                      is not spec.members, which lists local usernames.
                    format: int32
                    maximum: 16
                    minimum: 1
                    type: integer
                  notifications:
                    description: |-
                      Notifications configures the outward notifications of this tenant.
                      The record store posts the completion webhook for each run.
                    properties:
                      webhook:
                        description: |-
                          Webhook posts a signed JSON payload to a URL each time a run of this
                          tenant completes. The record store sends it, not the cell.
                        properties:
                          secretRef:
                            description: SecretRef names the Secret that holds the
                              signing key.
                            properties:
                              key:
                                default: hmac-key
                                description: Key is the data key that holds the signing
                                  key.
                                type: string
                              name:
                                description: Name is the Secret name.
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          url:
                            description: |-
                              URL is the receiver endpoint. Use https:// for a receiver outside
                              the cluster.
                            maxLength: 2048
                            type: string
                        required:
                        - secretRef
                        - url
                        type: object
                        x-kubernetes-validations:
                        - message: url must start with https:// or http://
                          rule: self.url.startsWith('https://') || self.url.startsWith('http://')
                    type: object
                  profile:
                    description: |-
                      Profile names the JenkinsVersionProfile the placement pass resolves a
                      cell against.
                    type: string
                  rehydrateBuilds:
                    default: 10
                    description: |-
                      RehydrateBuilds sets how many of a job's newest completed builds the
                      operator seeds when this tenant's cell changes. The newest
                      successful build is always seeded in addition. Default 10.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  rehydrateDeadline:
                    default: 30m
                    description: |-
                      RehydrateDeadline bounds how long the operator keeps retrying a
                      deferred rehydration seed before it stops and reports
                      RehydrationFailed. Default 30m, range 1m to 24h.
                    type: string
                  retention:
                    description: |-
                      Retention shortens how long the record store keeps this tenant's
                      runs. A job rule replaces the tenant window. The store-wide
                      recordStore.retention.runs caps both. Only an operator sets it.
                    properties:
                      jobs:
                        description: |-
                          Jobs lists per-job windows. The first rule whose job glob matches
                          a run's job path sets that run's window.
                        items:
                          description: TenantJobRetention sets the run window for
                            the jobs that match a glob.
                          properties:
                            job:
                              description: Job is a folder-relative job glob. It must
                                not start with /.
                              maxLength: 512
                              minLength: 1
                              pattern: ^[^/]
                              type: string
                            runs:
                              description: |-
                                Runs is the job window, in whole days, such as "7d". It replaces
                                the tenant window for the matching jobs. The store-wide window
                                still caps it.
                              pattern: ^([1-9][0-9]{0,2}|[1-2][0-9]{3}|3[0-5][0-9]{2}|36[0-4][0-9]|3650)d$
                              type: string
                          required:
                          - job
                          - runs
                          type: object
                        maxItems: 64
                        type: array
                      runs:
                        description: |-
                          Runs is the tenant window, in whole days, such as "30d". It shortens
                          the store-wide window and never lengthens it.
                        pattern: ^([1-9][0-9]{0,2}|[1-2][0-9]{3}|3[0-5][0-9]{2}|36[0-4][0-9]|3650)d$
                        type: string
                    type: object
                  standby:
                    default: 0
                    description: |-
                      Standby sets the number of warm members this tenant keeps. A standby
                      holds the folder and no slot. It takes a slot whose holder dies.
                    format: int32
                    maximum: 8
                    minimum: 0
                    type: integer
                required:
                - agentNamespace
                - profile
                type: object
              provisionNamespaces:
                description: |-
                  ProvisionNamespaces, when true, creates the tenant namespaces (via the
                  tenancy helper) if they do not already exist.
                type: boolean
              roleRef:
                description: RoleRef is the VarroaRole to bind. Defaults to "developer"
                  when empty.
                type: string
              subjects:
                description: Subjects are pass-through IdP-group/user subjects for
                  the binding.
                items:
                  description: SubjectRef references a subject by kind and name.
                  properties:
                    kind:
                      description: 'Kind is the subject kind: "Group" or "User".'
                      type: string
                    name:
                      description: Name is the OIDC claim value (group name or user
                        subject).
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
            required:
            - namespaces
            type: object
            x-kubernetes-validations:
            - message: pipelines.profile must be non-empty when pipelines is set
              rule: '!has(self.pipelines) || size(self.pipelines.profile) > 0'
            - message: pipelines.agentNamespace must be non-empty when pipelines is
                set
              rule: '!has(self.pipelines) || size(self.pipelines.agentNamespace) >
                0'
            - message: pipelines.agentNamespace must be one of namespaces
              rule: '!has(self.pipelines) || self.pipelines.agentNamespace in self.namespaces'
            - message: pipelines.composedBundleRef.namespace must be non-empty when
                composedBundleRef is set
              rule: '!has(self.pipelines) || !has(self.pipelines.composedBundleRef)
                || (has(self.pipelines.composedBundleRef.namespace) && size(self.pipelines.composedBundleRef.namespace)
                > 0)'
            - message: pipelines.composedBundleRef.namespace must be one of namespaces
              rule: '!has(self.pipelines) || !has(self.pipelines.composedBundleRef)
                || !has(self.pipelines.composedBundleRef.namespace) || self.pipelines.composedBundleRef.namespace
                in self.namespaces'
            - message: pipelines.rehydrateDeadline must be between 1m and 24h
              rule: '!has(self.pipelines) || !has(self.pipelines.rehydrateDeadline)
                || (duration(self.pipelines.rehydrateDeadline) >= duration(''1m'')
                && duration(self.pipelines.rehydrateDeadline) <= duration(''24h''))'
            - message: pipelines.cronGrace must be between 1m and 60m
              rule: '!has(self.pipelines) || !has(self.pipelines.cronGrace) || (duration(self.pipelines.cronGrace)
                >= duration(''1m'') && duration(self.pipelines.cronGrace) <= duration(''60m''))'
          status:
            description: TenantStatus defines the observed state of a Tenant.
            properties:
              bindingRef:
                type: string
              conditions:
                items:
                  description: TenantCondition is a status condition for a Tenant.
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              groupRef:
                type: string
              namespaceStates:
                items:
                  description: TenantNamespaceState reports the state of a single
                    namespace for a Tenant.
                  properties:
                    name:
                      type: string
                    state:
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
              pipelines:
                description: |-
                  Pipelines carries the pipelines tenancy's own status fields: the
                  door credentials and the teardown-purge retry count.
                properties:
                  agentNamespace:
                    description: |-
                      AgentNamespace mirrors spec.pipelines.agentNamespace while the tenant
                      is placed. Teardown reads it to find the tenant ServiceAccount and its
                      token Secret after spec.pipelines is gone, the same way Placement
                      keeps naming a cell after the placement pass stops writing to it.
                    type: string
                  badgeToken:
                    description: |-
                      BadgeToken is the credential in every badge URL of this tenant.
                      Minted once; never regenerated. Clear it to rotate.
                    type: string
                  pendingPurgeCell:
                    description: |-
                      PendingPurgeCell names the cell whose schedule rows the pending
                      purge must delete. A slot move raises the tenant generation, so a
                      whole-tenant delete would drop every other slot's rows. The retry
                      therefore needs the cell the move left, not only the generation.
                      An empty value means a whole-tenant delete, which is what teardown
                      asks for.
                    type: string
                  pendingPurgeCellNamespace:
                    description: |-
                      PendingPurgeCellNamespace names that cell's namespace. A schedule
                      row is keyed by both, so a cell name alone can name two cells and
                      the delete would drop the rows of a same-named cell in another
                      namespace. It is set and cleared with PendingPurgeCell.
                    type: string
                  pendingPurgeGeneration:
                    description: |-
                      PendingPurgeGeneration names the old placement generation a move
                      still owes a schedule purge for. A move sets this field when it
                      requests the purge and clears it once the purge succeeds. The
                      placement pass retries every tick while it is set, so the retry
                      survives a transient tick that changes the Placed reason for an
                      unrelated cause.
                    format: int64
                    type: integer
                  purgeAttempts:
                    description: |-
                      PurgeAttempts counts retries of the teardown schedule purge, so a
                      restart does not lose the count. Bounded at ten attempts.
                    format: int32
                    type: integer
                  webhookSecret:
                    description: |-
                      WebhookSecret verifies the forge signature on a webhook delivery.
                      Minted once, on the tick that first sees spec.pipelines; never
                      regenerated.
                    type: string
                  webhookToken:
                    description: |-
                      WebhookToken authenticates a webhook delivery against this tenant's
                      door. Minted once, on the tick that first sees spec.pipelines; never
                      regenerated.
                    type: string
                type: object
              placement:
                description: |-
                  Placement reports the cell this tenant is bound to. Written only by
                  the placement pass inside TenantReconciler.
                properties:
                  cell:
                    description: Cell is the name of the bound cell Controller.
                    type: string
                  cellNamespace:
                    description: CellNamespace is the namespace of the bound cell
                      Controller.
                    type: string
                  cluster:
                    description: Cluster is the cluster the bound cell runs in.
                    type: string
                  generation:
                    description: |-
                      Generation increases only when the bound cell changes. The fence
                      C6 owns rejects a claim carrying an older generation.
                    format: int64
                    type: integer
                  members:
                    description: |-
                      Members reports every member of this tenant. The scalar fields above
                      keep describing slot 0.
                    items:
                      description: TenantMemberStatus reports one member of a pipelines
                        tenant.
                      properties:
                        applied:
                          description: Applied is true when the member's cell reports
                            this tenant applied.
                          type: boolean
                        cell:
                          description: Cell is the name of the cell Controller that
                            holds this member.
                          type: string
                        cellNamespace:
                          description: CellNamespace is the namespace of that cell
                            Controller.
                          type: string
                        role:
                          description: Role is TenantMemberRoleActive or TenantMemberRoleStandby.
                          type: string
                        slot:
                          description: Slot is set only on an active member.
                          format: int32
                          type: integer
                      type: object
                    type: array
                type: object
              rehydration:
                description: |-
                  Rehydration reports this tenant's build-record rehydration state.
                  TenantReconciler copies it from the bound cell's own
                  Controller.status.cell.rehydration entry on the same tick that
                  writes Placement.
                properties:
                  attempts:
                    description: |-
                      Attempts counts the rehydration retries since the last applied
                      bundle.
                    format: int32
                    type: integer
                  cellInstance:
                    description: CellInstance is the cell pod UID this state was built
                      for.
                    type: string
                  deferred:
                    description: |-
                      Deferred lists the job paths the mite could not seed on the last
                      apply, because the job did not exist yet.
                    items:
                      type: string
                    maxItems: 50
                    type: array
                  generation:
                    description: Generation is the placement generation this state
                      was built for.
                    format: int64
                    type: integer
                  lastAttempt:
                    description: |-
                      LastAttempt is when the operator last sent a rehydration bundle for
                      this tenant.
                    format: date-time
                    type: string
                  records:
                    description: |-
                      Records is the number of thin build records the last bundle
                      carried.
                    format: int32
                    type: integer
                  truncated:
                    description: |-
                      Truncated is true when the last bundle dropped changelogs or older
                      records to fit the byte budget.
                    type: boolean
                  unseededJobs:
                    description: UnseededJobs counts the jobs no bundle has covered
                      yet.
                    format: int32
                    type: integer
                type: object
              staleAgentServiceNamespaces:
                description: |-
                  StaleAgentServiceNamespaces names every namespace a move left an
                  agent Service behind in. A move that crosses a namespace appends one,
                  and the tick that deletes that Service removes it again. The list
                  lives here, beside Placement, rather than on Pipelines: teardown
                  clears Pipelines in the same call that still owes these deletes.

                  The list is durable because a move is not reversible. The recorder
                  already holds the new generation once the placement pass returns, so a
                  failed cleanup must never roll the placement back.
                items:
                  type: string
                type: array
            type: object
        type: object
        x-kubernetes-validations:
        - message: a pipelines tenant name is at most 47 characters and contains no
            dot, because it names the agent Service
          rule: '!has(self.spec) || !has(self.spec.pipelines) || (size(self.metadata.name)
            <= 47 && !self.metadata.name.contains(''.''))'
    served: true
    storage: true
    subresources:
      status: {}
