---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: teams.varroa.dev
spec:
  group: varroa.dev
  names:
    kind: Team
    listKind: TeamList
    plural: teams
    singular: team
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.namespaces
      name: NAMESPACES
      type: string
    - jsonPath: .spec.roleRef
      name: ROLE
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: AGE
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Team is a cluster-scoped group of users with namespace-scoped role bindings.
          The operator composes it into a Group + VarroaRoleBinding.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TeamSpec defines the desired state of a Team.
            properties:
              displayName:
                description: DisplayName is a human-readable display name.
                type: string
              members:
                description: Members is the list of local usernames in this team (→
                  owned local Group).
                items:
                  type: string
                type: array
              namespaces:
                description: |-
                  Namespaces is the required list of Kubernetes namespaces this team
                  has RBAC in. Must have at least one entry.
                items:
                  type: string
                type: array
              provisionNamespaces:
                description: |-
                  ProvisionNamespaces, when true, creates the team namespaces (via the
                  tenancy helper) if they do not already exist.
                type: boolean
              roleRef:
                description: RoleRef is the VarroaRole to bind. Defaults to "developer"
                  when empty.
                type: string
              subjects:
                description: Subjects are pass-through IdP-group/user subjects for
                  the binding.
                items:
                  description: SubjectRef references a subject by kind and name.
                  properties:
                    kind:
                      description: 'Kind is the subject kind: "Group" or "User".'
                      type: string
                    name:
                      description: Name is the OIDC claim value (group name or user
                        subject).
                      type: string
                  required:
                  - kind
                  - name
                  type: object
                type: array
            required:
            - namespaces
            type: object
          status:
            description: TeamStatus defines the observed state of a Team.
            properties:
              bindingRef:
                type: string
              conditions:
                items:
                  description: TeamCondition is a status condition for a Team.
                  properties:
                    lastTransitionTime:
                      format: date-time
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              groupRef:
                type: string
              namespaceStates:
                items:
                  description: TeamNamespaceState reports the state of a single namespace
                    for a Team.
                  properties:
                    name:
                      type: string
                    state:
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
