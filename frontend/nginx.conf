server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — serves index.html for all SPA routes including /login.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # OIDC discovery (local auth mode) — proxied to Varroa backend.
    location /.well-known/ {
        proxy_pass http://${VARROA_API_HOST}:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Banner script — unauthenticated, served directly by the operator.
    location /varroa-banner.js {
        proxy_pass http://${VARROA_API_HOST}:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hibernation wake endpoints — unauthenticated, proxied to BFF.
    location /hibernation/ {
        proxy_pass http://${VARROA_API_HOST}:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Varroa API — proxied to Varroa backend (JWT-protected).
    # SSE / streaming support: HTTP/1.1, unbuffered, long timeout.
    # OIDC auth endpoints (/api/v1/auth/login, /api/v1/callback) are
    # also handled by the BFF through this proxy.
    location /api/ {
        proxy_pass http://${VARROA_API_HOST}:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
    }

}
