# hack/version-profiles.yaml — reviewed source of truth for shipped JenkinsVersionProfiles.
#
# hack/gen-plugin-lock.sh reads this manifest. It is the single place to add,
# remove, or re-pin a supported Jenkins version. Change it through a reviewed PR.
# Do not edit the generated lock.yaml or seed/ files by hand.
#
# version:        a 2-segment LTS line (for example "2.580") matches every patch
#                 of the line. A 2-segment weekly release (for example "2.588") or
#                 a 3-segment version is an exact pin.
# resolveVersion: the jenkins/jenkins:<resolveVersion>-alpine-jdk21 image that the
#                 generator resolves plugins against, and the exact core that the
#                 operator deploys for the line. An LTS line must set it. Pin it to
#                 the earliest patch that has no open core security advisory, that
#                 satisfies the required core of each pinned plugin, and that is at
#                 or above plugin/pom.xml <jenkins.version>. A weekly or 3-segment
#                 pin uses `version`.
#
# The generator enforces the floor: an LTS resolveVersion below plugin/pom.xml
# <jenkins.version> fails to boot, because varroa-mite-auth refuses to load.
#
# Policy: ship the current recommended LTS line and the newest weekly release.
# The weekly entry must equal `baseline`. An unpinned controller ("" or "lts")
# deploys jenkins/jenkins:<baseline> with the baseline plugin set, so the
# baseline must name an exact release that has no open core advisory.
baseline: "2.588"
profiles:
  # LTS line 2.580. The 2026-10-28 core advisory affects LTS 2.580.1 and
  # older, so resolveVersion is 2.580.2.
  - version: "2.580"
    channel: lts
    recommended: true
    resolveVersion: "2.580.2"
  # Weekly release. It must equal `baseline`.
  - version: "2.588"
    channel: weekly
