# CEL cases for charts/varroa/crds/varroa.dev_broodschedules.yaml.
# The rules sit on spec.template, so each case patches under template.
base:
  apiVersion: varroa.dev/v1alpha1
  kind: BroodSchedule
  metadata:
    name: schedule-a
  spec:
    schedule: "0 * * * *"
    waitForCompletion: false
    template:
      action:
        verb: restart
      targets:
        names: [ctl-a]
cases:
  - name: executeGroovy without a groovy block refused
    rule: |-
      self.verb == 'executeGroovy' ? has(self.groovy) : !has(self.groovy)
    field: spec.template.action
    new: {spec: {template: {action: {verb: executeGroovy, groovy: null}}}}
    want: reject
  - name: executeGroovy with a script accepted
    rule: |-
      self.verb == 'executeGroovy' ? has(self.groovy) : !has(self.groovy)
    field: spec.template.action
    new: {spec: {template: {action: {verb: executeGroovy, groovy: {script: "println 'x'"}}}}}
    want: accept

  - name: upgrade without an upgrade block refused
    rule: |-
      self.verb == 'upgrade' ? has(self.upgrade) : !has(self.upgrade)
    field: spec.template.action
    new: {spec: {template: {action: {verb: upgrade, upgrade: null}}}}
    want: reject
  - name: upgrade with a target version accepted
    rule: |-
      self.verb == 'upgrade' ? has(self.upgrade) : !has(self.upgrade)
    field: spec.template.action
    new: {spec: {template: {action: {verb: upgrade, upgrade: {targetVersion: "2.555.1"}}}}}
    want: accept

  - name: groovy block with neither source refused
    rule: |-
      (has(self.script) ? 1 : 0) + (has(self.itemRef) ? 1 : 0) == 1
    field: spec.template.action.groovy
    new: {spec: {template: {action: {verb: executeGroovy, groovy: {}}}}}
    want: reject
  - name: groovy block with a script accepted
    rule: |-
      (has(self.script) ? 1 : 0) + (has(self.itemRef) ? 1 : 0) == 1
    field: spec.template.action.groovy
    new: {spec: {template: {action: {verb: executeGroovy, groovy: {script: "println 'x'"}}}}}
    want: accept

  - name: template targets with neither names nor selector refused
    rule: |-
      has(self.names) != has(self.selector)
    field: spec.template.targets
    new: {spec: {template: {targets: {names: null}}}}
    want: reject
  - name: template targets with names accepted
    rule: |-
      has(self.names) != has(self.selector)
    field: spec.template.targets
    new: {spec: {template: {targets: {names: [ctl-a]}}}}
    want: accept

  - name: template names list empty refused
    rule: |-
      !has(self.names) || size(self.names) > 0
    field: spec.template.targets
    new: {spec: {template: {targets: {names: []}}}}
    want: reject
  - name: template names list with one entry accepted
    rule: |-
      !has(self.names) || size(self.names) > 0
    field: spec.template.targets
    new: {spec: {template: {targets: {names: [ctl-a]}}}}
    want: accept

  - name: template namespaces list empty refused
    rule: |-
      !has(self.namespaces) || size(self.namespaces) > 0
    field: spec.template.targets
    new: {spec: {template: {targets: {names: null, namespaces: [], selector: {matchLabels: {app: a}}}}}}
    want: reject
  - name: template namespaces list with one entry accepted
    rule: |-
      !has(self.namespaces) || size(self.namespaces) > 0
    field: spec.template.targets
    new: {spec: {template: {targets: {names: null, namespaces: [ns-a], selector: {matchLabels: {app: a}}}}}}
    want: accept

  - name: template namespaces without a selector refused
    rule: |-
      !has(self.namespaces) || has(self.selector)
    field: spec.template.targets
    new: {spec: {template: {targets: {namespaces: [ns-a]}}}}
    want: reject
  - name: template namespaces with a selector accepted
    rule: |-
      !has(self.namespaces) || has(self.selector)
    field: spec.template.targets
    new: {spec: {template: {targets: {names: null, namespaces: [ns-a], selector: {matchLabels: {app: a}}}}}}
    want: accept
