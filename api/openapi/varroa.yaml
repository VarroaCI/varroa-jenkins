        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Changes the kill switch, the defaults, or a tenant data level. Admin
        only.
      tags:
      - Assistant
  /api/v1/auth-config:
