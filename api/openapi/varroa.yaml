        from v1alpha1.RBACSpec).
      properties:
        groups:
          description: Group-to-role bindings.
          items:
            $ref: '#/components/schemas/components_schemas_RBACGroupBinding'
          type: array
      type: object
    components_schemas_RecentBuild:
      additionalProperties: false
      description: A recent build entry.
      properties:
        buildNumber:
          type: integer
        durationSeconds:
          type: integer
        jobName:
          type: string
        startedAt:
          type: string
        status:
          type: string
        url:
          type: string
      required:
      - jobName
      - buildNumber
      - status
      type: object
    components_schemas_ReconcileBlocked:
      additionalProperties: false
      description: Read-only projection of whether the controller's reconcile loop
        is currently blocked by an unresolved error.
      properties:
        blocked:
          type: boolean
        message:
          type: string
        reason:
          type: string
        since:
          type: string
      required:
      - blocked
      type: object
    components_schemas_ReconciliationPolicy:
      additionalProperties: false
      description: Reconciliation policy for a controller.
      properties:
        drainTimeoutSeconds:
          type: integer
        interval:
          type: string
        maxDeferSeconds:
          type: integer
        mode:
          type: string
      type: object
    components_schemas_ResourceOverlay:
      additionalProperties: false
      description: Raw strategic-merge-patch YAML for provisioned resources (transcribed
        from v1alpha1.ResourceOverlay).
      properties:
        ingress:
          description: Strategic-merge-patch YAML applied to the controller Ingress.
          type: string
        service:
          description: Strategic-merge-patch YAML applied to the controller Service.
          type: string
        statefulSet:
          description: Strategic-merge-patch YAML applied to the Jenkins StatefulSet.
          type: string
      type: object
    components_schemas_RestartRunRequest:
      additionalProperties: false
      description: POST /runs/{run}/restart. The stage the restart begins at.
      properties:
        stage:
          description: A stage name from the restart object of the run detail.
          type: string
      required:
      - stage
      type: object
    components_schemas_Rollout:
      additionalProperties: false
      description: Rollout gate status for a controller.
      properties:
        blocked:
          type: boolean
        blockedSince:
          type: string
        paused:
          type: boolean
        targetBundleHash:
          type: string
        waitingOn:
          items:
            type: string
          type: array
      required:
      - blocked
      type: object
    components_schemas_RotatePartialFailure:
      additionalProperties: false
      description: Partial failure on rotate — new key created but old key could not
        be revoked.
      properties:
        error:
          description: Human-readable error message.
          type: string
        newToken:
          description: The new API key (the old key still exists).
          type: string
      required:
      - error
      - newToken
      type: object
    components_schemas_RunActionResponse:
      additionalProperties: false
      description: |
        202 response for a run request, a rerun, or a replay. The BFF does not wait for the cell's admission decision; the caller polls the run.
      properties:
        intentKey:
          type: string
        runId:
          type: string
        state:
          enum:
          - requested
          type: string
      required:
      - runId
      - intentKey
      - state
      type: object
    components_schemas_RunArtifact:
      additionalProperties: false
      properties:
        contentType:
          type: string
        digest:
          type: string
        downloadable:
          description: |
            False when the stored blob key is empty (local artifact mode); the download path then answers 409.
          type: boolean
        path:
          type: string
        sizeBytes:
          format: int64
          type: integer
      required:
      - path
      - sizeBytes
      - downloadable
      type: object
    components_schemas_RunArtifactListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_RunArtifact'
          type: array
      required:
      - items
      type: object
    components_schemas_RunChange:
      additionalProperties: true
      description: One SCM change entry, passed through from the run's changes column.
      type: object
    components_schemas_RunChangeListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_RunChange'
          type: array
      required:
      - items
      type: object
    components_schemas_RunCommandRefusal:
      additionalProperties: false
      description: |
        The newest cancel or input answer the Jenkins plugin refused for this run, on GET /runs/{run}. The field is absent when no such refusal exists. A later successful command does not remove it. The notice carries its own time, so a reader compares it with the run state.
      properties:
        actor:
          description: The person or service that sent the command.
          type: string
        command:
          description: The refused command.
          enum:
          - cancel
          - proceed_input
          - abort_input
          type: string
        error:
          description: |
            The refusal text. The mite keeps the title of a Jenkins error page, and the gateway cuts the text at 512 characters.
          type: string
        httpStatus:
          description: The HTTP status the plugin answered.
          type: integer
        refusedAt:
          description: The time the gateway received the refusal.
          format: date-time
          type: string
      required:
      - command
      - refusedAt
      type: object
    components_schemas_RunDetail:
      additionalProperties: false
      description: GET /runs/{run}.
      properties:
        actor:
          type: string
        branch:
          type: string
        buildNumber:
          format: int64
          type: integer
        cases:
          description: |
            The run's stored failed and skipped test cases, the same entries GET /runs/{run}/tests serves. The field is absent when the run holds no stored case.
          items:
            $ref: '#/components/schemas/components_schemas_RunTestCase'
          type: array
        cause:
          type: string
        changeRequest:
          $ref: '#/components/schemas/components_schemas_ChangeRequest'
        commandRefusal:
          $ref: '#/components/schemas/components_schemas_RunCommandRefusal'
        digest:
          additionalProperties: false
          description: |
            Why a run that did not succeed failed. The server computes this object on every read, from the stored rows and the stored log. The field is absent for a run with no result, for a SUCCESS or TRIGGER_FAILED result, or for a run with no start time. The field is also absent when no part has a value.
          properties:
            error:
              description: |
                The stored error text of that stage. Absent when no stage failed, and when the stage carries no error.
              type: string
            failedTests:
              additionalProperties: false
              description: |
                The run's aggregate test counts. The field is present only when the run reports at least one failed test.
              properties:
                cases:
                  description: |
                    The first ten failed cases of the run, in the order the record store answers. A skipped case is not in the list. The field is absent when the run holds no stored case.
                  items:
                    additionalProperties: false
                    properties:
                      caseKey:
                        description: |
                          The opaque case key. Do not parse it. Percent-encode the whole key as one path segment before you use it as {case} on the case history read.
                        type: string
                      className:
                        type: string
                      name:
                        type: string
                      suite:
                        type: string
                    required:
                    - suite
                    - className
                    - name
                    - caseKey
                    type: object
                  type: array
                failed:
                  type: integer
                skipped:
                  type: integer
                total:
                  type: integer
              required:
              - failed
              type: object
            logTail:
              description: |
                The last 50 console log lines that carry the attribution of the failed stage or of a stage nested under it. The field falls back to the last 50 lines of the whole log when no log-index entry names one of those stages. The lines carry no ANSI escape sequence. It is absent when the server holds no blob store and when a log-index entry fails to decode. Absent for an INTERRUPTED run.
              type: string
            stage:
              description: |
                The name of the innermost stage whose status is FAILURE, in stage-start order. A stage or a parallel branch that holds a failed stage is never the answer. A parallel branch shows its branch name. Absent when no stage failed.
              type: string
          type: object
        downstream:
          $ref: '#/components/schemas/components_schemas_RunLinkPage'
        durationMs:
          format: int64
          type: integer
        endedAt:
          format: date-time
          type: string
        inputs:
          description: |
            The input steps the run waits on, read from the run's stored inputs column. This field is absent until a run.input event arrives, and absent for a run that holds no pending input.
          items:
            $ref: '#/components/schemas/components_schemas_RunInput'
          type: array
        interruptedReason:
          description: Set only when result is INTERRUPTED.
          type: string
        jobPath:
          type: string
        logComplete:
          description: The negation of LogSummary.incomplete.
          type: boolean
        logFinalized:
          description: LogSummary.finalized, read from the run's payload column.
          type: boolean
        params:
          additionalProperties:
            type: string
          type: object
        queuedAt:
          format: date-time
          type: string
        rejectedSignature:
          description: |
            Set only when result is FAILURE and the script sandbox refused a signature.
          type: string
        replayOf:
          description: |
            The identifier of the run whose script this build replayed. The field is absent for a build that is not a replay.
          type: string
        restart:
          $ref: '#/components/schemas/components_schemas_RunRestart'
        restartOf:
          description: |
            The identifier of the run this build restarted from. The field is absent for a build that is not a restart.
          type: string
        restartStage:
          description: |
            The stage this restarted build began at. The field is absent for a build that is not a restart.
          type: string
        result:
          type: string
        retryRunId:
          description: An existing retry's run id, when one already exists.
          type: string
        runId:
          type: string
        scmForge:
          description: |
            The forge that hosts scmUrl. A Forgejo host reads gitea. The field is absent when the forge is unknown.
          enum:
          - github
          - gitlab
          - gitea
          type: string
        scmRevision:
          type: string
        scmUrl:
          description: Repository URL of the run, from the SCM source. Absent when
            Jenkins reports none.
          type: string
        source:
          additionalProperties: false
          description: |
            How the run was defined, read from the run's stored source column. This field is absent until a run.source event arrives.
          properties:
            definitionPath:
              description: |
                The pipeline script path in the run's own repository. A run that a template defines reports no value here.
              type: string
            libraries:
              items:
                additionalProperties: false
                properties:
                  name:
                    type: string
                  repositoryForge:
                    description: |
                      The forge that hosts repositoryUrl. The field is absent when the forge is unknown.
                    enum:
                    - github
                    - gitlab
                    - gitea
                    type: string
                  repositoryUrl:
                    description: |
                      The library repository URL. It carries no credentials. The field is absent when the current library configuration does not name a repository.
                    type: string
                  revision:
                    description: |
                      The commit the run loaded. Absent when the library loaded from the cache.
                    type: string
                  version:
                    description: The version the run loaded. Absent when the library
                      declares none.
                    type: string
                type: object
              type: array
            podTemplates:
              items:
                additionalProperties: false
                properties:
                  image:
                    type: string
                  label:
                    type: string
                  name:
                    type: string
                type: object
              type: array
          type: object
        stages:
          items:
            $ref: '#/components/schemas/components_schemas_RunStage'
          type: array
        startedAt:
          format: date-time
          type: string
        status:
          type: string
        summary:
          description: |
            The one-line text the run attached to itself through varroa.summary. The plugin cuts the text at 512 UTF-8 bytes. This field is absent until the run calls varroa.summary.
          type: string
        tenant:
          description: |
            The tenant noun the server authorizes against: the run row's stored tenant column. A Tenant name for a Tenant tenant, or "<namespace>/<controller>" for a synthetic tenant.
          type: string
        tenantFolder:
          description: |
            The tenant's Jenkins folder prefix, from TenantRef.Folder. Empty for a root-hosted tenant.
          type: string
        testReport:
          $ref: '#/components/schemas/components_schemas_RunDetailTestReport'
        testsFailed:
          type: integer
        testsSkipped:
          type: integer
        testsTotal:
          type: integer
        triggerError:
          description: The error text a refused build trigger reported. Set only when
            result is TRIGGER_FAILED.
          type: string
        triggerReasonCode:
          description: Why no build exists for the trigger. One of JOB_NOT_FOUND,
            JOB_NOT_BUILDABLE, TRIGGER_REJECTED, TRIGGER_UNREACHABLE, CLAIM_EXPIRED,
            CLAIM_ABANDONED, FENCED, CROSS_TENANT, INVALID_KEY, THROTTLED, and NOT_HOME.
            The first three name a refusal from the controller. TRIGGER_UNREACHABLE
            names a trigger that reached no Jenkins. CLAIM_EXPIRED names an accepted
            trigger that no build claim followed. CLAIM_ABANDONED names a granted
            build claim that started no build. The last five name a build claim that
            the record store refused. NOT_HOME names a replay or a restart whose job
            home moved to another slot before it claimed. Set only when result is
            TRIGGER_FAILED.
          type: string
        triggerSource:
          description: |
            Kind of cause that started the run. Absent when Jenkins reports no cause list.
          enum:
          - user
          - webhook
          - cron
          - upstream
          - replay
          - restart
          - scm
          - other
          type: string
          x-enum-varnames:
          - User
          - Webhook
          - Cron
          - Upstream
          - Replay
          - Restart
          - Scm
          - Other
        upstream:
          $ref: '#/components/schemas/components_schemas_RunLink'
        waiting:
          $ref: '#/components/schemas/components_schemas_RunWait'
      required:
      - runId
      - jobPath
      - status
      - tenantFolder
      - tenant
      type: object
    components_schemas_RunDetailTestReport:
      additionalProperties: false
      description: |
        The run's stored test report, on GET /runs/{run}. The field is absent when the run holds no stored report. sizeBytes and caseCount are always present, and zero is a valid value.
      properties:
        blobKey:
          description: |
            The blob key of the archived report file. The value is empty when Jenkins stored the file locally.
          type: string
        caseCount:
          description: |
            The number of cases the report file holds. The file holds every case, including a passed case.
          format: int32
          type: integer
        sizeBytes:
          description: The length of the report file in bytes.
          format: int64
          type: integer
      required:
      - blobKey
      - sizeBytes
      - caseCount
      type: object
    components_schemas_RunInput:
      additionalProperties: false
      description: One input step a run waits on, read from the run's stored inputs
        column.
      properties:
        id:
          description: The input step's own identifier. Both input routes address
            this value.
          type: string
        message:
          description: The message the step shows. Absent when the step declares none.
          type: string
        ok:
          description: The label of the step's proceed control. Absent when the step
            declares none.
          type: string
        parameters:
          description: |
            The step's own parameter definitions, in declaration order. Absent when the step declares none.
          items:
            $ref: '#/components/schemas/components_schemas_RunInputParameter'
          type: array
        submitter:
          description: |
            The users and groups the step admits. Absent when the step declares none.
          type: string
        submitterParameter:
          description: |
            The parameter name that holds the answering user's name. Absent when the step declares none.
          type: string
      required:
      - id
      type: object
    components_schemas_RunInputParameter:
      additionalProperties: false
      description: One parameter an input step declares, read from its definition.
      properties:
        choices:
          description: The definition's choices. Absent when the definition declares
            none.
          items:
            type: string
          type: array
        defaultValue:
          description: |
            The definition's default value, rendered as text. Absent when the definition declares none.
          type: string
        description:
          description: The definition's description. Absent when the definition declares
            none.
          type: string
        name:
          description: The definition's name.
          type: string
        type:
          description: |
            The Java simple name of the parameter definition, such as StringParameterDefinition or ChoiceParameterDefinition.
          type: string
      required:
      - name
      type: object
    components_schemas_RunLink:
      additionalProperties: false
      description: |
        One run on the far side of a run link: the run that started this run, a run this run started, or a dependency edge's last run. A run the caller may not read carries its tenant alone.
      properties:
        buildNumber:
          description: The build number of the run.
          format: int64
          type: integer
        jobPath:
          description: The run's job path, qualified with its tenant folder.
          type: string
        result:
          description: The run's result, when it has one. Absent on an upstream link.
          type: string
        runId:
          description: The run's identifier. Absent when no run matched.
          format: uuid
          type: string
        status:
          description: The run's status. Absent on an upstream link.
          type: string
        tenant:
          description: The tenant that holds the run.
          type: string
      required:
      - tenant
      type: object
    components_schemas_RunLinkPage:
      additionalProperties: false
      description: One page of the runs a run started, newest first.
      properties:
        items:
          description: The runs on this page. Never null.
          items:
            $ref: '#/components/schemas/components_schemas_RunLink'
          type: array
        nextCursor:
          description: The cursor of the next page. Absent on the last page.
          type: string
      required:
      - items
      type: object
    components_schemas_RunListResponse:
      additionalProperties: false
      description: GET /pipelines/{tenant}/jobs/{job}/runs, cross-tenant cursor-merged.
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_RunSummary'
          type: array
        nextCursor:
          type: string
      required:
      - items
      type: object
    components_schemas_RunNote:
      additionalProperties: false
      description: A note on one build, or on one job. A session note carries the
        session id.
      properties:
        body:
          type: string
        buildNumber:
          description: The build number of the note's run. Set on the job read only.
          format: int64
          nullable: true
          type: integer
        cluster:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        jobPath:
          type: string
        principal:
          type: string
        runId:
          format: uuid
          nullable: true
          type: string
        sessionId:
          format: uuid
          nullable: true
          type: string
        tenant:
          type: string
      required:
      - id
      - runId
      - cluster
      - tenant
      - jobPath
      - principal
      - sessionId
      - body
      - createdAt
      type: object
    components_schemas_RunNoteError:
      additionalProperties: false
      description: A note refusal. The code names the cause when one applies.
      properties:
        code:
          enum:
          - note_too_long
          - note_session_invalid
          type: string
        error:
          type: string
      required:
      - error
      - code
      type: object
    components_schemas_RunNoteList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_RunNote'
          type: array
      required:
      - items
      type: object
    components_schemas_RunRestart:
      additionalProperties: false
      description: |
        GET /runs/{run}/restart. Whether a completed declarative run restarts from a stage. The stages list is always present, and it is empty when the run does not restart.
      properties:
        reason:
          description: |
            Why the run does not restart. The field is absent when restartable is true. The value is one of not-terminal, template-defined, not-recorded, not-declarative, disabled, unavailable, no-restartable-stage, or home-moved. The job moved and no restart copy is kept.
          type: string
        restartable:
          type: boolean
        stages:
          description: The stages the restart can begin at, in run order.
          items:
            type: string
          type: array
      required:
      - restartable
      - stages
      type: object
    components_schemas_RunScript:
      additionalProperties: false
      description: |
        GET /runs/{run}/script. The run's own Groovy script, read from the build record the run retains in the blob tier. Every field is always present. A run that does not replay answers an empty script and an empty loadedScripts object.
      properties:
        definitionKind:
          description: |
            template when the run's stored payload names a pipeline template or a marker file, and script otherwise.
          enum:
          - template
          - script
          type: string
        loadedScripts:
          additionalProperties:
            type: string
          description: |
            The library scripts the run loaded, as a map of name to script text. A caller cannot edit them, and a replay loads them again from their library. The object is empty when the run loaded no script or when replayable is false.
          type: object
        reason:
          description: |
            The name of the first eligibility rule the run fails. The rules run in this order: not-terminal, template-defined, masked-parameter, no-replica, unreadable, not-sandbox, and script-too-large. A replayable run answers the empty string.
          type: string
        replayable:
          description: True only when the run passes every eligibility rule.
          type: boolean
        script:
          description: |
            The main script of the run's flow execution. The value is empty when replayable is false.
          type: string
      required:
      - script
      - loadedScripts
      - definitionKind
      - replayable
      - reason
      type: object
    components_schemas_RunStage:
      additionalProperties: false
      properties:
        durationMs:
          format: int64
          type: integer
        endedAt:
          format: date-time
          type: string
        error:
          type: string
        name:
          type: string
        nodeType:
          type: string
        parentId:
          type: string
        stageId:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          type: string
      required:
      - stageId
      - name
      - status
      type: object
    components_schemas_RunSummary:
      additionalProperties: false
      description: One run, condensed for a list or a card.
      properties:
        actor:
          type: string
        branch:
          type: string
        buildNumber:
          format: int64
          type: integer
        cause:
          type: string
        changeRequest:
          $ref: '#/components/schemas/components_schemas_ChangeRequest'
        durationMs:
          format: int64
          type: integer
        endedAt:
          format: date-time
          type: string
        jobPath:
          type: string
        queuedAt:
          format: date-time
          type: string
        result:
          type: string
        runId:
          type: string
        scmForge:
          description: |
            The forge that hosts scmUrl. A Forgejo host reads gitea. The field is absent when the forge is unknown.
          enum:
          - github
          - gitlab
          - gitea
          type: string
        scmRevision:
          type: string
        scmUrl:
          description: Repository URL of the run, from the SCM source. Absent when
            Jenkins reports none.
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          type: string
        triggerSource:
          description: |
            Kind of cause that started the run. Absent when Jenkins reports no cause list.
          enum:
          - user
          - webhook
          - cron
          - upstream
          - replay
          - restart
          - scm
          - other
          type: string
          x-enum-varnames:
          - User
          - Webhook
          - Cron
          - Upstream
          - Replay
          - Restart
          - Scm
          - Other
      required:
      - runId
      - status
      type: object
    components_schemas_RunTestCase:
      additionalProperties: false
      description: |
        One stored test case of a run. The record store holds only failed and skipped cases, at most 500 for each run.
      properties:
        caseKey:
          description: |
            The opaque case key the server makes from the class name and the test name. Do not parse it. Percent-encode the whole key as one path segment before you use it as {case} on GET /pipelines/{tenant}/jobs/{job}/tests/{case}.
          type: string
        className:
          type: string
        durationMs:
          description: The case's duration in milliseconds. Absent when the value
            is zero.
          format: int64
          type: integer
        errorDetails:
          description: |
            The case's error detail text, cut at 512 bytes. Absent when the case carries no error detail.
          type: string
        name:
          type: string
        status:
          description: |
            The reporter's own status name, for example FAILED or REGRESSION. A skipped case carries SKIPPED.
          type: string
        suite:
          type: string
      required:
      - suite
      - className
      - name
      - status
      - caseKey
      type: object
    components_schemas_RunTestListResponse:
      additionalProperties: false
      description: |
        GET /runs/{run}/tests. items holds one row per suite, at most 500, the most failed suites first, then by suite name. items is empty when the run reported no suite. totals holds the run's aggregate counters, and it is absent when the run reported no test result. cases holds the run's stored failed and skipped cases, failed cases first. cases is always present, and an empty array is a valid value.
      properties:
        cases:
          items:
            $ref: '#/components/schemas/components_schemas_RunTestCase'
          type: array
        items:
          items:
            $ref: '#/components/schemas/components_schemas_RunTestSuite'
          type: array
        report:
          $ref: '#/components/schemas/components_schemas_RunTestReport'
        totals:
          $ref: '#/components/schemas/components_schemas_RunTestTotals'
      required:
      - items
      - cases
      type: object
    components_schemas_RunTestReport:
      additionalProperties: false
      description: |
        The run's archived test report, on GET /runs/{run}/tests. The field is absent when the run holds no stored report. sizeBytes and caseCount are always present, and zero is a valid value.
      properties:
        caseCount:
          description: |
            The number of cases the report file holds. The file holds every case, including a passed case.
          format: int32
          type: integer
        downloadable:
          description: |
            False when the stored blob key is empty, because Jenkins stored the file locally. The download path then answers 409.
          type: boolean
        path:
          description: |
            The archived path of the report file, always .varroa/tests.json. Download the file through GET /runs/{run}/artifacts/{path}.
          type: string
        sizeBytes:
          description: The length of the report file in bytes.
          format: int64
          type: integer
      required:
      - path
      - sizeBytes
      - caseCount
      - downloadable
      type: object
    components_schemas_RunTestSuite:
      additionalProperties: false
      properties:
        durationMs:
          format: int64
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        suite:
          type: string
        total:
          type: integer
      required:
      - suite
      - total
      - failed
      - skipped
      type: object
    components_schemas_RunTestTotals:
      additionalProperties: false
      description: |
        The run's aggregate test counters. Jenkins reports them. They count every suite, including a suite the items list omits.
      properties:
        failed:
          type: integer
        skipped:
          type: integer
        total:
          type: integer
      required:
      - total
      - failed
      - skipped
      type: object
    components_schemas_RunWait:
      additionalProperties: false
      description: The concurrency cap that holds a queued run. Absent from a run
        that no cap holds.
      properties:
        cell:
          type: string
        kind:
          description: tenant when a tenant limit holds the run; cell when the tenant
            cap of its cell does.
          enum:
          - tenant
          - cell
          type: string
        limit:
          description: The tenant limit's name. Absent for a cell cap.
          type: string
        max:
          format: int32
          type: integer
        running:
          description: The builds the cap counted when it last held the run.
          format: int32
          type: integer
        since:
          format: date-time
          type: string
      required:
      - kind
      - max
      - running
      - since
      type: object
    components_schemas_RunWaitEntry:
      additionalProperties: false
      description: A waiting run of a job, with its reason.
      properties:
        cell:
          type: string
        kind:
          enum:
          - tenant
          - cell
          type: string
        limit:
          type: string
        max:
          format: int32
          type: integer
        runId:
          type: string
        running:
          format: int32
          type: integer
        since:
          format: date-time
          type: string
      required:
      - runId
      - kind
      - max
      - running
      - since
      type: object
    components_schemas_RunnerCondition:
      additionalProperties: false
      description: Status condition for a Runner. Type Ready.
      properties:
        lastTransitionTime:
          description: ISO 8601 last transition time.
          type: string
        message:
          type: string
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - type
      - status
      type: object
    components_schemas_RunnerCreateRequest:
      additionalProperties: false
      description: Request body for POST /runners.
      properties:
        name:
          description: 'metadata.name. Not generated: the operator names the machine,
            and the rendered node is <tenant>-<name>.'
          type: string
        spec:
          $ref: '#/components/schemas/components_schemas_RunnerSpec'
      required:
      - name
      - spec
      type: object
    components_schemas_RunnerEntry:
      additionalProperties: false
      description: Full runner object returned from get/list operations.
      properties:
        name:
          type: string
        spec:
          $ref: '#/components/schemas/components_schemas_RunnerSpec'
        status:
          $ref: '#/components/schemas/components_schemas_RunnerStatus'
      required:
      - name
      - spec
      - status
      type: object
    components_schemas_RunnerSpec:
      additionalProperties: false
      description: A Runner's mutable configuration (spec.*). tenant and launcher
        are immutable after creation.
      properties:
        credentialRef:
          description: Name of a Secret in the Tenant's agent namespace holding the
            SSH credential. Required for launcher ssh; forbidden for inbound.
          type: string
        host:
          description: The SSH target. Required for launcher ssh; forbidden for inbound.
          type: string
        javaPath:
          description: An explicit java binary path for the ssh launcher.
          type: string
        labels:
          description: Unprefixed label suffixes; the operator prefixes each one with
            <tenant>-.
          items:
            type: string
          type: array
        launcher:
          description: Connection direction. Immutable.
          enum:
          - ssh
          - inbound
          type: string
        numExecutors:
          description: The node's executor count. Defaults to 1.
          type: integer
        port:
          description: The SSH port. Required for launcher ssh; forbidden for inbound.
          type: integer
        remoteFS:
          description: The agent work directory on the node.
          type: string
        tenant:
          description: The pipelines Tenant that owns this runner. Immutable.
          type: string
      required:
      - tenant
      - launcher
      - remoteFS
      type: object
    components_schemas_RunnerStatus:
      additionalProperties: false
      description: A Runner's observed state (status.*). status.token is present only
        for a caller holding runners:create; the BFF redacts it for every other caller
        (design D12).
      properties:
        cell:
          description: The Controller that hosts this runner's node.
          type: string
        cellNamespace:
          type: string
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_RunnerCondition'
          type: array
        connected:
          description: The last liveness probe result for this runner's node.
          type: boolean
        lastSeen:
          description: ISO 8601 time of the last online probe result.
          type: string
        nodeName:
          description: The rendered Jenkins node name, <tenant>-<runner name>.
          type: string
        observedGeneration:
          format: int64
          type: integer
        token:
          description: The door bearer credential for an inbound runner. Minted once
            by the operator; never set for an ssh runner.
          type: string
      required:
      - connected
      type: object
    components_schemas_RunningRun:
      additionalProperties: false
      description: |
        One unfinished run for the tenant home's Running now card. currentStage names the top-level stage in progress. It is absent when no top-level stage is in progress: before the first stage, between two stages, and for a queued run.
      properties:
        branch:
          type: string
        buildNumber:
          format: int64
          type: integer
        changeRequest:
          $ref: '#/components/schemas/components_schemas_ChangeRequest'
        changeSummary:
          description: The last commit's short message.
          type: string
        currentStage:
          type: string
        jobPath:
          type: string
        queuedAt:
          format: date-time
          type: string
        runId:
          type: string
        scmRevision:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          type: string
        typicalDurationMs:
          description: The job's usual duration, from its duration trend.
          format: int64
          type: integer
      required:
      - runId
      - jobPath
      - status
      type: object
    components_schemas_ScanMultibranchRequest:
      additionalProperties: false
      description: POST /pipelines/{tenant}/jobs/{job}/scan. Every field is optional.
      properties:
        cluster:
          description: |
            Breaks a tie when the job path lies in more than one surviving tenant.
          type: string
      type: object
    components_schemas_ScopedCapabilities:
      additionalProperties: false
      description: The capability set granted by bindings that carry one scope, plus
        the scope descriptor. Scoped grants are never flattened into the global partition.
      properties:
        capabilities:
          $ref: '#/components/schemas/components_schemas_APICapabilitySet'
        hasControllerSelector:
          description: True when the scope carries a controller label selector, which
            the client cannot evaluate.
          type: boolean
        namespaces:
          description: The scope's namespace allowlist. Null or empty means the scope
            is not namespace-bounded.
          items:
            type: string
          nullable: true
          type: array
        tenants:
          description: The scope's canonicalized pipelines-tenant allowlist. Null
            or empty means the scope names no tenant.
          items:
            $ref: '#/components/schemas/components_schemas_TenantScope'
          nullable: true
          type: array
      required:
      - namespaces
      - hasControllerSelector
      - capabilities
      type: object
    components_schemas_SearchResult:
      additionalProperties: false
      description: A single search result entry.
      properties:
        cluster:
          type: string
        description:
          type: string
        link:
          type: string
        name:
          type: string
        namespace:
          type: string
        type:
