  /api/v1/openapi.json:
    get:
      operationId: getOpenAPISpec
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The complete OpenAPI specification.
      security: []
      summary: Returns the bundled OpenAPI spec.
      tags:
      - ops
  /api/v1/pipelines:
    get:
      description: |
        Answers each local Team that carries spec.pipelines, and each live record-store placement row of another cluster. A row of the local cluster, a row with no cell, and a row at placement generation 0 are not listed. A name that a local Team holds lists only the local Team. One name placed on two other clusters lists one row for each cluster. The route has no gate of its own: the tenant read check drops each row the caller may not read, so a caller who can read no row gets an empty list. When the record store is off or its schema is too old, the list carries the local Teams alone and recordStore is false.
      operationId: listPipelineTeams
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_PipelineTeamList'
          description: The pipelines Teams the caller may read.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "500":
          $ref: '#/components/responses/components_responses_Internal'
      summary: Lists the pipelines Teams the caller may read.
      tags:
      - Pipelines
  /api/v1/pipelines/{team}:
    get:
      description: |
        Resolves {team} onto one or more record-store tenants, unions each tenant's job summaries with the catalog's declared jobs, and reads each tenant's unfinished runs for the Running now strip.
      operationId: listPipelines
      parameters:
      - $ref: '#/components/parameters/components_parameters_team'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_PipelineListResponse'
          description: The team's pipelines and running-now strip.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The team name is ambiguous across clusters.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The team resolves to more tenants than the fan-out ceiling.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists a team's pipelines and its unfinished runs.
      tags:
      - Pipelines
  /api/v1/pipelines/{team}/cell:
    get:
      description: |
        Reads the Team object first, so a pipelines team that waits for its first cell answers 200 with the state unplaced. The body carries this tenant's own counts and a neighbour count. It carries no other tenant's name, job path, run, or count. canOpenCell is a hint that gates no field: a caller the controller read check refuses still receives the whole body.
      operationId: getTeamCell
      parameters:
      - $ref: '#/components/parameters/components_parameters_team'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TeamCell'
          description: The tenant's cell view.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Returns the tenant's own view of the cell that hosts it.
      tags:
      - Pipelines
  /api/v1/pipelines/{team}/jobs/{job}:
    get:
      description: |
        dependencies.upstream and dependencies.downstream carry the job's cross-tenant varroa-upstream trigger edges (design D13), each marked granted or not. The route authorizes with CanReadPipeline, never a controller-scoped check, because a cell hosts many tenants.
      operationId: getPipelineJob
      parameters:
      - $ref: '#/components/parameters/components_parameters_team'
      - $ref: '#/components/parameters/components_parameters_job'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_PipelineJobDetail'
          description: The job's detail.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Returns one job's summary, definition, triggers, parameters, and dependency
        edges.
      tags:
      - Pipelines
  /api/v1/pipelines/{team}/jobs/{job}/runs:
    get:
      operationId: listRuns
      parameters:
      - $ref: '#/components/parameters/components_parameters_team'
      - $ref: '#/components/parameters/components_parameters_job'
      - in: query
        name: branch
        schema:
          type: string
      - in: query
        name: result
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: cause
        schema:
          type: string
      - in: query
        name: limit
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      - in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunListResponse'
          description: A page of the job's runs, newest first.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists a job's runs, filtered and paged across every tenant of the team.
      tags:
      - Pipelines
    post:
      description: |
        job may omit or repeat the tenant's folder segment; both forms resolve to the same job.
      operationId: createRun
      parameters:
      - $ref: '#/components/parameters/components_parameters_team'
      - $ref: '#/components/parameters/components_parameters_job'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_CreateRunRequest'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunActionResponse'
          description: The run was requested.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The job path lies in two or more tenants and no cluster value
            breaks the tie.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Requests a new build. Fire and forget — the BFF does not claim the
        build number.
      tags:
      - Pipelines
  /api/v1/pipelines/{team}/jobs/{job}/tests/{case}:
    get:
      description: |
        Resolves {team} onto one or more record-store tenants and applies the tenant read check to each, with the decoded job path. Reads the case history of each admitted tenant, merges the rows newest first, and cuts the list to limit. The history is keyed by class name and test name, so two suites that report one class and one name merge. A job that holds no stored case answers an empty items list. The read answers the record store retention window.
      operationId: listJobTestCaseHistory
      parameters:
      - $ref: '#/components/parameters/components_parameters_team'
      - $ref: '#/components/parameters/components_parameters_job'
      - $ref: '#/components/parameters/components_parameters_case'
      - in: query
        name: limit
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TestCaseHistoryResponse'
          description: The case's recent outcomes, newest first.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The server cannot split or decode the case key.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The team resolves no tenant, or the caller may not read any
            of its tenants.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists the recent outcomes of one test case of a job, across every tenant
        of the team.
      tags:
      - Pipelines
  /api/v1/pipelines/{team}/locks:
    get:
      description: |
        Resolves {team} onto one or more record-store tenants, applies the tenant read check to each, reads each tenant's locks, and merges the answers in lock name order, the holder before its waiters. Each row carries its own tenant and jobPath, whichever tenant it belongs to. A row carries runLink only when the caller's own grant can read that row's own run. A waiting row reports its own waitingSince. A held or a releasing row reports its own acquiredAt. It carries no queue position.
      operationId: listTeamFleetLocks
      parameters:
      - $ref: '#/components/parameters/components_parameters_team'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_FleetLockListResponse'
          description: The team's fleet locks, the holder of each name before its
            waiters.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists the fleet locks a team's tenants own, hold, or wait on.
      tags:
      - Pipelines
  /api/v1/pipelines/{team}/markers/validate:
    post:
      description: |
        Resolves {team} onto its delivered pipeline-template set (design pipeline-marker-file) and validates the posted marker text against it. Contacts no cell and no record store, so it works while a cell is down and while the record store is disabled.
      operationId: validatePipelineMarker
      parameters:
      - $ref: '#/components/parameters/components_parameters_team'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_PipelineMarkerValidateRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_PipelineMarkerValidateResponse'
          description: The lint findings. An empty list means the marker is valid.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lints a marker file against the team's delivered pipeline templates.
      tags:
      - Pipelines
  /api/v1/pipelines/{team}/stream:
    get:
      description: |
        Streams one frame per live run notification, with the event name run or stage and the notification body as data. The stream writes no initial frame and replays nothing, so a page refetches its own reads when the stream reports itself open. It uses `?ticket=` for browser EventSource auth, and the ticket carries the scope pipelines:{team}.
      operationId: streamTeamRuns
      parameters:
      - $ref: '#/components/parameters/components_parameters_team'
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: The event stream (event kinds run and stage).
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Streams live run notifications for one team via Server-Sent Events.
      tags:
      - Pipelines
      x-sse: true
