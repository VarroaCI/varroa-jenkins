          type: object
      type: object
    components_schemas_BroodScheduleSpec:
      description: Desired state of a BroodSchedule.
      properties:
        concurrencyPolicy:
          description: How to handle overlapping executions.
          enum:
          - Allow
          - Forbid
          - Replace
          type: string
        failedJobsHistoryLimit:
          description: Number of failed finished jobs to retain.
          format: int32
          type: integer
        schedule:
          description: Cron expression for when to trigger the operation.
          type: string
        startingDeadlineSeconds:
          description: Deadline in seconds for starting the job if it misses its scheduled
            time.
          format: int64
          type: integer
        successfulJobsHistoryLimit:
          description: Number of successful finished jobs to retain.
          format: int32
          type: integer
        suspend:
          description: Suspends the schedule.
          type: boolean
        template:
          description: Template for the brood operation.
          properties:
            action:
              properties:
                verb:
                  description: Brood operation verb.
                  type: string
              type: object
            clusters:
              description: Target clusters.
              items:
                type: string
              type: array
            execution:
              additionalProperties: true
              description: Execution parameters (order, maxParallel, failurePolicy).
              type: object
            targets:
              additionalProperties: true
              description: Target selection (names or selector).
              type: object
            ttlSecondsAfterFinished:
              description: TTL after the operation finishes.
              format: int32
              type: integer
          type: object
        waitForCompletion:
          description: Whether the CronJob should wait for the brood operation to
            complete.
          type: boolean
      required:
      - schedule
      - template
      type: object
    components_schemas_BuiltinRoleRef:
      additionalProperties: false
      description: A built-in VarroaRole with resolved Jenkins permissions.
      properties:
        apiRules:
          items:
            $ref: '#/components/schemas/components_schemas_ApiRuleRef'
          type: array
        jenkinsPermissions:
          description: Resolved Jenkins permissions (plugin/controller-level).
          items:
            type: string
          type: array
        jenkinsRoleRef:
          description: Reference to the corresponding JenkinsRole.
          type: string
        name:
          type: string
      required:
      - name
      - apiRules
      - jenkinsRoleRef
      - jenkinsPermissions
      type: object
    components_schemas_BundleRef:
      additionalProperties: false
      properties:
        name:
          type: string
        namespace:
          type: string
      required:
      - namespace
      - name
      type: object
    components_schemas_CancelRunResponse:
      additionalProperties: false
      description: |
        202 response for a fire-and-forget run action: a cancel, an input proceed, or an input abort. The BFF publishes one command and waits for no result.
      properties:
        state:
          enum:
          - requested
          type: string
      required:
      - state
      type: object
    components_schemas_CatalogItem:
      description: A CatalogItem CRD.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_CatalogItemSpec'
        status:
          $ref: '#/components/schemas/components_schemas_CatalogItemStatus'
      type: object
    components_schemas_CatalogItemClosureEntry:
      additionalProperties: false
      description: One pinned member of a derived item's dependency closure.
      properties:
        artifactId:
          type: string
        direct:
          description: Declared by the root, as opposed to pulled in transitively.
          type: boolean
        minimum:
          description: The effective minimum in force, when one was declared.
          type: string
        provenance:
          description: Where the selected version came from.
          enum:
          - store
          - lock
          type: string
        version:
          type: string
      required:
      - artifactId
      - version
      type: object
    components_schemas_CatalogItemCompat:
      additionalProperties: false
      description: One profile's advisory compatibility verdict for a catalog item.
      properties:
        jenkinsVersion:
          description: The profile's effective deployed core — resolveVersion when
            set, else version.
          type: string
        message:
          type: string
        profile:
          type: string
        verdict:
          enum:
          - compatible
          - core-too-old
          - dep-below-minimum
          - lock-too-old
          - unknown
          type: string
      required:
      - profile
      - verdict
      type: object
    components_schemas_CatalogItemDetailResponse:
      additionalProperties: false
      description: A CatalogItem plus the per-profile lock-pin projection joined from
        the JenkinsVersionProfile locks at read time. The pins are cluster state and
        are deliberately not stored on the item, where they would go stale.
      properties:
        item:
          $ref: '#/components/schemas/components_schemas_CatalogItem'
        lockPins:
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemLockPins'
          type: array
      required:
      - item
      type: object
    components_schemas_CatalogItemLockPins:
      additionalProperties: false
      description: One profile's lock pins for a derived item's closure entries. A
        closure entry the lock does not mention has no key in pins, which is distinct
        from the lock pinning it at the same version.
      properties:
        pins:
          additionalProperties:
            type: string
          type: object
        profile:
          type: string
      required:
      - profile
      - pins
      type: object
    components_schemas_CatalogItemRef:
      additionalProperties: false
      properties:
        name:
          type: string
        namespace:
          type: string
      required:
      - name
      - namespace
      type: object
    components_schemas_CatalogItemSpec:
      additionalProperties: false
      description: Spec for a CatalogItem.
      properties:
        description:
          type: string
        displayName:
          type: string
        path:
          type: string
        requires:
          items:
            type: string
          type: array
        sourceRef:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          enum:
          - podtemplate
          - plugin
          - item
          - jcasc
          - rbac
          - pipeline-template
          - groovy
          type: string
        variables:
          items:
            $ref: '#/components/schemas/components_schemas_CatalogVariable'
          type: array
        version:
          type: string
      required:
      - sourceRef
      - type
      - path
      type: object
    components_schemas_CatalogItemStatus:
      description: Observed state of a CatalogItem.
      properties:
        closure:
          description: The resolver's own record of what it pinned, for items derived
            from the update-center store. status.content is a flat plugins.yaml fragment
            and can express none of these facts.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemClosureEntry'
          type: array
        compat:
          description: One advisory verdict per JenkinsVersionProfile. Never blocks
            anything.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemCompat'
          type: array
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_TemplateCatalogCondition'
          type: array
        content:
          type: string
        contentHash:
          type: string
        message:
          type: string
        observedRevision:
          type: string
        valid:
          type: boolean
      type: object
    components_schemas_CatalogItemSummary:
      additionalProperties: false
      description: Summary projection returned by catalog item list responses.
      properties:
        compat:
          description: The item's advisory per-profile verdicts, so a row can be badged
            without a per-item detail fetch. A badge never disables selection.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemCompat'
          type: array
        contentHash:
          type: string
        description:
          type: string
        displayName:
          type: string
        message:
          type: string
        name:
          type: string
        namespace:
          type: string
        pluginName:
          description: The update-center plugin this item was derived for. The browser
            collapses rows by it, so a plugin stored at three versions is one row
            with a version selector. Absent for items that are not update-center-derived.
          type: string
        sourceRef:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          type: string
        valid:
          type: boolean
        variables:
          description: The item's declared variables, so list consumers can render
            typed inputs without a per-item detail fetch.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogVariable'
          type: array
        version:
          type: string
      required:
      - name
      - namespace
      - type
      - sourceRef
      - valid
      type: object
    components_schemas_CatalogSource:
      description: A CatalogSource CRD.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_CatalogSourceSpec'
        status:
          $ref: '#/components/schemas/components_schemas_CatalogSourceStatus'
      type: object
    components_schemas_CatalogSourceSpec:
      additionalProperties: false
      description: Spec for a CatalogSource (bundle catalog repository).
      properties:
        ociRef:
          description: OCI artifact reference; mutually exclusive with repoURL.
          type: string
        path:
          type: string
        repoURL:
          type: string
        revision:
          type: string
        secretRef:
          type: string
        syncIntervalSeconds:
          description: Catalog poll cadence in seconds. 0 or an omitted field means
            the default (300); any other value must be between 30 and 31536000.
          oneOf:
          - enum:
            - 0
          - maximum: 31536000
            minimum: 30
          type: integer
        trusted:
          type: boolean
      type: object
    components_schemas_CatalogSourceStatus:
      description: Observed state of a CatalogSource.
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_TemplateCatalogCondition'
          type: array
        itemCount:
          type: integer
        lastSyncTime:
          type: string
        message:
          type: string
        observedRevision:
          type: string
        phase:
          enum:
          - Pending
          - Syncing
          - Ready
          - Error
          type: string
      type: object
    components_schemas_CatalogVariable:
      additionalProperties: false
      description: A variable definition for a catalog item.
      properties:
        allowedValues:
          description: Populates a choice/dropdown widget. Only valid when type is
            "string" or "number".
          items:
            type: string
          type: array
        default:
          type: string
        description:
          type: string
        name:
          type: string
        required:
          type: boolean
        type:
          description: Parameter type. Omitting the field means "string".
          enum:
          - string
          - number
          - boolean
          - credentials
          type: string
      required:
      - name
      type: object
    components_schemas_CellGrant:
      additionalProperties: false
      description: One grant that reaches a tenant. The jobs field is absent when
        the grant narrows nothing. An absent jobs and an empty jobs mean different
        things, so the field is never an empty array.
      properties:
        binding:
          description: The VarroaRoleBinding name. Absent for the teamMembership source.
          type: string
        jobs:
          items:
            type: string
          minItems: 1
          type: array
        roleRef:
          type: string
        source:
          enum:
          - teamMembership
          - tenantScopedBinding
          - clusterWideBinding
          type: string
        subjects:
          items:
            $ref: '#/components/schemas/components_schemas_CellGrantSubject'
          type: array
        verbs:
          description: The pipelines verbs of the grant's role, never the whole capability
            set.
          items:
            type: string
          type: array
      required:
      - source
      - roleRef
      - subjects
      - verbs
      type: object
    components_schemas_CellGrantSubject:
      additionalProperties: false
      description: One subject of a grant.
      properties:
        kind:
          type: string
        name:
          type: string
      required:
      - kind
      - name
      type: object
    components_schemas_CellGrants:
      additionalProperties: false
      description: One entry for each tenant of a cell, naming the subjects that may
        build on it.
      properties:
        cell:
          type: string
        cluster:
          type: string
        namespace:
          type: string
        tenants:
          items:
            $ref: '#/components/schemas/components_schemas_CellTenantGrants'
          type: array
      required:
      - cluster
      - namespace
      - cell
      - tenants
      type: object
    components_schemas_CellPool:
      additionalProperties: false
      description: Full cell-pool object returned from get and list operations.
      properties:
        cluster:
          description: The cluster that holds the pool. A pool name is unique inside
            one cluster only.
          type: string
        name:
          type: string
        spec:
          $ref: '#/components/schemas/components_schemas_CellPoolSpec'
        status:
          $ref: '#/components/schemas/components_schemas_CellPoolStatus'
      required:
      - cluster
      - name
      - spec
      - status
      type: object
    components_schemas_CellPoolCondition:
      additionalProperties: false
      description: Status condition for a CellPool. Type PoolReady, with exactly the
        reasons Ready, CellCapReached, ProfileMissing, RecordStoreUnsupported, BlobTierUnsupported,
        ArtifactSecretMissing, ArtifactPluginMissing, and SecretsMissing.
      properties:
        lastTransitionTime:
          description: ISO 8601 last transition time.
          type: string
        message:
          type: string
        observedGeneration:
          format: int64
          type: integer
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - type
      - status
      type: object
    components_schemas_CellPoolScaleRequest:
      additionalProperties: false
      description: Request body for PATCH /cellpools/{name}. It declares the four
        scale dials and nothing else, so the contract itself states that a structural
        edit is not an API operation.
      properties:
        spec:
          additionalProperties: false
          properties:
            maxCells:
              format: int32
              minimum: 0
              type: integer
            maxTenantsPerCell:
              format: int32
              minimum: 1
              type: integer
            unreadyGracePeriod:
              type: string
            warm:
              format: int32
              minimum: 0
              type: integer
          type: object
      required:
      - spec
      type: object
    components_schemas_CellPoolSpec:
      additionalProperties: false
      description: A CellPool's configuration (spec.*). profileRef is immutable, because
        a pool's cells carry the profile label they were created with.
      properties:
        cellTemplate:
          additionalProperties: true
          description: resources, miteResources, and podOverrides for the cells the
            pool creates. resources and podOverrides go to the Jenkins container and
            the pod; miteResources goes to the mite sidecar. The pool exposes no raw
            strategic-merge overlay.
          type: object
        maxCells:
          description: Cap on the pool's cells, placed cells included. 0 means unlimited.
          format: int32
          minimum: 0
          type: integer
        maxTenantsPerCell:
          description: Capacity a pool cell uses when its own spec.cell.maxTenants
            is zero.
          format: int32
          minimum: 1
          type: integer
        profileRef:
          description: The JenkinsVersionProfile the pool's cells run. Immutable.
          minLength: 1
          type: string
        unreadyGracePeriod:
          description: How long a pool cell may stay unready before the operator rolls
            its pod. A Go duration string.
          type: string
        warm:
          description: Target count of free cells the pool keeps ready.
          format: int32
          minimum: 0
          type: integer
      required:
      - profileRef
      type: object
    components_schemas_CellPoolStatus:
      additionalProperties: false
      description: A CellPool's reported cell and tenant counts.
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_CellPoolCondition'
          type: array
        freeTenantSlots:
          description: Spare capacity of the placed cells only. warmCells already
            reports the empty ones.
          format: int32
          type: integer
        observedGeneration:
          format: int64
          type: integer
        placedCells:
          description: Owned cells that hold at least one tenant.
          format: int32
          type: integer
        tenants:
          description: Every tenant on the pool, sorted.
          items:
            type: string
          type: array
        unreadyCells:
          description: Owned cells whose CellReady condition is not True.
          format: int32
          type: integer
        warmCells:
          description: Owned cells that hold no tenant.
          format: int32
          type: integer
      required:
      - warmCells
      - placedCells
      - unreadyCells
      - freeTenantSlots
      type: object
    components_schemas_CellSpec:
      additionalProperties: false
      description: Marks a controller as a shared cell that hosts tenant pipelines.
        enabled is immutable after creation; maxTenants bounds placement.
      properties:
        enabled:
          type: boolean
        maxTenants:
          format: int32
          type: integer
      required:
      - enabled
      type: object
    components_schemas_CellStatusProjection:
      additionalProperties: false
      description: 'The controller detail''s projection of status.cell. It declares
        ten properties. It declares no rehydration property: the cell-controllers
        capability keeps that key inside the operator.'
      properties:
        appliedTenants:
          description: The tenant set of the last apply that passed. A tenant named
            in tenants and absent here is still rehydrating.
          items:
            type: string
          type: array
        evacuate:
          description: Operator-written state. No API accepts a write to it, so no
            surface offers an evacuate action.
          type: boolean
        instance:
          type: string
        previousInstance:
          type: string
        previousInstanceLastSeen:
          format: date-time
          type: string
        rolledAt:
          format: date-time
          type: string
        tenantWarnings:
          items:
            $ref: '#/components/schemas/components_schemas_CellTenantWarning'
          type: array
        tenants:
          items:
            type: string
          type: array
        unreadySince:
          format: date-time
          type: string
        warm:
          type: boolean
      type: object
    components_schemas_CellTenantGrants:
      additionalProperties: false
      description: Every grant that reaches one tenant of a cell, with the tenant's
        generated Jenkins item role. The item role and its pattern come from the tenant
        name, so the read opens no JenkinsRole object.
      properties:
        grants:
          items:
            $ref: '#/components/schemas/components_schemas_CellGrant'
          type: array
        itemPattern:
          type: string
        itemRole:
          type: string
        tenant:
          type: string
        truncated:
          description: True only when the 50-grant cap dropped a grant of this tenant.
          type: boolean
      required:
      - tenant
      - itemRole
      - itemPattern
      - truncated
      - grants
      type: object
    components_schemas_CellTenantUsage:
      additionalProperties: false
      description: One tenant on a cell, with that tenant's role and four counts.
      properties:
        agentNamespace:
          description: The namespace that holds the tenant's build agents, as the
            tenant's own cluster last announced it. Absent when no announcement named
            one.
          type: string
        failedLast24h:
          format: int64
          type: integer
        jobs:
          format: int64
          type: integer
        placementGeneration:
          description: The generation of the tenant's placement row.
          format: int64
          type: integer
        role:
          description: 'That tenant''s role on this cell: "slot <n>" for an active
            member and "standby" for a standby. A standby holds the tenant folder
            and runs no build, so its running count is zero.'
          type: string
        runningNow:
          format: int64
          type: integer
        runsLast24h:
          format: int64
          type: integer
        tenant:
          type: string
      required:
      - tenant
      - placementGeneration
      - runningNow
      - runsLast24h
      - failedLast24h
      - jobs
      type: object
    components_schemas_CellTenantWarning:
      additionalProperties: false
      description: One non-blocking finding the reconciler recorded about a tenant.
      properties:
        message:
          type: string
        reason:
          type: string
        tenant:
          type: string
      required:
      - tenant
      - reason
      - message
      type: object
    components_schemas_CellUsage:
      additionalProperties: false
      description: 'One cell''s load, tenant by tenant. An absent optional field is
        absent from the object, never a null and never a zero: queueLength reads as
        zero only for an empty queue, and a cell in a remote cluster carries no queueLength
        at all.'
      properties:
        cellPool:
          description: The cell's varroa.dev/cell-pool label. Absent while no label
            is set.
          type: string
        cluster:
          type: string
        freeSlots:
          description: maxTenants minus the placed tenant count, never below zero.
          format: int32
          type: integer
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        maxTenants:
          description: 'The effective tenant cap this surface resolves: the cell''s
            own spec.cell.maxTenants when that value is not zero, else the chart value,
            else ten. It is never a minimum over the tiers.'
          format: int32
          type: integer
        name:
          type: string
        namespace:
          type: string
        profile:
          description: The cell's varroa.dev/cell-profile label.
          type: string
        queueLength:
          description: The Jenkins queue length from the latest mite heartbeat. Absent
            for a remote cluster and absent while no heartbeat has arrived.
          format: int64
          type: integer
        queueLengthAt:
          description: The heartbeat time the queue length came from.
          format: date-time
          type: string
        tenants:
          items:
            $ref: '#/components/schemas/components_schemas_CellTenantUsage'
          type: array
        totals:
          $ref: '#/components/schemas/components_schemas_CellUsageCounts'
        windowStart:
          description: The start of the fixed 24-hour window the counts used.
          format: date-time
          type: string
      required:
      - cluster
      - namespace
      - name
      - windowStart
      - tenants
      - totals
      - maxTenants
      - freeSlots
      type: object
    components_schemas_CellUsageCounts:
      additionalProperties: false
      description: The four load counts of one tenant on a cell, or the same four
        summed over the cell. runningNow carries no time bound, so a build that runs
        longer than a day still counts. runsLast24h and failedLast24h count inside
        the fixed 24-hour window. jobs counts distinct job paths. A run whose result
        is TRIGGER_FAILED counts in no value.
      properties:
        failedLast24h:
          format: int64
          type: integer
        jobs:
          format: int64
          type: integer
        runningNow:
          format: int64
          type: integer
        runsLast24h:
          format: int64
          type: integer
      required:
      - runningNow
      - runsLast24h
      - failedLast24h
      - jobs
      type: object
    components_schemas_Check:
      additionalProperties: false
      description: Result of a single preflight validation check.
      properties:
        id:
          type: string
        message:
          type: string
        status:
          enum:
          - pass
          - warn
          - fail
          type: string
      required:
      - id
      - status
      - message
      type: object
    components_schemas_ClassMiteSpec:
      additionalProperties: false
      description: Mite sidecar configuration for a ControllerClass.
      properties:
        image:
          description: Mite sidecar container image.
          type: string
        imagePullPolicy:
          description: Mite sidecar image pull policy.
          type: string
      type: object
    components_schemas_ClassifiedPlugin:
      additionalProperties: false
      description: One classified installed plugin from the read model.
      properties:
        bundled:
          type: string
        class:
          type: string
        contributors:
          items:
            type: string
          type: array
        declaredBy:
          type: string
        detached:
          type: string
        enabled:
          type: string
        impliedBy:
          items:
            type: string
          type: array
        name:
          type: string
        version:
          type: string
        versionVerdict:
          type: string
      required:
      - name
      - version
      - class
      type: object
    components_schemas_ClassifiedPluginInventory:
      additionalProperties: false
      description: Full classified plugin inventory from the plugins sub-resource.
      properties:
        advisories:
          items:
            $ref: '#/components/schemas/components_schemas_PluginAdvisory'
          type: array
        bootstrapApproximate:
          type: boolean
        collectedAt:
          type: string
        counts:
          additionalProperties:
            type: integer
          type: object
        degraded:
          type: boolean
        detailAvailable:
          type: boolean
        detailStale:
          type: boolean
        driftTruncated:
          type: boolean
        hash:
          type: string
        observedAt:
          type: string
        optionalEdgesDropped:
          type: boolean
        plugins:
          items:
            $ref: '#/components/schemas/components_schemas_ClassifiedPlugin'
          type: array
        source:
          type: string
        stale:
          type: boolean
        total:
          type: integer
        truncated:
          type: boolean
      required:
      - hash
      - source
      - stale
      - degraded
      - bootstrapApproximate
      - optionalEdgesDropped
      - truncated
      - total
      - driftTruncated
      - detailAvailable
      type: object
    components_schemas_ClusterFanoutStatus:
      additionalProperties: false
      description: Per-cluster result of a fan-out list operation.
      properties:
        error:
          type: string
        name:
          type: string
        ok:
          type: boolean
      required:
      - name
      - ok
      type: object
    components_schemas_ClusterInfo:
      additionalProperties: false
      description: Status information for a known cluster.
      properties:
        connectedCount:
          format: int32
          type: integer
        controllerCount:
          format: int32
          type: integer
        core:
          description: 'true on exactly one row: the BFF''s own cluster'
          type: boolean
        drainStartedAt:
          format: date-time
          type: string
        healthy:
          type: boolean
        k8sVersion:
          type: string
        lastHeartbeat:
          format: date-time
          type: string
        name:
          type: string
        operatorVersion:
          type: string
        state:
          enum:
          - active
          - draining
          - drained
          type: string
      required:
      - name
      - core
      - healthy
      - lastHeartbeat
      - operatorVersion
      - k8sVersion
      - controllerCount
      - connectedCount
      - state
      type: object
    components_schemas_ComposedBundle:
      description: A ComposedBundle CRD.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_ComposedBundleSpec'
        status:
          $ref: '#/components/schemas/components_schemas_ComposedBundleStatus'
      type: object
    components_schemas_ComposedBundlePreview:
      additionalProperties: false
      description: Response from a composed bundle preview.
      properties:
        bundleYaml:
          type: string
        drifted:
          items:
            type: string
          type: array
        itemsYaml:
          type: string
        jenkinsYaml:
          type: string
        missing:
          items:
            type: string
          type: array
        pinPreflight:
          $ref: '#/components/schemas/components_schemas_PinPreflightReport'
        pipelineTemplates:
          description: One entry per template the composition delivered, in input
            order.
          items:
            $ref: '#/components/schemas/components_schemas_PipelineTemplateSummary'
          type: array
        pipelineTemplatesYaml:
          description: |
            The composed pipeline-template content, never resolved by ${var} substitution. Empty for a bundle with no pipeline-template input.
          type: string
        pluginsYaml:
          type: string
        rbacYaml:
          type: string
        unresolvedVariables:
          items:
            type: string
          type: array
        warnings:
          items:
            type: string
          type: array
      required:
      - bundleYaml
      - jenkinsYaml
      - pluginsYaml
      - itemsYaml
      - rbacYaml
      - pipelineTemplatesYaml
      - missing
      - drifted
      - warnings
      - unresolvedVariables
      - pinPreflight
      - pipelineTemplates
      type: object
    components_schemas_ComposedBundleRef:
      additionalProperties: false
      description: Reference to a ComposedBundle from a Controller.
      properties:
        name:
          type: string
        namespace:
          description: Empty = the controller's own namespace.
          type: string
      required:
      - name
      type: object
    components_schemas_ComposedBundleSpec:
      additionalProperties: false
      description: Spec for a ComposedBundle.
      properties:
        description:
          type: string
        displayName:
          type: string
        inputs:
          items:
            $ref: '#/components/schemas/components_schemas_ComposedInput'
          type: array
        jcascMergeStrategy:
          enum:
          - errorOnConflict
          - override
          type: string
        variables:
          additionalProperties:
            type: string
          type: object
      required:
      - inputs
      type: object
    components_schemas_ComposedBundleStatus:
      description: Observed state of a ComposedBundle.
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_TemplateCatalogCondition'
          type: array
        contentRef:
          type: string
        driftedItems:
          items:
            type: string
          type: array
        errors:
          items:
            type: string
          type: array
        inputSummary:
          items:
            $ref: '#/components/schemas/components_schemas_InputSummaryEntry'
          type: array
        itemCount:
          type: integer
        message:
          type: string
        missingItems:
          items:
            type: string
          type: array
        observedGeneration:
          format: int64
          type: integer
        observedRevisions:
          additionalProperties:
            type: string
          type: object
        phase:
          enum:
          - Pending
          - Ready
          - Drifted
          - Invalid
          type: string
        resolvedHash:
          type: string
        warnings:
          items:
            type: string
          type: array
      type: object
    components_schemas_ComposedBundleValidateResponse:
      additionalProperties: false
      description: Response from a composed bundle validation.
      properties:
        errors:
          items:
            type: string
          type: array
        pinPreflight:
          $ref: '#/components/schemas/components_schemas_PinPreflightReport'
        pipelineTemplates:
          description: One entry per template the composition delivered, in input
            order.
          items:
            $ref: '#/components/schemas/components_schemas_PipelineTemplateSummary'
          type: array
        unresolvedVariables:
          items:
            type: string
          type: array
        valid:
          type: boolean
        warnings:
          items:
            type: string
          type: array
      required:
      - valid
      - unresolvedVariables
      - pinPreflight
      - pipelineTemplates
      type: object
    components_schemas_ComposedInput:
      additionalProperties: false
      description: A single input to a composed bundle.
      properties:
        gitSource:
          $ref: '#/components/schemas/components_schemas_GitBundleSource'
        itemRef:
          $ref: '#/components/schemas/components_schemas_ComposedItemRef'
        ociSource:
          $ref: '#/components/schemas/components_schemas_OCIBundleSource'
      type: object
    components_schemas_ComposedItemRef:
      additionalProperties: false
      description: Reference to a catalog item composing a bundle.
      properties:
        name:
          type: string
        namespace:
          type: string
        pinnedContentHash:
          type: string
        variables:
          additionalProperties:
            type: string
          type: object
      required:
      - name
      type: object
    components_schemas_ConflictItem:
      additionalProperties: false
      description: A single field conflict detail.
      properties:
        field:
          description: JSON path to the conflicting field (e.g. ".spec.version").
          type: string
        manager:
          description: Field manager that owns the conflict, if identifiable.
          type: string
        message:
          description: Conflict detail message.
          type: string
      required:
      - field
      - message
      type: object
    components_schemas_ConflictResponse:
      additionalProperties: false
      description: SSA field-conflict error body returned on 409 Conflict during a
        PATCH.
      properties:
        conflicts:
          description: List of conflicting fields.
          items:
            $ref: '#/components/schemas/components_schemas_ConflictItem'
          type: array
        error:
          description: Human-readable conflict error message.
          type: string
      required:
      - error
      - conflicts
      type: object
    components_schemas_ControllerAttention:
      additionalProperties: false
      description: Why the controller needs an operator's attention, if it does. Exactly
        one kind is reported, chosen by precedence failed > reconcileBlocked > bootFailed
        > pluginRollFailed > applyFailed > miteUnreachable.
      properties:
        kind:
          enum:
          - failed
          - reconcileBlocked
          - bootFailed
          - pluginRollFailed
          - applyFailed
          - miteUnreachable
          type: string
        message:
          type: string
        reason:
          type: string
        since:
          format: date-time
          type: string
      required:
      - kind
      type: object
    components_schemas_ControllerClass:
      additionalProperties: true
      description: A ControllerClass CRD (cluster-scoped). Layers cluster-level defaults
        between ProvisioningDefaults and each Controller via spec.className.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          additionalProperties: true
          type: object
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerClassSpec'
        status:
          additionalProperties: true
          description: ControllerClassStatus with conditions.
          properties:
            conditions:
              items:
                $ref: '#/components/schemas/components_schemas_ObjectMeta'
              type: array
          type: object
      required:
      - apiVersion
      - kind
      - metadata
      type: object
    components_schemas_ControllerClassSpec:
      additionalProperties: false
      description: Desired state of a ControllerClass. Fields that map to a corev1
        concept use the literal Kubernetes types.
      properties:
        affinity:
          description: Pod scheduling affinity.
          type: object
        imagePullSecrets:
          description: Image-pull secret names.
          items:
            type: string
          type: array
        ingressAnnotations:
          additionalProperties:
            type: string
          description: Ingress annotations merged onto the controller ingress.
          type: object
        ingressClassName:
          description: Default ingress class name for controllers in this class.
          type: string
        jvmOpts:
          description: JVM options prepended to JAVA_OPTS.
          type: string
        mite:
          $ref: '#/components/schemas/components_schemas_ClassMiteSpec'
        nodeSelector:
          additionalProperties:
            type: string
          description: Node selector constraints.
          type: object
        persistence:
          description: Persistent volume claim defaults (transcribed from v1alpha1.PersistenceSpec).
          type: object
        podAnnotations:
          additionalProperties:
            type: string
          description: Pod annotations merged onto the controller pod template.
          type: object
        podLabels:
          additionalProperties:
            type: string
          description: Pod labels merged onto the controller pod template.
          type: object
        probes:
          description: Health probe tuning (transcribed from v1alpha1.ProbesSpec).
          type: object
        resources:
          description: CPU/memory resource requests and limits for the Jenkins container.
          type: object
        securityContext:
          description: Pod-level security context.
          type: object
        tolerations:
          description: Pod tolerations.
          items:
            type: object
          type: array
      type: object
    components_schemas_ControllerDetail:
      additionalProperties: false
      description: Full controller detail including status and sub-resources.
      properties:
        appliedBundleHash:
          type: string
        applyHistory:
          items:
            $ref: '#/components/schemas/components_schemas_ApplyResult'
          type: array
        attention:
          $ref: '#/components/schemas/components_schemas_ControllerAttention'
        cell:
          $ref: '#/components/schemas/components_schemas_CellStatusProjection'
        certExpiry:
          type: string
        cluster:
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        configHash:
          type: string
        desiredStateHash:
          type: string
        effectiveBundle:
          $ref: '#/components/schemas/components_schemas_EffectiveBundle'
        endpoint:
          type: string
        firstConnectedAt:
          type: string
        headless:
          description: Mirrors v1alpha1.IsHeadless. When true, endpoint is always
            the empty string, whatever the controller's Status.Endpoint carries.
          type: boolean
        hibernated:
          description: Whether the controller is currently hibernated (status.hibernated).
          type: boolean
        hibernatedAt:
          description: When the controller was last hibernated (status.hibernatedAt,
            RFC 3339).
          type: string
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        kind:
          description: Mirrors v1alpha1.IsCell. Present for every controller.
          enum:
          - cell
          - stateful
          type: string
        lastApplyResult:
          $ref: '#/components/schemas/components_schemas_ApplyResult'
        lastReconciledAt:
          type: string
        lastSeen:
          type: string
        liveDrift:
          $ref: '#/components/schemas/components_schemas_LiveDrift'
        miteConnected:
          type: boolean
        miteImageStatus:
          $ref: '#/components/schemas/components_schemas_MiteImageStatus'
        miteVersion:
          type: string
        name:
          type: string
        namespace:
          type: string
        observability:
          $ref: '#/components/schemas/components_schemas_ControllerObservability'
        pendingItemDeletions:
          items:
            $ref: '#/components/schemas/components_schemas_PendingDeletion'
          type: array
        pendingPluginRoll:
          $ref: '#/components/schemas/components_schemas_PendingPluginRoll'
        pendingRestart:
          $ref: '#/components/schemas/components_schemas_PendingRestart'
        phase:
          type: string
        pluginConflict:
          $ref: '#/components/schemas/components_schemas_PluginConflict'
        pluginInventory:
          $ref: '#/components/schemas/components_schemas_PluginInventorySummary'
        podOverrides:
          type: object
        powerState:
          description: The controller's spec.powerState intent (Running or Stopped).
          type: string
        rbacHash:
          type: string
        reconcileBlocked:
          $ref: '#/components/schemas/components_schemas_ReconcileBlocked'
        reconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        resourceOverlay:
          type: object
        rollout:
          $ref: '#/components/schemas/components_schemas_Rollout'
        routingMode:
          type: string
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
        unappliedRemovals:
          description: |
            Requested spec removals (explicit JSON nulls) that did not take effect: another field manager also owns the field, so server-side apply retains it. Present only on the PATCH response, and only when at least one removal was blocked — an empty or absent array leaves the ordinary success path unchanged.
          items:
            $ref: '#/components/schemas/components_schemas_UnappliedRemoval'
          type: array
        version:
          type: string
        versionStatus:
          $ref: '#/components/schemas/components_schemas_VersionStatus'
      required:
      - name
      - namespace
      - cluster
      - phase
      - endpoint
      - headless
      - version
      - miteConnected
      - routingMode
      - reconcileBlocked
      - spec
      - kind
      type: object
    components_schemas_ControllerDiff:
      additionalProperties: false
      description: Diff between incoming bundle content and last-applied content.
      properties:
        applied:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
        appliedUnavailable:
          type: boolean
        incoming:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
      type: object
    components_schemas_ControllerObservability:
      additionalProperties: false
      description: Normalized observability model for a controller.
      properties:
        capabilities:
          items:
            type: string
          type: array
        freshness:
          $ref: '#/components/schemas/components_schemas_FreshnessJSON'
        level:
          type: integer
        levelName:
          type: string
        sources:
          items:
            $ref: '#/components/schemas/components_schemas_SourceJSON'
          type: array
        summary:
          $ref: '#/components/schemas/components_schemas_SummaryJSON'
        warnings:
          items:
            type: object
          type: array
      required:
      - sources
      - capabilities
      - level
      - levelName
      - freshness
      type: object
    components_schemas_ControllerPatch:
      additionalProperties: false
      description: |
        Patch body for PATCH /controllers/{ns}/{name}. Exactly one top-level key `spec` is allowed — any other key returns 400 (N5).
      properties:
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
      type: object
    components_schemas_ControllerSpec:
      additionalProperties: false
      description: Desired state of a Controller. Transcribed from v1alpha1.ControllerSpec.
      properties:
        backupSpec:
          $ref: '#/components/schemas/components_schemas_BackupSpec'
        cell:
          $ref: '#/components/schemas/components_schemas_CellSpec'
        className:
          description: References a ControllerClass by name, layering its defaults
            between ProvisioningDefaults and the Controller's own spec.
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        endpoint:
          description: API endpoint URL for the controller.
          type: string
        headless:
          description: Blocks the Jenkins web UI for every non-admin caller. A cell
            is always headless.
          type: boolean
        hibernation:
          $ref: '#/components/schemas/components_schemas_HibernationSpec'
        ingressSpec:
          $ref: '#/components/schemas/components_schemas_IngressSpec'
        miteSpec:
          $ref: '#/components/schemas/components_schemas_MiteSpec'
        persistence:
          $ref: '#/components/schemas/components_schemas_PersistenceSpec'
        pluginSpec:
          $ref: '#/components/schemas/components_schemas_PluginSpec'
        podOverrides:
          $ref: '#/components/schemas/components_schemas_PodOverrides'
        powerState:
          description: Controls whether the controller runs. Hibernation is reported
            in status.hibernated, not requested here.
          enum:
          - ""
          - Running
          - Stopped
          type: string
        probes:
          $ref: '#/components/schemas/components_schemas_ProbesSpec'
        rbacSpec:
          $ref: '#/components/schemas/components_schemas_RBACSpec'
        reconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        resourceOverlay:
          $ref: '#/components/schemas/components_schemas_ResourceOverlay'
        resources:
          description: CPU/memory resource requests and limits (transcribed from corev1.ResourceRequirements).
          properties:
            limits:
              additionalProperties:
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                type: string
              description: Maximum resource limits for the Jenkins container.
              type: object
            requests:
              additionalProperties:
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                type: string
              description: Minimum resource requests for the Jenkins container.
              type: object
          type: object
        version:
          description: Controller version tag.
          type: string
      type: object
    components_schemas_ControllerSummary:
      additionalProperties: false
      description: Summary entry for each controller in the list.
      properties:
        appliedBundleHash:
          type: string
        attention:
          $ref: '#/components/schemas/components_schemas_ControllerAttention'
        cellPool:
          description: The controller's varroa.dev/cell-pool label. Absent while no
            label is set.
          type: string
        cluster:
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        createdAt:
          description: metadata.creationTimestamp, RFC 3339. Present for every controller.
          format: date-time
          type: string
        effectiveBundle:
          $ref: '#/components/schemas/components_schemas_EffectiveBundle'
        endpoint:
          type: string
        headless:
          description: Mirrors v1alpha1.IsHeadless. When true, endpoint is always
            the empty string, whatever the controller's Status.Endpoint carries.
          type: boolean
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        kind:
          description: Mirrors v1alpha1.IsCell. Always present, so a client never
            reads the kind from an absent field.
          enum:
          - cell
          - stateful
          type: string
        lastSeen:
          description: Last mite heartbeat, RFC3339 UTC. Absent when no mite has reported.
          type: string
        maxTenants:
          description: The same effective cap the cell usage read resolves. Absent
            for a controller that is not a cell.
          format: int32
          type: integer
        miteConnected:
          type: boolean
        miteVersion:
          type: string
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
        rolloutWave:
          description: RolloutWave from the reconciliation policy.
          type: integer
        routingMode:
          description: Either "subdomain" or "path".
          type: string
        tenantCount:
          description: The length of status.cell.tenants, never of status.cell.appliedTenants.
            Absent for a controller that is not a cell.
          format: int32
          type: integer
        unreadySince:
          description: status.cell.unreadySince, RFC 3339. Absent while the cell is
            ready.
          format: date-time
          type: string
        version:
          description: Desired Jenkins version (from spec.version).
          type: string
        warm:
          description: status.cell.warm. Absent for a controller that is not a cell.
          type: boolean
      required:
      - name
      - namespace
      - cluster
      - phase
      - endpoint
      - headless
      - miteConnected
      - routingMode
      - kind
      - createdAt
      type: object
    components_schemas_CreateBroodRequest:
      additionalProperties: false
      description: Request body to create or preview a brood operation.
      properties:
        clusters:
          description: Target clusters, or ["all"] for all known clusters. Defaults
            to the local cluster.
          items:
            type: string
          type: array
        namespace:
          description: Target namespace. Defaults to operator namespace.
          type: string
        spec:
          description: BroodOperationSpec (action, targets, execution).
          type: object
      type: object
    components_schemas_CreateControllerRequest:
      additionalProperties: false
      description: Request body for creating a controller. Wraps a Controller CR with
        optional inline bundle.
      properties:
        bundle:
          description: Optional inline ComposedBundleSpec.
          type: object
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
      type: object
    components_schemas_CreateGroupRequest:
      additionalProperties: false
      properties:
        displayName:
          type: string
        members:
          items:
            type: string
          type: array
        name:
          type: string
      required:
      - name
      type: object
    components_schemas_CreateKeyRequest:
      additionalProperties: false
      description: Request body for creating or rotating an API key.
      properties:
        expiresIn:
          description: Optional duration string (e.g. "720h"), absent for no expiry.
          type: string
        name:
          description: Optional display name (≤128 chars). When rotating, an absent
            or empty name carries the old key's name forward.
          type: string
      type: object
    components_schemas_CreateRunRequest:
      additionalProperties: false
      description: |
        POST /pipelines/{team}/jobs/{job}/runs. clientToken, a UUIDv7, makes the request idempotent: the BFF uses it as the run identifier. A request with no clientToken is not idempotent.
      properties:
        clientToken:
          format: uuid
          type: string
        cluster:
          description: |
            Breaks a tie when the job path lies in more than one surviving tenant.
          type: string
        parameters:
          additionalProperties:
            type: string
          type: object
      type: object
    components_schemas_CreateUserRequest:
      additionalProperties: false
      description: Request body for creating a user (admin, local auth only).
      properties:
        displayName:
          type: string
        email:
          type: string
        groups:
          items:
            type: string
          type: array
        password:
          type: string
        username:
          type: string
      required:
      - username
      - password
      type: object
    components_schemas_DeployableNamespaces:
      additionalProperties: false
      description: The caller's create-authorized namespaces.
      properties:
        allowFreeform:
          type: boolean
        defaultNamespace:
          type: string
        degraded:
          description: True only when a remote target's inputs were unavailable.
          type: boolean
        namespaces:
          items:
            type: string
          type: array
      required:
      - namespaces
      - defaultNamespace
      - allowFreeform
      - degraded
      type: object
    components_schemas_EffectiveBundle:
      additionalProperties: false
      description: 'The ComposedBundle a controller is actually using, resolved. Read-only,
        and deliberately separate from composedBundleRef: that field is the raw spec
        value the dashboard writes back, so resolving into it would materialize an
        explicit reference to the starter bundle on the next save.'
      properties:
        builtIn:
          description: True when the controller names no bundle and resolved to the
            built-in starter bundle.
          type: boolean
        name:
          type: string
        namespace:
          type: string
      required:
      - name
      - namespace
      - builtIn
      type: object
    components_schemas_Error:
      additionalProperties: false
      properties:
        error:
          description: Human-readable error message.
          type: string
      required:
      - error
      type: object
    components_schemas_ExecuteGroovyPolicy:
      additionalProperties: false
      description: Governs the executeGroovy verb. Every field absent means enabled
        — a policy object that only some clusters carry must not change behaviour
        by its absence.
      properties:
        allowedNamespaces:
          description: Namespaces that may host an executeGroovy BroodOperation, matched
            against the operation's own namespace rather than its targets'. Empty
            means all, when enabled is not false.
          items:
            type: string
          type: array
        enabled:
          description: Absent means enabled.
          type: boolean
      type: object
    components_schemas_FleetLock:
      additionalProperties: false
      description: |
        One fleet lock row, from a varroa.lock step. tenant and jobPath are always present, whichever tenant the row belongs to. runLink is present only when the reading caller can read that row's own run. A waiting row reports its own waitingSince. A held or a releasing row reports its own acquiredAt and no waitingSince. The row carries no queue position and no derived holder: a consumer groups the rows it already has by name.
      properties:
        acquiredAt:
          description: |
            The time the run acquired the lock. Present on a held or a releasing row.
          format: date-time
          type: string
        cluster:
          description: The cluster of the run that holds or waits on the lock.
          type: string
        jobPath:
          description: The job path of the run that holds or waits on the lock.
          type: string
        name:
          description: |
            The qualified lock name: the owner tenant, a slash, and the bare lock name. A controller tenant holds a slash of its own, so do not split this value to find the owner.
          type: string
        runId:
          type: string
        runLink:
          description: |
            The run's own page path, /pipelines/{team}/{jobPath}/{runId}, the same link a run search result carries. Absent, not null, when the caller's own grant cannot read the row's own run.
          type: string
        state:
          enum:
          - waiting
          - held
          - releasing
          type: string
        tenant:
          description: The tenant of the run that holds or waits on the lock.
          type: string
        waitingSince:
          description: |
            The time the run began to wait. Present only on a waiting row.
          format: date-time
          type: string
      required:
      - name
      - cluster
      - tenant
      - jobPath
      - state
      - runId
      type: object
    components_schemas_FleetLockListResponse:
      additionalProperties: false
      description: |
        GET /pipelines/{team}/locks and GET /locks. Both routes answer the rows in lock name order. In one name, the holder comes first, and the waiters follow in the order they began to wait.
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_FleetLock'
          type: array
      required:
      - items
      type: object
    components_schemas_FleetPluginClassCount:
      additionalProperties: false
      properties:
        class:
          type: string
        controllerCount:
          minimum: 0
          type: integer
      required:
      - class
      - controllerCount
      type: object
    components_schemas_FleetPluginCoverage:
      additionalProperties: false
      properties:
        clustersNotCovered:
          minimum: 0
          type: integer
        complete:
          type: boolean
        controllersDegraded:
          minimum: 0
          type: integer
        controllersDetailStale:
          minimum: 0
          type: integer
        controllersMissing:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginMissingController'
          type: array
        controllersReporting:
          minimum: 0
          type: integer
        controllersStale:
          minimum: 0
          type: integer
        controllersTotal:
          minimum: 0
          type: integer
        controllersTruncated:
