        bundleYaml:
          type: string
        drifted:
          items:
            type: string
          type: array
        itemsYaml:
          type: string
        jenkinsYaml:
          type: string
        missing:
          items:
            type: string
          type: array
        pluginsYaml:
          type: string
        rbacYaml:
          type: string
        unresolvedVariables:
          items:
            type: string
          type: array
        warnings:
          items:
            type: string
          type: array
      required:
      - bundleYaml
      - jenkinsYaml
      - pluginsYaml
      - itemsYaml
      - rbacYaml
      - missing
      - drifted
      - warnings
      - unresolvedVariables
      type: object
    components_schemas_ComposedBundleRef:
      additionalProperties: false
      description: Reference to a ComposedBundle from a Controller.
      properties:
        name:
          type: string
        namespace:
          description: Empty = the controller's own namespace.
          type: string
      required:
      - name
      type: object
    components_schemas_ComposedBundleSpec:
      additionalProperties: false
      description: Spec for a ComposedBundle.
      properties:
        description:
          type: string
        displayName:
          type: string
        inputs:
          items:
            $ref: '#/components/schemas/components_schemas_ComposedInput'
          type: array
        jcascMergeStrategy:
          enum:
          - errorOnConflict
          - override
          type: string
        variables:
          additionalProperties:
            type: string
          type: object
      required:
      - inputs
      type: object
    components_schemas_ComposedBundleStatus:
      description: Observed state of a ComposedBundle.
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_TemplateCatalogCondition'
          type: array
        contentRef:
          type: string
        driftedItems:
          items:
            type: string
          type: array
        errors:
          items:
            type: string
          type: array
        inputSummary:
          items:
            $ref: '#/components/schemas/components_schemas_InputSummaryEntry'
          type: array
        itemCount:
          type: integer
        message:
          type: string
        missingItems:
          items:
            type: string
          type: array
        observedGeneration:
          format: int64
          type: integer
        observedRevisions:
          additionalProperties:
            type: string
          type: object
        phase:
          enum:
          - Pending
          - Ready
          - Drifted
          - Invalid
          type: string
        resolvedHash:
          type: string
        warnings:
          items:
            type: string
          type: array
      type: object
    components_schemas_ComposedBundleValidateResponse:
      additionalProperties: false
      description: Response from a composed bundle validation.
      properties:
        errors:
          items:
            type: string
          type: array
        unresolvedVariables:
          items:
            type: string
          type: array
        valid:
          type: boolean
        warnings:
          items:
            type: string
          type: array
      required:
      - valid
      - unresolvedVariables
      type: object
    components_schemas_ComposedInput:
      additionalProperties: false
      description: A single input to a composed bundle.
      properties:
        gitSource:
          $ref: '#/components/schemas/components_schemas_GitBundleSource'
        itemRef:
          $ref: '#/components/schemas/components_schemas_ComposedItemRef'
        ociSource:
          $ref: '#/components/schemas/components_schemas_OCIBundleSource'
      type: object
    components_schemas_ComposedItemRef:
      additionalProperties: false
      description: Reference to a catalog item composing a bundle.
      properties:
        name:
          type: string
        namespace:
          type: string
        pinnedContentHash:
          type: string
        variables:
          additionalProperties:
            type: string
          type: object
      required:
      - name
      type: object
    components_schemas_ConflictItem:
      additionalProperties: false
      description: A single field conflict detail.
      properties:
        field:
          description: JSON path to the conflicting field (e.g. ".spec.version").
          type: string
        manager:
          description: Field manager that owns the conflict, if identifiable.
          type: string
        message:
          description: Conflict detail message.
          type: string
      required:
      - field
      - message
      type: object
    components_schemas_ConflictResponse:
      additionalProperties: false
      description: SSA field-conflict error body returned on 409 Conflict during a
        PATCH.
      properties:
        conflicts:
          description: List of conflicting fields.
          items:
            $ref: '#/components/schemas/components_schemas_ConflictItem'
          type: array
        error:
          description: Human-readable conflict error message.
          type: string
      required:
      - error
      - conflicts
      type: object
    components_schemas_ControllerClass:
      additionalProperties: true
      description: A ControllerClass CRD (cluster-scoped). Layers cluster-level defaults
        between ProvisioningDefaults and each Controller via spec.className.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          additionalProperties: true
          type: object
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerClassSpec'
        status:
          additionalProperties: true
          description: ControllerClassStatus with conditions.
          properties:
            conditions:
              items:
                $ref: '#/components/schemas/components_schemas_ObjectMeta'
              type: array
          type: object
      required:
      - apiVersion
      - kind
      - metadata
      type: object
    components_schemas_ControllerClassSpec:
      additionalProperties: false
      description: Desired state of a ControllerClass. Fields that map to a corev1
        concept use the literal Kubernetes types.
      properties:
        affinity:
          description: Pod scheduling affinity.
          type: object
        imagePullSecrets:
          description: Image-pull secret names.
          items:
            type: string
          type: array
        ingressAnnotations:
          additionalProperties:
            type: string
          description: Ingress annotations merged onto the controller ingress.
          type: object
        ingressClassName:
          description: Default ingress class name for controllers in this class.
          type: string
        jvmOpts:
          description: JVM options prepended to JAVA_OPTS.
          type: string
        mite:
          $ref: '#/components/schemas/components_schemas_ClassMiteSpec'
        nodeSelector:
          additionalProperties:
            type: string
          description: Node selector constraints.
          type: object
        persistence:
          description: Persistent volume claim defaults (transcribed from v1alpha1.PersistenceSpec).
          type: object
        podAnnotations:
          additionalProperties:
            type: string
          description: Pod annotations merged onto the controller pod template.
          type: object
        podLabels:
          additionalProperties:
            type: string
          description: Pod labels merged onto the controller pod template.
          type: object
        probes:
          description: Health probe tuning (transcribed from v1alpha1.ProbesSpec).
          type: object
        resources:
          description: CPU/memory resource requests and limits for the Jenkins container.
          type: object
        securityContext:
          description: Pod-level security context.
          type: object
        tolerations:
          description: Pod tolerations.
          items:
            type: object
          type: array
      type: object
    components_schemas_ControllerDetail:
      additionalProperties: false
      description: Full controller detail including status and sub-resources.
      properties:
        appliedBundleHash:
          type: string
        applyHistory:
          items:
            $ref: '#/components/schemas/components_schemas_ApplyResult'
          type: array
        certExpiry:
          type: string
        cluster:
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        configHash:
          type: string
        desiredStateHash:
          type: string
        effectiveBundle:
          $ref: '#/components/schemas/components_schemas_EffectiveBundle'
        endpoint:
          type: string
        firstConnectedAt:
          type: string
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        lastApplyResult:
          $ref: '#/components/schemas/components_schemas_ApplyResult'
        lastReconciledAt:
          type: string
        lastSeen:
          type: string
        liveDrift:
          $ref: '#/components/schemas/components_schemas_LiveDrift'
        miteConnected:
          type: boolean
        miteImageStatus:
          $ref: '#/components/schemas/components_schemas_MiteImageStatus'
        miteVersion:
          type: string
        name:
          type: string
        namespace:
          type: string
        observability:
          $ref: '#/components/schemas/components_schemas_ControllerObservability'
        pendingItemDeletions:
          items:
            $ref: '#/components/schemas/components_schemas_PendingDeletion'
          type: array
        pendingPluginRoll:
          $ref: '#/components/schemas/components_schemas_PendingPluginRoll'
        pendingRestart:
          $ref: '#/components/schemas/components_schemas_PendingRestart'
        phase:
          type: string
        pluginConflict:
          $ref: '#/components/schemas/components_schemas_PluginConflict'
        pluginInventory:
          $ref: '#/components/schemas/components_schemas_PluginInventorySummary'
        podOverrides:
          type: object
        powerState:
          type: string
        rbacHash:
          type: string
        reconcileBlocked:
          $ref: '#/components/schemas/components_schemas_ReconcileBlocked'
        reconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        resourceOverlay:
          type: object
        rollout:
          $ref: '#/components/schemas/components_schemas_Rollout'
        routingMode:
          type: string
        version:
          type: string
        versionStatus:
          $ref: '#/components/schemas/components_schemas_VersionStatus'
      required:
      - name
      - namespace
      - cluster
      - phase
      - endpoint
      - version
      - miteConnected
      - routingMode
      - reconcileBlocked
      type: object
    components_schemas_ControllerDiff:
      additionalProperties: false
      description: Diff between incoming bundle content and last-applied content.
      properties:
        applied:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
        appliedUnavailable:
          type: boolean
        incoming:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
      type: object
    components_schemas_ControllerObservability:
      additionalProperties: false
      description: Normalized observability model for a controller.
      properties:
        capabilities:
          items:
            type: string
          type: array
        freshness:
          $ref: '#/components/schemas/components_schemas_FreshnessJSON'
        level:
          type: integer
        levelName:
          type: string
        sources:
          items:
            $ref: '#/components/schemas/components_schemas_SourceJSON'
          type: array
        summary:
          $ref: '#/components/schemas/components_schemas_SummaryJSON'
        warnings:
          items:
            type: object
          type: array
      required:
      - sources
      - capabilities
      - level
      - levelName
      - freshness
      type: object
    components_schemas_ControllerPatch:
      additionalProperties: false
      description: |
        Patch body for PATCH /controllers/{ns}/{name}. Exactly one top-level key `spec` is allowed — any other key returns 400 (N5).
      properties:
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
      type: object
    components_schemas_ControllerSpec:
      additionalProperties: false
      description: Desired state of a Controller. Transcribed from v1alpha1.ControllerSpec.
      properties:
        backupSpec:
          $ref: '#/components/schemas/components_schemas_BackupSpec'
        className:
          description: References a ControllerClass by name, layering its defaults
            between ProvisioningDefaults and the Controller's own spec.
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        endpoint:
          description: API endpoint URL for the controller.
          type: string
        hibernation:
          $ref: '#/components/schemas/components_schemas_HibernationSpec'
        ingressSpec:
          $ref: '#/components/schemas/components_schemas_IngressSpec'
        miteSpec:
          $ref: '#/components/schemas/components_schemas_MiteSpec'
        namespace:
          description: Target namespace this controller manages.
          type: string
        persistence:
          $ref: '#/components/schemas/components_schemas_PersistenceSpec'
        pluginSpec:
          $ref: '#/components/schemas/components_schemas_PluginSpec'
        podOverrides:
          $ref: '#/components/schemas/components_schemas_PodOverrides'
        powerState:
          description: Controls whether the controller runs.
          enum:
          - ""
          - Running
          - Stopped
          - Hibernated
          type: string
        probes:
          $ref: '#/components/schemas/components_schemas_ProbesSpec'
        rbacSpec:
          $ref: '#/components/schemas/components_schemas_RBACSpec'
        reconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        resourceOverlay:
          $ref: '#/components/schemas/components_schemas_ResourceOverlay'
        resources:
          description: CPU/memory resource requests and limits (transcribed from corev1.ResourceRequirements).
          properties:
            limits:
              additionalProperties:
                type: string
              description: Maximum resource limits for the Jenkins container.
              type: object
            requests:
              additionalProperties:
                type: string
              description: Minimum resource requests for the Jenkins container.
              type: object
          type: object
        version:
          description: Controller version tag.
          type: string
      type: object
    components_schemas_ControllerSummary:
      additionalProperties: false
      description: Summary entry for each controller in the list.
      properties:
        appliedBundleHash:
          type: string
        cluster:
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        effectiveBundle:
          $ref: '#/components/schemas/components_schemas_EffectiveBundle'
        endpoint:
          type: string
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        miteConnected:
          type: boolean
        miteVersion:
          type: string
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
        rolloutWave:
          description: RolloutWave from the reconciliation policy.
          type: integer
        routingMode:
          description: Either "subdomain" or "path".
          type: string
        version:
          description: Desired Jenkins version (from spec.version).
          type: string
      required:
      - name
      - namespace
      - cluster
      - phase
      - endpoint
      - miteConnected
      - routingMode
      type: object
    components_schemas_CreateBroodRequest:
      additionalProperties: false
      description: Request body to create or preview a brood operation.
      properties:
        clusters:
          description: Target clusters, or ["all"] for all known clusters. Defaults
            to the local cluster.
          items:
            type: string
          type: array
        namespace:
          description: Target namespace. Defaults to operator namespace.
          type: string
        spec:
          description: BroodOperationSpec (action, targets, execution).
          type: object
      type: object
    components_schemas_CreateControllerRequest:
      additionalProperties: false
      description: Request body for creating a controller. Wraps a Controller CR with
        optional inline bundle.
      properties:
        bundle:
          description: Optional inline ComposedBundleSpec.
          type: object
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
      type: object
    components_schemas_CreateGroupRequest:
      additionalProperties: false
      properties:
        displayName:
          type: string
        members:
          items:
            type: string
          type: array
        name:
          type: string
      required:
      - name
      type: object
    components_schemas_CreateKeyRequest:
      additionalProperties: false
      description: Request body for creating or rotating an API key.
      properties:
        expiresIn:
          description: Optional duration string (e.g. "720h"), absent for no expiry.
          type: string
        name:
          description: Optional display name (≤128 chars). When rotating, an absent
            or empty name carries the old key's name forward.
          type: string
      type: object
    components_schemas_CreateUserRequest:
      additionalProperties: false
      description: Request body for creating a user (admin, local auth only).
      properties:
        displayName:
          type: string
        email:
          type: string
        groups:
          items:
            type: string
          type: array
        password:
          type: string
        username:
          type: string
      required:
      - username
      - password
      type: object
    components_schemas_DeployableNamespaces:
      additionalProperties: false
      description: The caller's create-authorized namespaces.
      properties:
        allowFreeform:
          type: boolean
        defaultNamespace:
          type: string
        degraded:
          description: True only when a remote target's inputs were unavailable.
          type: boolean
        namespaces:
          items:
            type: string
          type: array
      required:
      - namespaces
      - defaultNamespace
      - allowFreeform
      - degraded
      type: object
    components_schemas_EffectiveBundle:
      additionalProperties: false
      description: 'The ComposedBundle a controller is actually using, resolved. Read-only,
        and deliberately separate from composedBundleRef: that field is the raw spec
        value the dashboard writes back, so resolving into it would materialize an
        explicit reference to the starter bundle on the next save.'
      properties:
        builtIn:
          description: True when the controller names no bundle and resolved to the
            built-in starter bundle.
          type: boolean
        name:
          type: string
        namespace:
          type: string
      required:
      - name
      - namespace
      - builtIn
      type: object
    components_schemas_Error:
      additionalProperties: false
      properties:
        error:
          description: Human-readable error message.
          type: string
      required:
      - error
      type: object
    components_schemas_ExecuteGroovyPolicy:
      additionalProperties: false
      description: Governs the executeGroovy verb. Every field absent means enabled
        — a policy object that only some clusters carry must not change behaviour
        by its absence.
      properties:
        allowedNamespaces:
          description: Namespaces that may host an executeGroovy BroodOperation, matched
            against the operation's own namespace rather than its targets'. Empty
            means all, when enabled is not false.
          items:
            type: string
          type: array
        enabled:
          description: Absent means enabled.
          type: boolean
      type: object
    components_schemas_FleetPluginClassCount:
      additionalProperties: false
      properties:
        class:
          type: string
        controllerCount:
          minimum: 0
          type: integer
      required:
      - class
      - controllerCount
      type: object
    components_schemas_FleetPluginCoverage:
      additionalProperties: false
      properties:
        clustersNotCovered:
          minimum: 0
          type: integer
        complete:
          type: boolean
        controllersDegraded:
          minimum: 0
          type: integer
        controllersDetailStale:
          minimum: 0
          type: integer
        controllersMissing:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginMissingController'
          type: array
        controllersReporting:
          minimum: 0
          type: integer
        controllersStale:
          minimum: 0
          type: integer
        controllersTotal:
          minimum: 0
          type: integer
        controllersTruncated:
          minimum: 0
          type: integer
      required:
      - complete
      - controllersTotal
      - controllersReporting
      - controllersStale
      - controllersDegraded
      - controllersTruncated
      - controllersDetailStale
      - controllersMissing
      - clustersNotCovered
      type: object
    components_schemas_FleetPluginDrillItem:
      additionalProperties: false
      properties:
        bootstrapApproximate:
          type: boolean
        class:
          type: string
        cluster:
          type: string
        collectedAt:
          type: string
        controller:
          type: string
        degraded:
          type: boolean
        detailPath:
          type: string
        detailStale:
          type: boolean
        namespace:
          type: string
        optionalEdgesDropped:
          type: boolean
        source:
          type: string
        stale:
          type: boolean
        truncated:
          type: boolean
        version:
          type: string
      required:
      - cluster
      - namespace
      - controller
      - version
      - class
      - source
      - collectedAt
      - detailPath
      - detailStale
      - stale
      - degraded
      - truncated
      - optionalEdgesDropped
      - bootstrapApproximate
      type: object
    components_schemas_FleetPluginDrilldown:
      additionalProperties: false
      properties:
        clusters:
          items:
            $ref: '#/components/schemas/components_schemas_ClusterFanoutStatus'
          type: array
        coverage:
          $ref: '#/components/schemas/components_schemas_FleetPluginCoverage'
        items:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginDrillItem'
          type: array
        name:
          type: string
        versions:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginVersionCount'
          type: array
      required:
      - name
      - items
      - versions
      - coverage
      - clusters
      type: object
    components_schemas_FleetPluginMissingController:
      additionalProperties: false
      properties:
        cluster:
          type: string
        name:
          type: string
        namespace:
          type: string
        reason:
          type: string
      required:
      - cluster
      - namespace
      - name
      - reason
      type: object
    components_schemas_FleetPluginRollupItem:
      additionalProperties: false
      properties:
        classes:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginClassCount'
          type: array
        controllerCount:
          minimum: 0
          type: integer
        name:
          type: string
        versions:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginVersionCount'
          type: array
      required:
      - name
      - controllerCount
      - versions
      - classes
      type: object
    components_schemas_FleetPluginVersionCount:
      additionalProperties: false
      properties:
        controllerCount:
          minimum: 0
          type: integer
        version:
          type: string
      required:
      - version
      - controllerCount
      type: object
    components_schemas_FleetPluginsRollup:
      additionalProperties: false
      properties:
        clusters:
          items:
            $ref: '#/components/schemas/components_schemas_ClusterFanoutStatus'
          type: array
        coverage:
          $ref: '#/components/schemas/components_schemas_FleetPluginCoverage'
        items:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginRollupItem'
          type: array
      required:
      - items
      - coverage
      - clusters
      type: object
    components_schemas_FreshnessJSON:
      additionalProperties: false
      description: Observability freshness information.
      properties:
        miteTTL:
          type: integer
        observedAt:
          type: string
        stale:
          type: boolean
      required:
      - stale
      type: object
    components_schemas_GitBundleSource:
      additionalProperties: false
      description: Git source for a composed bundle input.
      properties:
        path:
          type: string
        repoURL:
          type: string
        revision:
          type: string
        secretRef:
          type: string
      required:
      - repoURL
      - path
      type: object
    components_schemas_GroupEntry:
      additionalProperties: false
      description: Entry for each group in the group list.
      properties:
        displayName:
          type: string
        memberCount:
          description: Number of members (from local and/or IDP sources).
          type: integer
        members:
          items:
            type: string
          type: array
        name:
          type: string
        source:
          description: Origin of the group.
          enum:
          - local
          - idp
          - both
          type: string
      required:
      - name
      - members
      - memberCount
      - source
      type: object
    components_schemas_HibernationSpec:
      additionalProperties: false
      description: Automatic hibernation configuration (transcribed from v1alpha1.HibernationSpec).
      properties:
        activityIgnoreRegex:
          description: Regular expression matched against request paths to exclude
            them from activity tracking.
          type: string
        enabled:
          description: Enables automatic hibernation. When enabled, the controller
            parks (scales to 0) after inactivity.
          type: boolean
        gracePeriodMinutes:
          description: Minutes of inactivity before the controller hibernates. Minimum
            5. Default 60.
          type: integer
      type: object
    components_schemas_IdentitySettings:
      additionalProperties: false
      description: Identity and OIDC configuration (admin view, client secret never
        included).
      properties:
        clientId:
          description: OIDC client ID (present in OIDC mode only).
          type: string
        cookieDomain:
          type: string
        defaultRead:
          type: boolean
        issuer:
          description: OIDC issuer URL (present in OIDC mode only).
          type: string
        mode:
          enum:
          - local
          - ldap
          - oidc
          type: string
        scopes:
          description: OIDC scopes (present in OIDC mode only).
          items:
            type: string
          type: array
      required:
      - mode
      - cookieDomain
      - defaultRead
      type: object
    components_schemas_IngressSpec:
      additionalProperties: false
      description: Ingress configuration (transcribed from v1alpha1.IngressSpec).
      properties:
        annotations:
          additionalProperties:
            type: string
          description: Ingress annotations merged onto this controller's ingress.
          type: object
        host:
          description: Ingress hostname.
          type: string
        ingressClassName:
          description: Override the cluster-level ingress class name for this controller.
            Empty uses the cluster default.
          type: string
        mode:
          description: Controls how the controller is exposed. "subdomain" (default)
            assigns its own host; "path" serves at /jenkins/<ns>/<name>. Immutable
            after create.
          enum:
          - ""
          - subdomain
          - path
          type: string
        tlsSecretName:
          description: Name of the TLS secret.
          type: string
      type: object
    components_schemas_InputSummaryEntry:
      description: Mirror of a single ComposedBundle input for list rendering.
      properties:
        kind:
          type: string
        namespace:
          type: string
        type:
          type: string
      required:
