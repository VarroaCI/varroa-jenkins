components:
  parameters:
    cluster:
      description: Cluster name (DNS-1123 label).
      in: path
      name: cluster
      required: true
      schema:
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
    clusterQuery:
      description: Cluster name filter for aggregated list.
      in: query
      name: cluster
      schema:
        type: string
    components_parameters_cluster:
      description: Cluster name (DNS-1123 label).
      in: path
      name: cluster
      required: true
      schema:
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
    components_parameters_clusterQuery:
      description: Cluster name filter for aggregated list.
      in: query
      name: cluster
      schema:
        type: string
    components_parameters_force:
      description: Force the update, overriding SSA field-ownership conflicts.
      in: query
      name: force
      schema:
        type: boolean
    components_parameters_name:
      description: Resource name.
      in: path
      name: name
      required: true
      schema:
        type: string
    components_parameters_namespace:
      description: Namespace filter (optional).
      in: query
      name: namespace
      schema:
        type: string
    components_parameters_ns:
      description: Controller namespace.
      in: path
      name: ns
      required: true
      schema:
        type: string
    components_parameters_prefix:
      description: API key prefix (first 7 characters).
      in: path
      name: prefix
      required: true
      schema:
        type: string
    name:
      description: Resource name.
      in: path
      name: name
      required: true
      schema:
        type: string
    namespace:
      description: Namespace filter (optional).
      in: query
      name: namespace
      schema:
        type: string
    ns:
      description: Controller namespace.
      in: path
      name: ns
      required: true
      schema:
        type: string
    prefix:
      description: API key prefix (first 7 characters).
      in: path
      name: prefix
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      $ref: '#/components/responses/components_responses_BadRequest'
    Conflict:
      $ref: '#/components/responses/components_responses_Conflict'
    Forbidden:
      $ref: '#/components/responses/components_responses_Forbidden'
    Internal:
      $ref: '#/components/responses/components_responses_Internal'
    MethodNotAllowed:
      $ref: '#/components/responses/components_responses_MethodNotAllowed'
    NotFound:
      $ref: '#/components/responses/components_responses_NotFound'
    Unauthorized:
      $ref: '#/components/responses/components_responses_Unauthorized'
    components_responses_BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Bad request — invalid body, missing required fields, or validation
        failure.
    components_responses_ClusterUnreachable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Target cluster unreachable over the bus.
    components_responses_Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Conflict — resource state prevents the operation (e.g. no pending
        approval).
    components_responses_Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Forbidden — authenticated but insufficient permissions.
    components_responses_Internal:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Internal server error.
    components_responses_MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Method not allowed on this endpoint.
    components_responses_NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Resource not found.
    components_responses_ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Search sources are temporarily unavailable.
    components_responses_Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Not authenticated — missing or invalid bearer token.
  schemas:
    APIRule:
      additionalProperties: false
      description: An API rule defining resource access.
      properties:
        resources:
          items:
            type: string
          type: array
        verbs:
          items:
            type: string
          type: array
      required:
      - resources
      - verbs
      type: object
    ActivityEvent:
      additionalProperties: false
      description: A single activity feed event.
      properties:
        actor:
          type: string
        buildNumber:
          format: int64
          type: integer
        cluster:
          type: string
        controller:
          type: string
        itemPath:
          type: string
        message:
          type: string
        namespace:
          type: string
        phase:
          type: string
        reason:
          type: string
        result:
          type: string
        severity:
          enum:
          - info
          - warning
          - error
          type: string
        source:
          enum:
          - mite
          - operator
          - user
          - api
          - jenkins
          type: string
        timestamp:
          format: date-time
          type: string
        type:
          type: string
        url:
          type: string
      required:
      - timestamp
      - type
      - source
      - severity
      - message
      type: object
    ApiRuleRef:
      additionalProperties: false
      description: An API rule with resources and verbs.
      properties:
        resources:
          items:
            type: string
          type: array
        verbs:
          items:
            type: string
          type: array
      required:
      - resources
      - verbs
      type: object
    ApplyResult:
      additionalProperties: false
      description: Result of an apply operation with RFC3339 timestamp.
      properties:
        hash:
          type: string
        sections:
          items:
            $ref: '#/components/schemas/components_schemas_ApplySectionResult'
          type: array
        succeeded:
          type: boolean
        timestamp:
          type: string
      required:
      - timestamp
      - succeeded
      - sections
      type: object
    ApplySectionResult:
      additionalProperties: false
      description: Result for one apply section.
      properties:
        error:
          type: string
        name:
          type: string
        ok:
          type: boolean
      required:
      - name
      - ok
      type: object
    BroodOperationDetail:
      additionalProperties: false
      description: Full brood operation resource with spec and status.
      properties:
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          properties:
            action:
              properties:
                groovy:
                  description: Script selection for verb=executeGroovy. Exactly one
                    of script or itemRef.
                  properties:
                    itemRef:
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        pinnedContentHash:
                          type: string
                        variables:
                          additionalProperties:
                            type: string
                          type: object
                      type: object
                    script:
                      type: string
                  type: object
                verb:
                  enum:
                  - restart
                  - reprovision
                  - reconcile
                  - stop
                  - start
                  - executeGroovy
                  type: string
              type: object
            execution:
              properties:
                failurePolicy:
                  enum:
                  - FailFast
                  - FailTidy
                  - FailAtEnd
                  type: string
                maxParallel:
                  format: int32
                  type: integer
                order:
                  enum:
                  - rolloutWave
                  - name
                  type: string
              type: object
            suspend:
              type: boolean
            targets:
              properties:
                filters:
                  properties:
                    bundle:
                      type: string
                    phase:
                      type: string
                    version:
                      type: string
                  type: object
                names:
                  items:
                    type: string
                  type: array
                namespaces:
                  items:
                    type: string
                  type: array
                selector:
                  type: object
              type: object
            ttlSecondsAfterFinished:
              format: int32
              type: integer
          type: object
        status:
          properties:
            finishedAt:
              format: date-time
              type: string
            observedGeneration:
              format: int64
              type: integer
            phase:
              enum:
              - Pending
              - Running
              - Suspended
              - Succeeded
              - Failed
              - Canceled
              type: string
            reason:
              type: string
            scriptSnapshotRef:
              description: Name of the owner-referenced ConfigMap holding the once-resolved
                script content for a catalog-sourced executeGroovy operation. Empty
                for inline scripts and every other verb.
              type: string
            startedAt:
              format: date-time
              type: string
            startedBy:
              type: string
            summary:
              properties:
                failed:
                  format: int32
                  type: integer
                skipped:
                  format: int32
                  type: integer
                succeeded:
                  format: int32
                  type: integer
                total:
                  format: int32
                  type: integer
              type: object
            targets:
              items:
                properties:
                  dispatchedAt:
                    format: date-time
                    type: string
                  finishedAt:
                    format: date-time
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  output:
                    description: Verb-specific dispatch output (currently executeGroovy
                      only), truncated to 4096 bytes on a UTF-8-safe boundary.
                    type: string
                  reason:
                    type: string
                  state:
                    enum:
                    - Pending
                    - Dispatched
                    - Succeeded
                    - Failed
                    - Skipped
                    type: string
                  wave:
                    format: int32
                    type: integer
                type: object
              type: array
          type: object
      type: object
    BroodPreviewResponse:
      description: Per-cluster preview result with targets.
      properties:
        clusters:
          items:
            properties:
              cluster:
                type: string
              error:
                type: string
              ok:
                type: boolean
              targets:
                items:
                  properties:
                    applicable:
                      type: boolean
                    name:
                      type: string
                    namespace:
                      type: string
                    reason:
                      type: string
                    wave:
                      format: int32
                      type: integer
                  required:
                  - namespace
                  - name
                  - wave
                  - applicable
                  type: object
                type: array
            required:
            - cluster
            - ok
            type: object
          type: array
      required:
      - clusters
      type: object
    BuiltinRoleRef:
      additionalProperties: false
      description: A built-in VarroaRole with resolved Jenkins permissions.
      properties:
        apiRules:
          items:
            $ref: '#/components/schemas/components_schemas_ApiRuleRef'
          type: array
        jenkinsPermissions:
          description: Resolved Jenkins permissions (plugin/controller-level).
          items:
            type: string
          type: array
        jenkinsRoleRef:
          description: Reference to the corresponding JenkinsRole.
          type: string
        name:
          type: string
      required:
      - name
      - apiRules
      - jenkinsRoleRef
      - jenkinsPermissions
      type: object
    CatalogItemSpec:
      additionalProperties: false
      description: Spec for a CatalogItem.
      properties:
        description:
          type: string
        displayName:
          type: string
        path:
          type: string
        requires:
          items:
            type: string
          type: array
        sourceRef:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          enum:
          - podtemplate
          - plugin
          - item
          - jcasc
          - rbac
          - pipeline-template
          - groovy
          type: string
        variables:
          items:
            $ref: '#/components/schemas/components_schemas_CatalogVariable'
          type: array
        version:
          type: string
      required:
      - sourceRef
      - type
      - path
      type: object
    CatalogSourceSpec:
      additionalProperties: false
      description: Spec for a CatalogSource (bundle catalog repository).
      properties:
        ociRef:
          description: OCI artifact reference; mutually exclusive with repoURL.
          type: string
        path:
          type: string
        repoURL:
          type: string
        revision:
          type: string
        secretRef:
          type: string
        syncIntervalSeconds:
          type: integer
        trusted:
          type: boolean
      type: object
    CatalogVariable:
      additionalProperties: false
      description: A variable definition for a catalog item.
      properties:
        allowedValues:
          description: Populates a choice/dropdown widget. Only valid when type is
            "string" or "number".
          items:
            type: string
          type: array
        default:
          type: string
        description:
          type: string
        name:
          type: string
        required:
          type: boolean
        type:
          description: Parameter type. Omitting the field means "string".
          enum:
          - string
          - number
          - boolean
          - credentials
          type: string
      required:
      - name
      type: object
    Check:
      additionalProperties: false
      description: Result of a single preflight validation check.
      properties:
        id:
          type: string
        message:
          type: string
        status:
          enum:
          - pass
          - warn
          - fail
          type: string
      required:
      - id
      - status
      - message
      type: object
    ClassifiedPlugin:
      additionalProperties: false
      description: One classified installed plugin from the read model.
      properties:
        bundled:
          type: string
        class:
          type: string
        contributors:
          items:
            type: string
          type: array
        declaredBy:
          type: string
        detached:
          type: string
        enabled:
          type: string
        impliedBy:
          items:
            type: string
          type: array
        name:
          type: string
        version:
          type: string
        versionVerdict:
          type: string
      required:
      - name
      - version
      - class
      type: object
    ClassifiedPluginInventory:
      additionalProperties: false
      description: Full classified plugin inventory from the plugins sub-resource.
      properties:
        advisories:
          items:
            $ref: '#/components/schemas/components_schemas_PluginAdvisory'
          type: array
        bootstrapApproximate:
          type: boolean
        collectedAt:
          type: string
        counts:
          additionalProperties:
            type: integer
          type: object
        degraded:
          type: boolean
        detailAvailable:
          type: boolean
        detailStale:
          type: boolean
        driftTruncated:
          type: boolean
        hash:
          type: string
        observedAt:
          type: string
        optionalEdgesDropped:
          type: boolean
        plugins:
          items:
            $ref: '#/components/schemas/components_schemas_ClassifiedPlugin'
          type: array
        source:
          type: string
        stale:
          type: boolean
        total:
          type: integer
        truncated:
          type: boolean
      required:
      - hash
      - source
      - stale
      - degraded
      - bootstrapApproximate
      - optionalEdgesDropped
      - truncated
      - total
      - driftTruncated
      - detailAvailable
      type: object
    ClusterFanoutStatus:
      additionalProperties: false
      description: Per-cluster result of a fan-out list operation.
      properties:
        error:
          type: string
        name:
          type: string
        ok:
          type: boolean
      required:
      - name
      - ok
      type: object
    ClusterInfo:
      additionalProperties: false
      description: Status information for a known cluster.
      properties:
        connectedCount:
          format: int32
          type: integer
        controllerCount:
          format: int32
          type: integer
        core:
          description: 'true on exactly one row: the BFF''s own cluster'
          type: boolean
        drainStartedAt:
          format: date-time
          type: string
        healthy:
          type: boolean
        k8sVersion:
          type: string
        lastHeartbeat:
          format: date-time
          type: string
        name:
          type: string
        operatorVersion:
          type: string
        state:
          enum:
          - active
          - draining
          - drained
          type: string
      required:
      - name
      - core
      - healthy
      - lastHeartbeat
      - operatorVersion
      - k8sVersion
      - controllerCount
      - connectedCount
      - state
      type: object
    ComposedBundlePreview:
      additionalProperties: false
      description: Response from a composed bundle preview.
      properties:
        bundleYaml:
          type: string
        drifted:
          items:
            type: string
          type: array
        itemsYaml:
          type: string
        jenkinsYaml:
          type: string
        missing:
          items:
            type: string
          type: array
        pluginsYaml:
          type: string
        rbacYaml:
          type: string
        unresolvedVariables:
          items:
            type: string
          type: array
        warnings:
          items:
            type: string
          type: array
      required:
      - bundleYaml
      - jenkinsYaml
      - pluginsYaml
      - itemsYaml
      - rbacYaml
      - missing
      - drifted
      - warnings
      - unresolvedVariables
      type: object
    ComposedBundleRef:
      additionalProperties: false
      description: Reference to a ComposedBundle from a Controller.
      properties:
        name:
          type: string
        namespace:
          description: Empty = the controller's own namespace.
          type: string
      required:
      - name
      type: object
    ComposedBundleSpec:
      additionalProperties: false
      description: Spec for a ComposedBundle.
      properties:
        description:
          type: string
        displayName:
          type: string
        inputs:
          items:
            $ref: '#/components/schemas/components_schemas_ComposedInput'
          type: array
        jcascMergeStrategy:
          enum:
          - errorOnConflict
          - override
          type: string
        variables:
          additionalProperties:
            type: string
          type: object
      required:
      - inputs
      type: object
    ComposedBundleValidateResponse:
      additionalProperties: false
      description: Response from a composed bundle validation.
      properties:
        errors:
          items:
            type: string
          type: array
        unresolvedVariables:
          items:
            type: string
          type: array
        valid:
          type: boolean
        warnings:
          items:
            type: string
          type: array
      required:
      - valid
      - unresolvedVariables
      type: object
    ComposedInput:
      additionalProperties: false
      description: A single input to a composed bundle.
      properties:
        gitSource:
          $ref: '#/components/schemas/components_schemas_GitBundleSource'
        itemRef:
          $ref: '#/components/schemas/components_schemas_ComposedItemRef'
        ociSource:
          $ref: '#/components/schemas/components_schemas_OCIBundleSource'
      type: object
    ComposedItemRef:
      additionalProperties: false
      description: Reference to a catalog item composing a bundle.
      properties:
        name:
          type: string
        namespace:
          type: string
        pinnedContentHash:
          type: string
        variables:
          additionalProperties:
            type: string
          type: object
      required:
      - name
      type: object
    ControllerDetail:
      additionalProperties: false
      description: Full controller detail including status and sub-resources.
      properties:
        appliedBundleHash:
          type: string
        applyHistory:
          items:
            $ref: '#/components/schemas/components_schemas_ApplyResult'
          type: array
        certExpiry:
          type: string
        cluster:
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        configHash:
          type: string
        desiredStateHash:
          type: string
        effectiveBundle:
          $ref: '#/components/schemas/components_schemas_EffectiveBundle'
        endpoint:
          type: string
        firstConnectedAt:
          type: string
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        lastApplyResult:
          $ref: '#/components/schemas/components_schemas_ApplyResult'
        lastReconciledAt:
          type: string
        lastSeen:
          type: string
        liveDrift:
          $ref: '#/components/schemas/components_schemas_LiveDrift'
        miteConnected:
          type: boolean
        miteImageStatus:
          $ref: '#/components/schemas/components_schemas_MiteImageStatus'
        miteVersion:
          type: string
        name:
          type: string
        namespace:
          type: string
        observability:
          $ref: '#/components/schemas/components_schemas_ControllerObservability'
        pendingItemDeletions:
          items:
            $ref: '#/components/schemas/components_schemas_PendingDeletion'
          type: array
        pendingPluginRoll:
          $ref: '#/components/schemas/components_schemas_PendingPluginRoll'
        pendingRestart:
          $ref: '#/components/schemas/components_schemas_PendingRestart'
        phase:
          type: string
        pluginConflict:
          $ref: '#/components/schemas/components_schemas_PluginConflict'
        pluginInventory:
          $ref: '#/components/schemas/components_schemas_PluginInventorySummary'
        podOverrides:
          type: object
        powerState:
          type: string
        rbacHash:
          type: string
        reconcileBlocked:
          $ref: '#/components/schemas/components_schemas_ReconcileBlocked'
        reconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        resourceOverlay:
          type: object
        rollout:
          $ref: '#/components/schemas/components_schemas_Rollout'
        routingMode:
          type: string
        version:
          type: string
        versionStatus:
          $ref: '#/components/schemas/components_schemas_VersionStatus'
      required:
      - name
      - namespace
      - cluster
      - phase
      - endpoint
      - version
      - miteConnected
      - routingMode
      - reconcileBlocked
      type: object
    ControllerDiff:
      additionalProperties: false
      description: Diff between incoming bundle content and last-applied content.
      properties:
        applied:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
        appliedUnavailable:
          type: boolean
        incoming:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
      type: object
    ControllerObservability:
      additionalProperties: false
      description: Normalized observability model for a controller.
      properties:
        capabilities:
          items:
            type: string
          type: array
        freshness:
          $ref: '#/components/schemas/components_schemas_FreshnessJSON'
        level:
          type: integer
        levelName:
          type: string
        sources:
          items:
            $ref: '#/components/schemas/components_schemas_SourceJSON'
          type: array
        summary:
          $ref: '#/components/schemas/components_schemas_SummaryJSON'
        warnings:
          items:
            type: object
          type: array
      required:
      - sources
      - capabilities
      - level
      - levelName
      - freshness
      type: object
    ControllerPatch:
      additionalProperties: false
      description: |
        Patch body for PATCH /controllers/{ns}/{name}. Exactly one top-level key `spec` is allowed — any other key returns 400 (N5).
      properties:
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
      type: object
    ControllerSpec:
      additionalProperties: false
      description: Desired state of a Controller. Transcribed from v1alpha1.ControllerSpec.
      properties:
        backupSpec:
          $ref: '#/components/schemas/components_schemas_BackupSpec'
        className:
          description: References a ControllerClass by name, layering its defaults
            between ProvisioningDefaults and the Controller's own spec.
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        endpoint:
          description: API endpoint URL for the controller.
          type: string
        hibernation:
          $ref: '#/components/schemas/components_schemas_HibernationSpec'
        ingressSpec:
          $ref: '#/components/schemas/components_schemas_IngressSpec'
        miteSpec:
          $ref: '#/components/schemas/components_schemas_MiteSpec'
        namespace:
          description: Target namespace this controller manages.
          type: string
        persistence:
          $ref: '#/components/schemas/components_schemas_PersistenceSpec'
        pluginSpec:
          $ref: '#/components/schemas/components_schemas_PluginSpec'
        podOverrides:
          $ref: '#/components/schemas/components_schemas_PodOverrides'
        powerState:
          description: Controls whether the controller runs.
          enum:
          - ""
          - Running
          - Stopped
          - Hibernated
          type: string
        probes:
          $ref: '#/components/schemas/components_schemas_ProbesSpec'
        rbacSpec:
          $ref: '#/components/schemas/components_schemas_RBACSpec'
        reconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        resourceOverlay:
          $ref: '#/components/schemas/components_schemas_ResourceOverlay'
        resources:
          description: CPU/memory resource requests and limits (transcribed from corev1.ResourceRequirements).
          properties:
            limits:
              additionalProperties:
                type: string
              description: Maximum resource limits for the Jenkins container.
              type: object
            requests:
              additionalProperties:
                type: string
              description: Minimum resource requests for the Jenkins container.
              type: object
          type: object
        version:
          description: Controller version tag.
          type: string
      type: object
    ControllerSummary:
      additionalProperties: false
      description: Summary entry for each controller in the list.
      properties:
        appliedBundleHash:
          type: string
        cluster:
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        effectiveBundle:
          $ref: '#/components/schemas/components_schemas_EffectiveBundle'
