      properties:
        bootstrapApproximate:
          type: boolean
        collectedAt:
          type: string
        counts:
          additionalProperties:
            type: integer
          type: object
        degraded:
          type: boolean
        drift:
          items:
            $ref: '#/components/schemas/components_schemas_PluginInventoryDriftEntry'
