        verdict:
          type: string
        version:
          type: string
      required:
      - name
      type: object
    PluginInventoryPendingCollect:
      additionalProperties: false
      description: An in-flight COLLECT_PLUGIN_INVENTORY command.
      properties:
        commandId:
