        groups:
          items:
            type: string
          type: array
        lastLogin:
          description: ISO 8601 last login time, absent if never logged in.
          type: string
        name:
          type: string
        preferences:
          $ref: '#/components/schemas/components_schemas_Preferences'
        preferredUsername:
          type: string
        subject:
          type: string
      required:
      - subject
      - email
      - name
      - groups
      - authMode
      type: object
    ObjectMeta:
