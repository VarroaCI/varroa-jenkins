      properties:
        reason:
          description: Required. At most 256 characters. Recorded on the audit event.
          maxLength: 256
          type: string
        ttlSeconds:
          description: Token lifetime in seconds. Defaults to 900. Must be between
            300 and 3600.
          maximum: 3600
          minimum: 300
          type: integer
      required:
      - reason
      type: object
    components_schemas_BreakGlassResponse:
      additionalProperties: false
      description: A granted break-glass session.
      properties:
        expiresAt:
          format: date-time
          type: string
        locationUrl:
          description: The in-cluster Service URL, with a trailing slash.
          type: string
        target:
          $ref: '#/components/schemas/components_schemas_BreakGlassTarget'
        token:
          description: A short-lived Jenkins user token minted for the caller's own
            identity.
          type: string
      required:
      - token
      - expiresAt
      - target
      - locationUrl
      type: object
    components_schemas_BreakGlassTarget:
      additionalProperties: false
      description: The in-cluster Service a break-glass token reaches.
      properties:
        namespace:
          type: string
        port:
          type: integer
        service:
          type: string
      required:
      - service
      - namespace
      - port
      type: object
    components_schemas_BroodCreateFailure:
      description: Error body when zero clusters succeed on create.
      properties:
        clusters:
          items:
            $ref: '#/components/schemas/components_schemas_BroodRunClusterStatus'
          type: array
        error:
          type: string
      required:
      - error
      - clusters
      type: object
    components_schemas_BroodOperationDetail:
      additionalProperties: false
      description: Full brood operation resource with spec and status.
      properties:
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          properties:
            action:
              properties:
                groovy:
                  description: Script selection for verb=executeGroovy. Exactly one
                    of script or itemRef.
                  properties:
                    itemRef:
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        pinnedContentHash:
                          type: string
                        variables:
                          additionalProperties:
                            type: string
                          type: object
                      type: object
                    script:
                      type: string
                  type: object
                upgrade:
                  description: Granularity selection for verb=upgrade. An absent targetVersion
                    releases each target's own held promoted revision; a set targetVersion
                    bulk-writes that version to every target.
                  properties:
                    targetVersion:
                      type: string
                  type: object
                verb:
                  enum:
                  - restart
                  - reprovision
                  - reconcile
                  - stop
                  - start
                  - executeGroovy
                  - upgrade
                  type: string
              type: object
            execution:
              properties:
                failurePolicy:
                  enum:
                  - FailFast
                  - FailTidy
                  - FailAtEnd
                  type: string
                maxParallel:
                  format: int32
                  type: integer
                order:
                  enum:
                  - rolloutWave
                  - name
                  type: string
              type: object
            suspend:
              type: boolean
            targets:
              properties:
                filters:
                  properties:
                    bundle:
                      type: string
                    phase:
                      type: string
                    version:
                      type: string
                  type: object
                names:
                  items:
                    type: string
                  type: array
                namespaces:
                  items:
                    type: string
                  type: array
                selector:
                  type: object
              type: object
            ttlSecondsAfterFinished:
              format: int32
              type: integer
          type: object
        status:
          properties:
            finishedAt:
              format: date-time
              type: string
            observedGeneration:
              format: int64
              type: integer
            phase:
              enum:
              - Pending
              - Running
              - Suspended
              - Succeeded
              - Failed
              - Canceled
              type: string
            reason:
              type: string
            scriptSnapshotRef:
              description: Name of the owner-referenced ConfigMap holding the once-resolved
                script content for a catalog-sourced executeGroovy operation. Empty
                for inline scripts and every other verb.
              type: string
            startedAt:
              format: date-time
              type: string
            startedBy:
              type: string
            summary:
              properties:
                failed:
                  format: int32
                  type: integer
                skipped:
                  format: int32
                  type: integer
                succeeded:
                  format: int32
                  type: integer
                total:
                  format: int32
                  type: integer
              type: object
            targets:
              items:
                properties:
                  dispatchedAt:
                    format: date-time
                    type: string
                  finishedAt:
                    format: date-time
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  output:
                    description: Verb-specific dispatch output (currently executeGroovy
                      only), truncated to 4096 bytes on a UTF-8-safe boundary.
                    type: string
                  reason:
                    type: string
                  state:
                    enum:
                    - Pending
                    - Dispatched
                    - Succeeded
                    - Failed
                    - Skipped
                    type: string
                  wave:
                    format: int32
                    type: integer
                type: object
              type: array
          type: object
      type: object
    components_schemas_BroodPolicy:
      additionalProperties: false
      description: 'Cluster-wide constraints on brood operation verbs. Enforced by
        the operator, not the API: kubectl and GitOps create BroodOperation objects
