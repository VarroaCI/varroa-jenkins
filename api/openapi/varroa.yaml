      properties:
        code:
          enum:
          - assistant_disabled
          - assistant_off
          - assistant_busy
          - kill_switch
          - repo_url_invalid
          - data_sharing_too_low
          - no_matching_credential
          - forge_unsupported
          - forge_auth_failed
          - forge_write_denied
          - forge_unreachable
          - operator_timeout
          - operator_unavailable
          - jenkinsfile_exists
          - proposal_branch_exists
          - not_found
          - invalid_request
          - internal
          type: string
        error:
          type: string
      required:
      - error
      - code
      type: object
    components_schemas_ProposePipelineRequest:
      additionalProperties: false
      description: The repository to propose a first Jenkinsfile for.
      properties:
        repo:
          maxLength: 2048
          type: string
      required:
      - repo
      type: object
    components_schemas_ProposePipelineResponse:
      additionalProperties: false
      description: The session that the proposal started, and the forge facts of the
