    components_schemas_BroodOperationDetail:
      additionalProperties: false
      description: Full brood operation resource with spec and status.
      properties:
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          properties:
            action:
              properties:
                groovy:
                  description: Script selection for verb=executeGroovy. Exactly one
                    of script or itemRef.
                  properties:
                    itemRef:
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        pinnedContentHash:
                          type: string
                        variables:
                          additionalProperties:
                            type: string
                          type: object
                      type: object
                    script:
                      type: string
                  type: object
                verb:
                  enum:
                  - restart
                  - reprovision
                  - reconcile
                  - stop
                  - start
                  - executeGroovy
                  type: string
              type: object
            execution:
              properties:
                failurePolicy:
                  enum:
                  - FailFast
                  - FailTidy
                  - FailAtEnd
                  type: string
                maxParallel:
                  format: int32
                  type: integer
                order:
                  enum:
                  - rolloutWave
                  - name
                  type: string
              type: object
            suspend:
              type: boolean
            targets:
              properties:
                filters:
                  properties:
                    bundle:
                      type: string
                    phase:
                      type: string
                    version:
                      type: string
                  type: object
                names:
                  items:
                    type: string
                  type: array
                namespaces:
                  items:
                    type: string
                  type: array
                selector:
                  type: object
              type: object
            ttlSecondsAfterFinished:
              format: int32
              type: integer
          type: object
        status:
          properties:
            finishedAt:
              format: date-time
              type: string
            observedGeneration:
              format: int64
              type: integer
            phase:
              enum:
              - Pending
              - Running
              - Suspended
              - Succeeded
              - Failed
              - Canceled
              type: string
            reason:
              type: string
            scriptSnapshotRef:
              description: Name of the owner-referenced ConfigMap holding the once-resolved
                script content for a catalog-sourced executeGroovy operation. Empty
                for inline scripts and every other verb.
              type: string
            startedAt:
              format: date-time
              type: string
            startedBy:
              type: string
            summary:
              properties:
                failed:
                  format: int32
                  type: integer
                skipped:
                  format: int32
                  type: integer
                succeeded:
                  format: int32
                  type: integer
                total:
                  format: int32
                  type: integer
              type: object
            targets:
              items:
                properties:
                  dispatchedAt:
                    format: date-time
                    type: string
                  finishedAt:
                    format: date-time
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  output:
                    description: Verb-specific dispatch output (currently executeGroovy
                      only), truncated to 4096 bytes on a UTF-8-safe boundary.
                    type: string
                  reason:
                    type: string
                  state:
                    enum:
                    - Pending
                    - Dispatched
                    - Succeeded
                    - Failed
                    - Skipped
                    type: string
                  wave:
                    format: int32
                    type: integer
                type: object
              type: array
          type: object
      type: object
