          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ConflictResponse'
          description: SSA field-ownership conflict — retry with `?force=true` to
            override.
      summary: Patches a controller's spec (only `spec` key allowed, N5).
