          - Pending
          - Running
          - Suspended
          - Succeeded
          - Failed
          - Canceled
          type: string
        startedBy:
          type: string
        summary:
          properties:
            failed:
              format: int32
              type: integer
            skipped:
              format: int32
              type: integer
            succeeded:
              format: int32
              type: integer
            total:
              format: int32
              type: integer
          type: object
        verb:
          enum:
          - restart
          - reprovision
          - reconcile
          - stop
          - start
          - executeGroovy
          - upgrade
          type: string
      required:
      - namespace
      - name
      - verb
      - phase
      - summary
      - clusters
      type: object
    components_schemas_BroodRunCluster:
      description: Per-cluster detail section within a BroodRun.
      properties:
        cluster:
          type: string
        error:
          type: string
        ok:
          type: boolean
        op:
          $ref: '#/components/schemas/components_schemas_BroodOperationDetail'
      required:
      - cluster
      - ok
      type: object
    components_schemas_BroodRunClusterStatus:
      description: Per-cluster fan-out outcome row.
      properties:
        cluster:
          type: string
        error:
          type: string
        ok:
          type: boolean
      required:
      - cluster
      - ok
      type: object
    components_schemas_BroodRunSummaryRow:
      description: Summary row for a logical run in list responses.
      properties:
        clusters:
          items:
            type: string
          type: array
        createdAt:
          format: date-time
          type: string
        name:
          type: string
        namespace:
          type: string
        phase:
          enum:
          - Pending
          - Running
          - Suspended
          - Succeeded
          - Failed
          - Canceled
          type: string
        startedBy:
          type: string
        summary:
          properties:
            failed:
              format: int32
              type: integer
            skipped:
              format: int32
              type: integer
            succeeded:
              format: int32
              type: integer
            total:
              format: int32
              type: integer
          type: object
        verb:
          enum:
          - restart
          - reprovision
          - reconcile
          - stop
          - start
          - executeGroovy
          - upgrade
          type: string
      required:
      - namespace
      - name
      - verb
      - phase
      - summary
      - clusters
      type: object
    components_schemas_BroodScheduleResponse:
      description: Response envelope for a brood schedule create, get, or list.
      properties:
        cluster:
          type: string
        error:
          description: Error message if the operation failed.
          type: string
        name:
          type: string
        namespace:
          type: string
        spec:
          $ref: '#/components/schemas/components_schemas_BroodScheduleSpec'
        status:
          additionalProperties: true
          description: Observed schedule status (lastScheduleTime, lastSuccessfulTime,
            active, reason).
          type: object
      type: object
    components_schemas_BroodScheduleSpec:
      description: Desired state of a BroodSchedule.
      properties:
        concurrencyPolicy:
          description: How to handle overlapping executions.
          enum:
          - Allow
          - Forbid
          - Replace
          type: string
        failedJobsHistoryLimit:
          description: Number of failed finished jobs to retain.
          format: int32
          type: integer
        schedule:
          description: Cron expression for when to trigger the operation.
          type: string
        startingDeadlineSeconds:
          description: Deadline in seconds for starting the job if it misses its scheduled
            time.
          format: int64
          type: integer
        successfulJobsHistoryLimit:
          description: Number of successful finished jobs to retain.
          format: int32
          type: integer
        suspend:
          description: Suspends the schedule.
          type: boolean
        template:
          description: Template for the brood operation.
          properties:
            action:
              properties:
                verb:
                  description: Brood operation verb.
                  type: string
              type: object
            clusters:
              description: Target clusters.
              items:
                type: string
              type: array
            execution:
              additionalProperties: true
              description: Execution parameters (order, maxParallel, failurePolicy).
              type: object
            targets:
              additionalProperties: true
              description: Target selection (names or selector).
              type: object
            ttlSecondsAfterFinished:
              description: TTL after the operation finishes.
              format: int32
              type: integer
          type: object
        waitForCompletion:
          description: Whether the CronJob should wait for the brood operation to
            complete.
          type: boolean
      required:
      - schedule
      - template
      type: object
    components_schemas_BuiltinRoleRef:
      additionalProperties: false
      description: A built-in VarroaRole with resolved Jenkins permissions.
      properties:
        apiRules:
          items:
            $ref: '#/components/schemas/components_schemas_ApiRuleRef'
          type: array
        jenkinsPermissions:
          description: Resolved Jenkins permissions (plugin/controller-level).
          items:
            type: string
          type: array
        jenkinsRoleRef:
          description: Reference to the corresponding JenkinsRole.
          type: string
        name:
          type: string
      required:
      - name
      - apiRules
      - jenkinsRoleRef
      - jenkinsPermissions
      type: object
    components_schemas_BundleRef:
      additionalProperties: false
      properties:
        name:
          type: string
        namespace:
          type: string
      required:
      - namespace
      - name
      type: object
    components_schemas_CancelRunResponse:
      additionalProperties: false
      description: |
        202 response for a fire-and-forget run action: a cancel, an input proceed, or an input abort. The BFF publishes one command and waits for no result.
      properties:
        state:
          enum:
          - requested
          type: string
      required:
      - state
      type: object
    components_schemas_CatalogItem:
      description: A CatalogItem CRD.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_CatalogItemSpec'
        status:
          $ref: '#/components/schemas/components_schemas_CatalogItemStatus'
      type: object
    components_schemas_CatalogItemClosureEntry:
      additionalProperties: false
      description: One pinned member of a derived item's dependency closure.
      properties:
        artifactId:
          type: string
        direct:
          description: Declared by the root, as opposed to pulled in transitively.
          type: boolean
        minimum:
          description: The effective minimum in force, when one was declared.
          type: string
        provenance:
          description: Where the selected version came from.
          enum:
          - store
          - lock
          type: string
        version:
          type: string
      required:
      - artifactId
      - version
      type: object
    components_schemas_CatalogItemCompat:
      additionalProperties: false
      description: One profile's advisory compatibility verdict for a catalog item.
      properties:
        jenkinsVersion:
          description: The profile's effective deployed core — resolveVersion when
            set, else version.
          type: string
        message:
          type: string
        profile:
          type: string
        verdict:
          enum:
          - compatible
          - core-too-old
          - dep-below-minimum
          - lock-too-old
          - unknown
          type: string
      required:
      - profile
      - verdict
      type: object
    components_schemas_CatalogItemDetailResponse:
      additionalProperties: false
      description: A CatalogItem plus the per-profile lock-pin projection joined from
        the JenkinsVersionProfile locks at read time. The pins are cluster state and
        are deliberately not stored on the item, where they would go stale.
      properties:
        item:
          $ref: '#/components/schemas/components_schemas_CatalogItem'
        lockPins:
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemLockPins'
          type: array
      required:
      - item
      type: object
    components_schemas_CatalogItemLockPins:
      additionalProperties: false
      description: One profile's lock pins for a derived item's closure entries. A
        closure entry the lock does not mention has no key in pins, which is distinct
        from the lock pinning it at the same version.
      properties:
        pins:
          additionalProperties:
            type: string
          type: object
        profile:
          type: string
      required:
      - profile
      - pins
      type: object
    components_schemas_CatalogItemRef:
      additionalProperties: false
      properties:
        name:
          type: string
        namespace:
          type: string
      required:
      - name
      - namespace
      type: object
    components_schemas_CatalogItemSpec:
      additionalProperties: false
      description: Spec for a CatalogItem.
      properties:
        description:
          type: string
        displayName:
          type: string
        path:
          type: string
        requires:
          items:
            type: string
          type: array
        sourceRef:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          enum:
          - podtemplate
          - plugin
          - item
          - jcasc
          - rbac
          - pipeline-template
          - groovy
          type: string
        variables:
          items:
            $ref: '#/components/schemas/components_schemas_CatalogVariable'
          type: array
        version:
          type: string
      required:
      - sourceRef
      - type
      - path
      type: object
    components_schemas_CatalogItemStatus:
      description: Observed state of a CatalogItem.
      properties:
        closure:
          description: The resolver's own record of what it pinned, for items derived
            from the update-center store. status.content is a flat plugins.yaml fragment
            and can express none of these facts.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemClosureEntry'
          type: array
        compat:
          description: One advisory verdict per JenkinsVersionProfile. Never blocks
            anything.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemCompat'
          type: array
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_TemplateCatalogCondition'
          type: array
        content:
          type: string
        contentHash:
          type: string
        message:
          type: string
        observedRevision:
          type: string
        valid:
          type: boolean
      type: object
    components_schemas_CatalogItemSummary:
      additionalProperties: false
      description: Summary projection returned by catalog item list responses.
      properties:
        compat:
          description: The item's advisory per-profile verdicts, so a row can be badged
            without a per-item detail fetch. A badge never disables selection.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemCompat'
          type: array
        contentHash:
          type: string
        description:
          type: string
        displayName:
          type: string
        message:
          type: string
        name:
          type: string
        namespace:
          type: string
        pluginName:
          description: The update-center plugin this item was derived for. The browser
            collapses rows by it, so a plugin stored at three versions is one row
            with a version selector. Absent for items that are not update-center-derived.
          type: string
        sourceRef:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          type: string
        valid:
          type: boolean
        variables:
          description: The item's declared variables, so list consumers can render
            typed inputs without a per-item detail fetch.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogVariable'
          type: array
        version:
          type: string
      required:
      - name
      - namespace
      - type
      - sourceRef
      - valid
      type: object
    components_schemas_CatalogSource:
      description: A CatalogSource CRD.
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_CatalogSourceSpec'
        status:
          $ref: '#/components/schemas/components_schemas_CatalogSourceStatus'
      type: object
    components_schemas_CatalogSourceSpec:
      additionalProperties: false
      description: Spec for a CatalogSource (bundle catalog repository).
      properties:
        ociRef:
          description: OCI artifact reference; mutually exclusive with repoURL.
          type: string
        path:
          type: string
        repoURL:
          type: string
        revision:
          type: string
        secretRef:
          type: string
        syncIntervalSeconds:
          description: Catalog poll cadence in seconds. 0 or an omitted field means
            the default (300); any other value must be between 30 and 31536000.
          oneOf:
          - enum:
            - 0
          - maximum: 31536000
            minimum: 30
          type: integer
        trusted:
          type: boolean
      type: object
    components_schemas_CatalogSourceStatus:
      description: Observed state of a CatalogSource.
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_TemplateCatalogCondition'
          type: array
        itemCount:
          type: integer
        lastSyncTime:
          type: string
        message:
          type: string
        observedRevision:
          type: string
        phase:
          enum:
          - Pending
          - Syncing
          - Ready
          - Error
          type: string
      type: object
    components_schemas_CatalogVariable:
      additionalProperties: false
      description: A variable definition for a catalog item.
      properties:
        allowedValues:
          description: Populates a choice/dropdown widget. Only valid when type is
            "string" or "number".
          items:
            type: string
          type: array
        default:
          type: string
        description:
          type: string
        name:
          type: string
        required:
          type: boolean
        type:
          description: Parameter type. Omitting the field means "string".
          enum:
          - string
          - number
          - boolean
          - credentials
          type: string
      required:
      - name
      type: object
    components_schemas_CellGrant:
      additionalProperties: false
      description: One grant that reaches a tenant. The jobs field is absent when
        the grant narrows nothing. An absent jobs and an empty jobs mean different
        things, so the field is never an empty array.
      properties:
        binding:
          description: The VarroaRoleBinding name. For the federatedBinding source
            it names the JenkinsRoleBinding copy on this cell's cluster. Absent for
            the tenantMembership source.
          type: string
        federatedFrom:
          description: The core VarroaRoleBindings of a federated copy.
          items:
            type: string
          minItems: 1
          type: array
        jobs:
          items:
            type: string
          minItems: 1
          type: array
        roleRef:
          description: The VarroaRole of the grant. For the federatedBinding source
            it names the source VarroaRole of the copy.
          type: string
        source:
          enum:
          - tenantMembership
          - tenantScopedBinding
          - federatedBinding
          - clusterWideBinding
          type: string
        subjects:
          items:
            $ref: '#/components/schemas/components_schemas_CellGrantSubject'
          type: array
        verbs:
          description: The pipelines verbs of the grant's role, never the whole capability
            set.
          items:
            type: string
          type: array
      required:
      - source
      - roleRef
      - subjects
      - verbs
      type: object
    components_schemas_CellGrantSubject:
      additionalProperties: false
      description: One subject of a grant.
      properties:
        kind:
          type: string
        name:
          type: string
      required:
      - kind
      - name
      type: object
    components_schemas_CellGrants:
      additionalProperties: false
      description: One entry for each tenant of a cell, naming the subjects that may
        build on it.
      properties:
        cell:
          type: string
        cluster:
          type: string
        namespace:
          type: string
        tenants:
          items:
            $ref: '#/components/schemas/components_schemas_CellTenantGrants'
          type: array
      required:
      - cluster
      - namespace
      - cell
      - tenants
      type: object
    components_schemas_CellMemberRole:
      additionalProperties: false
      description: One generated Jenkins member role of a tenant. The role holds the
        person checks of the acting-user routes for its subjects.
      properties:
        binding:
          description: The narrowing VarroaRoleBinding, or the JenkinsRoleBinding
            copy that names it. Absent for the role on the whole folder subtree.
          type: string
        name:
          type: string
        pattern:
          type: string
        permissions:
          items:
            type: string
          type: array
        subjects:
          items:
            $ref: '#/components/schemas/components_schemas_CellGrantSubject'
          type: array
      required:
      - name
      - pattern
      - permissions
      - subjects
      type: object
    components_schemas_CellPendingSignature:
      additionalProperties: false
      description: One script signature the sandbox refused in a cell.
      properties:
        dangerous:
          type: boolean
        requesters:
          description: Up to three tenant jobs that hit this signature, newest first.
          items:
            $ref: '#/components/schemas/components_schemas_CellSignatureRequester'
          type: array
        signature:
          type: string
      required:
      - signature
      type: object
    components_schemas_CellPool:
      additionalProperties: false
      description: Full cell-pool object returned from get and list operations.
      properties:
        cluster:
          description: The cluster that holds the pool. A pool name is unique inside
            one cluster only.
          type: string
        name:
          type: string
        spec:
          $ref: '#/components/schemas/components_schemas_CellPoolSpec'
        status:
          $ref: '#/components/schemas/components_schemas_CellPoolStatus'
      required:
      - cluster
      - name
      - spec
      - status
      type: object
    components_schemas_CellPoolCondition:
      additionalProperties: false
      description: Status condition for a CellPool. Type PoolReady, with exactly the
        reasons Ready, CellCapReached, ProfileMissing, RecordStoreUnsupported, BlobTierUnsupported,
        ArtifactSecretMissing, ArtifactPluginMissing, and SecretsMissing.
      properties:
        lastTransitionTime:
          description: ISO 8601 last transition time.
          type: string
        message:
          type: string
        observedGeneration:
          format: int64
          type: integer
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - type
      - status
      type: object
    components_schemas_CellPoolGiteaServer:
      additionalProperties: false
      description: One Gitea or Forgejo server of a pool. The operator renders it
        with manageHooks false and no credential.
      properties:
        aliasUrl:
          description: The URL the forge reports in webhook payloads, when it differs
            from serverUrl.
          maxLength: 2048
          type: string
        displayName:
          description: The server name in Jenkins. Unset means the plugin derives
            it from the URL.
          maxLength: 100
          type: string
        serverUrl:
          description: The base URL of the forge.
          maxLength: 2048
          minLength: 8
          type: string
      required:
      - serverUrl
      type: object
    components_schemas_CellPoolLibrary:
      additionalProperties: false
      description: A trusted shared library of a pool. Jenkins runs its code outside
        the script sandbox. Only the operator declares it.
      properties:
        allowVersionOverride:
          description: Lets a pipeline load another version of the library. Any user
            who can push to the library repository then runs trusted code on every
            cell.
          type: boolean
        credentialRef:
          description: The name of the Secret in the operator namespace that holds
            the login. Required for an ssh remote.
          maxLength: 253
          type: string
        defaultVersion:
          description: The branch, tag, or commit a pipeline loads when it names no
            version.
          maxLength: 255
          minLength: 1
          type: string
        implicit:
          description: Loads the library in every job of every cell in the pool.
          type: boolean
        name:
          description: The library name. A pipeline loads the library by this name.
          maxLength: 63
          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
          type: string
        remote:
          description: The repository URL of the library. It must not hold a variable
            token.
          maxLength: 2048
          type: string
      required:
      - name
      - remote
      - defaultVersion
      type: object
    components_schemas_CellPoolMail:
      additionalProperties: false
      description: The SMTP setting of a pool. Every cell of the pool renders it for
        the mailer and email-ext plugins. Read-only through the API; edit the CellPool
        with kubectl or GitOps. The read carries the login Secret name, never its
        value.
      properties:
        credentialRef:
          description: The Secret in the operator namespace that holds the SMTP username
            and password. The name only; the value is never returned.
          maxLength: 253
          type: string
        defaultSuffix:
          description: The domain that a bare recipient name gets.
          maxLength: 254
          type: string
        from:
          description: The sender address of every message.
          maxLength: 254
          type: string
        host:
          description: The SMTP server name.
          maxLength: 253
          minLength: 1
          type: string
        port:
          description: The SMTP server port. Unset means 587.
          format: int32
          maximum: 65535
          minimum: 1
          type: integer
        replyTo:
          description: The reply-to address of every message.
          maxLength: 254
          type: string
        security:
          description: The transport mode. Unset means starttls.
          enum:
          - none
          - starttls
          - tls
          type: string
      required:
      - host
      - from
      type: object
    components_schemas_CellPoolScaleRequest:
      additionalProperties: false
      description: Request body for PATCH /cellpools/{name}. It declares the four
        scale dials and nothing else, so the contract itself states that a structural
        edit is not an API operation.
      properties:
        spec:
          additionalProperties: false
          properties:
            maxCells:
              format: int32
              minimum: 0
              type: integer
            maxTenantsPerCell:
              format: int32
              maximum: 64
              minimum: 1
              type: integer
            unreadyGracePeriod:
              type: string
            warm:
              format: int32
              minimum: 0
              type: integer
          type: object
      required:
      - spec
      type: object
    components_schemas_CellPoolSpec:
      additionalProperties: false
      description: A CellPool's configuration (spec.*). profileRef is immutable, because
        a pool's cells carry the profile label they were created with.
      properties:
        approvedSignatures:
          description: Script-security signatures that every cell of the pool approves.
            A cell renders this list with its own bundle list, sorted. Read-only through
            the API; edit the CellPool with kubectl or GitOps.
          items:
            maxLength: 1024
            pattern: ^(method|staticMethod|new|field|staticField) \S.*$
            type: string
          maxItems: 256
          type: array
          uniqueItems: true
        cellTemplate:
          additionalProperties: true
          description: resources, miteResources, and podOverrides for the cells the
            pool creates. resources and podOverrides go to the Jenkins container and
            the pod; miteResources goes to the mite sidecar. The pool exposes no raw
            strategic-merge overlay.
          type: object
        giteaServers:
          description: Gitea and Forgejo servers that every cell of the pool declares.
            Each server has hooks off and no credential. Read-only through the API;
            edit the CellPool with kubectl or GitOps. Server URLs are unique.
          items:
            $ref: '#/components/schemas/components_schemas_CellPoolGiteaServer'
          maxItems: 16
          type: array
        libraries:
          description: Trusted shared libraries that every cell of the pool serves
            as global libraries. Names are unique.
          items:
            $ref: '#/components/schemas/components_schemas_CellPoolLibrary'
          maxItems: 16
          type: array
        mail:
          $ref: '#/components/schemas/components_schemas_CellPoolMail'
        maxCells:
          description: Cap on the pool's cells, placed cells included. 0 means unlimited.
          format: int32
          minimum: 0
          type: integer
        maxRunsPerTenant:
          description: Cap on the builds one tenant runs at once on one cell of the
            pool. Zero means no cap. Set it on the CellPool object, not through the
            scale API.
          format: int32
          maximum: 10000
          minimum: 0
          type: integer
        maxTenantsPerCell:
          description: Capacity a pool cell uses when its own spec.cell.maxTenants
            is zero. At most 64, the item limit of status.cell.tenants.
          format: int32
          maximum: 64
          minimum: 1
          type: integer
        profileRef:
          description: The JenkinsVersionProfile the pool's cells run. Immutable.
          minLength: 1
          type: string
        unreadyGracePeriod:
          description: How long a pool cell may stay unready before the operator rolls
            its pod. A Go duration string.
          type: string
        warm:
          description: Target count of free cells the pool keeps ready.
          format: int32
          minimum: 0
          type: integer
      required:
      - profileRef
      type: object
    components_schemas_CellPoolStatus:
      additionalProperties: false
      description: A CellPool's reported cell and tenant counts.
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_CellPoolCondition'
          type: array
        freeTenantSlots:
          description: Spare capacity of the placed cells only. warmCells already
            reports the empty ones.
          format: int32
          type: integer
        observedGeneration:
          format: int64
          type: integer
        placedCells:
          description: Owned cells that hold at least one tenant.
          format: int32
          type: integer
        tenants:
          description: Every tenant on the pool, sorted.
          items:
            type: string
          type: array
        unreadyCells:
          description: Owned cells whose CellReady condition is not True.
          format: int32
          type: integer
        warmCells:
          description: Owned cells that hold no tenant.
          format: int32
          type: integer
      required:
      - warmCells
      - placedCells
      - unreadyCells
      - freeTenantSlots
      type: object
    components_schemas_CellSignatureRequester:
      additionalProperties: false
      description: One tenant job that requested a refused script signature.
      properties:
        buildNumber:
          type: integer
        jobPath:
          type: string
        runId:
          type: string
        tenant:
          type: string
      required:
      - jobPath
      type: object
    components_schemas_CellSpec:
      additionalProperties: false
      description: Marks a controller as a shared cell that hosts tenant pipelines.
        enabled is immutable after creation; maxTenants bounds placement.
      properties:
        enabled:
          type: boolean
        maxTenants:
          format: int32
          maximum: 64
          minimum: 0
          type: integer
      required:
      - enabled
      type: object
    components_schemas_CellStatusProjection:
      additionalProperties: false
      description: 'The controller detail''s projection of status.cell. It declares
        twelve properties. It declares no rehydration property: the cell-controllers
        capability keeps that key inside the operator.'
      properties:
        appliedTenants:
          description: The placed tenants that have an applied folder on the cell
            after its last items walk. A draining tenant never enters it. A tenant
            named in tenants and absent here has no folder building yet.
          items:
            type: string
          type: array
        evacuate:
          description: Operator-written state. No API accepts a write to it, so no
            surface offers an evacuate action.
          type: boolean
        instance:
          type: string
        pendingSignatures:
          description: The script signatures the sandbox refused in this cell and
            no operator approved. Carries at most 25 entries.
          items:
            $ref: '#/components/schemas/components_schemas_CellPendingSignature'
          type: array
        pendingSignaturesTotal:
          description: The number of pending signatures. It can exceed the list length.
          type: integer
        previousInstance:
          type: string
        previousInstanceLastSeen:
          format: date-time
          type: string
        rolledAt:
          format: date-time
          type: string
        tenantWarnings:
          items:
            $ref: '#/components/schemas/components_schemas_CellTenantWarning'
          type: array
        tenants:
          items:
            type: string
          type: array
        unreadySince:
          format: date-time
          type: string
        warm:
          type: boolean
      type: object
    components_schemas_CellTenantGrants:
      additionalProperties: false
      description: Every grant that reaches one tenant of a cell, with the tenant's
        generated Jenkins item role and its generated member roles. The item role
        and its pattern come from the tenant name, so the read opens no JenkinsRole
        object.
      properties:
        grants:
          items:
            $ref: '#/components/schemas/components_schemas_CellGrant'
          type: array
        itemPattern:
          type: string
        itemRole:
          type: string
        memberRoles:
          description: The generated Jenkins member roles of the tenant. Each subject
            with pipelines write gets the person checks of the acting-user routes.
            The list is never capped.
          items:
            $ref: '#/components/schemas/components_schemas_CellMemberRole'
          type: array
        tenant:
          type: string
        truncated:
          description: True only when the 50-grant cap dropped a grant of this tenant.
          type: boolean
      required:
      - tenant
      - itemRole
      - itemPattern
      - truncated
      - grants
      - memberRoles
      type: object
    components_schemas_CellTenantUsage:
      additionalProperties: false
      description: One tenant on a cell, with that tenant's role and four counts.
      properties:
        agentNamespace:
          description: The namespace that holds the tenant's build agents, as the
            tenant's own cluster last announced it. Absent when no announcement named
            one.
          type: string
        failedLast24h:
          format: int64
          type: integer
        jobs:
          format: int64
          type: integer
        placementGeneration:
          description: The generation of the tenant's placement row.
          format: int64
          type: integer
        role:
          description: 'That tenant''s role on this cell: "slot <n>" for an active
            member and "standby" for a standby. A standby holds the tenant folder
            and runs no build, so its running count is zero.'
          type: string
        runningNow:
          format: int64
          type: integer
        runsLast24h:
          format: int64
          type: integer
        tenant:
          type: string
      required:
      - tenant
      - placementGeneration
      - runningNow
      - runsLast24h
      - failedLast24h
      - jobs
      type: object
    components_schemas_CellTenantWarning:
      additionalProperties: false
      description: One non-blocking finding the reconciler recorded about a tenant.
      properties:
        message:
          type: string
        reason:
          type: string
        tenant:
          type: string
      required:
      - tenant
      - reason
      - message
      type: object
    components_schemas_CellUsage:
      additionalProperties: false
      description: 'One cell''s load, tenant by tenant. An absent optional field is
        absent from the object, never a null and never a zero: queueLength reads as
        zero only for an empty queue, and a cell in a remote cluster carries no queueLength
        at all.'
      properties:
        cellPool:
          description: The cell's varroa.dev/cell-pool label. Absent while no label
            is set.
          type: string
        cluster:
          type: string
        freeSlots:
          description: maxTenants minus the placed tenant count, never below zero.
          format: int32
          type: integer
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        maxTenants:
          description: 'The effective tenant cap this surface resolves: the cell''s
            own spec.cell.maxTenants when that value is not zero, else the chart value,
            else ten. It is never a minimum over the tiers.'
          format: int32
          type: integer
        name:
          type: string
        namespace:
          type: string
        profile:
          description: The cell's varroa.dev/cell-profile label.
          type: string
        queueLength:
          description: The Jenkins queue length from the latest mite heartbeat. Absent
            for a remote cluster and absent while no heartbeat has arrived.
          format: int64
          type: integer
        queueLengthAt:
          description: The heartbeat time the queue length came from.
          format: date-time
          type: string
        tenants:
          items:
            $ref: '#/components/schemas/components_schemas_CellTenantUsage'
          type: array
        totals:
          $ref: '#/components/schemas/components_schemas_CellUsageCounts'
        windowStart:
          description: The start of the fixed 24-hour window the counts used.
          format: date-time
          type: string
      required:
      - cluster
      - namespace
      - name
      - windowStart
      - tenants
      - totals
      - maxTenants
      - freeSlots
      type: object
    components_schemas_CellUsageCounts:
      additionalProperties: false
      description: The four load counts of one tenant on a cell, or the same four
        summed over the cell. runningNow carries no time bound, so a build that runs
        longer than a day still counts. runsLast24h and failedLast24h count inside
        the fixed 24-hour window. jobs counts distinct job paths. A run whose result
        is TRIGGER_FAILED counts in no value.
      properties:
        failedLast24h:
          format: int64
          type: integer
        jobs:
          format: int64
          type: integer
        runningNow:
          format: int64
          type: integer
        runsLast24h:
          format: int64
          type: integer
      required:
      - runningNow
      - runsLast24h
      - failedLast24h
      - jobs
      type: object
    components_schemas_ChangeRequest:
      additionalProperties: false
      description: |
        The change request (pull request) a multibranch run builds. Absent for a branch run.
      properties:
        id:
          description: The forge's change request number or identifier.
          type: string
        sourceBranch:
          description: The branch that carries the change.
          type: string
        targetBranch:
          description: The branch the change merges into.
          type: string
        title:
          type: string
        url:
          description: Web link to the change request on the forge.
          type: string
      required:
      - id
      type: object
    components_schemas_Check:
      additionalProperties: false
      description: Result of a single preflight validation check.
      properties:
        id:
