  securitySchemes:
    bearerAuth:
      description: |
        Session JWT (from POST /api/v1/login or the OIDC flow) or a long-lived vk_ API key. The server routes vk_-prefixed tokens to the API-key verifier and everything else to the JWT provider.
      scheme: bearer
      type: http
info:
  description: |
    Varroa is a Jenkins operator that manages controllers, RBAC, API keys, and identity within a Kubernetes cluster.
    ## Authentication
    **Bearer token (primary).** All API calls (except those explicitly marked unauthenticated) require an `Authorization: Bearer <token>` header. The token may be a session JWT obtained from `POST /api/v1/login` (local/LDAP) or via the OIDC flow, or a long-lived `vk_`-prefixed API key. The server routes `vk_`-prefixed tokens to the API-key verifier and everything else to the JWT provider.
    **Cookie (browser only).** On successful login the BFF sets an httpOnly `varroa_token` cookie. Browser-based clients (the Varroa dashboard) may use this cookie instead of a bearer header; the `GET /api/v1/me` endpoint accepts it as a fallback when no bearer token is present.
    **SSE ticket (browser EventSource).** Server-Sent Event streams use query-parameter authentication via `?ticket=<stream-ticket>` because the JavaScript `EventSource` API does not support custom headers. A short-lived ticket is obtained from `POST /api/v1/stream/ticket`.
    The CLI and generated Go client use the bearer header exclusively.
  title: Varroa BFF API
  version: 1.0.0
  x-varroa-flows:
    cli-auth:
      callback: http://127.0.0.1:{port}/callback?state={state}&token={token}
      description: |
        Browser-based CLI authentication flow. The CLI opens `https://<server>/cli-auth?port=<p>&state=<nonce>&name=<keyName>`, the user approves the request on the frontend page, which POSTs `/api/v1/me/apikeys {"name": "<keyName>"}` and then redirects the browser to `http://127.0.0.1:<p>/callback?state=<nonce>&token=<vk_>` to deliver the token to the CLI's loopback listener.
      query-params:
        name: Optional key display name; default "varroactl".
        port: Loopback listener port on 127.0.0.1.
        state: Anti-CSRF nonce, echoed back in the callback.
openapi: 3.0.3
paths:
  /api/v1/activity:
    get:
      operationId: listActivity
      parameters:
      - in: query
        name: controller
        schema:
          type: string
      - in: query
        name: cluster
        schema:
          type: string
      - in: query
        name: namespace
        schema:
          type: string
      - in: query
        name: source
        schema:
          enum:
          - mite
          - operator
          - user
          - api
          - jenkins
          type: string
      - in: query
        name: severity
        schema:
          enum:
          - info
          - warning
          - error
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: start
        schema:
          format: date-time
          type: string
      - in: query
        name: end
        schema:
          format: date-time
          type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          default: 100
          maximum: 250
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  hasMore:
                    type: boolean
                  items:
                    items:
                      $ref: '#/components/schemas/components_schemas_ActivityEvent'
                    type: array
                  nextCursor:
                    type: string
                  retentionDays:
                    enum:
                    - 7
                    - 30
                    - 90
                    type: integer
                  retentionMode:
                    enum:
                    - "on"
                    - "off"
                    type: string
                required:
                - items
                - hasMore
                - retentionMode
                type: object
          description: Activity history page.
        "400":
          description: Invalid filters, cursor, or range.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "410":
          description: Cursor has aged out of retention.
      summary: Returns authorized, filtered activity history with cursor pagination.
      tags:
      - activity
  /api/v1/activity/stream:
    get:
      description: SSE stream with event type `activity`; filtering follows authorization.
      operationId: streamActivity
      parameters:
      - in: query
        name: controller
        schema:
          type: string
      - in: query
        name: cluster
        schema:
          type: string
      - in: query
        name: namespace
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: 'SSE event stream (event: activity, data = ActivityEvent).'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: Streams filtered activity events via Server-Sent Events.
      tags:
      - activity
      x-sse: true
  /api/v1/auth-config:
    get:
      operationId: getAuthConfig
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  mode:
                    enum:
                    - local
                    - ldap
                    - oidc
                    type: string
                required:
                - mode
                type: object
          description: Auth mode.
      security: []
      summary: Returns the configured authentication mode.
      tags:
      - auth
  /api/v1/auth/login:
    get:
      description: |
        Sets a signed HttpOnly oidc_state cookie containing nonce and return path, then redirects to the provider. Consumes the interactive_login marker when present and adds prompt=login&max_age=0.
      operationId: authLogin
      parameters:
      - description: Optional normalized return path (default /).
        in: query
        name: return
        schema:
          type: string
      responses:
        "302":
          description: Redirect to OIDC provider authorization URL.
        "501":
          $ref: '#/components/responses/components_responses_MethodNotAllowed'
      security: []
      summary: Initiate OIDC authorization flow. Sets signed state cookie and redirects
        to provider.
      tags:
      - auth
  /api/v1/brood-operations:
    get:
      operationId: listBroodOperations
      parameters:
      - $ref: '#/components/parameters/components_parameters_namespace'
      - description: Optional cluster filter (narrows fan-out to one cluster).
        in: query
        name: cluster
        schema:
          type: string
      - description: Optional filter by status.startedBy (e.g., schedule:ns/name).
        in: query
        name: startedBy
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  clusters:
                    items:
                      $ref: '#/components/schemas/components_schemas_BroodRunClusterStatus'
                    type: array
                  items:
                    items:
                      $ref: '#/components/schemas/components_schemas_BroodRunSummaryRow'
                    type: array
                required:
                - items
                - clusters
                type: object
          description: Brood operation list with fan-out status.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          description: Unknown cluster specified in ?cluster=.
      summary: Lists brood operations, optionally filtered by namespace or cluster.
        Viewer+.
      tags:
      - broodops
    post:
      operationId: createBroodOperation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_CreateBroodRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_BroodRun'
          description: Brood operation created (at least one cluster succeeded).
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_BroodCreateFailure'
          description: Conflict (uniform across clusters).
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_BroodCreateFailure'
          description: All clusters failed or unreachable.
      summary: Creates a new brood operation. Operator+.
      tags:
      - broodops
  /api/v1/brood-operations/{ns}/{name}:
    delete:
      operationId: deleteBroodOperation
      parameters:
      - $ref: '#/components/parameters/components_parameters_ns'
      - $ref: '#/components/parameters/components_parameters_name'
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  clusters:
                    items:
                      $ref: '#/components/schemas/components_schemas_BroodRunClusterStatus'
                    type: array
                required:
                - clusters
                type: object
          description: Per-cluster cancel results.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
      summary: Deletes (cancels) a brood operation across all member clusters. Operator+.
      tags:
      - broodops
    get:
      operationId: getBroodOperation
      parameters:
      - $ref: '#/components/parameters/components_parameters_ns'
      - $ref: '#/components/parameters/components_parameters_name'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_BroodRun'
          description: Brood run detail with per-cluster sections.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "502":
          description: Run not found on reachable clusters but some clusters unreachable.
      summary: Gets a logical brood operation run (aggregated across clusters). Viewer+.
      tags:
      - broodops
  /api/v1/brood-operations/{ns}/{name}/stream:
    get:
      operationId: streamBroodOperation
      parameters:
      - $ref: '#/components/parameters/components_parameters_ns'
      - $ref: '#/components/parameters/components_parameters_name'
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: 'event: status\ndata: <BroodRun>\n\n'
                type: string
          description: 'SSE event stream. Emits `event: status` with BroodRun DTO.'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "502":
          description: Run unreachable (some clusters errored).
      summary: SSE stream of brood operation status changes (BroodRun DTO). Viewer+.
      tags:
      - broodops
  /api/v1/brood-operations/{ns}/{name}/suspend:
    post:
      operationId: suspendBroodOperation
      parameters:
      - $ref: '#/components/parameters/components_parameters_ns'
      - $ref: '#/components/parameters/components_parameters_name'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_SuspendBroodRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  clusters:
                    items:
                      $ref: '#/components/schemas/components_schemas_BroodRunClusterStatus'
                    type: array
                required:
                - clusters
                type: object
          description: Per-cluster suspend results.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
      summary: Toggles suspend on a brood operation across all member clusters. Operator+.
      tags:
      - broodops
  /api/v1/brood-operations/preview:
    post:
      operationId: previewBroodOperation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_CreateBroodRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_BroodPreviewResponse'
          description: Preview result with per-cluster target tables.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
