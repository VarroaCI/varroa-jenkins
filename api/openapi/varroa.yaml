        pattern:
          type: string
        propagate:
          enum:
          - None
          - Children
          - Subtree
          type: string
        type:
          enum:
          - Global
          - Folder
          - Pattern
          type: string
      required:
      - type
      type: object
    components_schemas_JenkinsVersionProfile:
      additionalProperties: true
      description: A JenkinsVersionProfile CRD (cluster-scoped).
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          additionalProperties: true
          type: object
        spec:
          additionalProperties: true
          type: object
        status:
          additionalProperties: true
          type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      type: object
    components_schemas_JobDeclaredBy:
      additionalProperties: false
      description: |
        Which input of the job's composed bundle declared it. Present when one bundle input resolved as the declarer. Absent when the bundle or every candidate input is unresolved.
      properties:
        bundle:
          $ref: '#/components/schemas/components_schemas_BundleRef'
        catalogItem:
          $ref: '#/components/schemas/components_schemas_CatalogItemRef'
        kind:
          enum:
          - gitSource
          - ociSource
          - itemRef
          type: string
        name:
          description: |
            gitSource: the input's repoURL. ociSource: the input's ociRef. itemRef: the CatalogItem name.
          type: string
        ociRef:
          description: Present only for kind ociSource.
          type: string
        path:
          description: The input's sub-path. Absent when the input declares no sub-path.
          type: string
        repoURL:
          description: Present only for kind gitSource.
          type: string
        revision:
          description: |
            A git SHA (gitSource), an OCI manifest digest (ociSource), or a CatalogItem content hash (itemRef). Absent when the composed bundle has not resolved this input yet.
          type: string
      required:
      - kind
      - name
      - bundle
      type: object
    components_schemas_KeyMeta:
      additionalProperties: false
      description: Non-secret metadata for an API key.
      properties:
        created:
          description: ISO 8601 creation time.
          type: string
        expires:
          description: ISO 8601 expiration time, absent if no expiry.
          type: string
        lastUsed:
          description: ISO 8601 last-use time, absent if never used.
          type: string
        name:
          description: Optional display name (≤128 chars). Absent when unnamed.
          type: string
        prefix:
          description: First 7 characters of the key.
          type: string
      required:
      - prefix
      - created
      type: object
    components_schemas_LiveDrift:
