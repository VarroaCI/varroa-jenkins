          - password
          type: string
        name:
          type: string
        schema:
          description: A JSON Schema fragment for this one field.
          type: object
        uiWidget:
          enum:
          - textarea
          - password
          type: string
      required:
      - name
      - kind
      - schema
      type: object
    components_schemas_PipelineSlowestStage:
      additionalProperties: false
      description: The stage with the greatest median duration across the window's
        runs.
      properties:
        durationMs:
          format: int64
          type: integer
        name:
          type: string
      required:
      - name
      - durationMs
      type: object
    components_schemas_PipelineSummary:
      additionalProperties: false
      description: |
        One job's run-history summary for the Pipelines table. A job that has never run carries no lastBuild.
      properties:
        durationTrendMs:
          description: The most recent runs' duration, newest first.
          items:
            format: int64
            type: integer
          type: array
        health:
          description: |
            The weather glyph, computed from the last five runs: clear when all passed, cloudy when one or two failed, rain when three or more failed, unknown for a job that has never run.
          enum:
          - clear
          - cloudy
          - rain
          - unknown
          type: string
        jobPath:
          type: string
        kind:
          description: |
            The item kind the tenant's bundle declares. A job the record store alone holds reports unknown. A declared item of any other kind also reports unknown.
          enum:
          - pipeline
          - multibranch
          - unknown
          type: string
        lastBuild:
          $ref: '#/components/schemas/components_schemas_RunSummary'
        medianQueueWaitMs:
          description: |
            The median wait between a build's queued moment and its started moment, in milliseconds, over the trailing 30 days. Absent when the job started no build in that window.
          format: int64
          type: integer
      required:
      - jobPath
      - health
      - kind
      type: object
    components_schemas_PipelineTeam:
