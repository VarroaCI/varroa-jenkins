    RunScript:
      additionalProperties: false
      description: |
        GET /runs/{run}/script. The run's own Groovy script, read from the build record the run retains in the blob tier. Every field is always present. A run that does not replay answers an empty script and an empty loadedScripts object.
      properties:
        definitionKind:
          description: |
            template when the run's stored payload names a pipeline template or a marker file, and script otherwise.
          enum:
          - template
          - script
          type: string
        loadedScripts:
          additionalProperties:
            type: string
          description: |
            The library scripts the run loaded, as a map of name to script text. A caller cannot edit them, and a replay loads them again from their library. The object is empty when the run loaded no script or when replayable is false.
          type: object
        reason:
          description: |
            The name of the first eligibility rule the run fails. The rules run in this order: not-terminal, template-defined, masked-parameter, no-replica, unreadable, not-sandbox, and script-too-large. A replayable run answers the empty string.
          type: string
        replayable:
          description: True only when the run passes every eligibility rule.
          type: boolean
        script:
          description: |
            The main script of the run's flow execution. The value is empty when replayable is false.
          type: string
      required:
      - script
      - loadedScripts
      - definitionKind
      - replayable
      - reason
      type: object
