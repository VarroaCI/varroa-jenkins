      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_ControllerPatch'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ControllerDetail'
          description: Controller updated.
        "400":
