  securitySchemes:
    bearerAuth:
      description: |
        Session JWT (from POST /api/v1/login or the OIDC flow) or a long-lived vk_ API key. The server routes vk_-prefixed tokens to the API-key verifier and everything else to the JWT provider.
      scheme: bearer
      type: http
info:
  description: |
    Varroa is a Jenkins operator that manages controllers, RBAC, API keys, and identity within a Kubernetes cluster.
    ## Authentication
    **Bearer token (primary).** All API calls (except those explicitly marked unauthenticated) require an `Authorization: Bearer <token>` header. The token may be a session JWT obtained from `POST /api/v1/login` (local/LDAP) or via the OIDC flow, or a long-lived `vk_`-prefixed API key. The server routes `vk_`-prefixed tokens to the API-key verifier and everything else to the JWT provider.
    **Cookie (browser only).** On successful login the BFF sets an httpOnly `varroa_token` cookie. Browser-based clients (the Varroa dashboard) may use this cookie instead of a bearer header; the `GET /api/v1/me` endpoint accepts it as a fallback when no bearer token is present.
    **SSE ticket (browser EventSource).** Server-Sent Event streams use query-parameter authentication via `?ticket=<stream-ticket>` because the JavaScript `EventSource` API does not support custom headers. A short-lived ticket is obtained from `POST /api/v1/stream/ticket`.
    The CLI and generated Go client use the bearer header exclusively.
  title: Varroa BFF API
  version: 1.0.0
  x-varroa-flows:
    cli-auth:
      callback: http://127.0.0.1:{port}/callback?state={state}&token={token}
      description: |
        Browser-based CLI authentication flow. The CLI opens `https://<server>/cli-auth?port=<p>&state=<nonce>&name=<keyName>`, the user approves the request on the frontend page, which POSTs `/api/v1/me/apikeys {"name": "<keyName>"}` and then redirects the browser to `http://127.0.0.1:<p>/callback?state=<nonce>&token=<vk_>` to deliver the token to the CLI's loopback listener.
      query-params:
        name: Optional key display name; default "varroactl".
        port: Loopback listener port on 127.0.0.1.
        state: Anti-CSRF nonce, echoed back in the callback.
openapi: 3.0.3
paths:
  /api/v1/activity:
    get:
      operationId: listActivity
      parameters:
      - in: query
        name: controller
        schema:
          type: string
      - in: query
        name: cluster
        schema:
          type: string
      - in: query
        name: namespace
        schema:
          type: string
      - in: query
        name: source
        schema:
          enum:
          - mite
          - operator
          - user
          - api
          - jenkins
          - mcp
          - assistant
          - tenant_agent
          type: string
      - in: query
        name: severity
        schema:
          enum:
          - info
          - warning
          - error
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      - in: query
        name: start
        schema:
          format: date-time
          type: string
      - in: query
        name: end
        schema:
          format: date-time
          type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          default: 100
          maximum: 250
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  hasMore:
                    type: boolean
                  items:
                    items:
                      $ref: '#/components/schemas/components_schemas_ActivityEvent'
                    type: array
                  nextCursor:
                    type: string
                  retentionDays:
                    type: integer
                  retentionMode:
                    enum:
                    - "on"
                    - "off"
                    type: string
                required:
                - items
                - hasMore
                - retentionMode
                type: object
          description: Activity history page.
        "400":
          description: Invalid filters, cursor, or range.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "410":
          description: Cursor has aged out of retention.
      summary: Returns authorized, filtered activity history with cursor pagination.
      tags:
      - activity
  /api/v1/activity/stream:
    get:
      description: SSE stream with event type `activity`; filtering follows authorization.
      operationId: streamActivity
      parameters:
      - in: query
        name: controller
        schema:
          type: string
      - in: query
        name: cluster
        schema:
          type: string
      - in: query
        name: namespace
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: 'SSE event stream (event: activity, data = ActivityEvent).'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: Streams filtered activity events via Server-Sent Events.
      tags:
      - activity
      x-sse: true
  /api/v1/agents:
    get:
      description: The cluster-wide view. It needs agentsessions:read.
      operationId: listAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TenantAgentItemList'
          description: Every TenantAgent.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
      summary: Lists every TenantAgent with its state, spend, and unattended grant.
      tags:
      - TenantAgents
  /api/v1/agents/{namespace}/{name}/unattended:
    put:
      description: |
        A true grant copies the object's current unattendedWrites, pinned to its UID. A later spec edit does not extend the grant. It needs tenantagents:unattended.
      operationId: putAgentUnattended
      parameters:
      - in: path
        name: namespace
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_TenantAgentUnattendedRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TenantAgentUnattendedResult'
          description: The grant after the change.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TenantAgentError'
          description: Nothing can be granted, because the object names no unattended
            writes.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Grants or revokes the unattended writes of one TenantAgent.
      tags:
      - TenantAgents
  /api/v1/assistant/approvals:
    get:
      operationId: listAssistantApprovals
      parameters:
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: session
        schema:
          type: string
      - in: query
        name: target_kind
        schema:
          type: string
      - in: query
        name: target_ref
        schema:
          type: string
      - description: all lists every approval and needs the admin verb.
        in: query
        name: scope
        schema:
          enum:
          - all
          type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantApprovalList'
          description: One page of approvals.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Lists approvals of the caller's sessions.
      tags:
      - Assistant
  /api/v1/assistant/approvals/{id}/approve:
    post:
      description: |
        The tool runs under the session context, with the approver's grants. A kill switch refuses the approval. The session resumes when every approval of it has its result.
      operationId: approveAssistantApproval
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantApprovalOutcome'
          description: The approval and the tool result.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The approval is not pending (assistant_busy), has expired (approval_expired),
            or the assistant is paused (kill_switch).
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Approves one write tool call and runs it as the approver.
      tags:
      - Assistant
  /api/v1/assistant/approvals/{id}/deny:
    post:
      operationId: denyAssistantApproval
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_AssistantDenyRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantApprovalOutcome'
          description: The approval and the denial result.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The approval is not pending (assistant_busy) or has expired
            (approval_expired).
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Denies one write tool call. Nothing runs.
      tags:
      - Assistant
  /api/v1/assistant/providers:
    get:
      operationId: listAssistantProviders
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantProviderList'
          description: The providers. The base URL is for admins only.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Lists the configured model providers and whether each can be called.
      tags:
      - Assistant
  /api/v1/assistant/sessions:
    get:
      operationId: listAssistantSessions
      parameters:
      - description: all lists every session and needs the admin verb.
        in: query
        name: scope
        schema:
          enum:
          - all
          type: string
      - in: query
        name: kind
        schema:
          type: string
      - in: query
        name: prompt
        schema:
          type: string
      - in: query
        name: tenant
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantSessionList'
          description: One page of sessions.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Lists the caller's assistant sessions, newest first.
      tags:
      - Assistant
    post:
      description: |
        Creates one session. The session runs when the gates pass. A session that a gate refuses is stored as skipped, with its skip reason. The context names what the session is about. The server adds the prompt id and the repository, and a client cannot set them.
      operationId: createAssistantSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_AssistantSessionCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantSession'
          description: The session, running or skipped.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The caller lacks the assistant use verb, or the prompt cannot
            start a session.
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is off for this user.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The user already runs the maximum number of sessions.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled, or a dependency is missing.
      summary: Starts an assistant session from a message or a fixed prompt.
      tags:
      - Assistant
  /api/v1/assistant/sessions/{id}:
    get:
      operationId: getAssistantSession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantSessionDetail'
          description: The session and its approvals.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Returns one session with its approvals and their results.
      tags:
      - Assistant
  /api/v1/assistant/sessions/{id}/cancel:
    post:
      operationId: cancelAssistantSession
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          description: The session is cancelled.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The session already ended.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Cancels a running or waiting session.
      tags:
      - Assistant
  /api/v1/assistant/sessions/{id}/events:
    get:
      description: |
        Sends every event after the cursor, then each new event. Each frame carries its sequence number as its id. The stream closes after a done event. The stream reads the ticket of the session scope, because a browser EventSource cannot set headers. A caller who is neither the session owner nor, for a Tenant agent session, a tenant reader, receives each tool_result frame with an empty content and withheld set to true. The frame keeps call_id and name.
      operationId: streamAssistantEvents
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: The last sequence number that the client read.
        in: query
        name: after
        schema:
          default: 0
          minimum: 0
          type: integer
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: The event stream.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Streams the transcript of one session as server-sent events.
      tags:
      - Assistant
      x-sse: true
      x-sse-events:
      - user
      - assistant
      - tool_call
      - tool_result
      - approval_requested
      - approval_resolved
      - error
      - done
  /api/v1/assistant/sessions/{id}/messages:
    post:
      operationId: postAssistantMessage
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_AssistantMessageRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantAcceptedState'
          description: The session runs again.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The session is not waiting, its budget is spent, or its key
            is not available.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Sends a message to a completed session and runs it again.
      tags:
      - Assistant
