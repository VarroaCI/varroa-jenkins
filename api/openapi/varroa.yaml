          enum:
          - controller
          - namespace
          - group
          - catalogitem
          - job
          - run
          - activity
          type: string
          x-enum-varnames:
          - ComponentsSchemasSearchResultTypeController
          - ComponentsSchemasSearchResultTypeNamespace
          - ComponentsSchemasSearchResultTypeGroup
          - ComponentsSchemasSearchResultTypeCatalogitem
          - ComponentsSchemasSearchResultTypeJob
          - ComponentsSchemasSearchResultTypeRun
          - ComponentsSchemasSearchResultTypeActivity
      required:
      - type
      - name
      - link
      type: object
    components_schemas_SizePreset:
      additionalProperties: false
      description: A size preset for provisioning defaults.
      properties:
        cpu:
          type: string
        memory:
          type: string
        name:
          type: string
        storage:
          type: string
      required:
      - name
      - cpu
      - memory
      - storage
      type: object
    components_schemas_SourceJSON:
      additionalProperties: false
      description: Observability source status.
      properties:
        error:
          type: string
        hints:
          additionalProperties:
            type: string
          type: object
        provider:
          type: string
        status:
          type: string
      required:
      - provider
      - status
      type: object
    components_schemas_StreamTicketResponse:
      additionalProperties: false
      description: Response from POST /stream/ticket.
      properties:
        expiresInSeconds:
          type: integer
        ticket:
          type: string
      required:
      - ticket
      - expiresInSeconds
      type: object
    components_schemas_SubjectRef:
      additionalProperties: false
      description: Reference to a subject by kind and name.
      properties:
        kind:
          description: Subject kind.
          enum:
          - Group
          - User
          type: string
        name:
          description: OIDC claim value (group name or user subject).
          type: string
      required:
      - kind
      - name
      type: object
    components_schemas_SummaryJSON:
      additionalProperties: false
      description: Observability summary.
      properties:
        recentBuilds:
          items:
            $ref: '#/components/schemas/components_schemas_RecentBuild'
          type: array
        runningBuilds:
          type: integer
        totalJobs:
          type: integer
      type: object
    components_schemas_SuspendBroodRequest:
      additionalProperties: false
      description: Request body to toggle suspend on a brood operation.
      properties:
        suspend:
          type: boolean
      required:
      - suspend
      type: object
    components_schemas_TemplateCatalogCondition:
      description: Status condition for catalog/composedbundle resources.
      properties:
        lastTransitionTime:
          type: string
        message:
          type: string
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - type
      - status
      type: object
    components_schemas_TenantAgent:
      properties:
        accepted:
          type: boolean
        cluster:
          type: string
        dayLimit:
          format: int64
          type: integer
        name:
          type: string
        namespace:
          type: string
        pendingApprovals:
          type: integer
        spec:
          $ref: '#/components/schemas/components_schemas_TenantAgentSpec'
        spendToday:
          format: int64
          type: integer
        status:
          properties:
            conditions:
              items:
                $ref: '#/components/schemas/components_schemas_TenantAgentCondition'
              type: array
            instructionsSHA:
              type: string
            lastSession:
              properties:
                at:
                  format: date-time
                  type: string
                id:
                  type: string
                state:
                  type: string
                trigger:
                  type: string
              type: object
            observedGeneration:
              format: int64
              type: integer
            spendToday:
              format: int64
              type: integer
          type: object
        tenant:
          type: string
      required:
      - namespace
      - name
      - tenant
      - cluster
      - spec
      - status
      - accepted
      - pendingApprovals
      - spendToday
      - dayLimit
      type: object
    components_schemas_TenantAgentCapabilities:
      properties:
        never:
          items:
            $ref: '#/components/schemas/components_schemas_TenantAgentCapability'
          type: array
        reads:
          items:
            $ref: '#/components/schemas/components_schemas_TenantAgentCapability'
          type: array
        unattended:
          items:
            $ref: '#/components/schemas/components_schemas_TenantAgentCapability'
          type: array
        writesByApproval:
          items:
            $ref: '#/components/schemas/components_schemas_TenantAgentCapability'
          type: array
      required:
      - reads
      - writesByApproval
      - unattended
      - never
      type: object
    components_schemas_TenantAgentCapability:
      properties:
        description:
          type: string
        kind:
          description: The tool class read or write, or the output kind note, issue,
            or webhook on an output tool.
          type: string
        name:
          type: string
      required:
      - name
      - description
      - kind
      type: object
    components_schemas_TenantAgentCondition:
      properties:
        lastTransitionTime:
          format: date-time
          type: string
        message:
          type: string
        observedGeneration:
          format: int64
          type: integer
        reason:
          type: string
        status:
          enum:
          - "True"
          - "False"
          - Unknown
          type: string
        type:
          type: string
      required:
      - type
      - status
      - reason
      - lastTransitionTime
      type: object
    components_schemas_TenantAgentError:
      additionalProperties: false
      description: A Tenant agent refusal. The code names the cause, and error gives
        the text.
      properties:
        code:
          enum:
          - tenant_agent_session
          - not_accepted
          - disabled
          - manual_not_enabled
          - nothing_to_grant
          type: string
        error:
          type: string
      required:
      - error
      - code
      type: object
    components_schemas_TenantAgentItem:
      properties:
        cluster:
          type: string
        conditions:
          description: The conditions whose status is not True.
          items:
            $ref: '#/components/schemas/components_schemas_TenantAgentCondition'
          type: array
        enabled:
          type: boolean
        failedToday:
          type: integer
        name:
          type: string
        namespace:
          type: string
        paused:
          allOf:
          - $ref: '#/components/schemas/components_schemas_TenantAgentPaused'
          nullable: true
        sessionsToday:
          type: integer
        spendToday:
          format: int64
          type: integer
        tenant:
          type: string
        unattendedGranted:
          items:
            type: string
          type: array
        unattendedRequested:
          items:
            type: string
          type: array
      required:
      - namespace
      - name
      - tenant
      - cluster
      - enabled
      - sessionsToday
      - spendToday
      - failedToday
      - conditions
      - unattendedRequested
      - unattendedGranted
      type: object
    components_schemas_TenantAgentItemList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_TenantAgentItem'
          type: array
      required:
      - items
      type: object
    components_schemas_TenantAgentPaused:
      properties:
        message:
          type: string
        reason:
          type: string
      required:
      - reason
      - message
      type: object
    components_schemas_TenantAgentRunRequest:
      properties:
        job:
          description: A job path under the Tenant. Empty names the whole Tenant.
          type: string
        run:
          description: A run id to note in the request.
          type: string
      type: object
    components_schemas_TenantAgentSession:
      allOf:
      - $ref: '#/components/schemas/components_schemas_AssistantSession'
      - properties:
          pendingApprovals:
            items:
              $ref: '#/components/schemas/components_schemas_AssistantApproval'
            type: array
        required:
        - pendingApprovals
        type: object
      description: One Tenant agent session. It carries the AssistantSession fields
        and its pending approvals.
      type: object
    components_schemas_TenantAgentSessionList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_TenantAgentSession'
          type: array
        nextCursor:
          type: string
      required:
      - items
      - nextCursor
      type: object
    components_schemas_TenantAgentSpec:
      description: The desired state of one TenantAgent. The acceptance rule picks
        the one object of a Tenant that runs.
      properties:
        budgets:
          properties:
            day:
              format: int64
              type: integer
            session:
              format: int64
              type: integer
          type: object
        dataSharing:
          enum:
          - none
          - metadata
          - logs
          type: string
        enabled:
          type: boolean
        instructions:
          properties:
            path:
              type: string
            source:
              type: string
          required:
          - source
          type: object
        model:
          type: string
        outputs:
          properties:
            issues:
              properties:
                forge:
                  type: string
                labels:
                  items:
                    type: string
                  type: array
                repo:
                  type: string
              required:
              - repo
              - forge
              type: object
            notes:
              type: boolean
            webhook:
              type: boolean
          type: object
        provider:
          type: string
        tenantRef:
          properties:
            name:
              type: string
          required:
          - name
          type: object
        triggers:
          items:
            properties:
              debounce:
                description: A Go duration, such as 10m.
                type: string
              type:
                enum:
                - run.failed
                - run.interrupted
                - cron.missed
                - signature.refused
                - scan.failed
                - lock.held
                - placement.moved
                - manual
                type: string
            required:
            - type
            type: object
          type: array
        unattendedWrites:
          items:
            type: string
          type: array
      required:
      - tenantRef
      type: object
    components_schemas_TenantAgentUnattendedRequest:
      additionalProperties: false
      properties:
        enabled:
          type: boolean
      required:
      - enabled
      type: object
    components_schemas_TenantAgentUnattendedResult:
      properties:
        enabled:
          type: boolean
        name:
          type: string
        namespace:
          type: string
        unattendedGranted:
          items:
            type: string
          type: array
      required:
      - namespace
      - name
      - enabled
      - unattendedGranted
      type: object
    components_schemas_TenantCapabilities:
      additionalProperties: false
      description: One grant the caller holds on one pipelines tenant. A tenant name
        may appear in more than one entry, because the caller can hold two grants
        on it with different job globs; they are never merged.
      properties:
        capabilities:
          $ref: '#/components/schemas/components_schemas_APICapabilitySet'
        jobs:
          description: Folder-relative job globs the grant covers. Always an array,
            never null; an empty array means every job.
          items:
            type: string
          type: array
        tenant:
          type: string
      required:
      - tenant
      - jobs
      - capabilities
      type: object
    components_schemas_TenantCell:
      additionalProperties: false
      description: The tenant's own view of the cell that hosts it. For the state
        notCellHosted only state is present. For the state unplaced every field other
        than state, reason, and warning is absent. The body carries no other tenant's
        name, job path, run, or count.
      properties:
        canOpenCell:
          description: True when the caller also holds the controller read grant on
            the cell. The hint gates no other field of this body.
          type: boolean
        cell:
          type: string
        cellPool:
          type: string
        cluster:
          type: string
        failedLast24h:
          format: int64
          type: integer
        freeSlots:
          format: int32
          type: integer
        jenkinsVersion:
          type: string
        jobs:
          format: int64
          type: integer
        members:
          description: 'One entry for each member of the tenant, ordered by role:
            active members by ascending slot first, then standbys by cell name. It
            is absent for unplaced and notCellHosted. Every other field of this body
            describes the tenant''s slot 0.'
          items:
            $ref: '#/components/schemas/components_schemas_TenantCellMember'
          type: array
        namespace:
          type: string
        otherTenantCount:
          description: The number of other tenants on the cell. It is a count, never
            a list.
          format: int32
          type: integer
        profile:
          type: string
        queueLength:
          format: int64
          type: integer
        reason:
          description: The Tenant's Placed condition reason, verbatim.
          type: string
        runningNow:
          format: int64
          type: integer
        runsLast24h:
          format: int64
          type: integer
        state:
          enum:
          - placed
          - moving
          - rehydrating
          - unplaced
          - notCellHosted
          type: string
        warning:
          $ref: '#/components/schemas/components_schemas_TenantCellWarning'
      required:
      - state
      - canOpenCell
      type: object
    components_schemas_TenantCellMember:
      additionalProperties: false
      description: One member of the tenant, with that member's own four load counts.
        The counts apply the same grant narrowing the top-level counts apply. No entry
        names another tenant.
      properties:
        cell:
          type: string
        cluster:
          type: string
        failedLast24h:
          format: int64
          type: integer
        jobs:
          format: int64
          type: integer
        namespace:
          type: string
        role:
          description: '"slot <n>" for an active member and "standby" for a standby.'
          type: string
        runningNow:
          format: int64
          type: integer
        runsLast24h:
          format: int64
          type: integer
      required:
      - cell
      - namespace
      - cluster
      - role
      - runningNow
      - runsLast24h
      - failedLast24h
      - jobs
      type: object
    components_schemas_TenantCellWarning:
      additionalProperties: false
      description: The Tenant's TenantWarnings condition, verbatim, while its status
        is True. It is absent otherwise.
      properties:
        message:
          description: The warning message, which names the fault.
          type: string
        reason:
          description: The warning reason. One of ItemsHeld, ItemsApplyFailed, BundleKeysIgnored,
            PodTemplateSkipped, CredentialSkipped, HibernationIgnored, or BranchScanFailed.
          type: string
      required:
      - reason
      - message
      type: object
    components_schemas_TenantConcurrencyLimit:
      additionalProperties: false
      description: A cap on the builds of a named set of jobs that run at once.
      properties:
        jobs:
          description: Folder-relative job globs (*, **, ?).
          items:
            maxLength: 512
            minLength: 1
            pattern: ^[^/]
            type: string
          maxItems: 64
          minItems: 1
          type: array
        max:
          description: Number of builds the set runs at one time.
          format: int32
          maximum: 1000
          minimum: 1
          type: integer
        name:
          description: Name of the limit, a DNS label. The queue and the run views
            show it.
          maxLength: 63
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
          type: string
      required:
      - name
      - jobs
      - max
      type: object
    components_schemas_TenantCondition:
      additionalProperties: false
      description: Status condition for a Tenant.
      properties:
        lastTransitionTime:
          description: ISO 8601 last transition time.
          type: string
        message:
          type: string
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - type
      - status
      type: object
    components_schemas_TenantEntry:
      additionalProperties: false
      description: Full tenant object returned from get/list operations.
      properties:
        bindingRef:
          description: Reference to the managed VarroaRoleBinding.
          type: string
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_TenantCondition'
          type: array
        displayName:
          type: string
        groupRef:
          description: Reference to the managed VarroaRoleBinding group.
          type: string
        members:
          items:
            type: string
          type: array
        name:
          type: string
        namespaceStates:
          items:
            $ref: '#/components/schemas/components_schemas_TenantNamespaceState'
          type: array
        namespaces:
          items:
            type: string
          type: array
        observedGeneration:
          format: int64
          type: integer
        pipelines:
          $ref: '#/components/schemas/components_schemas_TenantPipelines'
        placement:
          $ref: '#/components/schemas/components_schemas_TenantPlacement'
        provisionNamespaces:
          type: boolean
        rehydration:
          $ref: '#/components/schemas/components_schemas_TenantRehydration'
        roleRef:
          type: string
        subjects:
          items:
            $ref: '#/components/schemas/components_schemas_SubjectRef'
          type: array
      required:
      - name
      - namespaces
      type: object
    components_schemas_TenantExport:
      additionalProperties: false
      description: 'One grant a pipelines tenant makes to other tenants: a job pattern
        or a list of lock patterns, plus the callers allowed to use it. Exactly one
        of job or locks is set.'
      properties:
        callers:
          description: Tenant names allowed to use this export.
          items:
            type: string
          minItems: 1
          type: array
        job:
          description: Folder-relative job glob this tenant exports. Exactly one of
            job or locks is set.
          type: string
        locks:
          description: Globs over the bare names of this tenant's own locks. Exactly
            one of job or locks is set.
          items:
            type: string
          type: array
      required:
      - callers
      type: object
    components_schemas_TenantJobRetention:
      additionalProperties: false
      description: A run window for the jobs that match a folder-relative glob.
      properties:
        job:
          description: Folder-relative job glob. It must not start with /.
          maxLength: 512
          minLength: 1
          pattern: ^[^/]
          type: string
        runs:
          description: The job window, in whole days, such as 7d.
          pattern: ^([1-9][0-9]{0,2}|[1-2][0-9]{3}|3[0-5][0-9]{2}|36[0-4][0-9]|3650)d$
          type: string
      required:
      - job
      - runs
      type: object
    components_schemas_TenantMember:
      additionalProperties: false
      description: 'One member of a pipelines tenant (status.placement.members). Response-only:
        the placement pass is its only writer.'
      properties:
        applied:
          description: True when the member's cell reports this tenant applied.
          type: boolean
        cell:
          description: Name of the cell Controller that holds this member.
          type: string
        cellNamespace:
          description: Namespace of that cell Controller.
          type: string
        role:
          description: An active member holds one slot. A standby holds the folder,
            holds no slot, and runs no build.
          enum:
          - active
          - standby
          type: string
        slot:
          description: The slot index. Set only on an active member.
          format: int32
          type: integer
      type: object
    components_schemas_TenantNamespaceState:
      additionalProperties: false
      description: State of a single namespace for a Tenant.
      properties:
        name:
          type: string
        state:
          type: string
      required:
      - name
      - state
      type: object
    components_schemas_TenantNotifications:
      additionalProperties: false
      description: Outward notifications of a pipelines tenant. The record store posts
        the completion webhook for each run.
      properties:
        webhook:
          $ref: '#/components/schemas/components_schemas_TenantWebhook'
      type: object
    components_schemas_TenantPipelines:
      additionalProperties: false
      description: 'A Tenant''s pipelines tenancy declaration (spec.pipelines). A
        Tenant that sets this becomes a pipelines tenant: one top-level folder on
        exactly one cell.'
      properties:
        agentNamespace:
          description: Kubernetes namespace this tenant's agents run in. Must be one
            of the tenant's own namespaces. Required when pipelines is set.
          minLength: 1
          type: string
        cellPool:
          description: 'The CellPool the placement pass selects a cell from. Empty
            means the profile''s default pool: the pool whose name equals profile.
            A tenant that needs a cell of its own names a pool whose maxTenantsPerCell
            is 1.'
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        concurrency:
          description: This tenant's job concurrency policy. "allow" (default) runs
            builds side by side. "cancelInProgress" cancels the running build of the
            same job path when a new one starts.
          enum:
          - allow
          - cancelInProgress
          type: string
        concurrencyLimits:
          description: Named caps on how many builds of a set of this tenant's jobs
            run at one time. A build over a limit waits in the queue. A tenant pipelines
            admin may write this field.
          items:
            $ref: '#/components/schemas/components_schemas_TenantConcurrencyLimit'
          maxItems: 32
          type: array
        cronBackstop:
          description: Turns the backstop cron scheduler on for this tenant. Default
            true.
          type: boolean
        cronCatchUp:
          description: How many missed cron occurrences the backstop fires on wake.
            "one" (default) fires the newest missed occurrence. "none" fires nothing.
          enum:
          - one
          - none
          type: string
        cronGrace:
          description: How long the backstop waits past a missed cron occurrence before
            it fires. Default 5m, range 1m to 60m.
          type: string
        exports:
          description: Grants of this tenant's jobs and locks to other tenants. An
            absent list exports nothing.
          items:
            $ref: '#/components/schemas/components_schemas_TenantExport'
          type: array
        interruptedRetry:
          description: Whether an interrupted run retries on its own. "manual" (default)
            leaves the retry to a user. "automatic" retries once.
          enum:
          - manual
          - automatic
          type: string
        members:
          description: The number of active slots this tenant runs. Each slot holds
            one cell, and a job runs only on its home slot's holder. Default 1. This
            field is not spec.members, which lists local usernames.
          format: int32
          maximum: 16
          minimum: 1
          type: integer
        notifications:
          $ref: '#/components/schemas/components_schemas_TenantNotifications'
        profile:
          description: JenkinsVersionProfile the placement pass resolves a cell against.
            Required when pipelines is set.
          minLength: 1
          type: string
        rehydrateBuilds:
          description: How many of a job's newest completed builds the operator seeds
            when this tenant's cell changes. The newest successful build is always
            seeded in addition. Default 10.
          format: int32
          maximum: 100
          minimum: 0
          type: integer
        rehydrateDeadline:
          description: How long the operator keeps retrying a deferred rehydration
            seed before it stops and reports RehydrationFailed. Default 30m, range
            1m to 24h.
          type: string
        retention:
          $ref: '#/components/schemas/components_schemas_TenantPipelinesRetention'
        standby:
          description: The number of warm members this tenant keeps. A standby holds
            the folder and no slot. It takes a slot whose holder dies. Default 0.
          format: int32
          maximum: 8
          minimum: 0
          type: integer
      required:
      - profile
      - agentNamespace
      type: object
    components_schemas_TenantPipelinesRetention:
      additionalProperties: false
      description: Record-store windows for this tenant's runs. A job rule replaces
        the tenant window for the jobs it matches. The store-wide window caps both.
        Only an operator may set it.
      properties:
        jobs:
          description: Per-job windows. The first rule whose job glob matches sets
            the window of that job.
          items:
            $ref: '#/components/schemas/components_schemas_TenantJobRetention'
          maxItems: 64
          type: array
        runs:
          description: The tenant window, in whole days, such as 30d. It shortens
            the store-wide window and never lengthens it.
          pattern: ^([1-9][0-9]{0,2}|[1-2][0-9]{3}|3[0-5][0-9]{2}|36[0-4][0-9]|3650)d$
          type: string
      type: object
    components_schemas_TenantPlacement:
      additionalProperties: false
      description: 'The cell a pipelines tenant is bound to (status.placement). Response-only:
        the placement pass is its only writer.'
      properties:
        cell:
          description: Name of the bound cell Controller.
          type: string
        cellNamespace:
          description: Namespace of the bound cell Controller.
          type: string
        cluster:
          description: Cluster the bound cell runs in.
          type: string
        generation:
          description: Increases only when the bound cell changes.
          format: int64
          type: integer
        members:
          description: Every member of this tenant. The scalar fields above keep describing
            slot 0.
          items:
            $ref: '#/components/schemas/components_schemas_TenantMember'
          type: array
      type: object
    components_schemas_TenantRehydration:
      additionalProperties: false
      description: 'A pipelines tenant''s build-record rehydration state (status.rehydration).
        Response-only: TenantReconciler is its only writer.'
      properties:
        attempts:
          description: Rehydration retries since the last applied bundle.
          format: int32
          type: integer
        cellInstance:
          description: Cell pod UID this state was built for.
          type: string
        deferred:
          description: Job paths the mite could not seed on the last apply, because
            the job did not exist yet.
          items:
            type: string
          type: array
        generation:
          description: Placement generation this state was built for.
          format: int64
          type: integer
        lastAttempt:
          description: When the operator last sent a rehydration bundle for this tenant.
          format: date-time
          type: string
        records:
          description: Number of thin build records the last bundle carried.
          format: int32
          type: integer
        truncated:
          description: True when the last bundle dropped changelogs or older records
            to fit the byte budget.
          type: boolean
        unseededJobs:
          description: Number of jobs no bundle has covered yet.
          format: int32
          type: integer
      type: object
    components_schemas_TenantRequest:
      additionalProperties: false
      description: Request body for creating or updating a tenant.
      properties:
        displayName:
          type: string
        members:
          description: Direct member usernames.
          items:
            type: string
          type: array
        name:
          description: Tenant name (ignored in body for updates).
          type: string
        namespaces:
          description: Target namespaces for this tenant.
          items:
            type: string
          type: array
        pipelines:
          $ref: '#/components/schemas/components_schemas_TenantPipelines'
        provisionNamespaces:
          description: Whether to auto-provision namespaces.
          type: boolean
        roleRef:
          description: Name of a VarroaRole to bind. Must not be "admin".
          type: string
        subjects:
          description: OIDC subject references.
          items:
            $ref: '#/components/schemas/components_schemas_SubjectRef'
          type: array
      required:
      - name
      - namespaces
      type: object
    components_schemas_TenantScope:
      additionalProperties: false
      description: One pipelines tenant name and the folder-relative job globs a binding
        covers. An absent jobs list covers every job.
      properties:
        jobs:
          description: Jobs are folder-relative globs. An absent jobs list covers
            every job.
          items:
            maxLength: 512
            type: string
          maxItems: 64
          type: array
        name:
          description: A tenant is a Tenant name.
          maxLength: 253
          type: string
      required:
      - name
      type: object
    components_schemas_TenantWebhook:
      additionalProperties: false
      description: A completion webhook. The record store posts a signed JSON payload
        to url for each run this tenant completes. The signing key lives in the Secret
        that secretRef names, in the tenant's agent namespace.
      properties:
        secretRef:
          $ref: '#/components/schemas/components_schemas_TenantWebhookSecret'
