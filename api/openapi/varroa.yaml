            $ref: '#/components/schemas/components_schemas_SizePreset'
          type: array
        versions:
          items:
            $ref: '#/components/schemas/components_schemas_VersionCatalogEntry'
          type: array
      required:
      - rootDomain
      - dashboardHost
      - defaultNamespace
      - namespaces
      - defaultVersion
      - versions
      - sizePresets
      - injectedVariables
      type: object
    components_schemas_ProvisioningDefaults:
