  /api/v1/pipelines/{tenant}/markers/validate:
    post:
      description: |
        Resolves {tenant} onto its delivered pipeline-template set (design pipeline-marker-file) and validates the posted marker text against it. Contacts no cell and no record store, so it works while a cell is down and while the record store is disabled.
      operationId: validatePipelineMarker
