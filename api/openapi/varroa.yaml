    PipelineJobDetail:
      additionalProperties: false
      description: GET /pipelines/{tenant}/jobs/{job}.
      properties:
        definition:
          $ref: '#/components/schemas/components_schemas_PipelineDefinition'
        dependencies:
          $ref: '#/components/schemas/components_schemas_PipelineDependencies'
        durationTrendMs:
          items:
            format: int64
            type: integer
          type: array
        health:
          enum:
          - clear
          - cloudy
          - rain
          - unknown
          type: string
        jobPath:
          type: string
        kind:
          description: |
            The job's kind. A declared pipeline, multibranch, or organization folder item sets it. Otherwise a child of a multibranch job or of a project the inventory reports is a branch, and a project the inventory reports is a multibranch job. A run alone marks a pipeline job.
          enum:
          - pipeline
          - multibranch
          - organizationFolder
          - branch
          - unknown
          type: string
        last30Days:
          allOf:
          - $ref: '#/components/schemas/components_schemas_PipelineLast30Days'
          description: |
            Null when the record store could not answer the window query; the rest of the job page still renders.
          nullable: true
        lastBuild:
          $ref: '#/components/schemas/components_schemas_RunSummary'
        parameters:
          items:
            $ref: '#/components/schemas/components_schemas_PipelineParameter'
          type: array
        pending:
          description: |
            True when every tenant that declares this job reports a complete job list that lacks it. False when a declaring tenant has an unknown inventory, when a declaring tenant holds the job, when the job has a run, and when no tenant declares the job.
          type: boolean
        template:
          allOf:
          - $ref: '#/components/schemas/components_schemas_PipelineTemplateInfo'
          description: Absent for a job with no catalog template (a Jenkinsfile job).
        tenant:
          description: |
            The tenant noun the server authorizes against, from TenantRef.Tenant: a Tenant name for a Tenant tenant, or "<namespace>/<controller>" for a synthetic tenant.
          type: string
        tenantFolder:
          description: |
            The tenant's Jenkins folder prefix, from TenantRef.Folder. Empty for a root-hosted tenant.
          type: string
        triggers:
          $ref: '#/components/schemas/components_schemas_PipelineTriggers'
        waiting:
          description: Queued runs of this job that a concurrency cap holds. Absent
            when none waits.
          items:
            $ref: '#/components/schemas/components_schemas_RunWaitEntry'
          maxItems: 50
          type: array
      required:
      - jobPath
      - kind
      - pending
      - health
      - last30Days
      - tenantFolder
      - tenant
      - dependencies
      type: object
    PipelineListResponse:
      additionalProperties: false
