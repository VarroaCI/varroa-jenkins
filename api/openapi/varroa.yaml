        credentialId:
          type: string
        forge:
          enum:
          - github
          - gitea
          type: string
        repo:
          type: string
        sessionId:
          type: string
        state:
          type: string
      required:
      - sessionId
      - state
      - repo
      - forge
      - baseBranch
      - credentialId
      type: object
    components_schemas_ProvisioningConfig:
      additionalProperties: false
