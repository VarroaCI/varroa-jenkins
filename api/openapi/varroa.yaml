      type: object
    components_schemas_ProvisioningDefaultsSpec:
      additionalProperties: false
      description: Spec for ProvisioningDefaults CRD.
      properties:
        broodPolicy:
          $ref: '#/components/schemas/components_schemas_BroodPolicy'
        commandDeadlineSec:
          type: integer
        defaultCPU:
          type: string
        defaultMemory:
          type: string
        defaultNamespace:
          type: string
        defaultReconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        defaultStorage:
          type: string
        defaultVersion:
          type: string
        imagePullSecrets:
          items:
            type: string
          type: array
        ingressAnnotations:
          additionalProperties:
            type: string
          type: object
        ingressClassName:
          type: string
        liveFingerprintIntervalSec:
          type: integer
        namespaces:
          items:
            type: string
          type: array
        pluginInfoURL:
          type: string
        pluginUpdateCenterDownloadURL:
          type: string
        pluginUpdateCenterURL:
          type: string
        provisioningTimeoutSec:
          type: integer
        rootDomain:
          type: string
        sizePresets:
          items:
            $ref: '#/components/schemas/components_schemas_SizePreset'
          type: array
        storageClass:
          type: string
        storageSizeGB:
          type: integer
      type: object
    components_schemas_ProvisioningDefaultsStatus:
      description: Observed state of ProvisioningDefaults.
      properties:
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_ProvisioningDefaultsCondition'
          type: array
      type: object
    components_schemas_RBACGroupBinding:
      additionalProperties: false
      description: A single OIDC group-to-role binding.
      properties:
        name:
          description: The OIDC group claim value.
          type: string
        role:
          description: Built-in Varroa role short name.
          enum:
          - admin
          - operator
          - developer
          - viewer
          type: string
      required:
      - name
      - role
      type: object
    components_schemas_RBACSpec:
      additionalProperties: false
