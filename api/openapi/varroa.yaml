        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "502":
          $ref: '#/components/responses/components_responses_ClusterUnreachable'
      summary: Gets one cell pool's spec and status from the named cluster, or from
        the BFF's own cluster when no cluster is named. Requires the cellpools:read
        verb on a cluster-wide binding.
      tags:
      - CellPools
    patch:
      operationId: patchCellPool
      parameters:
      - $ref: '#/components/parameters/components_parameters_name'
      - $ref: '#/components/parameters/components_parameters_clusterQuery'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_CellPoolScaleRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_CellPool'
          description: Cell pool updated.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          $ref: '#/components/responses/components_responses_Conflict'
        "502":
          $ref: '#/components/responses/components_responses_ClusterUnreachable'
      summary: Scales a cell pool. The body carries only the four scale dials; a body
        naming profileRef or cellTemplate is refused with 400. The write goes to the
        pool of the named cluster, or of the BFF's own cluster when no cluster is
        named. Requires the cellpools:update verb on a cluster-wide binding.
      tags:
      - CellPools
  /api/v1/cells/{namespace}/{name}/grants:
    get:
      description: |
        Applies two gates. It applies the controller read check on the cell, exactly as the usage reads do. It then applies rolebindings:read on the caller's cluster-wide capability partition. It answers 404 for an unknown controller, a controller that is not a cell, and a caller the controller read check refuses. It answers 403 when the controller check passes and the caller holds no rolebindings:read. The read is resolver backed, so it touches no record store and answers no 503.
      operationId: getCellGrants
      parameters:
      - description: The cell's namespace.
        in: path
        name: namespace
        required: true
        schema:
          type: string
      - description: The cell's name.
        in: path
        name: name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/components_parameters_clusterQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_CellGrants'
          description: The grants of each tenant.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
      summary: Returns the grants that reach each tenant of one cell.
      tags:
      - Cells
  /api/v1/cells/{namespace}/{name}/usage:
    get:
      description: |
        Answers 404 for an unknown controller, a controller that is not a cell, and a caller the controller read check refuses. One code for all three keeps the surface from confirming that a cell exists. maxTenants is a first-match chain: the cell's own spec.cell.maxTenants when that value is not zero, else the owning pool's maxTenantsPerCell, else the chart value, else ten. It is never a minimum over the tiers.
      operationId: getCellUsage
      parameters:
      - description: The cell's namespace.
        in: path
        name: namespace
        required: true
        schema:
          type: string
      - description: The cell's name.
        in: path
        name: name
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/components_parameters_clusterQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_CellUsage'
          description: The cell's load.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Returns one cell's load, tenant by tenant.
      tags:
      - Cells
  /api/v1/cells/usage:
    get:
      description: |
        Gates each cell with the controller read check and drops a cell the check refuses. The counts come from the record store over a fixed 24-hour window. A run whose result is TRIGGER_FAILED counts in no value, and a tenant that left the cell contributes no count to it.
      operationId: listCellUsage
      parameters:
      - $ref: '#/components/parameters/components_parameters_clusterQuery'
      - $ref: '#/components/parameters/components_parameters_namespace'
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/components_schemas_CellUsage'
                    type: array
                required:
                - items
                type: object
          description: Cell usage list (items envelope).
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists the load of every cell the caller may read in one cluster.
      tags:
      - Cells
