    TestCaseHistoryResponse:
      additionalProperties: false
      description: |
        GET /pipelines/{team}/jobs/{job}/tests/{case}. items holds the case's recent outcomes, newest first, within the record store retention window. The response holds no rate, no trend, and no flake score.
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_TestCaseOutcome'
          type: array
      required:
      - items
      type: object
    TestCaseOutcome:
      additionalProperties: false
      description: |
        One outcome of one test case in one run of the job. A row names its own suite, because two suites can report one class and one name.
      properties:
        buildNumber:
          format: int64
          type: integer
        createdAt:
          description: The creation time of the run.
          format: date-time
          type: string
        durationMs:
          description: The case's duration in milliseconds. Absent when the case reports
            no duration.
          format: int64
          type: integer
        errorDetails:
          description: |
            The case's error detail text, cut at 512 bytes. Absent when the case carries no error detail.
          type: string
        result:
          description: The run's own result. Absent when the run holds no result.
          type: string
        runId:
          type: string
        runLink:
          description: |
            The run's own page path, /pipelines/{team}/{jobPath}/{runId}, the same link a fleet lock row carries.
          type: string
        status:
          description: |
            The reporter's own status name. A skipped case carries SKIPPED.
          type: string
        suite:
          type: string
      required:
      - runId
      - suite
      - status
      - createdAt
      - runLink
      type: object
    TokenResponse:
      additionalProperties: false
      properties:
        token:
          description: The new API key token (shown once).
