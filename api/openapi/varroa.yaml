    PipelineSummary:
      additionalProperties: false
      description: |
        One job's run-history summary for the Pipelines table. A job that has never run carries no lastBuild.
      properties:
        durationTrendMs:
          description: The most recent runs' duration, newest first.
          items:
            format: int64
            type: integer
          type: array
        health:
          description: |
            The weather glyph, computed from the last five runs: clear when all passed, cloudy when one or two failed, rain when three or more failed, unknown for a job that has never run.
          enum:
          - clear
          - cloudy
          - rain
          - unknown
          type: string
        jobPath:
          type: string
        kind:
          description: |
            The job's kind. A declared pipeline, multibranch, or organization folder item sets it. Otherwise a child of a multibranch job or of a project the inventory reports is a branch, and a project the inventory reports is a multibranch job. A run alone marks a pipeline job. Any other job reports unknown.
          enum:
          - pipeline
          - multibranch
          - organizationFolder
          - branch
          - unknown
          type: string
        lastBuild:
          $ref: '#/components/schemas/components_schemas_RunSummary'
        medianQueueWaitMs:
          description: |
            The median wait between a build's queued moment and its started moment, in milliseconds, over the trailing 30 days. Absent when the job started no build in that window.
          format: int64
          type: integer
        pending:
          description: |
            True when every tenant that declares this job reports a complete job list that lacks it. False when a declaring tenant has an unknown inventory, when a declaring tenant holds the job, when the job has a run, and when no tenant declares the job.
          type: boolean
      required:
      - jobPath
      - health
      - kind
      - pending
      type: object
