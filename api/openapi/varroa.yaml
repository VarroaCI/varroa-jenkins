        versionDrift:
          items:
            $ref: '#/components/schemas/components_schemas_PluginInventoryDriftEntry'
          type: array
      required:
      - hash
      - source
      - stale
      - degraded
      - bootstrapApproximate
      - optionalEdgesDropped
      - truncated
      - total
      - driftTruncated
      - pendingCollect
      type: object
    components_schemas_PluginSpec:
      additionalProperties: false
      description: Plugin policy and entries (transcribed from v1alpha1.PluginSpec).
      properties:
        entries:
          description: Plugins with pinned versions.
          items:
            $ref: '#/components/schemas/components_schemas_PluginEntry'
          type: array
        policy:
          description: Policy for plugin management (e.g. "pinned").
          type: string
      type: object
    components_schemas_PodOverrides:
      additionalProperties: false
      description: Typed pod-scoped customizations (transcribed from v1alpha1.PodOverrides).
      properties:
        affinity:
          description: Pod scheduling affinity.
          type: object
        annotations:
          additionalProperties:
            type: string
          description: Annotations added to the StatefulSet metadata.
          type: object
        env:
          description: Environment variables added or overridden on the jenkins container
            (merged by name).
          items:
            type: object
          type: array
        envFrom:
          description: envFrom sources added to the jenkins container.
          items:
            type: object
          type: array
        jvmOpts:
          description: JVM options appended (space-joined) to the baseline JAVA_OPTS
            value.
          type: string
        labels:
          additionalProperties:
            type: string
          description: Labels added to the StatefulSet metadata.
          type: object
        nodeSelector:
          additionalProperties:
            type: string
          description: Pod nodeSelector constraints.
          type: object
        podAnnotations:
          additionalProperties:
            type: string
          description: Annotations added to the pod template metadata.
          type: object
        podLabels:
          additionalProperties:
            type: string
          description: Labels added to the pod template metadata.
          type: object
        securityContext:
          description: Pod-level security context.
          type: object
        tolerations:
          description: Pod tolerations.
          items:
            type: object
          type: array
        volumeMounts:
          description: Volume mounts added to the jenkins container (merged by name).
          items:
            type: object
          type: array
        volumes:
          description: Pod volumes (merged by name).
          items:
            type: object
          type: array
      type: object
    components_schemas_Preferences:
      additionalProperties: false
      description: User UI preferences.
      properties:
        accent:
          type: string
        defaultLanding:
          type: string
        theme:
          type: string
      type: object
    components_schemas_PreviewRequest:
      additionalProperties: false
      description: Request body for POST /controllers/{ns}/{name}/preview.
      properties:
        baseline:
          description: '"live" (default) or "base".'
          type: string
        podOverrides:
          type: object
        resourceOverlay:
          type: object
      type: object
    components_schemas_PreviewResponse:
      additionalProperties: false
      description: Response from a controller preview operation.
      properties:
        baselineUsed:
          type: string
        diff:
          additionalProperties:
            type: string
          description: Map of resource type to diff output.
          type: object
        merged:
          additionalProperties:
            type: string
          description: Map of resource type to merged YAML.
          type: object
        warnings:
          items:
            $ref: '#/components/schemas/components_schemas_WarningItem'
          nullable: true
          type: array
      type: object
    components_schemas_ProbeSpec:
      additionalProperties: false
      description: Curated probe timing knobs (transcribed from corev1.Probe subset).
      properties:
        disabled:
          description: Removes this probe entirely. Default false (probe enabled with
            defaults).
          type: boolean
        failureThreshold:
          description: Minimum consecutive failures for the probe to be considered
            failed.
          type: integer
        initialDelaySeconds:
          description: Number of seconds before the first probe attempt.
          type: integer
        periodSeconds:
          description: How often (in seconds) to perform the probe.
          type: integer
        successThreshold:
          description: Minimum consecutive successes for the probe to be considered
            successful.
          type: integer
        timeoutSeconds:
          description: Number of seconds after which the probe times out.
          type: integer
      type: object
    components_schemas_ProbesSpec:
      additionalProperties: false
      description: Health probe tuning (transcribed from v1alpha1.ProbesSpec).
      properties:
        liveness:
          $ref: '#/components/schemas/components_schemas_ProbeSpec'
        readiness:
          $ref: '#/components/schemas/components_schemas_ProbeSpec'
        startup:
          $ref: '#/components/schemas/components_schemas_ProbeSpec'
      type: object
    components_schemas_ProfileCandidate:
      additionalProperties: true
      description: A ProfileCandidate CRD (cluster-scoped) — a discovered upstream
