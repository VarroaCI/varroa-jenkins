  /api/v1/version-candidates/{name}/promote:
    post:
      description: |
        Advances the candidate's JenkinsVersionProfile to the candidate's resolved version and closure content, then supersedes every other open candidate for the same profile. Requires the candidate to be in the Ready phase; every write in the sequence is resourceVersion-scoped, and a concurrent modification aborts the whole promotion with 409.
      operationId: promoteVersionCandidate
      parameters:
      - $ref: '#/components/parameters/components_parameters_name'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ProfileCandidate'
          description: Candidate promoted.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "405":
          $ref: '#/components/responses/components_responses_MethodNotAllowed'
        "409":
          $ref: '#/components/responses/components_responses_Conflict'
        "500":
          $ref: '#/components/responses/components_responses_Internal'
      summary: Promote an upgrade candidate.
      tags:
      - upgrade-tracking
