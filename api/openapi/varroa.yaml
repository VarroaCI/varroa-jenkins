components:
  parameters:
    cluster:
      description: Cluster name (DNS-1123 label).
      in: path
      name: cluster
      required: true
      schema:
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
    clusterQuery:
      description: Cluster name filter for aggregated list.
      in: query
      name: cluster
      schema:
        type: string
    components_parameters_artifactPath:
      description: |
        Multi-segment artifact path, exactly as run_artifacts.path stored it.
      in: path
      name: path
      required: true
      schema:
        type: string
    components_parameters_case:
      description: |
        Percent-encoded test case key, one path segment. The key is the caseKey value that GET /runs/{run}/tests returns. Encode the whole key again, because the key holds a literal "/". The router reads it with PathValue, which returns the decoded value.
      in: path
      name: case
      required: true
      schema:
        type: string
    components_parameters_cluster:
      description: Cluster name (DNS-1123 label).
      in: path
      name: cluster
      required: true
      schema:
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
    components_parameters_clusterQuery:
      description: Cluster name filter for aggregated list.
      in: query
      name: cluster
      schema:
        type: string
    components_parameters_force:
      description: Force the update, overriding SSA field-ownership conflicts.
      in: query
      name: force
      schema:
        type: boolean
    components_parameters_input:
      description: |
        Percent-encoded input step identifier, one path segment. The router reads it with PathValue, which returns the decoded value.
      in: path
      name: input
      required: true
      schema:
        type: string
    components_parameters_job:
      description: |
        Percent-encoded job path, one path segment. The router reads it with PathValue, which returns the decoded value, so the job path's slashes reach the handler intact.
      in: path
      name: job
      required: true
      schema:
        type: string
    components_parameters_name:
      description: Resource name.
      in: path
      name: name
      required: true
      schema:
        type: string
    components_parameters_namespace:
      description: Namespace filter (optional).
      in: query
      name: namespace
      schema:
        type: string
    components_parameters_ns:
      description: Controller namespace.
      in: path
      name: ns
      required: true
      schema:
        type: string
    components_parameters_prefix:
      description: API key prefix (first 7 characters).
      in: path
      name: prefix
      required: true
      schema:
        type: string
    components_parameters_run:
      description: Run identifier, a UUIDv7 string.
      in: path
      name: run
      required: true
      schema:
        format: uuid
        type: string
    components_parameters_tenant:
      description: |
        Tenant or controller name that addresses one pipelines tenant.
      in: path
      name: tenant
      required: true
      schema:
        type: string
    components_parameters_tenantQuery:
      description: Tenant name filter for the runner list.
      in: query
      name: tenant
      schema:
        type: string
    name:
      description: Resource name.
      in: path
      name: name
      required: true
      schema:
        type: string
    namespace:
      description: Namespace filter (optional).
      in: query
      name: namespace
      schema:
        type: string
    ns:
      description: Controller namespace.
      in: path
      name: ns
      required: true
      schema:
        type: string
    prefix:
      description: API key prefix (first 7 characters).
      in: path
      name: prefix
      required: true
      schema:
        type: string
  responses:
    ApproveConflict:
      $ref: '#/components/responses/components_responses_ApproveConflict'
    BadRequest:
      $ref: '#/components/responses/components_responses_BadRequest'
    Conflict:
      $ref: '#/components/responses/components_responses_Conflict'
    Forbidden:
      $ref: '#/components/responses/components_responses_Forbidden'
    Internal:
      $ref: '#/components/responses/components_responses_Internal'
    MethodNotAllowed:
      $ref: '#/components/responses/components_responses_MethodNotAllowed'
    NotFound:
      $ref: '#/components/responses/components_responses_NotFound'
    Unauthorized:
      $ref: '#/components/responses/components_responses_Unauthorized'
    components_responses_ApproveConflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_ApproveConflict'
      description: Conflict — no pending restart, no pending plugin roll, the pending
        change is not the one the caller approved, or the pending plugin roll changed
        after it was read.
    components_responses_BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Bad request — invalid body, missing required fields, or validation
        failure.
    components_responses_ClusterUnreachable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Target cluster unreachable over the bus.
    components_responses_Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Conflict — resource state prevents the operation (e.g. no pending
        approval).
    components_responses_Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Forbidden — authenticated but insufficient permissions.
    components_responses_Internal:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Internal server error.
    components_responses_MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Method not allowed on this endpoint.
    components_responses_NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Resource not found.
    components_responses_NotImplemented:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Not implemented.
    components_responses_ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: |
        The upstream data source is temporarily unavailable (search sources, or the build record store when it is disabled or its schema is too old).
    components_responses_Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Not authenticated — missing or invalid bearer token.
  schemas:
    APIRule:
      additionalProperties: false
      description: An API rule defining resource access.
      properties:
        resources:
          items:
            type: string
          type: array
        verbs:
          items:
            type: string
          type: array
      required:
      - resources
      - verbs
      type: object
    ActivityEvent:
      additionalProperties: false
      description: A single activity feed event.
      properties:
        actor:
          type: string
        buildNumber:
          format: int64
          type: integer
        cluster:
          type: string
        controller:
          type: string
        itemPath:
          type: string
        message:
          type: string
        namespace:
          type: string
        phase:
          type: string
        reason:
          type: string
        result:
          type: string
        severity:
          enum:
          - info
          - warning
          - error
          type: string
        source:
          enum:
          - mite
          - operator
          - user
          - api
          - jenkins
          - mcp
          - assistant
          - tenant_agent
          type: string
        timestamp:
          format: date-time
          type: string
        type:
          type: string
        url:
          type: string
      required:
      - timestamp
      - type
      - source
      - severity
      - message
      type: object
    ApiRuleRef:
      additionalProperties: false
      description: An API rule with resources and verbs.
      properties:
        resources:
          items:
            type: string
          type: array
        verbs:
          items:
            type: string
          type: array
      required:
      - resources
      - verbs
      type: object
    ApplyResult:
      additionalProperties: false
      description: Result of an apply operation with RFC3339 timestamp.
      properties:
        hash:
          type: string
        sections:
          items:
            $ref: '#/components/schemas/components_schemas_ApplySectionResult'
          type: array
        succeeded:
          type: boolean
        timestamp:
          type: string
      required:
      - timestamp
      - succeeded
      - sections
      type: object
    ApplySectionResult:
      additionalProperties: false
      description: Result for one apply section.
      properties:
        error:
          type: string
        name:
          type: string
        ok:
          type: boolean
      required:
      - name
      - ok
      type: object
    ApproveConflict:
      additionalProperties: false
      description: Refusal of an approval. changes is present when the pending change
        is not the one the caller approved.
      properties:
        changes:
          description: The sections of the current pending change.
          items:
            type: string
          type: array
        error:
          description: Human-readable error message.
          type: string
      required:
      - error
      type: object
    AssistantAcceptedState:
      properties:
        state:
          type: string
      required:
      - state
      type: object
    AssistantApproval:
      properties:
        arguments:
          additionalProperties: true
          type: object
        callId:
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        reason:
          type: string
        requestedAt:
          format: date-time
          type: string
        resolvedAt:
          format: date-time
          nullable: true
          type: string
        resolvedBy:
          type: string
        result:
          nullable: true
          type: string
        resultWithheld:
          description: True when the caller may view the session but not its tool
            results. result is then null.
          type: boolean
        sessionId:
          type: string
        state:
          enum:
          - pending
          - approved
          - denied
          - expired
          type: string
        targetKind:
          type: string
        targetRef:
          type: string
        tool:
          type: string
      required:
      - id
      - sessionId
      - callId
      - tool
      - arguments
      - targetKind
      - state
      - requestedAt
      - expiresAt
      - resultWithheld
      type: object
    AssistantApprovalList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_AssistantApproval'
          type: array
        nextCursor:
          type: string
      required:
      - items
      - nextCursor
      type: object
    AssistantApprovalOutcome:
      properties:
        approval:
          $ref: '#/components/schemas/components_schemas_AssistantApproval'
        result:
          properties:
            content:
              type: string
            isError:
              type: boolean
          required:
          - content
          - isError
          type: object
      required:
      - approval
      - result
      type: object
    AssistantDenyRequest:
      additionalProperties: false
      properties:
        reason:
          maxLength: 500
          type: string
      type: object
    AssistantError:
      additionalProperties: false
      description: An assistant refusal. The code names the cause, and error gives
        the text.
      properties:
        code:
          enum:
          - assistant_disabled
          - assistant_key_unavailable
          - assistant_off
          - assistant_busy
          - prompt_not_startable
          - kill_switch
          - approval_expired
          - tenant_agent_session
          type: string
        error:
          type: string
      required:
      - error
      - code
      type: object
    AssistantLimits:
      properties:
        approvalExpiry:
          type: string
        budgets:
          properties:
            session:
              format: int64
              type: integer
            steps:
              type: integer
            tenantDay:
              format: int64
              type: integer
            userDay:
              format: int64
              type: integer
          type: object
        egress:
          additionalProperties: true
          type: object
        externalDataSharing:
          type: string
      type: object
    AssistantMessageRequest:
      additionalProperties: false
      properties:
        message:
          maxLength: 8000
          minLength: 1
          type: string
      required:
      - message
      type: object
    AssistantProvider:
      properties:
        available:
          type: boolean
        baseURL:
          description: Shown to admins only.
          type: string
        default:
          type: boolean
        kind:
          enum:
          - anthropic
          - openai-compatible
          type: string
        models:
          items:
            type: string
          type: array
        name:
          type: string
        trust:
          enum:
          - internal
          - external
          type: string
      required:
      - name
      - kind
      - models
      - trust
      - default
      - available
      type: object
    AssistantProviderList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_AssistantProvider'
          type: array
      required:
      - items
      type: object
    AssistantSession:
      properties:
        cluster:
          type: string
        completionTokens:
          format: int64
          type: integer
        context:
          additionalProperties: true
          type: object
        dataSharing:
          enum:
          - none
          - metadata
          - logs
          type: string
        endedAt:
          format: date-time
          nullable: true
          type: string
        id:
          type: string
        keySource:
          enum:
          - chart
          - user
          type: string
        kind:
          enum:
          - assistant
          - tenant_agent
          type: string
        model:
          type: string
        principal:
          type: string
        promptTokens:
          format: int64
          type: integer
        provider:
          type: string
        skipReason:
          enum:
          - budget_day
          - kill_switch
          - data_sharing_none
          - provider_unavailable
          nullable: true
          type: string
        startedAt:
          format: date-time
          type: string
        state:
          enum:
          - running
          - waiting_approval
          - completed
          - failed
          - cancelled
          - skipped
          - expired
          type: string
        steps:
          type: integer
        tenant:
          type: string
        trigger:
          type: string
      required:
      - id
      - kind
      - principal
      - cluster
      - state
      - context
      - keySource
      - dataSharing
      - promptTokens
      - completionTokens
      - steps
      - startedAt
      type: object
    AssistantSessionContext:
      additionalProperties: false
      description: The client context of a session. Each key names one object the
        session is about.
      properties:
        cell:
          type: string
        controller:
          type: string
        job:
          type: string
        route:
          type: string
        run:
          type: string
        tenant:
          type: string
      type: object
    AssistantSessionCreateRequest:
      additionalProperties: false
      description: Send either message or prompt, never both.
      properties:
        context:
          $ref: '#/components/schemas/components_schemas_AssistantSessionContext'
        message:
          maxLength: 8000
          type: string
        model:
          type: string
        prompt:
          description: The id of a fixed prompt, such as explain-failure.
          type: string
        provider:
          type: string
      type: object
    AssistantSessionDetail:
      properties:
        approvals:
          items:
            $ref: '#/components/schemas/components_schemas_AssistantApproval'
          type: array
        session:
          $ref: '#/components/schemas/components_schemas_AssistantSession'
      required:
      - session
      - approvals
      type: object
    AssistantSessionList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_AssistantSession'
          type: array
        nextCursor:
          type: string
      required:
      - items
      - nextCursor
      type: object
    AssistantSettings:
      properties:
        defaultModel:
          type: string
        defaultProvider:
          type: string
        limits:
          $ref: '#/components/schemas/components_schemas_AssistantLimits'
        paused:
          type: boolean
        pausedAt:
          format: date-time
          nullable: true
          type: string
        pausedBy:
          type: string
        tenantDataSharing:
          additionalProperties:
            enum:
            - none
            - metadata
            - logs
            type: string
          type: object
        updatedAt:
          format: date-time
          type: string
        updatedBy:
          type: string
      required:
      - paused
      type: object
    AssistantSettingsUpdate:
      additionalProperties: false
      properties:
        defaultModel:
          type: string
        defaultProvider:
          type: string
        paused:
          type: boolean
        tenantDataSharing:
          properties:
            remove:
              type: string
            set:
              properties:
                level:
                  enum:
                  - none
                  - metadata
                  - logs
                  type: string
                tenant:
                  type: string
              required:
              - tenant
              - level
              type: object
          type: object
      type: object
    BindingFederationStatus:
      description: Federation outcome of a binding on one hive, or a federation fault
        of a role on one hive.
      properties:
        cluster:
          description: Hive cluster name.
          type: string
        lastTransitionTime:
          description: Time the state, reason, or message last changed.
          format: date-time
          type: string
        message:
          description: Human-readable detail for the state.
          type: string
        reason:
          description: CamelCase code for the state. Skipped codes are NoSubjects,
            NoTenantWrite, NoTenantJobs, RoleNotFound, NoJenkinsProjection, JenkinsRoleNotFound,
            NonGlobalJenkinsRole, and ReservedRole. Failed codes are HiveUnavailable,
            JenkinsRoleCollision, JenkinsRoleWriteFailed, JenkinsRoleBindingCollision,
            JenkinsRoleBindingWriteFailed, StaleJenkinsRoleBindingDeleteFailed, and
            StaleJenkinsRoleDeleteFailed. StaleJenkinsRoleDeleteFailed occurs only
            on a VarroaRole. The federated code is Federated.
          type: string
        state:
          enum:
          - federated
          - skipped
          - failed
          type: string
      required:
      - cluster
      - state
      - lastTransitionTime
      type: object
    BroodOperationDetail:
      additionalProperties: false
      description: Full brood operation resource with spec and status.
      properties:
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          properties:
            action:
              properties:
                groovy:
                  description: Script selection for verb=executeGroovy. Exactly one
                    of script or itemRef.
                  properties:
                    itemRef:
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        pinnedContentHash:
                          type: string
                        variables:
                          additionalProperties:
                            type: string
                          type: object
                      type: object
                    script:
                      type: string
                  type: object
                upgrade:
                  description: Granularity selection for verb=upgrade. An absent targetVersion
                    releases each target's own held promoted revision; a set targetVersion
                    bulk-writes that version to every target.
                  properties:
                    targetVersion:
                      type: string
                  type: object
                verb:
                  enum:
                  - restart
                  - reprovision
                  - reconcile
                  - stop
                  - start
                  - executeGroovy
                  - upgrade
                  type: string
              type: object
            execution:
              properties:
                failurePolicy:
                  enum:
                  - FailFast
                  - FailTidy
                  - FailAtEnd
                  type: string
                maxParallel:
                  format: int32
                  type: integer
                order:
                  enum:
                  - rolloutWave
                  - name
                  type: string
              type: object
            suspend:
              type: boolean
            targets:
              properties:
                filters:
                  properties:
                    bundle:
                      type: string
                    phase:
                      type: string
                    version:
                      type: string
                  type: object
                names:
                  items:
                    type: string
                  type: array
                namespaces:
                  items:
                    type: string
                  type: array
                selector:
                  type: object
              type: object
            ttlSecondsAfterFinished:
              format: int32
              type: integer
          type: object
        status:
          properties:
            finishedAt:
              format: date-time
              type: string
            observedGeneration:
              format: int64
              type: integer
            phase:
              enum:
              - Pending
              - Running
              - Suspended
              - Succeeded
              - Failed
              - Canceled
              type: string
            reason:
              type: string
            scriptSnapshotRef:
              description: Name of the owner-referenced ConfigMap holding the once-resolved
                script content for a catalog-sourced executeGroovy operation. Empty
                for inline scripts and every other verb.
              type: string
            startedAt:
              format: date-time
              type: string
            startedBy:
              type: string
            summary:
              properties:
                failed:
                  format: int32
                  type: integer
                skipped:
                  format: int32
                  type: integer
                succeeded:
                  format: int32
                  type: integer
                total:
                  format: int32
                  type: integer
              type: object
            targets:
              items:
                properties:
                  dispatchedAt:
                    format: date-time
                    type: string
                  finishedAt:
                    format: date-time
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  output:
                    description: Verb-specific dispatch output (currently executeGroovy
                      only), truncated to 4096 bytes on a UTF-8-safe boundary.
                    type: string
                  reason:
                    type: string
                  state:
                    enum:
                    - Pending
                    - Dispatched
                    - Succeeded
                    - Failed
                    - Skipped
                    type: string
                  wave:
                    format: int32
                    type: integer
                type: object
              type: array
          type: object
      type: object
    BroodPreviewResponse:
      description: Per-cluster preview result with targets.
      properties:
        clusters:
          items:
            properties:
              cluster:
                type: string
              error:
                type: string
              ok:
                type: boolean
              targets:
                items:
                  properties:
                    applicable:
                      type: boolean
                    name:
                      type: string
                    namespace:
                      type: string
                    reason:
                      type: string
                    wave:
                      format: int32
                      type: integer
                  required:
                  - namespace
                  - name
                  - wave
                  - applicable
                  type: object
                type: array
            required:
            - cluster
            - ok
            type: object
          type: array
      required:
      - clusters
      type: object
    BuiltinRoleRef:
      additionalProperties: false
      description: A built-in VarroaRole with resolved Jenkins permissions.
      properties:
        apiRules:
          items:
            $ref: '#/components/schemas/components_schemas_ApiRuleRef'
          type: array
        jenkinsPermissions:
          description: Resolved Jenkins permissions (plugin/controller-level).
          items:
            type: string
          type: array
        jenkinsRoleRef:
          description: Reference to the corresponding JenkinsRole.
          type: string
        name:
          type: string
      required:
      - name
      - apiRules
      - jenkinsRoleRef
      - jenkinsPermissions
      type: object
    CancelRunResponse:
      additionalProperties: false
      description: |
        202 response for a fire-and-forget run action: a cancel, an input proceed, or an input abort. The BFF publishes one command and waits for no result.
      properties:
        state:
          enum:
          - requested
          type: string
      required:
      - state
      type: object
    CatalogItemSpec:
      additionalProperties: false
      description: Spec for a CatalogItem.
      properties:
        description:
          type: string
        displayName:
          type: string
        path:
          type: string
        requires:
          items:
            type: string
          type: array
        sourceRef:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          enum:
          - podtemplate
          - plugin
          - item
          - jcasc
          - rbac
          - pipeline-template
          - groovy
          type: string
        variables:
          items:
            $ref: '#/components/schemas/components_schemas_CatalogVariable'
          type: array
        version:
          type: string
      required:
      - sourceRef
      - type
      - path
      type: object
    CatalogSourceSpec:
      additionalProperties: false
      description: Spec for a CatalogSource (bundle catalog repository).
      properties:
        ociRef:
          description: OCI artifact reference; mutually exclusive with repoURL.
          type: string
        path:
          type: string
        repoURL:
          type: string
        revision:
          type: string
        secretRef:
          type: string
        syncIntervalSeconds:
          description: Catalog poll cadence in seconds. 0 or an omitted field means
            the default (300); any other value must be between 30 and 31536000.
          oneOf:
          - enum:
            - 0
          - maximum: 31536000
            minimum: 30
          type: integer
        trusted:
          type: boolean
      type: object
    CatalogVariable:
      additionalProperties: false
      description: A variable definition for a catalog item.
      properties:
        allowedValues:
          description: Populates a choice/dropdown widget. Only valid when type is
            "string" or "number".
          items:
            type: string
          type: array
        default:
          type: string
        description:
          type: string
        name:
          type: string
        required:
          type: boolean
        type:
          description: Parameter type. Omitting the field means "string".
          enum:
          - string
          - number
          - boolean
          - credentials
          type: string
      required:
      - name
      type: object
