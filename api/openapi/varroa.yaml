  /api/v1/callback:
    get:
      description: |
        Validates the signed oidc_state cookie (signature, nonce, expiry), exchanges the authorization code for tokens, sets the varroa_token session cookie, and renders server-side progress HTML.
      operationId: authCallback
      parameters:
      - description: Authorization code from OIDC provider.
        in: query
        name: code
        schema:
          type: string
      - description: OAuth state nonce echoed back from provider.
        in: query
        name: state
        schema:
          type: string
      - description: OIDC error returned by the provider (e.g. access_denied).
        in: query
        name: error
        schema:
          type: string
      responses:
        "200":
          content:
            text/html: {}
          description: Login progress page with server-side redirect.
        "302":
          description: Redirect to /login when state validation fails or provider
            error.
        "400":
          description: Missing required parameters.
        "500":
          description: Token exchange or validation failed.
        "501":
          $ref: '#/components/responses/components_responses_NotImplemented'
      security: []
      summary: OIDC provider callback endpoint.
      tags:
      - auth
