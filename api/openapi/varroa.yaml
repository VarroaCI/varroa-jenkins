  /api/v1/updatecenter:
    get:
      operationId: getUpdateCenterStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_UpdateCenterStatus'
          description: Update center status.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "500":
          $ref: '#/components/responses/components_responses_Internal'
      summary: Gets the update center status.
      tags:
      - updatecenter
  /api/v1/updatecenter/plugins:
    get:
      operationId: getUpdateCenterPlugins
      parameters:
      - description: Optional case-insensitive substring filter on plugin name.
        in: query
        name: q
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_UpdateCenterPlugins'
          description: Plugin inventory.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "500":
          $ref: '#/components/responses/components_responses_Internal'
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: Update center service unreachable.
      summary: Gets the update center plugin inventory.
      tags:
      - updatecenter
    post:
      description: |
        Pushes a .hpi/.jpi into the update center store. The transitive mandatory dependency closure is resolved and validated before any byte is committed; an unresolvable closure is rejected with an actionable per-dependency diff. Requires the `updatecenter` / `upload` verb.
      operationId: uploadUpdateCenterPlugin
      parameters:
      - description: |
          Run PARSE, the admission check, PLAN and VALIDATE and return the plan without committing anything.
        in: query
        name: dryRun
        schema:
          type: boolean
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: The .hpi/.jpi bytes.
                  format: binary
                  type: string
              required:
              - file
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_UpdateCenterUploadResult'
          description: Dry-run plan; nothing was written.
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_UpdateCenterUploadResult'
          description: The plugin and its planned dependencies were stored.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: |
            malformed-upload (the body is not multipart/form-data or has no `file` part), invalid-artifact, or missing-manifest-fields.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: duplicate, version-digest-conflict, or update-center-disabled.
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: too-large — the artifact exceeds the configured byte cap.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_UpdateCenterUploadRejection'
          description: |
            unresolved-dependencies, closure-unverifiable, or closure-too-deep. Every rejecting dependency is listed in `unresolved`.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: update-center-status-unavailable.
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: |
            uploads-require-single-writer — the update center is not deployed as a single writer, so an upload could not be serialized.
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: update-center-unreachable or fetch-failed.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_UpdateCenterUploadRejection'
          description: |
            declared-set-unavailable or metadata-unavailable. Both are retryable.
      summary: Uploads a Jenkins plugin artifact into the update center.
      tags:
      - updatecenter
