  /api/v1/pipelines/{tenant}/jobs/{job}/tests/{case}:
    get:
      description: |
        Resolves {tenant} onto one or more record-store tenants and applies the tenant read check to each, with the decoded job path. Reads the case history of each admitted tenant, merges the rows newest first, and cuts the list to limit. The history is keyed by class name and test name, so two suites that report one class and one name merge. A job that holds no stored case answers an empty items list. The read answers the record store retention window.
      operationId: listJobTestCaseHistory
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      - $ref: '#/components/parameters/components_parameters_job'
      - $ref: '#/components/parameters/components_parameters_case'
      - in: query
        name: limit
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TestCaseHistoryResponse'
          description: The case's recent outcomes, newest first.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The server cannot split or decode the case key.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The tenant resolves no tenant, or the caller may not read any
            of its tenants.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists the recent outcomes of one test case of a job, across every tenant
        of the tenant.
      tags:
      - Pipelines
  /api/v1/pipelines/{tenant}/locks:
    get:
      description: |
        Resolves {tenant} onto one or more record-store tenants, applies the tenant read check to each, reads each tenant's locks, and merges the answers in lock name order, the holder before its waiters. Each row carries its own tenant and jobPath, whichever tenant it belongs to. A row carries runLink only when the caller's own grant can read that row's own run. A waiting row reports its own waitingSince. A held or a releasing row reports its own acquiredAt. It carries no queue position.
      operationId: listTenantFleetLocks
