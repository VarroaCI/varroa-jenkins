  /api/v1/clusters/{cluster}/controllers/{ns}/{name}/approve:
    post:
      operationId: approveController
      parameters:
      - $ref: '#/components/parameters/components_parameters_cluster'
      - $ref: '#/components/parameters/components_parameters_ns'
      - $ref: '#/components/parameters/components_parameters_name'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                action:
                  description: The action to approve.
                  enum:
                  - reload
                  - restart
                  - approve
                  - force
                  - force-restart
                  - plugin-roll
                  type: string
                  x-enum-varnames:
                  - ApproveControllerJSONBodyActionReload
                  - ApproveControllerJSONBodyActionRestart
                  - ApproveControllerJSONBodyActionApprove
                  - ApproveControllerJSONBodyActionForce
                  - ApproveControllerJSONBodyActionForceRestart
                  - ApproveControllerJSONBodyActionPluginRoll
                expectedContentHash:
                  description: The contentHash of the pending change that the caller
                    reviewed. When present, the approval refuses unless the pending
                    change has this hash. A caller that omits it approves the pending
                    change that exists at that moment. Only the reload, restart, approve,
                    and force actions check it; force-restart and plugin-roll ignore
                    it.
                  type: string
              required:
              - action
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  action:
                    type: string
                  status:
                    type: string
                required:
                - status
                - action
                type: object
          description: Action approved.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "409":
          $ref: '#/components/responses/components_responses_ApproveConflict'
      summary: Approves a pending restart, reload, or plugin-roll action.
      tags:
      - controllers
  /api/v1/clusters/{cluster}/controllers/{ns}/{name}/approve-deletion:
    post:
      operationId: approveControllerDeletion
      parameters:
