          description: Group updated.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
      summary: Edits the display name and members of an existing group (admin, local
        auth only).
      tags:
      - groups
  /api/v1/identity-settings:
    get:
      operationId: getIdentitySettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_IdentitySettings'
          description: Identity settings.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
      summary: Returns identity/OIDC configuration (admin only).
      tags:
      - identity
  /api/v1/locks:
    get:
      description: |
        Reads every cluster in one list, ordered by name, then waitingSince, then runId. A holder and its waiters can run on different clusters. Each row carries its own cluster, tenant, and jobPath. A row carries runLink only when the caller's own grant can read that row's own run. A waiting row reports its own waitingSince. A held or a releasing row reports its own acquiredAt. It carries no queue position and no derived holder.
      operationId: listAllFleetLocks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_FleetLockListResponse'
          description: Every fleet lock of every cluster (items envelope).
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists every fleet lock of every cluster, across every tenant. Requires
        the fleetlocks:read verb on a cluster-wide binding.
      tags:
      - Pipelines
  /api/v1/locks/release:
    post:
      description: |
        Deletes the releasing row that name and runId identify. The recorder refuses a row in another state, and a row whose cell instance the stored placement still names as a member, because that pod can still run the holder's build. That refusal names the holder cell in holderCell. Restart that cell when its Jenkins does not run, and the lock then releases with no force release. A release publishes one lock notification and writes one fleetlock.force_released activity row that names the actor and the reason. Confirm first that the holder's build runs on no cell.
      operationId: releaseFleetLock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_FleetLockReleaseRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_FleetLockReleaseResponse'
          description: The lock was released.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_FleetLockReleaseConflict'
          description: The lock is not releasing, or a live pod still runs its holder.
            The second refusal carries holderCell.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Force-releases one releasing fleet lock that no live pod holds. Requires
        the fleetlocks:release verb on a cluster-wide binding.
      tags:
      - Pipelines
  /api/v1/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_LoginResponse'
          description: Successful login — returns id_token and expires_in.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: Rate-limited — too many login attempts.
        "501":
          $ref: '#/components/responses/components_responses_NotImplemented'
      security: []
      summary: Authenticate with username/password. Returns a JWT and sets a secure
        cookie.
      tags:
      - auth
  /api/v1/logout:
    post:
      description: |
        Clears the varroa_token cookie, sets a five-minute interactive_login marker (Path=/api/v1/auth), and returns JSON {"redirect":"..."} with no Location header. In OIDC mode, when the provider supports RP-initiated logout, the redirect URL includes id_token_hint and post_logout_redirect_uri.
      operationId: logout
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  redirect:
                    type: string
                required:
                - redirect
                type: object
          description: Logged out successfully. JSON redirect only.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: Logs out the current session. Clears cookie, sets interactive marker,
        returns JSON redirect.
      tags:
      - auth
  /api/v1/mcp:
    delete:
      description: Stateless MCP Streamable HTTP — see POST description.
      operationId: mcpDelete
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Cancelled.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: MCP DELETE — cancels a JSON-RPC request by ID.
      tags:
      - mcp
    get:
      description: Stateless MCP Streamable HTTP — see POST description.
      operationId: mcpGet
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: OK.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: MCP GET health/liveness check.
      tags:
      - mcp
    post:
      description: |
        Opaque MCP Streamable HTTP endpoint. Requests and responses are JSON-RPC with no server-defined schema (coordinator-sanctioned exclusion). The server operates in **stateless** mode (`server.WithStateLess(true)`) — no session affinity is required; the C3 local proxy depends on this. Excluded from codegen.
      operationId: mcpPost
      requestBody:
        content:
          application/json:
            schema:
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: JSON-RPC response.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: MCP JSON-RPC pass-through (POST).
      tags:
      - mcp
  /api/v1/me:
    get:
      description: |
        Also accepts the `varroa_token` cookie when no bearer token is present (browser path).
      operationId: getMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Me'
          description: Current user profile.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: Returns the current user's profile, enriched from User CRD.
      tags:
      - auth
  /api/v1/me/apikeys:
    get:
      operationId: listMyApiKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/components_schemas_KeyMeta'
                    type: array
                required:
                - items
                type: object
          description: List of API key metadata (N6 envelope).
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: Lists the current user's API keys.
      tags:
      - apikeys
    post:
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_CreateKeyRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TokenResponse'
          description: API key created.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: Creates a new API key for the current user.
      tags:
      - apikeys
  /api/v1/me/apikeys/{prefix}:
    delete:
      operationId: revokeApiKey
      parameters:
      - $ref: '#/components/parameters/components_parameters_prefix'
      responses:
        "204":
          description: Key revoked successfully.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
      summary: Revokes one of the current user's API keys.
      tags:
      - apikeys
  /api/v1/me/apikeys/{prefix}/rotate:
    post:
      operationId: rotateApiKey
      parameters:
      - $ref: '#/components/parameters/components_parameters_prefix'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_CreateKeyRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TokenResponse'
          description: Key rotated successfully.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RotatePartialFailure'
          description: Partial failure — new key created but old key could not be
            revoked.
      summary: Rotates an API key (issues a new key, revokes the old one).
      tags:
      - apikeys
  /api/v1/me/assistant:
    get:
      description: With the assistant off, the answer is available false and no other
        field.
      operationId: getMyAssistant
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_MyAssistant'
          description: The caller's assistant view.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
      summary: Returns the caller's assistant settings, key state, and day spend.
      tags:
      - Assistant
    put:
      operationId: putMyAssistant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_MyAssistantUpdate'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_MyAssistant'
          description: The caller's assistant view after the change.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Changes the caller's provider, model, data level, or enabled flag.
      tags:
      - Assistant
  /api/v1/me/assistant/key:
    delete:
      operationId: deleteMyAssistantKey
      responses:
        "204":
          description: The key cookie is cleared.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is not enabled.
      summary: Clears the sealed provider key cookie.
      tags:
      - Assistant
    put:
      description: |
        The cookie is HttpOnly, SameSite Strict, scoped to the API path, and cleared at logout. An API key caller has no login session, so the call answers 409.
      operationId: putMyAssistantKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_MyAssistantKeyRequest'
        required: true
      responses:
        "204":
          description: The key is stored.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The caller has no login session.
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: Sealing is not configured.
      summary: Stores a provider key in a session-only, sealed cookie.
      tags:
      - Assistant
  /api/v1/me/password:
    put:
      operationId: changeMyPassword
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                newPassword:
                  type: string
                oldPassword:
                  type: string
              required:
              - oldPassword
              - newPassword
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  status:
                    type: string
                required:
                - status
                type: object
          description: Password changed.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "501":
          $ref: '#/components/responses/components_responses_NotImplemented'
      summary: Changes the current user's password (local auth only).
      tags:
      - auth
  /api/v1/me/permissions:
    get:
      operationId: getMyPermissions
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_PermissionScopes'
          description: Effective capabilities (Authorizer.EffectivePermissions DTO).
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: Returns the current user's effective permissions.
      tags:
      - auth
  /api/v1/me/preferences:
    put:
      description: CLI-excluded — browser-only feature.
      operationId: updateMyPreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_Preferences'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Preferences'
          description: Echo of the saved preferences.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
      summary: Updates the current user's UI preferences.
      tags:
      - auth
  /api/v1/openapi.json:
    get:
      operationId: getOpenAPISpec
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: The complete OpenAPI specification.
      security: []
      summary: Returns the bundled OpenAPI spec.
      tags:
      - ops
  /api/v1/pipelines:
    get:
      description: |
        Answers each local Tenant that carries spec.pipelines, and each live record-store placement row of another cluster. A row of the local cluster, a row with no cell, and a row at placement generation 0 are not listed. A name that a local Tenant holds lists only the local Tenant. One name placed on two other clusters lists one row for each cluster. It also answers each local Tenant without spec.pipelines whose spec.namespaces hold a controller the caller may read. The route has no gate of its own: the tenant read check drops each row the caller may not read, so a caller who can read no row gets an empty list. When the record store is off or its schema is too old, the list carries the local Tenants alone and recordStore is false.
      operationId: listPipelineTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_PipelineTenantList'
          description: The pipelines Tenants the caller may read.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "500":
          $ref: '#/components/responses/components_responses_Internal'
      summary: Lists the pipelines Tenants the caller may read.
      tags:
      - Pipelines
  /api/v1/pipelines/{tenant}:
    get:
      description: |
        Resolves {tenant} onto one or more record-store tenants, unions each tenant's job summaries with the catalog's declared jobs, and reads each tenant's unfinished runs for the Running now strip.
      operationId: listPipelines
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_PipelineListResponse'
          description: The tenant's pipelines and running-now strip.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The tenant name is ambiguous across clusters.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The tenant resolves to more tenants than the fan-out ceiling.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists a tenant's pipelines and its unfinished runs.
      tags:
      - Pipelines
  /api/v1/pipelines/{tenant}/agent:
    get:
      description: |
        Answers the TenantAgent object that the acceptance rule selects for the Tenant, its status, the pending approval count of its sessions, and the spend of the current UTC day against the day limit. Answers 404 when the Tenant has no accepted TenantAgent or the caller may not read the Tenant.
      operationId: getTenantAgent
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TenantAgent'
          description: The accepted Tenant agent.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
      summary: Returns the accepted Tenant agent of a pipelines tenant.
      tags:
      - TenantAgents
  /api/v1/pipelines/{tenant}/agent/capabilities:
    get:
      description: |
        The groups are reads, writesByApproval, unattended, and never. The lists hold only the tools the object's data level and grant make visible. Hidden tools are absent.
      operationId: getTenantAgentCapabilities
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TenantAgentCapabilities'
          description: The four capability groups.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is off.
      summary: Lists what the Tenant agent may do, in four groups.
      tags:
      - TenantAgents
  /api/v1/pipelines/{tenant}/agent/run:
    post:
      description: |
        Publishes a tenantagent.run_requested activity for the placement cluster of the Tenant. The run starts later, on the runner. A kill switch or a spent day budget still answers 202, and the session ends skipped.
      operationId: runTenantAgent
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_TenantAgentRunRequest'
      responses:
        "202":
          content:
            application/json:
              schema:
                properties:
                  state:
                    enum:
                    - requested
                    type: string
                required:
                - state
                type: object
          description: The run request is published.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TenantAgentError'
          description: The Tenant agent cannot run now.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Requests a manual Tenant agent run.
      tags:
      - TenantAgents
  /api/v1/pipelines/{tenant}/agent/sessions:
    get:
      description: |
        Pages the sessions of kind tenant_agent for the Tenant. Each item carries its pending approvals. The Approvals tab reads state waiting_approval.
      operationId: listTenantAgentSessions
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      - in: query
        name: state
        schema:
          enum:
          - running
          - waiting_approval
          - completed
          - failed
          - cancelled
          - skipped
          - expired
          type: string
      - in: query
        name: cursor
        schema:
          type: string
      - in: query
        name: limit
        schema:
          maximum: 200
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TenantAgentSessionList'
          description: One page of Tenant agent sessions.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_AssistantError'
          description: The assistant is off.
      summary: Lists the Tenant agent sessions of a pipelines tenant, newest first.
      tags:
      - TenantAgents
  /api/v1/pipelines/{tenant}/cell:
    get:
      description: |
        Reads the Tenant object first, so a pipelines tenant that waits for its first cell answers 200 with the state unplaced. The body carries this tenant's own counts and a neighbour count. It carries no other tenant's name, job path, run, or count. canOpenCell is a hint that gates no field: a caller the controller read check refuses still receives the whole body.
      operationId: getTenantCell
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_TenantCell'
          description: The tenant's cell view.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Returns the tenant's own view of the cell that hosts it.
      tags:
      - Pipelines
  /api/v1/pipelines/{tenant}/jobs/{job}:
    get:
      description: |
        dependencies.upstream and dependencies.downstream carry the job's cross-tenant varroa-upstream trigger edges (design D13), each marked granted or not. The route authorizes with CanReadPipeline, never a controller-scoped check, because a cell hosts many tenants.
      operationId: getPipelineJob
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      - $ref: '#/components/parameters/components_parameters_job'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_PipelineJobDetail'
          description: The job's detail.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Returns one job's summary, definition, triggers, parameters, and dependency
        edges.
      tags:
      - Pipelines
  /api/v1/pipelines/{tenant}/jobs/{job}/branches:
    get:
      description: |
        The inventory is exported by the cell that holds the job's home slot, so it can be up to ten minutes stale. A cell that is down or hibernated keeps its last export, and the response shows that last export. A job with no export yet answers an empty list with no observedAt. Each head is listed only when the caller may read its job path.
      operationId: listJobBranches
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      - $ref: '#/components/parameters/components_parameters_job'
      responses:
        "200":
          content:
            application/json:
              schema:
