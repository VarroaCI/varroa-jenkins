          type: string
        sources:
          items:
            $ref: '#/components/schemas/components_schemas_SourceJSON'
          type: array
        summary:
          $ref: '#/components/schemas/components_schemas_SummaryJSON'
        warnings:
          items:
            type: object
          type: array
      required:
      - sources
      - capabilities
      - level
      - levelName
      - freshness
      type: object
    ControllerPatch:
      additionalProperties: false
      description: |
        Patch body for PATCH /controllers/{ns}/{name}. Exactly one top-level key `spec` is allowed — any other key returns 400 (N5).
      properties:
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
      type: object
    ControllerSpec:
      additionalProperties: false
      description: Desired state of a Controller. Transcribed from v1alpha1.ControllerSpec.
      properties:
        backupSpec:
          $ref: '#/components/schemas/components_schemas_BackupSpec'
        cell:
          $ref: '#/components/schemas/components_schemas_CellSpec'
        className:
          description: References a ControllerClass by name, layering its defaults
            between ProvisioningDefaults and the Controller's own spec.
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        endpoint:
          description: API endpoint URL for the controller.
          type: string
        headless:
          description: Blocks the Jenkins web UI for every non-admin caller. A cell
            is always headless.
          type: boolean
        hibernation:
          $ref: '#/components/schemas/components_schemas_HibernationSpec'
        ingressSpec:
          $ref: '#/components/schemas/components_schemas_IngressSpec'
        miteSpec:
          $ref: '#/components/schemas/components_schemas_MiteSpec'
        persistence:
          $ref: '#/components/schemas/components_schemas_PersistenceSpec'
        pluginSpec:
          $ref: '#/components/schemas/components_schemas_PluginSpec'
        podOverrides:
          $ref: '#/components/schemas/components_schemas_PodOverrides'
        powerState:
          description: Controls whether the controller runs. Hibernation is reported
            in status.hibernated, not requested here.
          enum:
          - ""
          - Running
          - Stopped
          type: string
        probes:
          $ref: '#/components/schemas/components_schemas_ProbesSpec'
        rbacSpec:
          $ref: '#/components/schemas/components_schemas_RBACSpec'
        reconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        resourceOverlay:
          $ref: '#/components/schemas/components_schemas_ResourceOverlay'
        resources:
          description: CPU/memory resource requests and limits (transcribed from corev1.ResourceRequirements).
          properties:
            limits:
              additionalProperties:
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                type: string
              description: Maximum resource limits for the Jenkins container.
              type: object
            requests:
              additionalProperties:
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                type: string
              description: Minimum resource requests for the Jenkins container.
              type: object
          type: object
        version:
          description: Controller version tag.
          type: string
      type: object
    ControllerSummary:
      additionalProperties: false
      description: Summary entry for each controller in the list.
      properties:
        appliedBundleHash:
          type: string
        attention:
          $ref: '#/components/schemas/components_schemas_ControllerAttention'
        cellPool:
          description: The controller's varroa.dev/cell-pool label. Absent while no
            label is set.
          type: string
        cluster:
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        createdAt:
          description: metadata.creationTimestamp, RFC 3339. Present for every controller.
          format: date-time
          type: string
        effectiveBundle:
          $ref: '#/components/schemas/components_schemas_EffectiveBundle'
        endpoint:
          type: string
        headless:
          description: Mirrors v1alpha1.IsHeadless. When true, endpoint is always
            the empty string, whatever the controller's Status.Endpoint carries.
          type: boolean
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        kind:
          description: Mirrors v1alpha1.IsCell. Always present, so a client never
            reads the kind from an absent field.
          enum:
          - cell
          - stateful
          type: string
        lastSeen:
          description: Last mite heartbeat, RFC3339 UTC. Absent when no mite has reported.
          type: string
        maxTenants:
          description: The same effective cap the cell usage read resolves. Absent
            for a controller that is not a cell.
          format: int32
          type: integer
        miteConnected:
          type: boolean
        miteVersion:
          type: string
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
        rolloutWave:
          description: RolloutWave from the reconciliation policy.
          type: integer
        routingMode:
          description: Either "subdomain" or "path".
          type: string
        tenantCount:
          description: The length of status.cell.tenants, never of status.cell.appliedTenants.
            Absent for a controller that is not a cell.
          format: int32
          type: integer
        unreadySince:
          description: status.cell.unreadySince, RFC 3339. Absent while the cell is
            ready.
          format: date-time
          type: string
        version:
          description: Desired Jenkins version (from spec.version).
          type: string
        warm:
          description: status.cell.warm. Absent for a controller that is not a cell.
          type: boolean
      required:
      - name
      - namespace
      - cluster
      - phase
      - endpoint
      - headless
      - miteConnected
      - routingMode
      - kind
      - createdAt
      type: object
    CreateBroodRequest:
      additionalProperties: false
