          - stateful
          type: string
        lastApplyResult:
          $ref: '#/components/schemas/components_schemas_ApplyResult'
        lastReconciledAt:
          type: string
        lastSeen:
          type: string
        liveDrift:
          $ref: '#/components/schemas/components_schemas_LiveDrift'
        miteConnected:
          type: boolean
        miteImageStatus:
          $ref: '#/components/schemas/components_schemas_MiteImageStatus'
        miteVersion:
          type: string
        name:
          type: string
        namespace:
          type: string
        observability:
          $ref: '#/components/schemas/components_schemas_ControllerObservability'
        pendingItemDeletions:
          items:
            $ref: '#/components/schemas/components_schemas_PendingDeletion'
          type: array
        pendingPluginRoll:
          $ref: '#/components/schemas/components_schemas_PendingPluginRoll'
        pendingRestart:
          $ref: '#/components/schemas/components_schemas_PendingRestart'
        phase:
          type: string
        pluginConflict:
          $ref: '#/components/schemas/components_schemas_PluginConflict'
        pluginInventory:
          $ref: '#/components/schemas/components_schemas_PluginInventorySummary'
        podOverrides:
          type: object
        powerState:
          description: The controller's spec.powerState intent (Running or Stopped).
          type: string
        rbacHash:
          type: string
        reconcileBlocked:
          $ref: '#/components/schemas/components_schemas_ReconcileBlocked'
        reconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        resourceOverlay:
          type: object
        rollout:
          $ref: '#/components/schemas/components_schemas_Rollout'
        routingMode:
          type: string
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
        unappliedRemovals:
          description: |
            Requested spec removals (explicit JSON nulls) that did not take effect: another field manager also owns the field, so server-side apply retains it. Present only on the PATCH response, and only when at least one removal was blocked — an empty or absent array leaves the ordinary success path unchanged.
          items:
            $ref: '#/components/schemas/components_schemas_UnappliedRemoval'
          type: array
        version:
          type: string
        versionStatus:
          $ref: '#/components/schemas/components_schemas_VersionStatus'
      required:
      - name
      - namespace
      - cluster
      - phase
      - endpoint
      - headless
      - version
      - miteConnected
      - routingMode
      - reconcileBlocked
      - spec
      - kind
      type: object
    components_schemas_ControllerDiff:
      additionalProperties: false
      description: 'Diff between incoming bundle content and last-applied content.
        The jcasc and items text of both sides is redacted: each secret value shows
        as the marker "<redacted>". A key that contains password, secret, passphrase,
        privatekey, or token, and does not end in id, marks every value below it as
        a secret. Inside a domainCredentials or folderCredentials store, every value
        is a secret except id, scope, description, username, name, includes, excludes,
        and schemes. A jcasc value that is one whole ${...} reference to a named entry,
        a file, or a system property stays visible. Text that does not parse shows
        as "<redacted: unparseable content>". Every YAML comment is removed. No caller
        gets an unredacted value, and a rotated secret shows no difference.'
      properties:
        applied:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
        appliedUnavailable:
          type: boolean
        incoming:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
      type: object
    components_schemas_ControllerObservability:
      additionalProperties: false
      description: Normalized observability model for a controller.
      properties:
        capabilities:
          items:
            type: string
          type: array
        freshness:
          $ref: '#/components/schemas/components_schemas_FreshnessJSON'
        level:
          type: integer
        levelName:
          type: string
        sources:
          items:
            $ref: '#/components/schemas/components_schemas_SourceJSON'
          type: array
        summary:
          $ref: '#/components/schemas/components_schemas_SummaryJSON'
        warnings:
          items:
            type: object
          type: array
      required:
      - sources
      - capabilities
      - level
      - levelName
      - freshness
      type: object
    components_schemas_ControllerPatch:
      additionalProperties: false
      description: |
        Patch body for PATCH /controllers/{ns}/{name}. Exactly one top-level key `spec` is allowed — any other key returns 400 (N5).
      properties:
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
      type: object
    components_schemas_ControllerSpec:
      additionalProperties: false
      description: Desired state of a Controller. Transcribed from v1alpha1.ControllerSpec.
      properties:
        backupSpec:
          $ref: '#/components/schemas/components_schemas_BackupSpec'
        cell:
          $ref: '#/components/schemas/components_schemas_CellSpec'
        className:
          description: References a ControllerClass by name, layering its defaults
            between ProvisioningDefaults and the Controller's own spec.
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        endpoint:
          description: API endpoint URL for the controller.
          type: string
        headless:
          description: Blocks the Jenkins web UI for every non-admin caller. A cell
            is always headless.
          type: boolean
        hibernation:
          $ref: '#/components/schemas/components_schemas_HibernationSpec'
        ingressSpec:
          $ref: '#/components/schemas/components_schemas_IngressSpec'
        miteSpec:
          $ref: '#/components/schemas/components_schemas_MiteSpec'
        persistence:
          $ref: '#/components/schemas/components_schemas_PersistenceSpec'
        pluginSpec:
          $ref: '#/components/schemas/components_schemas_PluginSpec'
        podOverrides:
          $ref: '#/components/schemas/components_schemas_PodOverrides'
        powerState:
          description: Controls whether the controller runs. Hibernation is reported
            in status.hibernated, not requested here.
          enum:
          - ""
          - Running
          - Stopped
          type: string
        probes:
          $ref: '#/components/schemas/components_schemas_ProbesSpec'
        rbacSpec:
          $ref: '#/components/schemas/components_schemas_RBACSpec'
        reconciliationPolicy:
          $ref: '#/components/schemas/components_schemas_ReconciliationPolicy'
        resourceOverlay:
          $ref: '#/components/schemas/components_schemas_ResourceOverlay'
        resources:
          description: CPU/memory resource requests and limits (transcribed from corev1.ResourceRequirements).
          properties:
            limits:
              additionalProperties:
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                type: string
              description: Maximum resource limits for the Jenkins container.
              type: object
            requests:
              additionalProperties:
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                type: string
              description: Minimum resource requests for the Jenkins container.
              type: object
          type: object
        version:
          description: Controller version tag.
          type: string
      type: object
    components_schemas_ControllerSummary:
      additionalProperties: false
      description: Summary entry for each controller in the list.
      properties:
        appliedBundleHash:
          type: string
        attention:
          $ref: '#/components/schemas/components_schemas_ControllerAttention'
        cellPool:
          description: The controller's varroa.dev/cell-pool label. Absent while no
            label is set.
          type: string
        cluster:
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        createdAt:
          description: metadata.creationTimestamp, RFC 3339. Present for every controller.
          format: date-time
          type: string
        effectiveBundle:
          $ref: '#/components/schemas/components_schemas_EffectiveBundle'
        endpoint:
          description: External URL of the controller. A row of another cluster carries
            that cluster's own status.endpoint, or a URL from an explicit ingress
            host. It is empty when the host is not known or the controller is headless.
          type: string
        headless:
          description: Mirrors v1alpha1.IsHeadless. When true, endpoint is always
            the empty string, whatever the controller's Status.Endpoint carries.
          type: boolean
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        kind:
          description: Mirrors v1alpha1.IsCell. Always present, so a client never
            reads the kind from an absent field.
          enum:
          - cell
          - stateful
          type: string
        lastSeen:
          description: Last mite heartbeat, RFC3339 UTC. Absent when no mite has reported.
          type: string
        maxTenants:
          description: The same effective cap the cell usage read resolves. Absent
            for a controller that is not a cell.
          format: int32
          type: integer
        miteConnected:
          type: boolean
        miteVersion:
          type: string
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
        rolloutWave:
          description: RolloutWave from the reconciliation policy.
          type: integer
        routingMode:
          description: Either "subdomain" or "path".
          type: string
        tenantCount:
          description: The length of status.cell.tenants, never of status.cell.appliedTenants.
            Absent for a controller that is not a cell.
          format: int32
          type: integer
        unreadySince:
          description: status.cell.unreadySince, RFC 3339. Absent while the cell is
            ready.
          format: date-time
          type: string
        version:
          description: Desired Jenkins version (from spec.version).
          type: string
        warm:
          description: status.cell.warm. Absent for a controller that is not a cell.
          type: boolean
      required:
      - name
      - namespace
      - cluster
      - phase
      - endpoint
      - headless
      - miteConnected
      - routingMode
      - kind
      - createdAt
      type: object
    components_schemas_CreateBroodRequest:
      additionalProperties: false
      description: Request body to create or preview a brood operation.
      properties:
        clusters:
          description: Target clusters, or ["all"] for all known clusters. Defaults
            to the local cluster.
          items:
            type: string
          type: array
        namespace:
          description: Target namespace. Defaults to operator namespace.
          type: string
        spec:
          description: BroodOperationSpec (action, targets, execution).
          type: object
      type: object
    components_schemas_CreateControllerRequest:
      additionalProperties: false
      description: Request body for creating a controller. Wraps a Controller CR with
        optional inline bundle.
      properties:
        bundle:
          description: Optional inline ComposedBundleSpec.
          type: object
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_ControllerSpec'
      type: object
    components_schemas_CreateGroupRequest:
      additionalProperties: false
      properties:
        displayName:
          type: string
        members:
          items:
            type: string
          type: array
        name:
          type: string
      required:
      - name
      type: object
    components_schemas_CreateKeyRequest:
      additionalProperties: false
      description: Request body for creating or rotating an API key.
      properties:
        expiresIn:
          description: Optional duration string (e.g. "720h"), absent for no expiry.
          type: string
        name:
          description: Optional display name (≤128 chars). When rotating, an absent
            or empty name carries the old key's name forward.
          type: string
      type: object
    components_schemas_CreateRunNoteRequest:
      additionalProperties: false
      description: Send exactly one of body and sessionId.
      properties:
        body:
          maxLength: 16384
          type: string
        sessionId:
          format: uuid
          type: string
      type: object
    components_schemas_CreateRunRequest:
      additionalProperties: false
      description: |
        POST /pipelines/{tenant}/jobs/{job}/runs. clientToken, a UUIDv7, makes the request idempotent: the BFF uses it as the run identifier. A request with no clientToken is not idempotent.
      properties:
        clientToken:
          format: uuid
          type: string
        cluster:
          description: |
            Breaks a tie when the job path lies in more than one surviving tenant.
          type: string
        parameters:
          additionalProperties:
            type: string
          type: object
      type: object
    components_schemas_CreateUserRequest:
      additionalProperties: false
      description: Request body for creating a local account (admin only).
      properties:
        displayName:
          type: string
        email:
          type: string
        password:
          type: string
        purpose:
          description: Required when local accounts run beside OIDC.
          enum:
          - service
          - break-glass
          type: string
        username:
          type: string
      required:
      - username
      - password
      type: object
    components_schemas_DeployableNamespaces:
      additionalProperties: false
      description: The caller's create-authorized namespaces.
      properties:
        allowFreeform:
          type: boolean
        defaultNamespace:
          type: string
        degraded:
          description: True only when a remote target's inputs were unavailable.
          type: boolean
        namespaces:
          items:
            type: string
          type: array
      required:
      - namespaces
      - defaultNamespace
      - allowFreeform
      - degraded
      type: object
    components_schemas_EffectiveBundle:
      additionalProperties: false
      description: 'The ComposedBundle a controller is actually using, resolved. Read-only,
        and deliberately separate from composedBundleRef: that field is the raw spec
        value the dashboard writes back, so resolving into it would materialize an
        explicit reference to the starter bundle on the next save.'
      properties:
        builtIn:
          description: True when the controller names no bundle and resolved to the
            built-in starter bundle.
          type: boolean
        name:
          type: string
        namespace:
          type: string
      required:
      - name
      - namespace
      - builtIn
      type: object
    components_schemas_Error:
      additionalProperties: false
      properties:
        error:
          description: Human-readable error message.
          type: string
      required:
      - error
      type: object
    components_schemas_ExecuteGroovyPolicy:
      additionalProperties: false
      description: Governs the executeGroovy verb. Every field absent means enabled
        — a policy object that only some clusters carry must not change behaviour
        by its absence.
      properties:
        allowedNamespaces:
          description: Namespaces that may host an executeGroovy BroodOperation, matched
            against the operation's own namespace rather than its targets'. Empty
            means all, when enabled is not false.
          items:
            type: string
          type: array
        enabled:
          description: Absent means enabled.
          type: boolean
      type: object
    components_schemas_FleetLock:
      additionalProperties: false
      description: |
        One fleet lock row, from a varroa.lock step. tenant and jobPath are always present, whichever tenant the row belongs to. runLink is present only when the reading caller can read that row's own run. A waiting row reports its own waitingSince. A held or a releasing row reports its own acquiredAt and no waitingSince. The row carries no queue position and no derived holder: a consumer groups the rows it already has by name.
      properties:
        acquiredAt:
          description: |
            The time the run acquired the lock. Present on a held or a releasing row.
          format: date-time
          type: string
        cluster:
          description: The cluster of the run that holds or waits on the lock.
          type: string
        jobPath:
          description: The job path of the run that holds or waits on the lock.
          type: string
        name:
          description: |
            The qualified lock name: the owner tenant, a slash, and the bare lock name. A controller tenant holds a slash of its own, so do not split this value to find the owner.
          type: string
        runId:
          type: string
        runLink:
          description: |
            The run's own page path, /pipelines/{tenant}/{jobPath}/{runId}, the same link a run search result carries. Absent, not null, when the caller's own grant cannot read the row's own run.
          type: string
        state:
          enum:
          - waiting
          - held
          - releasing
          type: string
        tenant:
          description: The tenant of the run that holds or waits on the lock.
          type: string
        waitingSince:
          description: |
            The time the run began to wait. Present only on a waiting row.
          format: date-time
          type: string
      required:
      - name
      - cluster
      - tenant
      - jobPath
      - state
      - runId
      type: object
    components_schemas_FleetLockHolderCell:
      additionalProperties: false
      description: |
        The cell that still runs a releasing lock's holder. A restart of that cell ends the holder, and the lock then releases.
      properties:
        cluster:
          type: string
        name:
          type: string
        namespace:
          type: string
      required:
      - cluster
      - namespace
      - name
      type: object
    components_schemas_FleetLockListResponse:
      additionalProperties: false
      description: |
        GET /pipelines/{tenant}/locks and GET /locks. Both routes answer the rows in lock name order. In one name, the holder comes first, and the waiters follow in the order they began to wait.
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_FleetLock'
          type: array
      required:
      - items
      type: object
    components_schemas_FleetLockReleaseConflict:
      additionalProperties: false
      description: |
        The 409 body of POST /locks/release. holderCell is present only when a live pod still runs the lock's holder.
      properties:
        error:
          description: Human-readable refusal message.
          type: string
        holderCell:
          $ref: '#/components/schemas/components_schemas_FleetLockHolderCell'
      required:
      - error
      type: object
    components_schemas_FleetLockReleaseRequest:
      additionalProperties: false
      description: |
        POST /locks/release. name and runId identify the lock row. reason is stored in the audit record, so it is required.
      properties:
        name:
          description: The qualified lock name, as the lock reads answer it.
          minLength: 1
          type: string
        reason:
          description: Why the operator releases the lock. The activity row carries
            it.
          minLength: 1
          type: string
        runId:
          description: The run that holds the releasing lock.
          minLength: 1
          type: string
      required:
      - name
      - runId
      - reason
      type: object
    components_schemas_FleetLockReleaseResponse:
      additionalProperties: false
      description: |
        The released row. It names the owner of the run that held the lock.
      properties:
        cellInstance:
          description: The cell instance that held the lock.
          type: string
        cluster:
          type: string
        jobPath:
          type: string
        name:
          type: string
        runId:
          type: string
        state:
          enum:
          - released
          type: string
        tenant:
          type: string
      required:
      - name
      - runId
      - cluster
      - tenant
      - jobPath
      - state
      type: object
    components_schemas_FleetPluginClassCount:
      additionalProperties: false
      properties:
        class:
          type: string
        controllerCount:
          minimum: 0
          type: integer
      required:
      - class
      - controllerCount
      type: object
    components_schemas_FleetPluginCoverage:
      additionalProperties: false
      properties:
        clustersNotCovered:
          minimum: 0
          type: integer
        complete:
          type: boolean
        controllersDegraded:
          minimum: 0
          type: integer
        controllersDetailStale:
          minimum: 0
          type: integer
        controllersMissing:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginMissingController'
          type: array
        controllersReporting:
          minimum: 0
          type: integer
        controllersStale:
          minimum: 0
          type: integer
        controllersTotal:
          minimum: 0
          type: integer
        controllersTruncated:
          minimum: 0
          type: integer
      required:
      - complete
      - controllersTotal
      - controllersReporting
      - controllersStale
      - controllersDegraded
      - controllersTruncated
      - controllersDetailStale
      - controllersMissing
      - clustersNotCovered
      type: object
    components_schemas_FleetPluginDrillItem:
      additionalProperties: false
      properties:
        bootstrapApproximate:
          type: boolean
        class:
          type: string
        cluster:
          type: string
        collectedAt:
          type: string
        controller:
          type: string
        degraded:
          type: boolean
        detailPath:
          type: string
        detailStale:
          type: boolean
        namespace:
          type: string
        optionalEdgesDropped:
          type: boolean
        source:
          type: string
        stale:
          type: boolean
        truncated:
          type: boolean
        version:
          type: string
      required:
      - cluster
      - namespace
      - controller
      - version
      - class
      - source
      - collectedAt
      - detailPath
      - detailStale
      - stale
      - degraded
      - truncated
      - optionalEdgesDropped
      - bootstrapApproximate
      type: object
    components_schemas_FleetPluginDrilldown:
      additionalProperties: false
      properties:
        clusters:
          items:
            $ref: '#/components/schemas/components_schemas_ClusterFanoutStatus'
          type: array
        coverage:
          $ref: '#/components/schemas/components_schemas_FleetPluginCoverage'
        items:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginDrillItem'
          type: array
        name:
          type: string
        versions:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginVersionCount'
          type: array
      required:
      - name
      - items
      - versions
      - coverage
      - clusters
      type: object
    components_schemas_FleetPluginMissingController:
      additionalProperties: false
      properties:
        cluster:
          type: string
        name:
          type: string
        namespace:
          type: string
        reason:
          type: string
      required:
      - cluster
      - namespace
      - name
      - reason
      type: object
    components_schemas_FleetPluginRollupItem:
      additionalProperties: false
      properties:
        classes:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginClassCount'
          type: array
        controllerCount:
          minimum: 0
          type: integer
        name:
          type: string
        versions:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginVersionCount'
          type: array
      required:
      - name
      - controllerCount
      - versions
      - classes
      type: object
    components_schemas_FleetPluginVersionCount:
      additionalProperties: false
      properties:
        controllerCount:
          minimum: 0
          type: integer
        version:
          type: string
      required:
      - version
      - controllerCount
      type: object
    components_schemas_FleetPluginsRollup:
      additionalProperties: false
      properties:
        clusters:
          items:
            $ref: '#/components/schemas/components_schemas_ClusterFanoutStatus'
          type: array
        coverage:
          $ref: '#/components/schemas/components_schemas_FleetPluginCoverage'
        items:
          items:
            $ref: '#/components/schemas/components_schemas_FleetPluginRollupItem'
          type: array
      required:
      - items
      - coverage
      - clusters
      type: object
    components_schemas_FreshnessJSON:
      additionalProperties: false
      description: Observability freshness information.
      properties:
        miteTTL:
          type: integer
        observedAt:
          type: string
        stale:
          type: boolean
      required:
      - stale
      type: object
    components_schemas_GitBundleSource:
      additionalProperties: false
      description: Git source for a composed bundle input.
      properties:
        path:
          type: string
        repoURL:
          type: string
        revision:
          type: string
        secretRef:
          type: string
      required:
      - repoURL
      - path
      type: object
    components_schemas_GroupEntry:
      additionalProperties: false
      description: Entry for each group in the group list.
      properties:
        displayName:
          type: string
        memberCount:
          description: Number of members (from local and/or IDP sources).
          type: integer
        members:
          items:
            type: string
          type: array
        name:
          type: string
        source:
          description: Origin of the group.
          enum:
          - local
          - idp
          - both
          type: string
      required:
      - name
      - members
      - memberCount
      - source
      type: object
    components_schemas_HibernationSpec:
      additionalProperties: false
      description: Automatic hibernation configuration (transcribed from v1alpha1.HibernationSpec).
      properties:
        activityIgnoreRegex:
          description: Regular expression matched against request paths to exclude
            them from activity tracking.
          type: string
        enabled:
          description: Enables automatic hibernation. When enabled, the controller
            parks (scales to 0) after inactivity.
          type: boolean
        gracePeriodMinutes:
          description: Minutes of inactivity before the controller hibernates. Minimum
            5. Default 60.
          type: integer
      type: object
    components_schemas_IdentitySettings:
      additionalProperties: false
      description: Identity and OIDC configuration (admin view, client secret never
        included).
      properties:
        clientId:
          description: OIDC client ID (present in OIDC mode only).
          type: string
        cookieDomain:
          type: string
        defaultRead:
          type: boolean
        issuer:
          description: OIDC issuer URL (present in OIDC mode only).
          type: string
        localAccounts:
          description: True when declared local accounts sign in beside OIDC.
          type: boolean
        mode:
          enum:
          - local
          - ldap
          - oidc
          type: string
        scopes:
          description: OIDC scopes (present in OIDC mode only).
          items:
            type: string
          type: array
      required:
      - mode
      - cookieDomain
      - defaultRead
      - localAccounts
      type: object
    components_schemas_IngressSpec:
      additionalProperties: false
      description: Ingress configuration (transcribed from v1alpha1.IngressSpec).
      properties:
        annotations:
          additionalProperties:
            type: string
          description: Ingress annotations merged onto this controller's ingress.
          type: object
        host:
          description: Ingress hostname.
          type: string
        ingressClassName:
          description: Override the cluster-level ingress class name for this controller.
            Empty uses the cluster default.
          type: string
        mode:
          description: Controls how the controller is exposed. "subdomain" (default)
            assigns its own host; "path" serves at /jenkins/<ns>/<name>. Immutable
            after create.
          enum:
          - ""
          - subdomain
          - path
          type: string
        tlsSecretName:
          description: Name of the TLS secret.
          type: string
      type: object
    components_schemas_InputSummaryEntry:
      description: Mirror of a single ComposedBundle input for list rendering.
      properties:
        kind:
          type: string
        namespace:
          type: string
        type:
          type: string
      required:
      - kind
      - type
      type: object
    components_schemas_JenkinsLink:
      additionalProperties: false
      description: The Varroa page that a Jenkins item path resolves to.
      properties:
        link:
          description: A dashboard path, such as /pipelines/tenant/job/runId.
          type: string
      required:
      - link
      type: object
    components_schemas_JenkinsRole:
      description: A JenkinsRole CRD (cluster-scoped, data-plane permissions).
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_JenkinsRoleSpec'
      type: object
    components_schemas_JenkinsRoleBinding:
      description: A JenkinsRoleBinding CRD (cluster-scoped).
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          $ref: '#/components/schemas/components_schemas_JenkinsRoleBindingSpec'
      type: object
    components_schemas_JenkinsRoleBindingSpec:
      additionalProperties: false
      description: Spec for a JenkinsRoleBinding.
      properties:
        controllerScope:
          $ref: '#/components/schemas/components_schemas_VarroaRoleBindingScope'
        jenkinsScope:
          $ref: '#/components/schemas/components_schemas_JenkinsScope'
        roleRef:
          type: string
        subjects:
          items:
            $ref: '#/components/schemas/components_schemas_SubjectRef'
          type: array
      required:
      - subjects
      - roleRef
      type: object
    components_schemas_JenkinsRoleSpec:
      additionalProperties: false
      description: Spec for a JenkinsRole (Jenkins-level RBAC).
      properties:
        description:
          type: string
        permissions:
          items:
            type: string
          type: array
        roleType:
          enum:
          - Global
          - Item
          - Agent
          type: string
      required:
      - permissions
      type: object
    components_schemas_JenkinsScope:
      additionalProperties: false
      description: Jenkins-level scope for a binding.
      properties:
        folder:
          type: string
        pattern:
          type: string
        propagate:
          enum:
          - None
          - Children
          - Subtree
          type: string
        type:
          enum:
          - Global
          - Folder
          - Pattern
          type: string
      required:
      - type
      type: object
    components_schemas_JenkinsVersionProfile:
      additionalProperties: true
      description: A JenkinsVersionProfile CRD (cluster-scoped).
      properties:
        apiVersion:
          type: string
        kind:
          type: string
        metadata:
          additionalProperties: true
          type: object
        spec:
          additionalProperties: true
          type: object
        status:
          additionalProperties: true
          type: object
      required:
      - apiVersion
      - kind
      - metadata
      - spec
      type: object
    components_schemas_JobBranchHead:
      additionalProperties: false
      description: One branch, change request, or tag of a multibranch job.
      properties:
        changeRequest:
          $ref: '#/components/schemas/components_schemas_ChangeRequest'
        jobPath:
          description: The head's own job path, which its runs carry.
          type: string
        lastRun:
          $ref: '#/components/schemas/components_schemas_RunSummary'
        name:
          type: string
        orphaned:
          description: True when Jenkins no longer discovers the head as buildable.
          type: boolean
        revision:
          description: The last seen SCM revision of the head.
          type: string
      required:
      - name
      - jobPath
      - orphaned
      type: object
    components_schemas_JobBranchList:
      additionalProperties: false
      description: |
        GET /pipelines/{tenant}/jobs/{job}/branches. The inventory is up to ten minutes stale. A hibernated cell keeps its last export.
      properties:
        branches:
          items:
            $ref: '#/components/schemas/components_schemas_JobBranchHead'
          type: array
        changeRequests:
          description: Sorted by numeric change request id, newest first.
          items:
            $ref: '#/components/schemas/components_schemas_JobBranchHead'
          type: array
        indexResult:
          description: The result of the last Jenkins index.
          type: string
        indexedAt:
          description: When Jenkins last indexed the multibranch job.
          format: date-time
          type: string
        jobPath:
          type: string
        lastScan:
          $ref: '#/components/schemas/components_schemas_BranchScan'
        observedAt:
          description: When the cell last exported this job. Absent before the first
            export.
          format: date-time
          type: string
        repositories:
          description: |
            The repositories of an organization folder, sorted by name. A multibranch job has none.
          items:
            $ref: '#/components/schemas/components_schemas_JobBranchHead'
          type: array
        tags:
          items:
            $ref: '#/components/schemas/components_schemas_JobBranchHead'
          type: array
        truncated:
          description: True when the cell capped the number of heads it exported.
          type: boolean
      required:
      - jobPath
      - truncated
      - branches
      - changeRequests
      - tags
      - repositories
      type: object
    components_schemas_JobDeclaredBy:
      additionalProperties: false
      description: |
        Which input of the job's composed bundle declared it. Present when one bundle input resolved as the declarer. Absent when the bundle or every candidate input is unresolved.
      properties:
        bundle:
          $ref: '#/components/schemas/components_schemas_BundleRef'
        catalogItem:
          $ref: '#/components/schemas/components_schemas_CatalogItemRef'
        forge:
          description: |
            gitSource only: the forge that hosts repoURL. A Forgejo host reads gitea. The field is absent when the forge is unknown.
          enum:
          - github
          - gitlab
          - gitea
          type: string
        kind:
          enum:
          - gitSource
          - ociSource
          - itemRef
          type: string
        name:
          description: |
            gitSource: the input's repoURL. ociSource: the input's ociRef. itemRef: the CatalogItem name.
          type: string
        ociRef:
          description: Present only for kind ociSource.
          type: string
        path:
          description: The input's sub-path. Absent when the input declares no sub-path.
          type: string
        repoURL:
          description: Present only for kind gitSource.
          type: string
        revision:
          description: |
            A git SHA (gitSource), an OCI manifest digest (ociSource), or a CatalogItem content hash (itemRef). Absent when the composed bundle has not resolved this input yet.
          type: string
      required:
      - kind
      - name
      - bundle
      type: object
    components_schemas_KeyMeta:
      additionalProperties: false
      description: Non-secret metadata for an API key.
      properties:
        created:
          description: ISO 8601 creation time.
          type: string
        expires:
          description: ISO 8601 expiration time, absent if no expiry.
          type: string
        lastUsed:
          description: ISO 8601 last-use time, absent if never used.
          type: string
        name:
          description: Optional display name (≤128 chars). Absent when unnamed.
          type: string
        prefix:
          description: First 7 characters of the key.
          type: string
      required:
      - prefix
      - created
      type: object
    components_schemas_LiveDrift:
      additionalProperties: false
      description: Live-drift status for a controller.
      properties:
        detected:
          type: boolean
        detectedAt:
          type: string
        liveConfigHash:
          type: string
      required:
      - detected
      type: object
    components_schemas_LogEntry:
      additionalProperties: false
      description: A single structured log line from a controller.
      properties:
        level:
          enum:
          - ERROR
          - WARN
          - DEBUG
          - INFO
          type: string
        message:
          type: string
        source:
          type: string
        timestamp:
          format: date-time
          type: string
      required:
      - timestamp
      - level
      - source
      - message
      type: object
    components_schemas_LoginRequest:
      additionalProperties: false
      properties:
        password:
          type: string
        username:
          type: string
      required:
      - username
      - password
      type: object
    components_schemas_LoginResponse:
      additionalProperties: false
      description: |
        Successful login response. Uses snake_case to match OAuth2 conventions.
      properties:
        expires_in:
          description: Token lifetime in seconds.
          type: integer
        id_token:
          description: Signed JWT session token.
          type: string
      required:
      - id_token
      - expires_in
      type: object
    components_schemas_Me:
      additionalProperties: false
      description: Current user information, enriched from JWT claims and User CRD.
      properties:
        authMode:
          description: Source of this session. A local account beside OIDC reports
            local.
          enum:
          - local
          - ldap
          - oidc
          type: string
        displayName:
          type: string
        email:
          type: string
        groups:
          items:
            type: string
          type: array
        lastLogin:
          description: ISO 8601 last login time, absent if never logged in.
          type: string
        name:
          type: string
        preferences:
          $ref: '#/components/schemas/components_schemas_Preferences'
        preferredUsername:
          type: string
        signedInAt:
          description: Issue time of the session token. Absent for an API key caller.
          format: date-time
          type: string
        subject:
          type: string
      required:
      - subject
      - email
      - name
      - groups
      - authMode
      type: object
    components_schemas_MissingPlugin:
      additionalProperties: false
      description: A composed bundle's plugin pin absent from the resolved plugin
        set.
      properties:
        artifactId:
          type: string
        bundleVersion:
          type: string
      required:
      - artifactId
      - bundleVersion
      type: object
    components_schemas_MiteImageStatus:
      additionalProperties: false
      description: Read-only projection of mite image staleness.
      properties:
        image:
          nullable: true
          type: string
        stale:
          nullable: true
          type: boolean
      type: object
    components_schemas_MiteSpec:
      additionalProperties: false
      description: Mite sidecar configuration (transcribed from v1alpha1.MiteSpec).
      properties:
        image:
          description: Mite sidecar container image override for this Controller.
          type: string
        imagePullPolicy:
          description: Mite sidecar image pull policy override for this Controller.
          enum:
          - Always
          - Never
          - IfNotPresent
          type: string
        resources:
          description: CPU/memory resource requests and limits for the mite sidecar
            container.
          properties:
            limits:
              additionalProperties:
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                type: string
              description: Maximum resource limits.
              type: object
            requests:
              additionalProperties:
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                type: string
              description: Minimum resource requests.
              type: object
          type: object
      type: object
    components_schemas_MyAssistant:
      properties:
        available:
          type: boolean
        dataSharing:
          enum:
          - none
          - metadata
          - logs
          type: string
        dayBudget:
          format: int64
          type: integer
        dayTokens:
          format: int64
          type: integer
        effectiveLevels:
          additionalProperties:
            enum:
            - none
            - metadata
            - logs
            type: string
          type: object
        enabled:
          type: boolean
        model:
          type: string
        provider:
          type: string
        sessionKey:
          nullable: true
          properties:
            provider:
              type: string
          type: object
      required:
      - available
      type: object
    components_schemas_MyAssistantKeyRequest:
      additionalProperties: false
      properties:
        apiKey:
          minLength: 1
          type: string
          writeOnly: true
        provider:
          type: string
      required:
      - provider
      - apiKey
      type: object
    components_schemas_MyAssistantUpdate:
      additionalProperties: false
      properties:
        dataSharing:
          enum:
          - none
          - metadata
          - logs
          type: string
        enabled:
          type: boolean
        model:
          type: string
        provider:
          type: string
      type: object
    components_schemas_OCIBundleSource:
      additionalProperties: false
      description: OCI artifact source for a composed bundle input.
      properties:
        path:
          description: Optional sub-path within the artifact.
          type: string
        ref:
          description: OCI artifact reference.
          type: string
        secretRef:
          description: Optional pull-credential Secret name.
          type: string
      required:
      - ref
      type: object
    components_schemas_ObjectMeta:
      description: Slim Kubernetes ObjectMeta for CRD-shaped request/response bodies.
      properties:
        annotations:
          additionalProperties:
            type: string
          type: object
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        namespace:
          type: string
      type: object
    components_schemas_PendingDeletion:
      additionalProperties: false
      description: Pending item deletion.
      properties:
        approval:
          $ref: '#/components/schemas/components_schemas_PendingDeletionApproval'
        detectedAt:
          type: string
        path:
          type: string
        reason:
          type: string
      required:
      - path
      type: object
    components_schemas_PendingDeletionApproval:
      additionalProperties: false
      description: An approved delete of a pending item. The entry stays until the
        mite confirms the delete. Error is set when the mite reports a failed delete.
      properties:
        approvedAt:
          type: string
        commandId:
          type: string
        error:
          type: string
        failedAt:
          type: string
      required:
      - commandId
      - approvedAt
      type: object
    components_schemas_PendingPluginRoll:
      additionalProperties: false
      description: Pending plugin roll information.
      properties:
        changes:
          items:
            type: string
          type: array
        since:
          type: string
        targetChecksum:
          type: string
      required:
      - targetChecksum
      - since
      type: object
    components_schemas_PendingRestart:
      additionalProperties: false
      description: Pending restart information.
      properties:
        changes:
          items:
            type: string
          type: array
        contentHash:
          description: Hash of the JCasC, RBAC, and items of the pending change. Send
            it as expectedContentHash to approve this change only.
          type: string
        desiredStateHash:
          type: string
        detectedAt:
          type: string
      required:
      - detectedAt
      - desiredStateHash
      type: object
    components_schemas_PermissionScopes:
      additionalProperties: false
      description: Scope-aware introspection result for /me/permissions.
      properties:
        global:
          allOf:
          - $ref: '#/components/schemas/components_schemas_APICapabilitySet'
          description: Capabilities from cluster-wide (nil-scope) bindings only.
        scopes:
          description: One entry per distinct scoped binding scope.
          items:
            $ref: '#/components/schemas/components_schemas_ScopedCapabilities'
          nullable: true
          type: array
        tenants:
          description: One entry per pipelines-tenant grant the caller holds. Always
            an array, never null.
          items:
            $ref: '#/components/schemas/components_schemas_TenantCapabilities'
          type: array
      required:
      - global
      - scopes
      - tenants
      type: object
    components_schemas_PersistenceSpec:
      additionalProperties: false
      description: Persistent volume size/class (transcribed from v1alpha1.PersistenceSpec).
      properties:
        size:
          description: Persistent volume storage request (e.g. "20Gi").
          type: string
        storageClass:
          description: Kubernetes StorageClass name for the persistent volume.
          type: string
      type: object
    components_schemas_PinConflict:
      additionalProperties: false
      description: A composed bundle's plugin pin whose version conflicts with the
        resolved plugin set.
      properties:
        artifactId:
          type: string
        bundleVersion:
          type: string
        setVersion:
          type: string
      required:
      - artifactId
      - bundleVersion
      - setVersion
      type: object
    components_schemas_PinPreflightReport:
      additionalProperties: false
      description: Plugin-pin preflight result comparing a composed bundle's pins
        against the resolved plugin set.
      properties:
        conflicts:
          items:
            $ref: '#/components/schemas/components_schemas_PinConflict'
          type: array
        missing:
          items:
            $ref: '#/components/schemas/components_schemas_MissingPlugin'
          type: array
      required:
      - conflicts
      - missing
      type: object
    components_schemas_PipelineDefinition:
      additionalProperties: false
      description: |
        Where a job's pipeline script comes from. The catalog template, when one exists, is reported separately on PipelineJobDetail.template — see PipelineTemplateInfo.
      properties:
        declaredBy:
          $ref: '#/components/schemas/components_schemas_JobDeclaredBy'
        definitionPath:
          description: |
            The Jenkinsfile's script path within its own repository, from the job's last run. Present only when source is jenkinsfile and the run recorded one.
          type: string
        jenkinsfileCommit:
          description: The last build's checked-out commit, from its run record.
          type: string
        jenkinsfileForge:
          description: |
            The forge that hosts jenkinsfileRepo. A Forgejo host reads gitea. The field is absent when the forge is unknown.
          enum:
          - github
          - gitlab
          - gitea
          type: string
        jenkinsfileRepo:
          type: string
        profile:
          description: The version profile in effect for this job's controller.
          type: string
        source:
          description: |
            jenkinsfile when the script is read from source control, inline when the bundle item carries the script itself, and template when the item's definition names a catalog template (varroaTemplate). A marker-defined multibranch job reads its marker from a repository, so it reports jenkinsfile; its template is on PipelineJobDetail.template.
          enum:
          - jenkinsfile
          - inline
          - template
          type: string
      required:
      - source
      type: object
    components_schemas_PipelineDependencies:
      additionalProperties: false
      description: |
        The job's cross-tenant dependency edges (design D13). Both arrays are empty, never omitted, for a job that declares no cross-tenant trigger and has no subscriber.
      properties:
        downstream:
          description: The varroa-upstream rows naming this job as their producer.
          items:
            $ref: '#/components/schemas/components_schemas_PipelineDependencyEdge'
          type: array
        upstream:
          description: The varroa-upstream trigger rows this job declares.
          items:
            $ref: '#/components/schemas/components_schemas_PipelineDependencyEdge'
          type: array
      required:
      - upstream
      - downstream
      type: object
    components_schemas_PipelineDependencyEdge:
      additionalProperties: false
      description: |
        One cross-tenant dependency edge: a producer tenant and job, the result threshold the edge fires on, and whether the producer's exports currently grant it. A declared edge whose grant is missing is not hidden; it appears with granted false.
      properties:
        granted:
          description: |
            The grant evaluator's fanout-path verdict, read from the producer's exports.
          type: boolean
        job:
          description: The job's name, relative to the other tenant's folder.
          type: string
        jobPath:
          description: |
            The job's path with its tenant folder. The job page route takes this path.
          type: string
        lastRun:
          allOf:
          - $ref: '#/components/schemas/components_schemas_RunLink'
          description: |
            The edge's most recent run within the last 30 days. Absent when no such run exists. A run the caller may not read carries its tenant alone.
        result:
          description: The result threshold the edge fires on.
          enum:
          - SUCCESS
          - UNSTABLE
          - FAILURE
          type: string
        tenant:
          description: The producer tenant's identifier.
          type: string
      required:
      - tenant
      - job
      - jobPath
      - result
      - granted
      type: object
    components_schemas_PipelineJobDetail:
      additionalProperties: false
      description: GET /pipelines/{tenant}/jobs/{job}.
      properties:
        definition:
          $ref: '#/components/schemas/components_schemas_PipelineDefinition'
        dependencies:
          $ref: '#/components/schemas/components_schemas_PipelineDependencies'
        durationTrendMs:
          items:
            format: int64
            type: integer
          type: array
        health:
          enum:
          - clear
          - cloudy
          - rain
          - unknown
          type: string
        jobPath:
          type: string
        kind:
          description: |
            The job's kind. A declared pipeline, multibranch, or organization folder item sets it. Otherwise a child of a multibranch job or of a project the inventory reports is a branch, and a project the inventory reports is a multibranch job. A run alone marks a pipeline job.
          enum:
          - pipeline
          - multibranch
          - organizationFolder
          - branch
          - unknown
          type: string
        last30Days:
          allOf:
          - $ref: '#/components/schemas/components_schemas_PipelineLast30Days'
          description: |
            Null when the record store could not answer the window query; the rest of the job page still renders.
          nullable: true
        lastBuild:
          $ref: '#/components/schemas/components_schemas_RunSummary'
        parameters:
          items:
            $ref: '#/components/schemas/components_schemas_PipelineParameter'
          type: array
        pending:
          description: |
            True when every tenant that declares this job reports a complete job list that lacks it. False when a declaring tenant has an unknown inventory, when a declaring tenant holds the job, when the job has a run, and when no tenant declares the job.
          type: boolean
        template:
          allOf:
          - $ref: '#/components/schemas/components_schemas_PipelineTemplateInfo'
          description: Absent for a job with no catalog template (a Jenkinsfile job).
        tenant:
          description: |
            The tenant noun the server authorizes against, from TenantRef.Tenant: a Tenant name for a Tenant tenant, or "<namespace>/<controller>" for a synthetic tenant.
          type: string
        tenantFolder:
          description: |
            The tenant's Jenkins folder prefix, from TenantRef.Folder. Empty for a root-hosted tenant.
          type: string
        triggers:
          $ref: '#/components/schemas/components_schemas_PipelineTriggers'
        waiting:
          description: Queued runs of this job that a concurrency cap holds. Absent
            when none waits.
          items:
            $ref: '#/components/schemas/components_schemas_RunWaitEntry'
          maxItems: 50
          type: array
      required:
      - jobPath
      - kind
      - pending
      - health
      - last30Days
      - tenantFolder
      - tenant
      - dependencies
      type: object
    components_schemas_PipelineJobRetention:
      additionalProperties: false
      description: One per-job window rule of a pipelines tenant.
      properties:
        days:
          description: The window the rule names, in days, before the store cap.
          type: integer
        effectiveDays:
          description: The window the rule gives, in days, after the store cap.
          type: integer
        job:
          description: The folder-relative job glob.
          type: string
      required:
      - job
      - days
      - effectiveDays
      type: object
    components_schemas_PipelineLast30Days:
      additionalProperties: false
      description: The job's "Last 30 days" card, GET /pipelines/{tenant}/jobs/{job}.
      properties:
        builds:
          description: Every run created in the window, whatever its status.
          format: int64
          type: integer
        medianDurationMs:
          description: The median duration_ms over finished runs. Null when the window
            holds no finished run.
          format: int64
          nullable: true
          type: integer
        medianQueueWaitMs:
          description: The median wait between a build's queued moment and its started
            moment, in milliseconds. Absent when the job started no build in that
            window.
          format: int64
          type: integer
        passRate:
          description: The share of finished runs whose result is SUCCESS. Null when
            the window holds no finished run.
          format: double
          nullable: true
          type: number
        slowestStage:
          allOf:
          - $ref: '#/components/schemas/components_schemas_PipelineSlowestStage'
          description: Null when no run in the window carries a finished stage.
          nullable: true
      required:
      - builds
      type: object
    components_schemas_PipelineListResponse:
      additionalProperties: false
      description: |
        GET /pipelines/{tenant}: the job list, unioned with the catalog's declared jobs, plus the running-now strip.
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_PipelineSummary'
          type: array
        retention:
          $ref: '#/components/schemas/components_schemas_PipelineRetention'
        runningNow:
          items:
            $ref: '#/components/schemas/components_schemas_RunningRun'
          type: array
        tenantFolder:
          description: |
            The Jenkins folder that prefixes every job path in the response. It is the Tenant name for a placed pipelines tenant. It is the empty string for a controller tenant. The field is always present.
          type: string
        truncated:
          description: |
            True when any tenant's running-now page was full (50 rows), so the strip does not claim completeness.
          type: boolean
      required:
      - items
      - runningNow
      - truncated
      - tenantFolder
      - retention
      type: object
    components_schemas_PipelineMarkerFinding:
      additionalProperties: false
      description: One line of the lint table's SEVERITY, PATH, and MESSAGE columns.
      properties:
        message:
          type: string
        path:
          type: string
        severity:
          enum:
          - error
          type: string
      required:
      - severity
      - message
      type: object
    components_schemas_PipelineMarkerValidateRequest:
      additionalProperties: false
      description: POST /pipelines/{tenant}/markers/validate.
      properties:
        marker:
          description: The marker file's raw text, at most 64 KiB.
          type: string
      required:
      - marker
      type: object
    components_schemas_PipelineMarkerValidateResponse:
      additionalProperties: false
      description: |
        findings is empty when the marker resolved against the tenant's delivered set and its values validated; templateName and templateVersion are then present.
      properties:
        findings:
          items:
            $ref: '#/components/schemas/components_schemas_PipelineMarkerFinding'
          type: array
        templateName:
          type: string
        templateVersion:
          type: string
      required:
      - findings
      type: object
    components_schemas_PipelineParameter:
      additionalProperties: false
      description: |
        One declared build parameter, converted from the items engine's parameter kind into a JSON Schema fragment the frontend's form renders directly.
      properties:
        defaultValue:
          type: string
        description:
          type: string
        kind:
          enum:
          - string
          - boolean
          - choice
          - text
          - password
          type: string
        name:
          type: string
        schema:
          description: A JSON Schema fragment for this one field.
          type: object
        uiWidget:
          enum:
          - textarea
          - password
          type: string
      required:
      - name
      - kind
      - schema
      type: object
    components_schemas_PipelineRetention:
      additionalProperties: false
      description: The record-store windows that apply to one pipelines tenant.
      properties:
        effectiveDays:
          description: The window a job without a matching rule gets, in days.
          type: integer
        jobs:
          description: The per-job rules, in match order.
          items:
            $ref: '#/components/schemas/components_schemas_PipelineJobRetention'
          type: array
        storeDays:
          description: The store-wide runs window, in days. It caps every other window.
          type: integer
        tenantDays:
          description: The tenant window, in days. Absent when the tenant sets none.
          type: integer
      required:
      - storeDays
      - effectiveDays
      - jobs
      type: object
    components_schemas_PipelineSlowestStage:
      additionalProperties: false
      description: The stage with the greatest median duration across the window's
        runs.
      properties:
        durationMs:
          format: int64
          type: integer
        name:
          type: string
      required:
      - name
      - durationMs
      type: object
    components_schemas_PipelineSummary:
      additionalProperties: false
      description: |
        One job's run-history summary for the Pipelines table. A job that has never run carries no lastBuild.
      properties:
        durationTrendMs:
          description: The most recent runs' duration, newest first.
          items:
            format: int64
            type: integer
          type: array
        health:
          description: |
            The weather glyph, computed from the last five runs: clear when all passed, cloudy when one or two failed, rain when three or more failed, unknown for a job that has never run.
          enum:
          - clear
          - cloudy
          - rain
          - unknown
          type: string
        jobPath:
          type: string
        kind:
          description: |
            The job's kind. A declared pipeline, multibranch, or organization folder item sets it. Otherwise a child of a multibranch job or of a project the inventory reports is a branch, and a project the inventory reports is a multibranch job. A run alone marks a pipeline job. Any other job reports unknown.
          enum:
          - pipeline
          - multibranch
          - organizationFolder
          - branch
          - unknown
          type: string
        lastBuild:
          $ref: '#/components/schemas/components_schemas_RunSummary'
        medianQueueWaitMs:
          description: |
            The median wait between a build's queued moment and its started moment, in milliseconds, over the trailing 30 days. Absent when the job started no build in that window.
          format: int64
          type: integer
        pending:
          description: |
            True when every tenant that declares this job reports a complete job list that lacks it. False when a declaring tenant has an unknown inventory, when a declaring tenant holds the job, when the job has a run, and when no tenant declares the job.
          type: boolean
      required:
      - jobPath
      - health
      - kind
      - pending
      type: object
    components_schemas_PipelineTemplateInfo:
      additionalProperties: false
      description: |
        The resolved catalog template for a job, read from the record store (marker-defined) or the items engine and catalog (items-declared). Absent from PipelineJobDetail for a job with no catalog template.
        For source "marker": name, version, and asOfBuild are absent before the job's first run — markerPath and source are always present. markerRevision is the trusted revision the cell read the marker from, not the branch tip. For source "items": only name, version, and source are set.
      properties:
        asOfBuild:
          format: int64
          type: integer
        markerPath:
          type: string
        markerRevision:
          type: string
        name:
          type: string
        source:
          enum:
          - marker
          - items
          type: string
        version:
          type: string
      required:
      - source
      type: object
    components_schemas_PipelineTemplateSummary:
      additionalProperties: false
      description: One pipeline-template a composition delivered.
      properties:
        description:
          type: string
        displayName:
          type: string
        name:
          type: string
        version:
          type: string
      required:
      - name
      - version
      type: object
    components_schemas_PipelineTenant:
      additionalProperties: false
      description: |
        One row of GET /pipelines. cell and cellNamespace are set only on a placed row.
      properties:
        cell:
          description: The slot-0 cell Controller that holds the tenant.
          type: string
        cellNamespace:
          description: The namespace of that cell Controller.
          type: string
        cluster:
          description: |
            The cluster that holds the tenant's cell. An unplaced local Tenant names the local cluster. A local Tenant whose namespaces hold a controller, and which has no spec.pipelines, also names the local cluster.
          type: string
        name:
          description: The Tenant name, which is also its tenant name.
          type: string
        placed:
          description: |
            True when a cell holds the tenant. A controller-namespace Tenant answers false.
          type: boolean
      required:
      - name
      - cluster
      - placed
      type: object
    components_schemas_PipelineTenantList:
      additionalProperties: false
      description: |
        GET /pipelines. The rows are in (name, cluster) order.
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_PipelineTenant'
          type: array
        recordStore:
          description: |
            False when the record store is off or its schema is too old. The list then carries no Tenant that another cluster holds.
          type: boolean
      required:
      - items
      - recordStore
      type: object
    components_schemas_PipelineTriggers:
      additionalProperties: false
      properties:
        concurrency:
          type: integer
        pullRequest:
          type: boolean
        push:
          type: boolean
        schedule:
          type: string
        webhook:
          description: True when the job declares a genericTrigger. The token is not
            returned.
          type: boolean
      type: object
    components_schemas_PluginAdvisory:
      additionalProperties: false
