        Where a job's pipeline script comes from. The catalog template, when one exists, is reported separately on PipelineJobDetail.template — see PipelineTemplateInfo.
      properties:
        declaredBy:
          $ref: '#/components/schemas/components_schemas_JobDeclaredBy'
