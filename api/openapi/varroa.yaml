          description: The abort was requested.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The input identifier is empty.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Rejects one pending input step as the calling user. Fire and forget.
      tags:
      - Pipelines
  /api/v1/runs/{run}/inputs/{input}/proceed:
    post:
      description: |
        The BFF publishes one PROCEED_INPUT command and does not wait for Jenkins. The plugin applies the step's own declared defaults for every parameter the request omits.
      operationId: proceedRunInput
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      - $ref: '#/components/parameters/components_parameters_input'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                parameters:
                  additionalProperties:
                    type: string
                  description: |
                    Input parameter values, as a map of name to string value. A name the step does not declare is dropped.
                  type: object
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_CancelRunResponse'
          description: The proceed was requested.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The input identifier is empty, or the request body does not
            decode.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Answers one pending input step as the calling user. Fire and forget.
      tags:
      - Pipelines
  /api/v1/runs/{run}/log:
    get:
      description: |
        Plays the stored log as Server-Sent Events, then attaches the live tail while the run is not terminal. raw=true returns the plain console text instead of an event stream, with no new path.
      operationId: streamRunLog
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      - description: Byte offset of the first unread byte.
        in: query
        name: from
        schema:
          default: 0
          format: int64
          type: integer
      - description: 1-based line number starting at from.
        in: query
        name: fromLine
        schema:
          type: integer
      - description: true returns text/plain with no SSE.
        in: query
        name: raw
        schema:
          default: false
          type: boolean
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: |
            The event stream (event kinds meta, stage, line, gap, live, end) or, with raw=true, the plain console text.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Streams a run's console log, history then the live tail.
      tags:
      - Pipelines
      x-sse: true
  /api/v1/runs/{run}/replay:
    post:
      description: |
        The BFF applies the eligibility rules of the script read, mints a new run identifier, and publishes one REPLAY_BUILD command to the job's home member. It does not wait for Jenkins. Each call starts its own build with its own build number.
      operationId: replayRun
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                script:
                  description: |
                    The edited main script, at most 262144 UTF-8 bytes. A larger script answers 413. The library scripts load again from their library, so the body holds no library script.
                  type: string
              required:
              - script
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunActionResponse'
          description: The replay was requested.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The request body does not decode, or the script is empty.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: |
            The run does not replay. The message names the reason, one of the reason values of the script read.
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The script is larger than 256 KiB.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Starts a new build of the run's job with an edited script. Fire and
