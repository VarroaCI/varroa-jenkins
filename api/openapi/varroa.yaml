          properties:
            limits:
              additionalProperties:
                type: string
              description: Maximum resource limits.
              type: object
            requests:
              additionalProperties:
                type: string
              description: Minimum resource requests.
              type: object
          type: object
      type: object
    components_schemas_OCIBundleSource:
      additionalProperties: false
