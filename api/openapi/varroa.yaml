  /api/v1/version-candidates:
    get:
      description: |
        Lists ProfileCandidate resources across every JenkinsVersionProfile. Clusterless — resolved directly against the CRD store.
      operationId: listVersionCandidates
      responses:
        "200":
          content:
            application/json:
              schema:
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/components_schemas_ProfileCandidate'
                    type: array
                  upstreamMetadata:
                    description: |
                      State of the Jenkins upstream metadata host. off means Varroa does not discover upgrade candidates.
                    enum:
                    - online
                    - mirror
                    - "off"
                    type: string
                required:
                - items
                - upstreamMetadata
                type: object
          description: Candidates listed.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "405":
