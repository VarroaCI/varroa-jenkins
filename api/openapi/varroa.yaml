  /api/v1/pipelines/{tenant}/propose:
    post:
      description: |
        Checks the repository, then starts an assistant session with the fixed prompt propose-pipeline. The session reads the repository and asks for one approval before it opens a pull request. The checks run in this order, and nothing is written before the last one. Each refusal answers its code and creates no session. 1. The assistant is on the server (503 assistant_disabled). 2. The caller holds assistant use (403). 3. The body is valid (400). 4. The user's assistant switch is on (409 assistant_off). 5. The Tenant is a pipelines tenant the caller reads (404), and the caller
           holds the tenant write check (403).
        6. The repo is an https URL on port 443 (400 repo_url_invalid). 7. The data level of the tenant and provider shows read_repo_file
           (409 data_sharing_too_low).
        8. The operator finds a credential that reaches the forge and a
           Jenkinsfile and a proposal branch are absent (422, 409, 502, or 404
           by the code of the forge reply, 504 operator_timeout when the
           operator does not answer in time, or 503 operator_unavailable when
           no operator receives the check).
        9. The assistant is not busy (429 assistant_busy). Codes from the forge check: no_matching_credential, forge_unsupported, forge_auth_failed, forge_write_denied (422); jenkinsfile_exists and proposal_branch_exists (409); not_found (404); forge_unreachable (502); operator_timeout (504); operator_unavailable (503).
      operationId: proposePipeline
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_ProposePipelineRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ProposePipelineResponse'
          description: The session started. The state is running, waiting_approval,
            or skipped.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ProposePipelineError'
          description: A bad body, or a repo_url_invalid, invalid_request, or forge
            code of a bad request.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ProposePipelineError'
          description: The assistant is off, the data level hides read_repo_file,
            or the forge found a Jenkinsfile or a proposal branch.
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ProposePipelineError'
          description: No credential reaches the forge, or the credential may not
            write.
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ProposePipelineError'
          description: The user has too many running sessions (assistant_busy).
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ProposePipelineError'
          description: The forge did not answer, or the forge relay failed (forge_unreachable).
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ProposePipelineError'
          description: The assistant is disabled, its kill switch is set, or no operator
            received the forge check (operator_unavailable).
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_ProposePipelineError'
          description: The operator did not answer in time (operator_timeout).
      summary: Starts an assistant session that proposes a first Jenkinsfile for a
        repository.
      tags:
      - Pipelines
  /api/v1/pipelines/{tenant}/stream:
    get:
      description: |
        Streams one frame per live run notification, with the event name run, stage, lock, input, or wait and the notification body as data. The stream writes no initial frame and replays nothing, so a page refetches its own reads when the stream reports itself open. It uses `?ticket=` for browser EventSource auth, and the ticket carries the scope pipelines:{tenant}.
      operationId: streamTenantRuns
      parameters:
      - $ref: '#/components/parameters/components_parameters_tenant'
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: The event stream (event kinds run, stage, lock, input, and
            wait).
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Streams live run notifications for one tenant via Server-Sent Events.
      tags:
      - Pipelines
      x-sse: true
