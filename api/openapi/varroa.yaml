            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
        appliedUnavailable:
          type: boolean
        incoming:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
      type: object
    ControllerObservability:
      additionalProperties: false
