            and can express none of these facts.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemClosureEntry'
          type: array
        compat:
          description: One advisory verdict per JenkinsVersionProfile. Never blocks
            anything.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemCompat'
          type: array
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_TemplateCatalogCondition'
          type: array
        content:
          type: string
        contentHash:
          type: string
        message:
          type: string
        observedRevision:
          type: string
        valid:
          type: boolean
      type: object
    components_schemas_CatalogItemSummary:
      additionalProperties: false
      description: Summary projection returned by catalog item list responses.
      properties:
        compat:
          description: The item's advisory per-profile verdicts, so a row can be badged
            without a per-item detail fetch. A badge never disables selection.
          items:
            $ref: '#/components/schemas/components_schemas_CatalogItemCompat'
          type: array
        contentHash:
          type: string
        description:
          type: string
        displayName:
          type: string
        message:
          type: string
        name:
          type: string
        namespace:
          type: string
        pluginName:
