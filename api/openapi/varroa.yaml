    ControllerDiff:
      additionalProperties: false
      description: 'Diff between incoming bundle content and last-applied content.
        The jcasc and items text of both sides is redacted: each secret value shows
        as the marker "<redacted>". A key that contains password, secret, passphrase,
        privatekey, or token, and does not end in id, marks every value below it as
        a secret. Inside a domainCredentials or folderCredentials store, every value
        is a secret except id, scope, description, username, name, includes, excludes,
        and schemes. A jcasc value that is one whole ${...} reference to a named entry,
        a file, or a system property stays visible. Text that does not parse shows
        as "<redacted: unparseable content>". Every YAML comment is removed. No caller
        gets an unredacted value, and a rotated secret shows no difference.'
      properties:
        applied:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
        appliedUnavailable:
          type: boolean
        incoming:
          properties:
            items:
              type: string
            jcasc:
              type: string
            plugins:
              type: string
          type: object
      type: object
