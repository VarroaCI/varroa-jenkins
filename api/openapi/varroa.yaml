    components_schemas_BackupSpec:
      additionalProperties: false
      description: Backup configuration (transcribed from v1alpha1.BackupSpec).
      properties:
        enabled:
          description: Whether backups are enabled.
          type: boolean
        retentionDays:
          description: Number of days to retain backups.
          type: integer
        schedule:
          description: Cron expression for the backup schedule.
          type: string
      type: object
    components_schemas_BindingFederationStatus:
      description: Federation outcome of a binding on one hive, or a federation fault
        of a role on one hive.
      properties:
        cluster:
          description: Hive cluster name.
          type: string
        lastTransitionTime:
          description: Time the state, reason, or message last changed.
          format: date-time
          type: string
        message:
          description: Human-readable detail for the state.
          type: string
        reason:
          description: CamelCase code for the state. Skipped codes are NoSubjects,
            TenantScope, RoleNotFound, NoJenkinsProjection, JenkinsRoleNotFound, NonGlobalJenkinsRole,
            and ReservedRole. Failed codes are HiveUnavailable, JenkinsRoleCollision,
            JenkinsRoleWriteFailed, JenkinsRoleBindingCollision, JenkinsRoleBindingWriteFailed,
            StaleJenkinsRoleBindingDeleteFailed, and StaleJenkinsRoleDeleteFailed.
            StaleJenkinsRoleDeleteFailed occurs only on a VarroaRole. The federated
            code is Federated.
          type: string
        state:
          enum:
          - federated
          - skipped
          - failed
          type: string
      required:
      - cluster
      - state
      - lastTransitionTime
      type: object
