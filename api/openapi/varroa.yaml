    components_schemas_RunChangeListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_RunChange'
          type: array
      required:
      - items
      type: object
    components_schemas_RunCommandRefusal:
      additionalProperties: false
      description: |
        The newest cancel or input answer the Jenkins plugin refused for this run, on GET /runs/{run}. The field is absent when no such refusal exists. A later successful command does not remove it. The notice carries its own time, so a reader compares it with the run state.
      properties:
        actor:
          description: The person or service that sent the command.
          type: string
        command:
          description: The refused command.
          enum:
          - cancel
          - proceed_input
          - abort_input
          type: string
        error:
          description: |
            The refusal text. The mite keeps the title of a Jenkins error page, and the gateway cuts the text at 512 characters.
          type: string
        httpStatus:
          description: The HTTP status the plugin answered.
          type: integer
        refusedAt:
          description: The time the gateway received the refusal.
          format: date-time
          type: string
      required:
      - command
      - refusedAt
      type: object
    components_schemas_RunDetail:
      additionalProperties: false
      description: GET /runs/{run}.
      properties:
        actor:
          type: string
        branch:
          type: string
        buildNumber:
          format: int64
          type: integer
        cases:
          description: |
            The run's stored failed and skipped test cases, the same entries GET /runs/{run}/tests serves. The field is absent when the run holds no stored case.
          items:
            $ref: '#/components/schemas/components_schemas_RunTestCase'
          type: array
        cause:
          type: string
        commandRefusal:
          $ref: '#/components/schemas/components_schemas_RunCommandRefusal'
        digest:
          additionalProperties: false
          description: |
            Why a run that did not succeed failed. The server computes this object on every read, from the stored rows and the stored log. The field is absent for a run with no result, for a SUCCESS or TRIGGER_FAILED result, or for a run with no start time.
          properties:
            error:
              description: |
                The stored error text of that stage. Absent when no stage failed, and when the stage carries no error.
              type: string
            failedTests:
              additionalProperties: false
              description: |
                The run's aggregate test counts. The field is present only when the run reports at least one failed test.
              properties:
                cases:
                  description: |
                    The first ten failed cases of the run, in the order the record store answers. A skipped case is not in the list. The field is absent when the run holds no stored case.
                  items:
                    additionalProperties: false
                    properties:
                      caseKey:
                        description: |
                          The opaque case key. Do not parse it. Percent-encode the whole key as one path segment before you use it as {case} on the case history read.
                        type: string
                      className:
                        type: string
                      name:
                        type: string
                      suite:
                        type: string
                    required:
                    - suite
                    - className
                    - name
                    - caseKey
                    type: object
                  type: array
                failed:
                  type: integer
                skipped:
                  type: integer
                total:
                  type: integer
              required:
              - failed
              type: object
            logTail:
              description: |
                The last 50 console log lines that carry the attribution of the failed stage or of a stage nested under it. The field falls back to the last 50 lines of the whole log when no log-index entry names one of those stages. The lines carry no ANSI escape sequence. It is absent when the server holds no blob store and when a log-index entry fails to decode.
              type: string
            stage:
              description: |
                The name of the innermost stage whose status is FAILURE, in stage-start order. A stage or a parallel branch that holds a failed stage is never the answer. A parallel branch shows its branch name. Absent when no stage failed.
              type: string
          type: object
        durationMs:
          format: int64
          type: integer
        endedAt:
          format: date-time
          type: string
        inputs:
          description: |
            The input steps the run waits on, read from the run's stored inputs column. This field is absent until a run.input event arrives, and absent for a run that holds no pending input.
          items:
            $ref: '#/components/schemas/components_schemas_RunInput'
          type: array
        interruptedReason:
          description: Set only when result is INTERRUPTED.
          type: string
        jobPath:
          type: string
        logComplete:
          description: The negation of LogSummary.incomplete.
          type: boolean
        logFinalized:
          description: LogSummary.finalized, read from the run's payload column.
          type: boolean
        params:
          additionalProperties:
            type: string
          type: object
        queuedAt:
          format: date-time
          type: string
        replayOf:
          description: |
            The identifier of the run whose script this build replayed. The field is absent for a build that is not a replay.
          type: string
        result:
          type: string
        retryRunId:
          description: An existing retry's run id, when one already exists.
          type: string
        runId:
          type: string
        scmRevision:
          type: string
        source:
          additionalProperties: false
          description: |
            How the run was defined, read from the run's stored source column. This field is absent until a run.source event arrives.
          properties:
            definitionPath:
              description: |
                The pipeline script path in the run's own repository. A run that a template defines reports no value here.
              type: string
            libraries:
              items:
                additionalProperties: false
                properties:
                  name:
                    type: string
                  revision:
                    type: string
                  version:
                    type: string
                type: object
              type: array
            podTemplates:
              items:
                additionalProperties: false
                properties:
                  image:
                    type: string
                  label:
                    type: string
                  name:
                    type: string
                type: object
              type: array
          type: object
        stages:
          items:
            $ref: '#/components/schemas/components_schemas_RunStage'
          type: array
        startedAt:
          format: date-time
          type: string
        status:
          type: string
        summary:
          description: |
            The one-line text the run attached to itself through varroa.summary. The plugin cuts the text at 512 UTF-8 bytes. This field is absent until the run calls varroa.summary.
          type: string
        tenant:
          description: |
            The tenant noun the server authorizes against: the run row's stored tenant column. A Team name for a Team tenant, or "<namespace>/<controller>" for a synthetic tenant.
          type: string
        tenantFolder:
          description: |
            The tenant's Jenkins folder prefix, from TenantRef.Folder. Empty for a root-hosted tenant.
          type: string
        testReport:
          $ref: '#/components/schemas/components_schemas_RunDetailTestReport'
        testsFailed:
          type: integer
        testsSkipped:
          type: integer
        testsTotal:
          type: integer
        triggerError:
          description: The error text a refused build trigger reported. Set only when
            result is TRIGGER_FAILED.
          type: string
        triggerReasonCode:
          description: Why no build exists for the trigger. One of JOB_NOT_FOUND,
            JOB_NOT_BUILDABLE, TRIGGER_REJECTED, TRIGGER_UNREACHABLE, CLAIM_EXPIRED,
            CLAIM_ABANDONED, FENCED, CROSS_TENANT, INVALID_KEY, and THROTTLED. The
            first three name a refusal from the controller. TRIGGER_UNREACHABLE names
            a trigger that reached no Jenkins. CLAIM_EXPIRED names an accepted trigger
            that no build claim followed. CLAIM_ABANDONED names a granted build claim
            that started no build. The last four name a build claim that the record
            store refused. Set only when result is TRIGGER_FAILED.
          type: string
      required:
      - runId
      - jobPath
      - status
      - tenantFolder
      - tenant
      type: object
    components_schemas_RunDetailTestReport:
      additionalProperties: false
      description: |
        The run's stored test report, on GET /runs/{run}. The field is absent when the run holds no stored report. sizeBytes and caseCount are always present, and zero is a valid value.
      properties:
        blobKey:
          description: |
            The blob key of the archived report file. The value is empty when Jenkins stored the file locally.
          type: string
        caseCount:
          description: |
            The number of cases the report file holds. The file holds every case, including a passed case.
          format: int32
          type: integer
        sizeBytes:
          description: The length of the report file in bytes.
          format: int64
          type: integer
      required:
      - blobKey
      - sizeBytes
      - caseCount
      type: object
    components_schemas_RunInput:
      additionalProperties: false
      description: One input step a run waits on, read from the run's stored inputs
        column.
      properties:
        id:
          description: The input step's own identifier. Both input routes address
            this value.
          type: string
        message:
          description: The message the step shows. Absent when the step declares none.
          type: string
        ok:
          description: The label of the step's proceed control. Absent when the step
            declares none.
          type: string
        parameters:
          description: |
            The step's own parameter definitions, in declaration order. Absent when the step declares none.
          items:
            $ref: '#/components/schemas/components_schemas_RunInputParameter'
          type: array
        submitter:
          description: |
            The users and groups the step admits. Absent when the step declares none.
          type: string
        submitterParameter:
          description: |
            The parameter name that holds the answering user's name. Absent when the step declares none.
          type: string
      required:
      - id
      type: object
    components_schemas_RunInputParameter:
      additionalProperties: false
      description: One parameter an input step declares, read from its definition.
      properties:
        choices:
          description: The definition's choices. Absent when the definition declares
            none.
          items:
            type: string
          type: array
        defaultValue:
          description: |
            The definition's default value, rendered as text. Absent when the definition declares none.
          type: string
        description:
          description: The definition's description. Absent when the definition declares
            none.
          type: string
        name:
          description: The definition's name.
          type: string
        type:
          description: |
            The Java simple name of the parameter definition, such as StringParameterDefinition or ChoiceParameterDefinition.
          type: string
      required:
      - name
      type: object
    components_schemas_RunListResponse:
      additionalProperties: false
      description: GET /pipelines/{team}/jobs/{job}/runs, cross-tenant cursor-merged.
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_RunSummary'
          type: array
        nextCursor:
          type: string
      required:
      - items
      type: object
    components_schemas_RunScript:
      additionalProperties: false
      description: |
        GET /runs/{run}/script. The run's own Groovy script, read from the build record the run retains in the blob tier. Every field is always present. A run that does not replay answers an empty script and an empty loadedScripts object.
      properties:
        definitionKind:
          description: |
            template when the run's stored payload names a pipeline template or a marker file, and script otherwise.
          enum:
          - template
          - script
          type: string
        loadedScripts:
          additionalProperties:
            type: string
          description: |
            The library scripts the run loaded, as a map of name to script text. A caller cannot edit them, and a replay loads them again from their library. The object is empty when the run loaded no script or when replayable is false.
          type: object
        reason:
          description: |
            The name of the first eligibility rule the run fails. The rules run in this order: not-terminal, template-defined, masked-parameter, no-replica, unreadable, not-sandbox, and script-too-large. A replayable run answers the empty string.
          type: string
        replayable:
          description: True only when the run passes every eligibility rule.
          type: boolean
        script:
          description: |
            The main script of the run's flow execution. The value is empty when replayable is false.
          type: string
      required:
      - script
      - loadedScripts
      - definitionKind
      - replayable
      - reason
      type: object
    components_schemas_RunStage:
      additionalProperties: false
      properties:
        durationMs:
          format: int64
          type: integer
        endedAt:
          format: date-time
          type: string
        error:
          type: string
        name:
          type: string
        nodeType:
          type: string
        parentId:
          type: string
        stageId:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          type: string
      required:
      - stageId
      - name
      - status
      type: object
    components_schemas_RunSummary:
      additionalProperties: false
      description: One run, condensed for a list or a card.
      properties:
        actor:
          type: string
        branch:
          type: string
        buildNumber:
          format: int64
          type: integer
        cause:
          type: string
        durationMs:
          format: int64
          type: integer
        endedAt:
          format: date-time
          type: string
        jobPath:
          type: string
        queuedAt:
          format: date-time
          type: string
        result:
          type: string
        runId:
          type: string
        scmRevision:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          type: string
      required:
      - runId
      - status
      type: object
    components_schemas_RunTestCase:
      additionalProperties: false
      description: |
        One stored test case of a run. The record store holds only failed and skipped cases, at most 500 for each run.
      properties:
        caseKey:
          description: |
            The opaque case key the server makes from the class name and the test name. Do not parse it. Percent-encode the whole key as one path segment before you use it as {case} on GET /pipelines/{team}/jobs/{job}/tests/{case}.
          type: string
        className:
          type: string
        durationMs:
          description: The case's duration in milliseconds. Absent when the value
            is zero.
          format: int64
          type: integer
        errorDetails:
          description: |
            The case's error detail text, cut at 512 bytes. Absent when the case carries no error detail.
          type: string
        name:
          type: string
        status:
          description: |
            The reporter's own status name, for example FAILED or REGRESSION. A skipped case carries SKIPPED.
          type: string
        suite:
          type: string
      required:
      - suite
      - className
      - name
      - status
      - caseKey
      type: object
    components_schemas_RunTestListResponse:
      additionalProperties: false
      description: |
        GET /runs/{run}/tests. items holds one row for each suite, plus the "_total" sentinel row. cases holds the run's stored failed and skipped cases, failed cases first. cases is always present, and an empty array is a valid value.
      properties:
        cases:
          items:
            $ref: '#/components/schemas/components_schemas_RunTestCase'
          type: array
        items:
          items:
            $ref: '#/components/schemas/components_schemas_RunTestSuite'
          type: array
        report:
          $ref: '#/components/schemas/components_schemas_RunTestReport'
      required:
      - items
      - cases
      type: object
    components_schemas_RunTestReport:
      additionalProperties: false
      description: |
        The run's archived test report, on GET /runs/{run}/tests. The field is absent when the run holds no stored report. sizeBytes and caseCount are always present, and zero is a valid value.
      properties:
        caseCount:
          description: |
            The number of cases the report file holds. The file holds every case, including a passed case.
          format: int32
          type: integer
        downloadable:
          description: |
            False when the stored blob key is empty, because Jenkins stored the file locally. The download path then answers 409.
          type: boolean
        path:
          description: |
            The archived path of the report file, always .varroa/tests.json. Download the file through GET /runs/{run}/artifacts/{path}.
          type: string
        sizeBytes:
          description: The length of the report file in bytes.
          format: int64
          type: integer
      required:
      - path
      - sizeBytes
      - caseCount
      - downloadable
      type: object
    components_schemas_RunTestSuite:
      additionalProperties: false
      properties:
        durationMs:
          format: int64
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        suite:
          type: string
        total:
          type: integer
      required:
      - suite
      - total
      - failed
      - skipped
      type: object
    components_schemas_RunnerCondition:
      additionalProperties: false
      description: Status condition for a Runner. Type Ready.
      properties:
        lastTransitionTime:
          description: ISO 8601 last transition time.
          type: string
        message:
          type: string
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - type
      - status
      type: object
    components_schemas_RunnerCreateRequest:
      additionalProperties: false
      description: Request body for POST /runners.
      properties:
        name:
          description: 'metadata.name. Not generated: the operator names the machine,
            and the rendered node is <team>-<name>.'
          type: string
        spec:
          $ref: '#/components/schemas/components_schemas_RunnerSpec'
      required:
      - name
      - spec
      type: object
    components_schemas_RunnerEntry:
      additionalProperties: false
      description: Full runner object returned from get/list operations.
      properties:
        name:
          type: string
        spec:
          $ref: '#/components/schemas/components_schemas_RunnerSpec'
        status:
          $ref: '#/components/schemas/components_schemas_RunnerStatus'
      required:
      - name
      - spec
      - status
      type: object
    components_schemas_RunnerSpec:
      additionalProperties: false
      description: A Runner's mutable configuration (spec.*). team and launcher are
        immutable after creation.
      properties:
        credentialRef:
          description: Name of a Secret in the Team's agent namespace holding the
            SSH credential. Required for launcher ssh; forbidden for inbound.
          type: string
        host:
          description: The SSH target. Required for launcher ssh; forbidden for inbound.
          type: string
        javaPath:
          description: An explicit java binary path for the ssh launcher.
          type: string
        labels:
          description: Unprefixed label suffixes; the operator prefixes each one with
            <team>-.
          items:
            type: string
          type: array
        launcher:
          description: Connection direction. Immutable.
          enum:
          - ssh
          - inbound
          type: string
        numExecutors:
          description: The node's executor count. Defaults to 1.
          type: integer
        port:
          description: The SSH port. Required for launcher ssh; forbidden for inbound.
          type: integer
        remoteFS:
          description: The agent work directory on the node.
          type: string
        team:
          description: The pipelines Team that owns this runner. Immutable.
          type: string
      required:
      - team
      - launcher
      - remoteFS
      type: object
    components_schemas_RunnerStatus:
      additionalProperties: false
      description: A Runner's observed state (status.*). status.token is present only
        for a caller holding runners:create; the BFF redacts it for every other caller
        (design D12).
      properties:
        cell:
          description: The Controller that hosts this runner's node.
          type: string
        cellNamespace:
          type: string
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_RunnerCondition'
          type: array
        connected:
          description: The last liveness probe result for this runner's node.
          type: boolean
        lastSeen:
          description: ISO 8601 time of the last online probe result.
          type: string
        nodeName:
          description: The rendered Jenkins node name, <team>-<runner name>.
          type: string
        observedGeneration:
          format: int64
          type: integer
        token:
          description: The door bearer credential for an inbound runner. Minted once
            by the operator; never set for an ssh runner.
          type: string
      required:
      - connected
      type: object
    components_schemas_RunningRun:
      additionalProperties: false
      description: |
        One unfinished run for the team home's Running now card. currentStage names the top-level stage in progress. It is absent when no top-level stage is in progress: before the first stage, between two stages, and for a queued run.
      properties:
        branch:
          type: string
        buildNumber:
          format: int64
          type: integer
        changeSummary:
          description: The last commit's short message.
          type: string
        currentStage:
          type: string
        jobPath:
          type: string
        queuedAt:
          format: date-time
          type: string
        runId:
          type: string
        scmRevision:
          type: string
        startedAt:
          format: date-time
          type: string
        status:
          type: string
        typicalDurationMs:
          description: The job's usual duration, from its duration trend.
          format: int64
          type: integer
      required:
      - runId
      - jobPath
      - status
      type: object
    components_schemas_ScopedCapabilities:
      additionalProperties: false
      description: The capability set granted by bindings that carry one scope, plus
        the scope descriptor. Scoped grants are never flattened into the global partition.
      properties:
        capabilities:
          $ref: '#/components/schemas/components_schemas_APICapabilitySet'
        hasControllerSelector:
          description: True when the scope carries a controller label selector, which
            the client cannot evaluate.
          type: boolean
        namespaces:
          description: The scope's namespace allowlist. Null or empty means the scope
            is not namespace-bounded.
          items:
            type: string
          nullable: true
          type: array
        tenants:
          description: The scope's canonicalized pipelines-tenant allowlist. Null
            or empty means the scope names no tenant.
          items:
            $ref: '#/components/schemas/components_schemas_TenantScope'
          nullable: true
          type: array
      required:
      - namespaces
      - hasControllerSelector
      - capabilities
      type: object
    components_schemas_SearchResult:
      additionalProperties: false
      description: A single search result entry.
      properties:
        cluster:
          type: string
        description:
          type: string
        link:
          type: string
        name:
          type: string
        namespace:
          type: string
        type:
          description: controller, namespace, group, and catalogitem come from a live
            Kubernetes read; job, run, and activity come from the record store and
            are absent when it is not wired.
          enum:
          - controller
          - namespace
          - group
          - catalogitem
          - job
          - run
          - activity
          type: string
      required:
      - type
      - name
      - link
      type: object
    components_schemas_SizePreset:
      additionalProperties: false
      description: A size preset for provisioning defaults.
      properties:
        cpu:
          type: string
        memory:
          type: string
        name:
          type: string
        storage:
          type: string
      required:
      - name
      - cpu
      - memory
      - storage
      type: object
    components_schemas_SourceJSON:
      additionalProperties: false
      description: Observability source status.
      properties:
        error:
          type: string
        hints:
          additionalProperties:
            type: string
          type: object
        provider:
          type: string
        status:
          type: string
      required:
      - provider
      - status
      type: object
    components_schemas_StreamTicketResponse:
      additionalProperties: false
      description: Response from POST /stream/ticket.
      properties:
        expiresInSeconds:
          type: integer
        ticket:
          type: string
      required:
      - ticket
      - expiresInSeconds
      type: object
    components_schemas_SubjectRef:
      additionalProperties: false
      description: Reference to a subject by kind and name.
      properties:
        kind:
          description: Subject kind.
          enum:
          - Group
          - User
          type: string
        name:
          description: OIDC claim value (group name or user subject).
          type: string
      required:
      - kind
      - name
      type: object
    components_schemas_SummaryJSON:
      additionalProperties: false
      description: Observability summary.
      properties:
        recentBuilds:
          items:
            $ref: '#/components/schemas/components_schemas_RecentBuild'
          type: array
        runningBuilds:
          type: integer
        totalJobs:
          type: integer
      type: object
    components_schemas_SuspendBroodRequest:
      additionalProperties: false
      description: Request body to toggle suspend on a brood operation.
      properties:
        suspend:
          type: boolean
      required:
      - suspend
      type: object
    components_schemas_TeamCell:
      additionalProperties: false
      description: The tenant's own view of the cell that hosts it. For the states
        unplaced and notCellHosted every field other than state and reason is absent.
        The body carries no other tenant's name, job path, run, or count.
      properties:
        canOpenCell:
          description: True when the caller also holds the controller read grant on
            the cell. The hint gates no other field of this body.
          type: boolean
        cell:
          type: string
        cellPool:
          type: string
        cluster:
          type: string
        failedLast24h:
          format: int64
          type: integer
        freeSlots:
          format: int32
          type: integer
        jenkinsVersion:
          type: string
        jobs:
          format: int64
          type: integer
        members:
          description: 'One entry for each member of the tenant, ordered by role:
            active members by ascending slot first, then standbys by cell name. It
            is absent for unplaced and notCellHosted. Every other field of this body
            describes the tenant''s slot 0.'
          items:
            $ref: '#/components/schemas/components_schemas_TeamCellMember'
          type: array
        namespace:
          type: string
        otherTenantCount:
          description: The number of other tenants on the cell. It is a count, never
            a list.
          format: int32
          type: integer
        profile:
          type: string
        queueLength:
          format: int64
          type: integer
        reason:
          description: The Team's Placed condition reason, verbatim.
          type: string
        runningNow:
          format: int64
          type: integer
        runsLast24h:
          format: int64
          type: integer
        state:
          enum:
          - placed
          - moving
          - rehydrating
          - unplaced
          - notCellHosted
          type: string
      required:
      - state
      - canOpenCell
      type: object
    components_schemas_TeamCellMember:
      additionalProperties: false
      description: One member of the tenant, with that member's own four load counts.
        The counts apply the same grant narrowing the top-level counts apply. No entry
        names another tenant.
      properties:
        cell:
          type: string
        cluster:
          type: string
        failedLast24h:
          format: int64
          type: integer
        jobs:
          format: int64
          type: integer
        namespace:
          type: string
        role:
          description: '"slot <n>" for an active member and "standby" for a standby.'
          type: string
        runningNow:
          format: int64
          type: integer
        runsLast24h:
          format: int64
          type: integer
      required:
      - cell
      - namespace
      - cluster
      - role
      - runningNow
      - runsLast24h
      - failedLast24h
      - jobs
      type: object
    components_schemas_TeamCondition:
      additionalProperties: false
      description: Status condition for a Team.
      properties:
        lastTransitionTime:
          description: ISO 8601 last transition time.
          type: string
        message:
          type: string
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - type
      - status
      type: object
    components_schemas_TeamEntry:
      additionalProperties: false
      description: Full team object returned from get/list operations.
      properties:
        bindingRef:
          description: Reference to the managed VarroaRoleBinding.
          type: string
        conditions:
          items:
            $ref: '#/components/schemas/components_schemas_TeamCondition'
          type: array
        displayName:
          type: string
        groupRef:
          description: Reference to the managed VarroaRoleBinding group.
          type: string
        members:
          items:
            type: string
          type: array
        name:
          type: string
        namespaceStates:
          items:
            $ref: '#/components/schemas/components_schemas_TeamNamespaceState'
          type: array
        namespaces:
          items:
            type: string
          type: array
        observedGeneration:
          format: int64
          type: integer
        pipelines:
          $ref: '#/components/schemas/components_schemas_TeamPipelines'
        placement:
          $ref: '#/components/schemas/components_schemas_TeamPlacement'
        provisionNamespaces:
          type: boolean
        rehydration:
          $ref: '#/components/schemas/components_schemas_TeamRehydration'
        roleRef:
          type: string
        subjects:
          items:
            $ref: '#/components/schemas/components_schemas_SubjectRef'
          type: array
      required:
      - name
      - namespaces
      type: object
    components_schemas_TeamExport:
      additionalProperties: false
      description: 'One grant a pipelines tenant makes to other tenants: a job pattern
        or a list of lock patterns, plus the callers allowed to use it. Exactly one
        of job or locks is set.'
      properties:
        callers:
          description: Team names allowed to use this export.
          items:
            type: string
          minItems: 1
          type: array
        job:
          description: Folder-relative job glob this tenant exports. Exactly one of
            job or locks is set.
          type: string
        locks:
          description: Globs over the bare names of this tenant's own locks. Exactly
            one of job or locks is set.
          items:
            type: string
          type: array
      required:
      - callers
      type: object
    components_schemas_TeamMember:
      additionalProperties: false
      description: 'One member of a pipelines tenant (status.placement.members). Response-only:
        the placement pass is its only writer.'
      properties:
        applied:
          description: True when the member's cell reports this tenant applied.
          type: boolean
        cell:
          description: Name of the cell Controller that holds this member.
          type: string
        cellNamespace:
          description: Namespace of that cell Controller.
          type: string
        role:
          description: An active member holds one slot. A standby holds the folder,
            holds no slot, and runs no build.
          enum:
          - active
          - standby
          type: string
        slot:
          description: The slot index. Set only on an active member.
          format: int32
          type: integer
      type: object
    components_schemas_TeamNamespaceState:
      additionalProperties: false
      description: State of a single namespace for a Team.
      properties:
        name:
          type: string
        state:
          type: string
      required:
      - name
      - state
      type: object
    components_schemas_TeamPipelines:
      additionalProperties: false
      description: 'A Team''s pipelines tenancy declaration (spec.pipelines). A Team
        that sets this becomes a pipelines tenant: one top-level folder on exactly
        one cell.'
      properties:
        agentNamespace:
          description: Kubernetes namespace this tenant's agents run in. Must be one
            of the team's own namespaces.
          type: string
        cellPool:
          description: 'The CellPool the placement pass selects a cell from. Empty
            means the profile''s default pool: the pool whose name equals profile.
            A tenant that needs a cell of its own names a pool whose maxTenantsPerCell
            is 1.'
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        concurrency:
          description: This tenant's job concurrency policy. "allow" (default) runs
            builds side by side. "cancelInProgress" cancels the running build of the
            same job path when a new one starts.
          enum:
          - allow
          - cancelInProgress
          type: string
        cronBackstop:
          description: Turns the backstop cron scheduler on for this tenant. Default
            true.
          type: boolean
        cronCatchUp:
          description: How many missed cron occurrences the backstop fires on wake.
            "one" (default) fires the newest missed occurrence. "none" fires nothing.
          enum:
          - one
          - none
          type: string
        cronGrace:
          description: How long the backstop waits past a missed cron occurrence before
            it fires. Default 5m, range 1m to 60m.
          type: string
        exports:
          description: Grants of this tenant's jobs and locks to other tenants. An
            absent list exports nothing.
          items:
            $ref: '#/components/schemas/components_schemas_TeamExport'
          type: array
        interruptedRetry:
          description: Whether an interrupted run retries on its own. "manual" (default)
            leaves the retry to a user. "automatic" retries once.
          enum:
          - manual
          - automatic
          type: string
        members:
          description: The number of active slots this tenant runs. Each slot holds
            one cell, and a job runs only on its home slot's holder. Default 1. This
            field is not spec.members, which lists local usernames.
          format: int32
          maximum: 16
          minimum: 1
          type: integer
        profile:
          description: JenkinsVersionProfile the placement pass resolves a cell against.
          type: string
        rehydrateBuilds:
          description: How many of a job's newest completed builds the operator seeds
            when this tenant's cell changes. The newest successful build is always
            seeded in addition. Default 10.
          format: int32
          maximum: 100
          minimum: 0
          type: integer
        rehydrateDeadline:
          description: How long the operator keeps retrying a deferred rehydration
            seed before it stops and reports RehydrationFailed. Default 30m, range
            1m to 24h.
          type: string
        standby:
          description: The number of warm members this tenant keeps. A standby holds
            the folder and no slot. It takes a slot whose holder dies. Default 0.
          format: int32
          maximum: 8
          minimum: 0
          type: integer
      type: object
    components_schemas_TeamPlacement:
      additionalProperties: false
      description: 'The cell a pipelines tenant is bound to (status.placement). Response-only:
        the placement pass is its only writer.'
      properties:
        cell:
          description: Name of the bound cell Controller.
          type: string
        cellNamespace:
          description: Namespace of the bound cell Controller.
          type: string
        cluster:
          description: Cluster the bound cell runs in.
          type: string
        generation:
          description: Increases only when the bound cell changes.
          format: int64
          type: integer
        members:
          description: Every member of this tenant. The scalar fields above keep describing
            slot 0.
          items:
            $ref: '#/components/schemas/components_schemas_TeamMember'
          type: array
      type: object
    components_schemas_TeamRehydration:
      additionalProperties: false
      description: 'A pipelines tenant''s build-record rehydration state (status.rehydration).
        Response-only: TeamReconciler is its only writer.'
      properties:
        attempts:
          description: Rehydration retries since the last applied bundle.
          format: int32
          type: integer
        cellInstance:
          description: Cell pod UID this state was built for.
          type: string
        deferred:
          description: Job paths the mite could not seed on the last apply, because
            the job did not exist yet.
          items:
            type: string
          type: array
        generation:
          description: Placement generation this state was built for.
          format: int64
          type: integer
        lastAttempt:
          description: When the operator last sent a rehydration bundle for this tenant.
          format: date-time
          type: string
        records:
          description: Number of thin build records the last bundle carried.
          format: int32
          type: integer
        truncated:
          description: True when the last bundle dropped changelogs or older records
            to fit the byte budget.
          type: boolean
        unseededJobs:
          description: Number of jobs no bundle has covered yet.
          format: int32
          type: integer
      type: object
    components_schemas_TeamRequest:
      additionalProperties: false
      description: Request body for creating or updating a team.
      properties:
        displayName:
          type: string
        members:
          description: Direct member usernames.
          items:
            type: string
          type: array
        name:
          description: Team name (ignored in body for updates).
          type: string
        namespaces:
          description: Target namespaces for this team.
          items:
            type: string
          type: array
        pipelines:
          $ref: '#/components/schemas/components_schemas_TeamPipelines'
        provisionNamespaces:
          description: Whether to auto-provision namespaces.
          type: boolean
        roleRef:
          description: Name of a VarroaRole to bind. Must not be "admin".
          type: string
        subjects:
          description: OIDC subject references.
          items:
            $ref: '#/components/schemas/components_schemas_SubjectRef'
          type: array
      required:
      - name
      - namespaces
      type: object
    components_schemas_TemplateCatalogCondition:
      description: Status condition for catalog/composedbundle resources.
      properties:
        lastTransitionTime:
          type: string
        message:
          type: string
        reason:
          type: string
        status:
          type: string
        type:
          type: string
      required:
      - type
      - status
      type: object
    components_schemas_TenantCapabilities:
      additionalProperties: false
      description: One grant the caller holds on one pipelines tenant. A tenant name
        may appear in more than one entry, because the caller can hold two grants
        on it with different job globs; they are never merged.
      properties:
        capabilities:
          $ref: '#/components/schemas/components_schemas_APICapabilitySet'
        jobs:
          description: Folder-relative job globs the grant covers. Always an array,
            never null; an empty array means every job.
          items:
            type: string
          type: array
        tenant:
          type: string
      required:
      - tenant
      - jobs
      - capabilities
      type: object
    components_schemas_TenantScope:
      additionalProperties: false
      description: One pipelines tenant name and the folder-relative job globs a binding
        covers. An absent jobs list covers every job.
      properties:
        jobs:
          description: Jobs are folder-relative globs. An absent jobs list covers
            every job.
          items:
            maxLength: 512
            type: string
          maxItems: 64
          type: array
        name:
          description: A tenant is a Team name.
          maxLength: 253
          type: string
      required:
      - name
      type: object
    components_schemas_TestCaseHistoryResponse:
      additionalProperties: false
      description: |
        GET /pipelines/{team}/jobs/{job}/tests/{case}. items holds the case's recent outcomes, newest first, within the record store retention window. The response holds no rate, no trend, and no flake score.
      properties:
        items:
          items:
            $ref: '#/components/schemas/components_schemas_TestCaseOutcome'
          type: array
      required:
      - items
      type: object
    components_schemas_TestCaseOutcome:
      additionalProperties: false
      description: |
        One outcome of one test case in one run of the job. A row names its own suite, because two suites can report one class and one name.
      properties:
        buildNumber:
          format: int64
          type: integer
        createdAt:
          description: The creation time of the run.
          format: date-time
          type: string
        durationMs:
          description: The case's duration in milliseconds. Absent when the case reports
            no duration.
          format: int64
          type: integer
        errorDetails:
          description: |
            The case's error detail text, cut at 512 bytes. Absent when the case carries no error detail.
          type: string
        result:
          description: The run's own result. Absent when the run holds no result.
          type: string
        runId:
          type: string
        runLink:
          description: |
            The run's own page path, /pipelines/{team}/{jobPath}/{runId}, the same link a fleet lock row carries.
          type: string
        status:
          description: |
            The reporter's own status name. A skipped case carries SKIPPED.
          type: string
        suite:
          type: string
      required:
      - runId
      - suite
      - status
      - createdAt
      - runLink
      type: object
    components_schemas_TokenResponse:
      additionalProperties: false
      properties:
