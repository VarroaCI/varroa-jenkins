      description: |
        Authorizes with the run read check on the record's own tenant and job path, so a run whose cell was deleted still resolves for a permitted caller.
      operationId: getRun
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunDetail'
          description: The run record.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Returns one run's record and stage list.
      tags:
      - Pipelines
  /api/v1/runs/{run}/artifacts:
    get:
      operationId: listRunArtifacts
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunArtifactListResponse'
          description: The run's artifacts.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists one run's archived artifacts.
      tags:
      - Pipelines
  /api/v1/runs/{run}/artifacts/{path}:
    get:
      description: |
        path is a multi-segment artifact path, exactly as run_artifacts.path stored it. The handler opens the recorded blob_key with the blob store's native-object read — an artifact is one object, never a chunk sequence — and never derives a key from run or path.
      operationId: downloadRunArtifact
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      - $ref: '#/components/parameters/components_parameters_artifactPath'
      - description: Byte range within the artifact.
        in: header
        name: Range
        schema:
          type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The complete artifact.
        "206":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: The requested byte range.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run or the artifact does not exist, or the caller may not
            read the run.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: |
            The artifact row carries an empty blob key (Jenkins stored it locally). The message names the recordStore.blobs.mode chart value that selects the blob mode.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Streams one artifact's bytes.
      tags:
      - Pipelines
  /api/v1/runs/{run}/cancel:
    post:
      operationId: cancelRun
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_CancelRunResponse'
          description: The cancel was requested.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Requests that a queued or running build stop. Fire and forget.
      tags:
      - Pipelines
  /api/v1/runs/{run}/changes:
    get:
      operationId: listRunChanges
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunChangeListResponse'
          description: The run's SCM changes.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists one run's SCM changes.
      tags:
      - Pipelines
  /api/v1/runs/{run}/downstream:
    get:
      description: |
        Each item passes the run read check on its own. An item the caller may not read carries its tenant alone.
      operationId: listRunDownstream
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      - in: query
        name: limit
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      - in: query
        name: cursor
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunLinkPage'
          description: A page of the runs the run started.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The limit is out of range, or the cursor is malformed.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists one page of the runs that one run started, newest first.
      tags:
      - Pipelines
  /api/v1/runs/{run}/inputs/{input}/abort:
    post:
      description: |
        The BFF publishes one ABORT_INPUT command and does not wait for Jenkins. The abort path takes no body.
      operationId: abortRunInput
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      - $ref: '#/components/parameters/components_parameters_input'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_CancelRunResponse'
          description: The abort was requested.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The input identifier is empty.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Rejects one pending input step as the calling user. Fire and forget.
      tags:
      - Pipelines
  /api/v1/runs/{run}/inputs/{input}/proceed:
    post:
      description: |
        The BFF publishes one PROCEED_INPUT command and does not wait for Jenkins. The plugin applies the step's own declared defaults for every parameter the request omits.
      operationId: proceedRunInput
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      - $ref: '#/components/parameters/components_parameters_input'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                parameters:
                  additionalProperties:
                    type: string
                  description: |
                    Input parameter values, as a map of name to string value. A name the step does not declare is dropped.
                  type: object
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_CancelRunResponse'
          description: The proceed was requested.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The input identifier is empty, or the request body does not
            decode.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Answers one pending input step as the calling user. Fire and forget.
      tags:
      - Pipelines
  /api/v1/runs/{run}/log:
    get:
      description: |
        Plays the stored log as Server-Sent Events, then attaches the live tail while the run is not terminal. raw=true returns the plain console text instead of an event stream, with no new path.
      operationId: streamRunLog
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      - description: Byte offset of the first unread byte.
        in: query
        name: from
        schema:
          default: 0
          format: int64
          type: integer
      - description: 1-based line number starting at from.
        in: query
        name: fromLine
        schema:
          type: integer
      - description: true returns text/plain with no SSE.
        in: query
        name: raw
        schema:
          default: false
          type: boolean
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: |
            The event stream (event kinds meta, stage, line, gap, live, end) or, with raw=true, the plain console text.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Streams a run's console log, history then the live tail.
      tags:
      - Pipelines
      x-sse: true
  /api/v1/runs/{run}/notes:
    get:
      description: |
        The route reads the run first, so a caller the run read check refuses gets 404. The list is never null.
      operationId: listRunNotes
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunNoteList'
          description: The notes of the build.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists the notes of one build, oldest first.
      tags:
      - Pipelines
    post:
      description: |
        Send exactly one of body and sessionId. A body writes a human note, and the caller needs the tenant write check on the build. A sessionId writes the newest final answer of that assistant session, and only the session owner may send it. A session can write its note once. A repeat returns the stored note with 200.
      operationId: createRunNote
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_CreateRunNoteRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunNote'
          description: The stored note of the session, written earlier.
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunNote'
          description: The note that this call wrote.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunNoteError'
          description: |
            A plain refusal for a malformed request, or a RunNoteError with code note_too_long for a body over 16384 bytes.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunNoteError'
          description: The session cannot write a note on this build.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Adds a human note to a build, or the assistant answer of a session.
      tags:
      - Pipelines
  /api/v1/runs/{run}/replay:
    post:
      description: |
        The BFF applies the eligibility rules of the script read, mints a new run identifier, and publishes one REPLAY_BUILD command to the job's home member. It does not wait for Jenkins. Each call starts its own build with its own build number.
      operationId: replayRun
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                script:
                  description: |
                    The edited main script, at most 262144 UTF-8 bytes. A larger script answers 413. The library scripts load again from their library, so the body holds no library script.
                  type: string
              required:
              - script
              type: object
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunActionResponse'
          description: The replay was requested.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The request body does not decode, or the script is empty.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: |
            The run does not replay. The message names the reason, one of the reason values of the script read.
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The script is larger than 256 KiB.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Starts a new build of the run's job with an edited script. Fire and
        forget.
      tags:
      - Pipelines
  /api/v1/runs/{run}/rerun:
    post:
      description: |
        Reads the ledger by the retry intent key first: when a retry already exists, its run id is returned and no command is published.
      operationId: rerunRun
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunActionResponse'
          description: The retry was requested, or an existing retry's identifier
            was returned.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Requests a retry of a finished run. One retry per source run, fleet-wide.
      tags:
      - Pipelines
  /api/v1/runs/{run}/restart:
    get:
      description: |
        The BFF reads the restart answer the plugin recorded when the run completed. It never calls Jenkins. A run that does not restart answers restartable false and the reason, and an empty stages list.
      operationId: getRunRestart
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunRestart'
          description: The run's restart answer.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Reads whether one run restarts from a stage, and the stages it can
        restart from.
      tags:
      - Pipelines
    post:
      description: |
        The BFF applies the eligibility rules of the restart read, mints a new run identifier, and publishes one RESTART_BUILD command to the job's home member. The plugin checks that the source build still sits on that cell before it schedules the restart. The new run copies the parameter values of the source build. It does not wait for Jenkins.
      operationId: restartRun
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_RestartRunRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunActionResponse'
          description: The restart was requested.
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The request body does not decode, or the stage is empty.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: |
            The run does not restart, or the stage is not restartable. The message names the reason: not-terminal, template-defined, not-recorded, not-declarative, disabled, unavailable, no-restartable-stage, or home-moved. The job moved and no restart copy is kept. An unlisted stage answers "stage <name> is not restartable".
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The request body is larger than 4 KiB.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Starts a new build of the run's job from one stage. Fire and forget.
      tags:
      - Pipelines
  /api/v1/runs/{run}/script:
    get:
      description: |
        The BFF reads the build record the run retains in the blob tier. A run that does not replay answers replayable false, the reason, an empty script, and an empty loadedScripts object.
      operationId: getRunScript
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunScript'
          description: The run's script, its loaded scripts, and its replay eligibility.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Reads one run's own Groovy script and whether the run replays.
      tags:
      - Pipelines
  /api/v1/runs/{run}/tests:
    get:
      description: |
        items holds one row per suite, at most 500, the most failed suites first, then by suite name. items is empty when the run reported no suite. totals holds the run's aggregate counters, and it is absent when the run reported no test result. cases holds the run's stored failed and skipped cases, at most 500, failed cases first. report describes the archived report file, which holds every case. Download that file through the run's artifact path.
      operationId: listRunTests
      parameters:
      - $ref: '#/components/parameters/components_parameters_run'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_RunTestListResponse'
          description: The run's test suite totals, test cases, and test report.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_Error'
          description: The run does not exist, or the caller may not read it.
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Lists one run's test suites, totals, stored test cases, and test report.
      tags:
      - Pipelines
  /api/v1/search:
    get:
      operationId: search
      parameters:
      - description: Search query string.
        in: query
        name: q
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  clusters:
                    items:
                      $ref: '#/components/schemas/components_schemas_ClusterFanoutStatus'
                    type: array
                  items:
                    items:
                      $ref: '#/components/schemas/components_schemas_SearchResult'
                    type: array
                required:
                - items
                - clusters
                type: object
          description: Search results and the read status of each cluster.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "503":
          $ref: '#/components/responses/components_responses_ServiceUnavailable'
      summary: Search authorized resources across every kind.
      tags:
      - streams
  /api/v1/stream/brood:
    get:
      description: Uses `?ticket=` for browser EventSource auth.
      operationId: streamBrood
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: SSE event stream.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
      summary: Streams brood-wide events via Server-Sent Events.
      tags:
      - streams
      x-sse: true
  /api/v1/stream/ticket:
    post:
      description: |
        CLI-excluded — browser EventSource workaround. Returns a ticket that can be used as `?ticket=` parameter on SSE endpoints.
      operationId: createStreamTicket
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              properties:
                scope:
                  description: |
                    The one stream the ticket opens. One of brood, activity, controller:{cluster}/{ns}/{name}, broodop:{ns}/{name}, run:{run_id}, or pipelines:{tenant}. A ticket opens the stream whose path maps onto the same scope, and no other.
                  type: string
              required:
              - scope
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_StreamTicketResponse'
          description: Stream ticket.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
      summary: Creates a short-lived SSE stream ticket.
      tags:
      - streams
  /api/v1/tenants:
    get:
      operationId: listTenants
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/components_schemas_TenantEntry'
                    type: array
                required:
                - items
                type: object
          description: Tenant list (N6 envelope).
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
      summary: Lists all tenants (admin only).
      tags:
      - tenants
    post:
      operationId: createTenant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/components_schemas_TenantRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
          description: Tenant created.
        "400":
          $ref: '#/components/responses/components_responses_BadRequest'
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
