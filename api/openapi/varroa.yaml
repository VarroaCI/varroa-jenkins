            covered.
        "401":
          $ref: '#/components/responses/components_responses_Unauthorized'
        "403":
          $ref: '#/components/responses/components_responses_Forbidden'
        "404":
          $ref: '#/components/responses/components_responses_NotFound'
      summary: Lists the cell pools of every known cluster, or of the named cluster,
        with their spec and status. The list sorts by cluster, with the BFF's own
        cluster first, and then by name. A cluster whose read fails is reported with
        ok false in clusters and adds no item. Requires the cellpools:read verb on
        a cluster-wide binding.
      tags:
      - CellPools
  /api/v1/cellpools/{name}:
    get:
      operationId: getCellPool
      parameters:
      - $ref: '#/components/parameters/components_parameters_name'
      - $ref: '#/components/parameters/components_parameters_clusterQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/components_schemas_CellPool'
          description: Cell-pool details.
        "401":
