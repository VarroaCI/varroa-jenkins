components:
  parameters:
    cluster:
      description: Cluster name (DNS-1123 label).
      in: path
      name: cluster
      required: true
      schema:
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
    clusterQuery:
      description: Cluster name filter for aggregated list.
      in: query
      name: cluster
      schema:
        type: string
    components_parameters_artifactPath:
      description: |
        Multi-segment artifact path, exactly as run_artifacts.path stored it.
      in: path
      name: path
      required: true
      schema:
        type: string
    components_parameters_case:
      description: |
        Percent-encoded test case key, one path segment. The key is the caseKey value that GET /runs/{run}/tests returns. Encode the whole key again, because the key holds a literal "/". The router reads it with PathValue, which returns the decoded value.
      in: path
      name: case
      required: true
      schema:
        type: string
    components_parameters_cluster:
      description: Cluster name (DNS-1123 label).
      in: path
      name: cluster
      required: true
      schema:
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
        type: string
    components_parameters_clusterQuery:
      description: Cluster name filter for aggregated list.
      in: query
      name: cluster
      schema:
        type: string
    components_parameters_force:
      description: Force the update, overriding SSA field-ownership conflicts.
      in: query
      name: force
      schema:
        type: boolean
    components_parameters_input:
      description: |
        Percent-encoded input step identifier, one path segment. The router reads it with PathValue, which returns the decoded value.
      in: path
      name: input
      required: true
      schema:
        type: string
    components_parameters_job:
      description: |
        Percent-encoded job path, one path segment. The router reads it with PathValue, which returns the decoded value, so the job path's slashes reach the handler intact.
      in: path
      name: job
      required: true
      schema:
        type: string
    components_parameters_name:
      description: Resource name.
      in: path
      name: name
      required: true
      schema:
        type: string
    components_parameters_namespace:
      description: Namespace filter (optional).
      in: query
      name: namespace
      schema:
        type: string
    components_parameters_ns:
      description: Controller namespace.
      in: path
      name: ns
      required: true
      schema:
        type: string
    components_parameters_prefix:
      description: API key prefix (first 7 characters).
      in: path
      name: prefix
      required: true
      schema:
        type: string
    components_parameters_run:
      description: Run identifier, a UUIDv7 string.
      in: path
      name: run
      required: true
      schema:
        format: uuid
        type: string
    components_parameters_team:
      description: |
        Team or controller name that addresses one pipelines tenant.
      in: path
      name: team
      required: true
      schema:
        type: string
    components_parameters_teamQuery:
      description: Team name filter for the runner list.
      in: query
      name: team
      schema:
        type: string
    name:
      description: Resource name.
      in: path
      name: name
      required: true
      schema:
        type: string
    namespace:
      description: Namespace filter (optional).
      in: query
      name: namespace
      schema:
        type: string
    ns:
      description: Controller namespace.
      in: path
      name: ns
      required: true
      schema:
        type: string
    prefix:
      description: API key prefix (first 7 characters).
      in: path
      name: prefix
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      $ref: '#/components/responses/components_responses_BadRequest'
    Conflict:
      $ref: '#/components/responses/components_responses_Conflict'
    Forbidden:
      $ref: '#/components/responses/components_responses_Forbidden'
    Internal:
      $ref: '#/components/responses/components_responses_Internal'
    MethodNotAllowed:
      $ref: '#/components/responses/components_responses_MethodNotAllowed'
    NotFound:
      $ref: '#/components/responses/components_responses_NotFound'
    Unauthorized:
      $ref: '#/components/responses/components_responses_Unauthorized'
    components_responses_BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Bad request — invalid body, missing required fields, or validation
        failure.
    components_responses_ClusterUnreachable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Target cluster unreachable over the bus.
    components_responses_Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Conflict — resource state prevents the operation (e.g. no pending
        approval).
    components_responses_Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Forbidden — authenticated but insufficient permissions.
    components_responses_Internal:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Internal server error.
    components_responses_MethodNotAllowed:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Method not allowed on this endpoint.
    components_responses_NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Resource not found.
    components_responses_ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: |
        The upstream data source is temporarily unavailable (search sources, or the build record store when it is disabled or its schema is too old).
    components_responses_Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/components_schemas_Error'
      description: Not authenticated — missing or invalid bearer token.
  schemas:
    APIRule:
      additionalProperties: false
      description: An API rule defining resource access.
      properties:
        resources:
          items:
            type: string
          type: array
        verbs:
          items:
            type: string
          type: array
      required:
      - resources
      - verbs
      type: object
    ActivityEvent:
      additionalProperties: false
      description: A single activity feed event.
      properties:
        actor:
          type: string
        buildNumber:
          format: int64
          type: integer
        cluster:
          type: string
        controller:
          type: string
        itemPath:
          type: string
        message:
          type: string
        namespace:
          type: string
        phase:
          type: string
        reason:
          type: string
        result:
          type: string
        severity:
          enum:
          - info
          - warning
          - error
          type: string
        source:
          enum:
          - mite
          - operator
          - user
          - api
          - jenkins
          - mcp
          type: string
        timestamp:
          format: date-time
          type: string
        type:
          type: string
        url:
          type: string
      required:
      - timestamp
      - type
      - source
      - severity
      - message
      type: object
    ApiRuleRef:
      additionalProperties: false
      description: An API rule with resources and verbs.
      properties:
        resources:
          items:
            type: string
          type: array
        verbs:
          items:
            type: string
          type: array
      required:
      - resources
      - verbs
      type: object
    ApplyResult:
      additionalProperties: false
      description: Result of an apply operation with RFC3339 timestamp.
      properties:
        hash:
          type: string
        sections:
          items:
            $ref: '#/components/schemas/components_schemas_ApplySectionResult'
          type: array
        succeeded:
          type: boolean
        timestamp:
          type: string
      required:
      - timestamp
      - succeeded
      - sections
      type: object
    ApplySectionResult:
      additionalProperties: false
      description: Result for one apply section.
      properties:
        error:
          type: string
        name:
          type: string
        ok:
          type: boolean
      required:
      - name
      - ok
      type: object
    BindingFederationStatus:
      description: Federation outcome of a binding on one hive, or a federation fault
        of a role on one hive.
      properties:
        cluster:
          description: Hive cluster name.
          type: string
        lastTransitionTime:
          description: Time the state, reason, or message last changed.
          format: date-time
          type: string
        message:
          description: Human-readable detail for the state.
          type: string
        reason:
          description: CamelCase code for the state. Skipped codes are NoSubjects,
            TenantScope, RoleNotFound, NoJenkinsProjection, JenkinsRoleNotFound, NonGlobalJenkinsRole,
            and ReservedRole. Failed codes are HiveUnavailable, JenkinsRoleCollision,
            JenkinsRoleWriteFailed, JenkinsRoleBindingCollision, JenkinsRoleBindingWriteFailed,
            StaleJenkinsRoleBindingDeleteFailed, and StaleJenkinsRoleDeleteFailed.
            StaleJenkinsRoleDeleteFailed occurs only on a VarroaRole. The federated
            code is Federated.
          type: string
        state:
          enum:
          - federated
          - skipped
          - failed
          type: string
      required:
      - cluster
      - state
      - lastTransitionTime
      type: object
    BroodOperationDetail:
      additionalProperties: false
      description: Full brood operation resource with spec and status.
      properties:
        metadata:
          $ref: '#/components/schemas/components_schemas_ObjectMeta'
        spec:
          properties:
            action:
              properties:
                groovy:
                  description: Script selection for verb=executeGroovy. Exactly one
                    of script or itemRef.
                  properties:
                    itemRef:
                      properties:
                        name:
                          type: string
                        namespace:
                          type: string
                        pinnedContentHash:
                          type: string
                        variables:
                          additionalProperties:
                            type: string
                          type: object
                      type: object
                    script:
                      type: string
                  type: object
                upgrade:
                  description: Granularity selection for verb=upgrade. An absent targetVersion
                    releases each target's own held promoted revision; a set targetVersion
                    bulk-writes that version to every target.
                  properties:
                    targetVersion:
                      type: string
                  type: object
                verb:
                  enum:
                  - restart
                  - reprovision
                  - reconcile
                  - stop
                  - start
                  - executeGroovy
                  - upgrade
                  type: string
              type: object
            execution:
              properties:
                failurePolicy:
                  enum:
                  - FailFast
                  - FailTidy
                  - FailAtEnd
                  type: string
                maxParallel:
                  format: int32
                  type: integer
                order:
                  enum:
                  - rolloutWave
                  - name
                  type: string
              type: object
            suspend:
              type: boolean
            targets:
              properties:
                filters:
                  properties:
                    bundle:
                      type: string
                    phase:
                      type: string
                    version:
                      type: string
                  type: object
                names:
                  items:
                    type: string
                  type: array
                namespaces:
                  items:
                    type: string
                  type: array
                selector:
                  type: object
              type: object
            ttlSecondsAfterFinished:
              format: int32
              type: integer
          type: object
        status:
          properties:
            finishedAt:
              format: date-time
              type: string
            observedGeneration:
              format: int64
              type: integer
            phase:
              enum:
              - Pending
              - Running
              - Suspended
              - Succeeded
              - Failed
              - Canceled
              type: string
            reason:
              type: string
            scriptSnapshotRef:
              description: Name of the owner-referenced ConfigMap holding the once-resolved
                script content for a catalog-sourced executeGroovy operation. Empty
                for inline scripts and every other verb.
              type: string
            startedAt:
              format: date-time
              type: string
            startedBy:
              type: string
            summary:
              properties:
                failed:
                  format: int32
                  type: integer
                skipped:
                  format: int32
                  type: integer
                succeeded:
                  format: int32
                  type: integer
                total:
                  format: int32
                  type: integer
              type: object
            targets:
              items:
                properties:
                  dispatchedAt:
                    format: date-time
                    type: string
                  finishedAt:
                    format: date-time
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  output:
                    description: Verb-specific dispatch output (currently executeGroovy
                      only), truncated to 4096 bytes on a UTF-8-safe boundary.
                    type: string
                  reason:
                    type: string
                  state:
                    enum:
                    - Pending
                    - Dispatched
                    - Succeeded
                    - Failed
                    - Skipped
                    type: string
                  wave:
                    format: int32
                    type: integer
                type: object
              type: array
          type: object
      type: object
    BroodPreviewResponse:
      description: Per-cluster preview result with targets.
      properties:
        clusters:
          items:
            properties:
              cluster:
                type: string
              error:
                type: string
              ok:
                type: boolean
              targets:
                items:
                  properties:
                    applicable:
                      type: boolean
                    name:
                      type: string
                    namespace:
                      type: string
                    reason:
                      type: string
                    wave:
                      format: int32
                      type: integer
                  required:
                  - namespace
                  - name
                  - wave
                  - applicable
                  type: object
                type: array
            required:
            - cluster
            - ok
            type: object
          type: array
      required:
      - clusters
      type: object
    BuiltinRoleRef:
      additionalProperties: false
      description: A built-in VarroaRole with resolved Jenkins permissions.
      properties:
        apiRules:
          items:
            $ref: '#/components/schemas/components_schemas_ApiRuleRef'
          type: array
        jenkinsPermissions:
          description: Resolved Jenkins permissions (plugin/controller-level).
          items:
            type: string
          type: array
        jenkinsRoleRef:
          description: Reference to the corresponding JenkinsRole.
          type: string
        name:
          type: string
      required:
      - name
      - apiRules
      - jenkinsRoleRef
      - jenkinsPermissions
      type: object
    CancelRunResponse:
      additionalProperties: false
      description: |
        202 response for a fire-and-forget run action: a cancel, an input proceed, or an input abort. The BFF publishes one command and waits for no result.
      properties:
        state:
          enum:
          - requested
          type: string
      required:
      - state
      type: object
    CatalogItemSpec:
      additionalProperties: false
      description: Spec for a CatalogItem.
      properties:
        description:
          type: string
        displayName:
          type: string
        path:
          type: string
        requires:
          items:
            type: string
          type: array
        sourceRef:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          enum:
          - podtemplate
          - plugin
          - item
          - jcasc
          - rbac
          - pipeline-template
          - groovy
          type: string
        variables:
          items:
            $ref: '#/components/schemas/components_schemas_CatalogVariable'
          type: array
        version:
          type: string
      required:
      - sourceRef
      - type
      - path
      type: object
    CatalogSourceSpec:
      additionalProperties: false
      description: Spec for a CatalogSource (bundle catalog repository).
      properties:
        ociRef:
          description: OCI artifact reference; mutually exclusive with repoURL.
          type: string
        path:
          type: string
        repoURL:
          type: string
        revision:
          type: string
        secretRef:
          type: string
        syncIntervalSeconds:
          description: Catalog poll cadence in seconds. 0 or an omitted field means
            the default (300); any other value must be between 30 and 31536000.
          oneOf:
          - enum:
            - 0
          - maximum: 31536000
            minimum: 30
          type: integer
        trusted:
          type: boolean
      type: object
    CatalogVariable:
      additionalProperties: false
      description: A variable definition for a catalog item.
      properties:
        allowedValues:
          description: Populates a choice/dropdown widget. Only valid when type is
            "string" or "number".
          items:
            type: string
          type: array
        default:
          type: string
        description:
          type: string
        name:
          type: string
        required:
          type: boolean
        type:
          description: Parameter type. Omitting the field means "string".
          enum:
          - string
          - number
          - boolean
          - credentials
          type: string
      required:
      - name
      type: object
    Check:
      additionalProperties: false
      description: Result of a single preflight validation check.
      properties:
        id:
          type: string
        message:
          type: string
        status:
          enum:
          - pass
          - warn
          - fail
          type: string
      required:
      - id
      - status
      - message
      type: object
    ClassifiedPlugin:
      additionalProperties: false
      description: One classified installed plugin from the read model.
      properties:
        bundled:
          type: string
        class:
          type: string
        contributors:
          items:
            type: string
          type: array
        declaredBy:
          type: string
        detached:
          type: string
        enabled:
          type: string
        impliedBy:
          items:
            type: string
          type: array
        name:
          type: string
        version:
          type: string
        versionVerdict:
          type: string
      required:
      - name
      - version
      - class
      type: object
    ClassifiedPluginInventory:
      additionalProperties: false
      description: Full classified plugin inventory from the plugins sub-resource.
      properties:
        advisories:
          items:
            $ref: '#/components/schemas/components_schemas_PluginAdvisory'
          type: array
        bootstrapApproximate:
          type: boolean
        collectedAt:
          type: string
        counts:
          additionalProperties:
            type: integer
          type: object
        degraded:
          type: boolean
        detailAvailable:
          type: boolean
        detailStale:
          type: boolean
        driftTruncated:
          type: boolean
        hash:
          type: string
        observedAt:
          type: string
        optionalEdgesDropped:
          type: boolean
        plugins:
          items:
            $ref: '#/components/schemas/components_schemas_ClassifiedPlugin'
          type: array
        source:
          type: string
        stale:
          type: boolean
        total:
          type: integer
        truncated:
          type: boolean
      required:
      - hash
      - source
      - stale
      - degraded
      - bootstrapApproximate
      - optionalEdgesDropped
      - truncated
      - total
      - driftTruncated
      - detailAvailable
      type: object
    ClusterFanoutStatus:
      additionalProperties: false
      description: Per-cluster result of a fan-out list operation.
      properties:
        error:
          type: string
        name:
          type: string
        ok:
          type: boolean
      required:
      - name
      - ok
      type: object
    ClusterInfo:
      additionalProperties: false
      description: Status information for a known cluster.
      properties:
        connectedCount:
          format: int32
          type: integer
        controllerCount:
          format: int32
          type: integer
        core:
          description: 'true on exactly one row: the BFF''s own cluster'
          type: boolean
        drainStartedAt:
          format: date-time
          type: string
        healthy:
          type: boolean
        k8sVersion:
          type: string
        lastHeartbeat:
          format: date-time
          type: string
        name:
          type: string
        operatorVersion:
          type: string
        state:
          enum:
          - active
          - draining
          - drained
          type: string
      required:
      - name
      - core
      - healthy
      - lastHeartbeat
      - operatorVersion
      - k8sVersion
      - controllerCount
      - connectedCount
      - state
      type: object
    ComposedBundlePreview:
      additionalProperties: false
      description: Response from a composed bundle preview.
      properties:
        bundleYaml:
          type: string
        drifted:
          items:
            type: string
          type: array
        itemsYaml:
          type: string
        jenkinsYaml:
          type: string
        missing:
          items:
            type: string
          type: array
        pinPreflight:
          $ref: '#/components/schemas/components_schemas_PinPreflightReport'
        pipelineTemplates:
          description: One entry per template the composition delivered, in input
            order.
          items:
            $ref: '#/components/schemas/components_schemas_PipelineTemplateSummary'
          type: array
        pipelineTemplatesYaml:
          description: |
            The composed pipeline-template content, never resolved by ${var} substitution. Empty for a bundle with no pipeline-template input.
          type: string
        pluginsYaml:
          type: string
        rbacYaml:
          type: string
        unresolvedVariables:
          items:
            type: string
          type: array
        warnings:
          items:
            type: string
          type: array
      required:
      - bundleYaml
      - jenkinsYaml
      - pluginsYaml
      - itemsYaml
      - rbacYaml
      - pipelineTemplatesYaml
      - missing
      - drifted
      - warnings
      - unresolvedVariables
      - pinPreflight
      - pipelineTemplates
      type: object
    ComposedBundleRef:
      additionalProperties: false
      description: Reference to a ComposedBundle from a Controller.
      properties:
        name:
          type: string
        namespace:
          description: Empty = the controller's own namespace.
          type: string
      required:
      - name
      type: object
    ComposedBundleSpec:
      additionalProperties: false
      description: Spec for a ComposedBundle.
      properties:
        description:
          type: string
        displayName:
          type: string
        inputs:
          items:
            $ref: '#/components/schemas/components_schemas_ComposedInput'
          type: array
        jcascMergeStrategy:
          enum:
          - errorOnConflict
          - override
          type: string
        variables:
          additionalProperties:
            type: string
          type: object
      required:
      - inputs
      type: object
    ComposedBundleValidateResponse:
      additionalProperties: false
      description: Response from a composed bundle validation.
      properties:
        errors:
          items:
            type: string
          type: array
        pinPreflight:
          $ref: '#/components/schemas/components_schemas_PinPreflightReport'
        pipelineTemplates:
          description: One entry per template the composition delivered, in input
            order.
          items:
            $ref: '#/components/schemas/components_schemas_PipelineTemplateSummary'
          type: array
        unresolvedVariables:
          items:
            type: string
          type: array
        valid:
          type: boolean
        warnings:
          items:
            type: string
          type: array
      required:
      - valid
      - unresolvedVariables
      - pinPreflight
      - pipelineTemplates
      type: object
    ComposedInput:
      additionalProperties: false
      description: A single input to a composed bundle.
      properties:
        gitSource:
          $ref: '#/components/schemas/components_schemas_GitBundleSource'
        itemRef:
          $ref: '#/components/schemas/components_schemas_ComposedItemRef'
        ociSource:
          $ref: '#/components/schemas/components_schemas_OCIBundleSource'
      type: object
    ComposedItemRef:
      additionalProperties: false
      description: Reference to a catalog item composing a bundle.
      properties:
        name:
          type: string
        namespace:
          type: string
        pinnedContentHash:
          type: string
        variables:
          additionalProperties:
            type: string
          type: object
      required:
      - name
      type: object
    ControllerAttention:
      additionalProperties: false
      description: Why the controller needs an operator's attention, if it does. Exactly
        one kind is reported, chosen by precedence failed > reconcileBlocked > bootFailed
        > pluginRollFailed > applyFailed > miteUnreachable.
      properties:
        kind:
          enum:
          - failed
          - reconcileBlocked
          - bootFailed
          - pluginRollFailed
          - applyFailed
          - miteUnreachable
          type: string
        message:
          type: string
        reason:
          type: string
        since:
          format: date-time
          type: string
      required:
      - kind
      type: object
    ControllerDetail:
      additionalProperties: false
      description: Full controller detail including status and sub-resources.
      properties:
        appliedBundleHash:
          type: string
        applyHistory:
          items:
            $ref: '#/components/schemas/components_schemas_ApplyResult'
          type: array
        attention:
          $ref: '#/components/schemas/components_schemas_ControllerAttention'
        cell:
          $ref: '#/components/schemas/components_schemas_CellStatusProjection'
        certExpiry:
          type: string
        cluster:
          type: string
        composedBundleRef:
          $ref: '#/components/schemas/components_schemas_ComposedBundleRef'
        configHash:
          type: string
        desiredStateHash:
          type: string
        effectiveBundle:
          $ref: '#/components/schemas/components_schemas_EffectiveBundle'
        endpoint:
          type: string
        firstConnectedAt:
          type: string
        headless:
          description: Mirrors v1alpha1.IsHeadless. When true, endpoint is always
            the empty string, whatever the controller's Status.Endpoint carries.
          type: boolean
        hibernated:
          description: Whether the controller is currently hibernated (status.hibernated).
          type: boolean
        hibernatedAt:
          description: When the controller was last hibernated (status.hibernatedAt,
            RFC 3339).
          type: string
        jenkinsHealth:
          type: string
        jenkinsVersion:
          type: string
        kind:
          description: Mirrors v1alpha1.IsCell. Present for every controller.
          enum:
          - cell
          - stateful
          type: string
        lastApplyResult:
          $ref: '#/components/schemas/components_schemas_ApplyResult'
        lastReconciledAt:
