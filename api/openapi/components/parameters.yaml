# Shared path and query parameters.

namespace:
  name: namespace
  in: query
  description: Namespace filter (optional).
  required: false
  schema:
    type: string

cluster:
  name: cluster
  in: path
  description: Cluster name (DNS-1123 label).
  required: true
  schema:
    type: string
    pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

clusterQuery:
  name: cluster
  in: query
  description: Cluster name filter for aggregated list.
  required: false
  schema:
    type: string

tenantQuery:
  name: tenant
  in: query
  description: Tenant name filter for the runner list.
  required: false
  schema:
    type: string

ns:
  name: ns
  in: path
  description: Controller namespace.
  required: true
  schema:
    type: string

name:
  name: name
  in: path
  description: Resource name.
  required: true
  schema:
    type: string

prefix:
  name: prefix
  in: path
  description: API key prefix (first 7 characters).
  required: true
  schema:
    type: string

force:
  name: force
  in: query
  description: Force the update, overriding SSA field-ownership conflicts.
  required: false
  schema:
    type: boolean

tenant:
  name: tenant
  in: path
  description: >
    Tenant or controller name that addresses one pipelines tenant.
  required: true
  schema:
    type: string

job:
  name: job
  in: path
  description: >
    Percent-encoded job path, one path segment. The router reads it with
    PathValue, which returns the decoded value, so the job path's slashes
    reach the handler intact.
  required: true
  schema:
    type: string

case:
  name: case
  in: path
  description: >
    Percent-encoded test case key, one path segment. The key is the
    caseKey value that GET /runs/{run}/tests returns. Encode the whole
    key again, because the key holds a literal "/". The router reads it
    with PathValue, which returns the decoded value.
  required: true
  schema:
    type: string

run:
  name: run
  in: path
  description: Run identifier, a UUIDv7 string.
  required: true
  schema:
    type: string
    format: uuid

input:
  name: input
  in: path
  description: >
    Percent-encoded input step identifier, one path segment. The router
    reads it with PathValue, which returns the decoded value.
  required: true
  schema:
    type: string

artifactPath:
  name: path
  in: path
  description: >
    Multi-segment artifact path, exactly as run_artifacts.path stored it.
  required: true
  schema:
    type: string
