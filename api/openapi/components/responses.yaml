# Shared responses — all error responses carry the Error schema (N1).
BadRequest:
  description: Bad request — invalid body, missing required fields, or validation failure.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'

Unauthorized:
  description: Not authenticated — missing or invalid bearer token.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'

Forbidden:
  description: Forbidden — authenticated but insufficient permissions.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'

NotFound:
  description: Resource not found.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'

Conflict:
  description: Conflict — resource state prevents the operation (e.g. no pending approval).
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'

ApproveConflict:
  description: >-
    Conflict — no pending restart, no pending plugin roll, the pending change is
    not the one the caller approved, or the pending plugin roll changed after it
    was read.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/ApproveConflict'

MethodNotAllowed:
  description: Method not allowed on this endpoint.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'

Internal:
  description: Internal server error.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'

ClusterUnreachable:
  description: Target cluster unreachable over the bus.
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'

ServiceUnavailable:
  description: >
    The upstream data source is temporarily unavailable (search sources,
    or the build record store when it is disabled or its schema is too
    old).
  content:
    application/json:
      schema:
        $ref: './schemas.yaml#/Error'
