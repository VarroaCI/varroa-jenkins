# Shared schemas for the Varroa BFF API.
# See design.md §2, §3, and Go struct transcriptions.
# No additionalProperties: true except labels/annotations/variables string maps.

Error:
  type: object
  required: [error]
  properties:
    error:
      type: string
      description: Human-readable error message.
  additionalProperties: false

ApproveConflict:
  type: object
  description: Refusal of an approval. changes is present when the pending change is not the one the caller approved.
  required: [error]
  properties:
    error:
      type: string
      description: Human-readable error message.
    changes:
      type: array
      description: The sections of the current pending change.
      items:
        type: string
  additionalProperties: false

VersionInfo:
  type: object
  required: [component, version]
  properties:
    component:
      type: string
      description: Component name, e.g. "bff".
    version:
      type: string
      description: Build version (git short SHA or "dev").
  additionalProperties: false

KeyMeta:
  type: object
  description: Non-secret metadata for an API key.
  required: [prefix, created]
  properties:
    prefix:
      type: string
      description: First 7 characters of the key.
    created:
      type: string
      description: ISO 8601 creation time.
    lastUsed:
      type: string
      description: ISO 8601 last-use time, absent if never used.
    expires:
      type: string
      description: ISO 8601 expiration time, absent if no expiry.
    name:
      type: string
      description: Optional display name (≤128 chars). Absent when unnamed.
  additionalProperties: false

TokenResponse:
  type: object
  required: [token, warning]
  properties:
    token:
      type: string
      description: The new API key token (shown once).
    warning:
      type: string
      description: Fixed admonition that the token will not be shown again.
  additionalProperties: false

CreateKeyRequest:
  type: object
  description: Request body for creating or rotating an API key.
  properties:
    expiresIn:
      type: string
      description: Optional duration string (e.g. "720h"), absent for no expiry.
    name:
      type: string
      description: Optional display name (≤128 chars). When rotating, an absent or empty name carries the old key's name forward.
  additionalProperties: false

RotatePartialFailure:
  type: object
  description: Partial failure on rotate — new key created but old key could not be revoked.
  required: [error, newToken]
  properties:
    error:
      type: string
      description: Human-readable error message.
    newToken:
      type: string
      description: The new API key (the old key still exists).
  additionalProperties: false

Me:
  type: object
  description: Current user information, enriched from JWT claims and User CRD.
  required: [subject, email, name, groups, authMode]
  properties:
    preferredUsername:
      type: string
    subject:
      type: string
    email:
      type: string
    name:
      type: string
    groups:
      type: array
      items:
        type: string
    displayName:
      type: string
    preferences:
      $ref: '#/Preferences'
    authMode:
      type: string
      enum: [local, ldap, oidc]
      description: Source of this session. A local account beside OIDC reports local.
    lastLogin:
      type: string
      description: ISO 8601 last login time, absent if never logged in.
    signedInAt:
      type: string
      format: date-time
      description: Issue time of the session token. Absent for an API key caller.
  additionalProperties: false

Preferences:
  type: object
  description: User UI preferences.
  properties:
    theme:
      type: string
    accent:
      type: string
    defaultLanding:
      type: string
  additionalProperties: false

LoginRequest:
  type: object
  required: [username, password]
  properties:
    username:
      type: string
    password:
      type: string
  additionalProperties: false

LoginResponse:
  type: object
  description: |
    Successful login response. Uses snake_case to match OAuth2 conventions.
  required: [id_token, expires_in]
  properties:
    id_token:
      type: string
      description: Signed JWT session token.
    expires_in:
      type: integer
      description: Token lifetime in seconds.
  additionalProperties: false

# --- 3.2 user / group / team / identity schemas ---

UserListEntry:
  type: object
  description: Entry for each user in the user list.
  required: [name, email, groups, managedBy]
  properties:
    name:
      type: string
    email:
      type: string
    displayName:
      type: string
    groups:
      type: array
      items:
        type: string
    lastLogin:
      type: string
      description: ISO 8601 last login time.
    managedBy:
      type: string
      description: Source of user management, e.g. "local" or "idp".
    purpose:
      type: string
      enum: [service, break-glass]
      description: Purpose of a local account beside OIDC. Absent when not set.
  additionalProperties: false

CreateUserRequest:
  type: object
  description: Request body for creating a local account (admin only).
  required: [username, password]
  properties:
    username:
      type: string
    email:
      type: string
    displayName:
      type: string
    password:
      type: string
    groups:
      type: array
      items:
        type: string
    purpose:
      type: string
      enum: [service, break-glass]
      description: Required when local accounts run beside OIDC.
  additionalProperties: false

UpdateUserRequest:
  type: object
  description: Request body for updating a local account's identity fields.
  properties:
    email:
      type: string
    displayName:
      type: string
    purpose:
      type: string
      enum: [service, break-glass]
      description: Required when local accounts run beside OIDC.
  additionalProperties: false

GroupEntry:
  type: object
  description: Entry for each group in the group list.
  required: [name, members, memberCount, source]
  properties:
    name:
      type: string
    displayName:
      type: string
    members:
      type: array
      items:
        type: string
    memberCount:
      type: integer
      description: Number of members (from local and/or IDP sources).
    source:
      type: string
      enum: [local, idp, both]
      description: Origin of the group.
  additionalProperties: false

CreateGroupRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
    displayName:
      type: string
    members:
      type: array
      items:
        type: string
  additionalProperties: false

TeamRequest:
  type: object
  description: Request body for creating or updating a team.
  required: [name, namespaces]
  properties:
    name:
      type: string
      description: Team name (ignored in body for updates).
    displayName:
      type: string
    members:
      type: array
      items:
        type: string
      description: Direct member usernames.
    subjects:
      type: array
      items:
        $ref: '#/SubjectRef'
      description: OIDC subject references.
    namespaces:
      type: array
      items:
        type: string
      description: Target namespaces for this team.
    roleRef:
      type: string
      description: Name of a VarroaRole to bind. Must not be "admin".
    provisionNamespaces:
      type: boolean
      description: Whether to auto-provision namespaces.
    pipelines:
      $ref: '#/TeamPipelines'
  additionalProperties: false

TeamPipelines:
  type: object
  description: >-
    A Team's pipelines tenancy declaration (spec.pipelines). A Team that
    sets this becomes a pipelines tenant: one top-level folder on exactly
    one cell.
  required: [profile, agentNamespace]
  properties:
    profile:
      type: string
      minLength: 1
      description: >-
        JenkinsVersionProfile the placement pass resolves a cell against.
        Required when pipelines is set.
    cellPool:
      type: string
      description: >-
        The CellPool the placement pass selects a cell from. Empty means the
        profile's default pool: the pool whose name equals profile. A tenant
        that needs a cell of its own names a pool whose maxTenantsPerCell
        is 1.
    agentNamespace:
      type: string
      minLength: 1
      description: >-
        Kubernetes namespace this tenant's agents run in. Must be one of
        the team's own namespaces. Required when pipelines is set.
    composedBundleRef:
      $ref: '#/ComposedBundleRef'
      description: >-
        The ComposedBundle this tenant's items come from. Both name and
        namespace are set: a Team is cluster-scoped and has no namespace
        to default to.
    rehydrateBuilds:
      type: integer
      format: int32
      minimum: 0
      maximum: 100
      description: >-
        How many of a job's newest completed builds the operator seeds
        when this tenant's cell changes. The newest successful build is
        always seeded in addition. Default 10.
    rehydrateDeadline:
      type: string
      description: >-
        How long the operator keeps retrying a deferred rehydration seed
        before it stops and reports RehydrationFailed. Default 30m, range
        1m to 24h.
    interruptedRetry:
      type: string
      enum: [manual, automatic]
      description: >-
        Whether an interrupted run retries on its own. "manual" (default)
        leaves the retry to a user. "automatic" retries once.
    concurrency:
      type: string
      enum: [allow, cancelInProgress]
      description: >-
        This tenant's job concurrency policy. "allow" (default) runs
        builds side by side. "cancelInProgress" cancels the running build
        of the same job path when a new one starts.
    cronBackstop:
      type: boolean
      description: >-
        Turns the backstop cron scheduler on for this tenant. Default
        true.
    cronCatchUp:
      type: string
      enum: [one, none]
      description: >-
        How many missed cron occurrences the backstop fires on wake.
        "one" (default) fires the newest missed occurrence. "none" fires
        nothing.
    cronGrace:
      type: string
      description: >-
        How long the backstop waits past a missed cron occurrence before
        it fires. Default 5m, range 1m to 60m.
    members:
      type: integer
      format: int32
      minimum: 1
      maximum: 16
      description: >-
        The number of active slots this tenant runs. Each slot holds one
        cell, and a job runs only on its home slot's holder. Default 1.
        This field is not spec.members, which lists local usernames.
    standby:
      type: integer
      format: int32
      minimum: 0
      maximum: 8
      description: >-
        The number of warm members this tenant keeps. A standby holds the
        folder and no slot. It takes a slot whose holder dies. Default 0.
    exports:
      type: array
      items:
        $ref: '#/TeamExport'
      description: >-
        Grants of this tenant's jobs and locks to other tenants. An absent
        list exports nothing.
    notifications:
      $ref: '#/TeamNotifications'
    retention:
      $ref: '#/TeamPipelinesRetention'
    concurrencyLimits:
      type: array
      maxItems: 32
      items:
        $ref: '#/TeamConcurrencyLimit'
      description: >-
        Named caps on how many builds of a set of this tenant's jobs run at
        one time. A build over a limit waits in the queue. A tenant pipelines
        admin may write this field.
  additionalProperties: false

TeamNotifications:
  type: object
  description: >-
    Outward notifications of a pipelines tenant. The record store posts
    the completion webhook for each run.
  properties:
    webhook:
      $ref: '#/TeamWebhook'
  additionalProperties: false

TeamWebhook:
  type: object
  description: >-
    A completion webhook. The record store posts a signed JSON payload to
    url for each run this tenant completes. The signing key lives in the
    Secret that secretRef names, in the tenant's agent namespace.
  required: [url, secretRef]
  properties:
    url:
      type: string
      maxLength: 2048
      description: >-
        Receiver endpoint. Starts with https:// or http://. Use https://
        for a receiver outside the cluster.
    secretRef:
      $ref: '#/TeamWebhookSecret'
  additionalProperties: false

TeamWebhookSecret:
  type: object
  description: >-
    The Secret and data key that hold the HMAC signing key. The key
    defaults to hmac-key.
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      description: Name of the Secret in the tenant's agent namespace.
    key:
      type: string
      description: Data key that holds the signing key. Default hmac-key.
  additionalProperties: false

TeamPipelinesRetention:
  type: object
  description: >-
    Record-store windows for this tenant's runs. A job rule replaces the
    tenant window for the jobs it matches. The store-wide window caps both.
    Only an operator may set it.
  properties:
    runs:
      type: string
      pattern: '^([1-9][0-9]{0,2}|[1-2][0-9]{3}|3[0-5][0-9]{2}|36[0-4][0-9]|3650)d$'
      description: >-
        The tenant window, in whole days, such as 30d. It shortens the
        store-wide window and never lengthens it.
    jobs:
      type: array
      maxItems: 64
      items:
        $ref: '#/TeamJobRetention'
      description: >-
        Per-job windows. The first rule whose job glob matches sets the
        window of that job.
  additionalProperties: false

TeamJobRetention:
  type: object
  description: A run window for the jobs that match a folder-relative glob.
  required: [job, runs]
  properties:
    job:
      type: string
      minLength: 1
      maxLength: 512
      pattern: '^[^/]'
      description: Folder-relative job glob. It must not start with /.
    runs:
      type: string
      pattern: '^([1-9][0-9]{0,2}|[1-2][0-9]{3}|3[0-5][0-9]{2}|36[0-4][0-9]|3650)d$'
      description: The job window, in whole days, such as 7d.
  additionalProperties: false

TeamConcurrencyLimit:
  type: object
  description: A cap on the builds of a named set of jobs that run at once.
  required: [name, jobs, max]
  properties:
    name:
      type: string
      maxLength: 63
      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      description: Name of the limit, a DNS label. The queue and the run views show it.
    jobs:
      type: array
      minItems: 1
      maxItems: 64
      items:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[^/]'
      description: Folder-relative job globs (*, **, ?).
    max:
      type: integer
      format: int32
      minimum: 1
      maximum: 1000
      description: Number of builds the set runs at one time.
  additionalProperties: false

TeamExport:
  type: object
  description: >-
    One grant a pipelines tenant makes to other tenants: a job pattern or
    a list of lock patterns, plus the callers allowed to use it. Exactly
    one of job or locks is set.
  required: [callers]
  properties:
    job:
      type: string
      description: >-
        Folder-relative job glob this tenant exports. Exactly one of job
        or locks is set.
    locks:
      type: array
      items:
        type: string
      description: >-
        Globs over the bare names of this tenant's own locks. Exactly one
        of job or locks is set.
    callers:
      type: array
      items:
        type: string
      minItems: 1
      description: Team names allowed to use this export.
  additionalProperties: false

TeamRehydration:
  type: object
  description: >-
    A pipelines tenant's build-record rehydration state
    (status.rehydration). Response-only: TeamReconciler is its only
    writer.
  properties:
    generation:
      type: integer
      format: int64
      description: Placement generation this state was built for.
    cellInstance:
      type: string
      description: Cell pod UID this state was built for.
    records:
      type: integer
      format: int32
      description: Number of thin build records the last bundle carried.
    truncated:
      type: boolean
      description: >-
        True when the last bundle dropped changelogs or older records to
        fit the byte budget.
    unseededJobs:
      type: integer
      format: int32
      description: Number of jobs no bundle has covered yet.
    deferred:
      type: array
      items:
        type: string
      description: >-
        Job paths the mite could not seed on the last apply, because the
        job did not exist yet.
    attempts:
      type: integer
      format: int32
      description: Rehydration retries since the last applied bundle.
    lastAttempt:
      type: string
      format: date-time
      description: When the operator last sent a rehydration bundle for this tenant.
  additionalProperties: false

TeamPlacement:
  type: object
  description: >-
    The cell a pipelines tenant is bound to (status.placement).
    Response-only: the placement pass is its only writer.
  properties:
    cluster:
      type: string
      description: Cluster the bound cell runs in.
    cell:
      type: string
      description: Name of the bound cell Controller.
    cellNamespace:
      type: string
      description: Namespace of the bound cell Controller.
    generation:
      type: integer
      format: int64
      description: Increases only when the bound cell changes.
    members:
      type: array
      items:
        $ref: '#/TeamMember'
      description: >-
        Every member of this tenant. The scalar fields above keep
        describing slot 0.
  additionalProperties: false

TeamMember:
  type: object
  description: >-
    One member of a pipelines tenant (status.placement.members).
    Response-only: the placement pass is its only writer.
  properties:
    cell:
      type: string
      description: Name of the cell Controller that holds this member.
    cellNamespace:
      type: string
      description: Namespace of that cell Controller.
    role:
      type: string
      enum: [active, standby]
      description: >-
        An active member holds one slot. A standby holds the folder, holds
        no slot, and runs no build.
    slot:
      type: integer
      format: int32
      description: The slot index. Set only on an active member.
    applied:
      type: boolean
      description: True when the member's cell reports this tenant applied.
  additionalProperties: false

TeamEntry:
  type: object
  description: Full team object returned from get/list operations.
  required: [name, namespaces]
  properties:
    name:
      type: string
    displayName:
      type: string
    members:
      type: array
      items:
        type: string
    subjects:
      type: array
      items:
        $ref: '#/SubjectRef'
    namespaces:
      type: array
      items:
        type: string
    roleRef:
      type: string
    provisionNamespaces:
      type: boolean
    pipelines:
      $ref: '#/TeamPipelines'
    observedGeneration:
      type: integer
      format: int64
    groupRef:
      type: string
      description: Reference to the managed VarroaRoleBinding group.
    bindingRef:
      type: string
      description: Reference to the managed VarroaRoleBinding.
    namespaceStates:
      type: array
      items:
        $ref: '#/TeamNamespaceState'
    conditions:
      type: array
      items:
        $ref: '#/TeamCondition'
    placement:
      $ref: '#/TeamPlacement'
    rehydration:
      $ref: '#/TeamRehydration'
  additionalProperties: false

SubjectRef:
  type: object
  description: Reference to a subject by kind and name.
  required: [kind, name]
  properties:
    kind:
      type: string
      enum: [Group, User]
      description: Subject kind.
    name:
      type: string
      description: OIDC claim value (group name or user subject).
  additionalProperties: false

TeamNamespaceState:
  type: object
  description: State of a single namespace for a Team.
  required: [name, state]
  properties:
    name:
      type: string
    state:
      type: string
  additionalProperties: false

TeamCondition:
  type: object
  description: Status condition for a Team.
  required: [type, status]
  properties:
    type:
      type: string
    status:
      type: string
    lastTransitionTime:
      type: string
      description: ISO 8601 last transition time.
    reason:
      type: string
    message:
      type: string
  additionalProperties: false

RunnerSpec:
  type: object
  description: >-
    A Runner's mutable configuration (spec.*). team and launcher are
    immutable after creation.
  required: [team, launcher, remoteFS]
  properties:
    team:
      type: string
      description: The pipelines Team that owns this runner. Immutable.
    launcher:
      type: string
      enum: [ssh, inbound]
      description: Connection direction. Immutable.
    labels:
      type: array
      items:
        type: string
      description: >-
        Unprefixed label suffixes; the operator prefixes each one with
        <team>-.
    remoteFS:
      type: string
      description: The agent work directory on the node.
    numExecutors:
      type: integer
      description: The node's executor count. Defaults to 1.
    host:
      type: string
      description: The SSH target. Required for launcher ssh; forbidden for inbound.
    port:
      type: integer
      description: The SSH port. Required for launcher ssh; forbidden for inbound.
    credentialRef:
      type: string
      description: >-
        Name of a Secret in the Team's agent namespace holding the SSH
        credential. Required for launcher ssh; forbidden for inbound.
    javaPath:
      type: string
      description: An explicit java binary path for the ssh launcher.
  additionalProperties: false

RunnerCondition:
  type: object
  description: Status condition for a Runner. Type Ready.
  required: [type, status]
  properties:
    type:
      type: string
    status:
      type: string
    lastTransitionTime:
      type: string
      description: ISO 8601 last transition time.
    reason:
      type: string
    message:
      type: string
  additionalProperties: false

RunnerStatus:
  type: object
  description: >-
    A Runner's observed state (status.*). status.token is present only for
    a caller holding runners:create; the BFF redacts it for every other
    caller (design D12).
  required: [connected]
  properties:
    nodeName:
      type: string
      description: The rendered Jenkins node name, <team>-<runner name>.
    cell:
      type: string
      description: The Controller that hosts this runner's node.
    cellNamespace:
      type: string
    token:
      type: string
      description: >-
        The door bearer credential for an inbound runner. Minted once by
        the operator; never set for an ssh runner.
    connected:
      type: boolean
      description: The last liveness probe result for this runner's node.
    lastSeen:
      type: string
      description: ISO 8601 time of the last online probe result.
    observedGeneration:
      type: integer
      format: int64
    conditions:
      type: array
      items:
        $ref: '#/RunnerCondition'
  additionalProperties: false

RunnerEntry:
  type: object
  description: Full runner object returned from get/list operations.
  required: [name, spec, status]
  properties:
    name:
      type: string
    spec:
      $ref: '#/RunnerSpec'
    status:
      $ref: '#/RunnerStatus'
  additionalProperties: false

RunnerCreateRequest:
  type: object
  description: Request body for POST /runners.
  required: [name, spec]
  properties:
    name:
      type: string
      description: >-
        metadata.name. Not generated: the operator names the machine, and
        the rendered node is <team>-<name>.
    spec:
      $ref: '#/RunnerSpec'
  additionalProperties: false

IdentitySettings:
  type: object
  description: Identity and OIDC configuration (admin view, client secret never included).
  required: [mode, cookieDomain, defaultRead, localAccounts]
  properties:
    mode:
      type: string
      enum: [local, ldap, oidc]
    cookieDomain:
      type: string
    defaultRead:
      type: boolean
    localAccounts:
      type: boolean
      description: True when declared local accounts sign in beside OIDC.
    issuer:
      type: string
      description: OIDC issuer URL (present in OIDC mode only).
    clientId:
      type: string
      description: OIDC client ID (present in OIDC mode only).
    scopes:
      type: array
      items:
        type: string
      description: OIDC scopes (present in OIDC mode only).
  additionalProperties: false

BuiltinRoleRef:
  type: object
  description: A built-in VarroaRole with resolved Jenkins permissions.
  required: [name, apiRules, jenkinsRoleRef, jenkinsPermissions]
  properties:
    name:
      type: string
    apiRules:
      type: array
      items:
        $ref: '#/ApiRuleRef'
    jenkinsRoleRef:
      type: string
      description: Reference to the corresponding JenkinsRole.
    jenkinsPermissions:
      type: array
      items:
        type: string
      description: Resolved Jenkins permissions (plugin/controller-level).
  additionalProperties: false

ApiRuleRef:
  type: object
  description: An API rule with resources and verbs.
  required: [resources, verbs]
  properties:
    resources:
      type: array
      items:
        type: string
    verbs:
      type: array
      items:
        type: string
  additionalProperties: false

# --- 3.3 controller schemas ---

ObjectMeta:
  type: object
  description: Slim Kubernetes ObjectMeta for CRD-shaped request/response bodies.
  properties:
    name:
      type: string
    namespace:
      type: string
    labels:
      type: object
      additionalProperties:
        type: string
    annotations:
      type: object
      additionalProperties:
        type: string

ComposedBundleRef:
  type: object
  description: Reference to a ComposedBundle from a Controller.
  required: [name]
  properties:
    name:
      type: string
    namespace:
      type: string
      description: Empty = the controller's own namespace.
  additionalProperties: false

ControllerSpec:
  type: object
  description: Desired state of a Controller. Transcribed from v1alpha1.ControllerSpec.
  properties:
    endpoint:
      type: string
      description: API endpoint URL for the controller.
    version:
      type: string
      description: Controller version tag.
    composedBundleRef:
      $ref: '#/ComposedBundleRef'
    pluginSpec:
      $ref: '#/PluginSpec'
    backupSpec:
      $ref: '#/BackupSpec'
    ingressSpec:
      $ref: '#/IngressSpec'
    miteSpec:
      $ref: '#/MiteSpec'
    powerState:
      type: string
      enum: ["", Running, Stopped]
      description: Controls whether the controller runs. Hibernation is reported in status.hibernated, not requested here.
    headless:
      type: boolean
      description: Blocks the Jenkins web UI for every non-admin caller. A cell is always headless.
    resources:
      type: object
      description: CPU/memory resource requests and limits (transcribed from corev1.ResourceRequirements).
      properties:
        requests:
          type: object
          description: Minimum resource requests for the Jenkins container.
          additionalProperties:
            type: string
            # Kubernetes quantity pattern, mirrored from the generated CRD
            # (see charts/varroa/crds/varroa.dev_controllers.yaml). type: string
            # is deliberate — the CRD's anyOf int-or-string is not mirrored
            # (allowlisted in the CRD/BFF drift guard).
            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
        limits:
          type: object
          description: Maximum resource limits for the Jenkins container.
          additionalProperties:
            type: string
            # See the pattern note on requests.
            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
    persistence:
      $ref: '#/PersistenceSpec'
    reconciliationPolicy:
      $ref: '#/ReconciliationPolicy'
    rbacSpec:
      $ref: '#/RBACSpec'
    podOverrides:
      $ref: '#/PodOverrides'
    resourceOverlay:
      $ref: '#/ResourceOverlay'
    className:
      type: string
      description: References a ControllerClass by name, layering its defaults between ProvisioningDefaults and the Controller's own spec.
    hibernation:
      $ref: '#/HibernationSpec'
    cell:
      $ref: '#/CellSpec'
    probes:
      $ref: '#/ProbesSpec'
  additionalProperties: false

RBACSpec:
  type: object
  description: RBAC configuration mapping OIDC groups to Varroa roles (transcribed from v1alpha1.RBACSpec).
  properties:
    groups:
      type: array
      description: Group-to-role bindings.
      items:
        $ref: '#/RBACGroupBinding'
  additionalProperties: false

RBACGroupBinding:
  type: object
  description: A single OIDC group-to-role binding.
  required: [name, role]
  properties:
    name:
      type: string
      description: The OIDC group claim value.
    role:
      type: string
      enum: [admin, operator, developer, viewer]
      description: Built-in Varroa role short name.
  additionalProperties: false

PluginSpec:
  type: object
  description: Plugin policy and entries (transcribed from v1alpha1.PluginSpec).
  properties:
    policy:
      type: string
      description: Policy for plugin management (e.g. "pinned").
    entries:
      type: array
      description: Plugins with pinned versions.
      items:
        $ref: '#/PluginEntry'
  additionalProperties: false

PluginEntry:
  type: object
  description: A single plugin with pinned version.
  required: [artifactId, version]
  properties:
    artifactId:
      type: string
      description: Jenkins plugin artifact ID.
    version:
      type: string
      description: Pinned plugin version.
  additionalProperties: false

BackupSpec:
  type: object
  description: Backup configuration (transcribed from v1alpha1.BackupSpec).
  properties:
    enabled:
      type: boolean
      description: Whether backups are enabled.
    schedule:
      type: string
      description: Cron expression for the backup schedule.
    retentionDays:
      type: integer
      description: Number of days to retain backups.
  additionalProperties: false

IngressSpec:
  type: object
  description: Ingress configuration (transcribed from v1alpha1.IngressSpec).
  properties:
    host:
      type: string
      description: Ingress hostname.
    tlsSecretName:
      type: string
      description: Name of the TLS secret.
    mode:
      type: string
      enum: ["", subdomain, path]
      description: Controls how the controller is exposed. "subdomain" (default) assigns its own host; "path" serves at /jenkins/<ns>/<name>. Immutable after create.
    annotations:
      type: object
      description: Ingress annotations merged onto this controller's ingress.
      additionalProperties:
        type: string
    ingressClassName:
      type: string
      description: Override the cluster-level ingress class name for this controller. Empty uses the cluster default.
  additionalProperties: false

PodOverrides:
  type: object
  description: Typed pod-scoped customizations (transcribed from v1alpha1.PodOverrides).
  properties:
    env:
      type: array
      description: Environment variables added or overridden on the jenkins container (merged by name).
      items:
        type: object
    envFrom:
      type: array
      description: envFrom sources added to the jenkins container.
      items:
        type: object
    volumes:
      type: array
      description: Pod volumes (merged by name).
      items:
        type: object
    volumeMounts:
      type: array
      description: Volume mounts added to the jenkins container (merged by name).
      items:
        type: object
    podLabels:
      type: object
      description: Labels added to the pod template metadata.
      additionalProperties:
        type: string
    podAnnotations:
      type: object
      description: Annotations added to the pod template metadata.
      additionalProperties:
        type: string
    labels:
      type: object
      description: Labels added to the StatefulSet metadata.
      additionalProperties:
        type: string
    annotations:
      type: object
      description: Annotations added to the StatefulSet metadata.
      additionalProperties:
        type: string
    jvmOpts:
      type: string
      description: JVM options appended (space-joined) to the baseline JAVA_OPTS value.
    nodeSelector:
      type: object
      description: Pod nodeSelector constraints.
      additionalProperties:
        type: string
    tolerations:
      type: array
      description: Pod tolerations.
      items:
        type: object
    affinity:
      type: object
      description: Pod scheduling affinity.
    securityContext:
      type: object
      description: Pod-level security context.
  additionalProperties: false

ConflictResponse:
  type: object
  description: SSA field-conflict error body returned on 409 Conflict during a PATCH.
  required: [error, conflicts]
  properties:
    error:
      type: string
      description: Human-readable conflict error message.
    conflicts:
      type: array
      description: List of conflicting fields.
      items:
        $ref: '#/ConflictItem'
  additionalProperties: false

ConflictItem:
  type: object
  description: A single field conflict detail.
  required: [field, message]
  properties:
    field:
      type: string
      description: JSON path to the conflicting field (e.g. ".spec.version").
    manager:
      type: string
      description: Field manager that owns the conflict, if identifiable.
    message:
      type: string
      description: Conflict detail message.
  additionalProperties: false

MiteSpec:
  type: object
  description: Mite sidecar configuration (transcribed from v1alpha1.MiteSpec).
  properties:
    resources:
      type: object
      description: CPU/memory resource requests and limits for the mite sidecar container.
      properties:
        requests:
          type: object
          description: Minimum resource requests.
          additionalProperties:
            type: string
            # Kubernetes quantity pattern, mirrored from the Controller CRD.
            # See the pattern note on ControllerSpec.resources.
            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
        limits:
          type: object
          description: Maximum resource limits.
          additionalProperties:
            type: string
            # See the pattern note on requests.
            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
    image:
      type: string
      description: Mite sidecar container image override for this Controller.
    imagePullPolicy:
      type: string
      description: Mite sidecar image pull policy override for this Controller.
      enum: [Always, Never, IfNotPresent]
  additionalProperties: false

PersistenceSpec:
  type: object
  description: Persistent volume size/class (transcribed from v1alpha1.PersistenceSpec).
  properties:
    size:
      type: string
      description: Persistent volume storage request (e.g. "20Gi").
    storageClass:
      type: string
      description: Kubernetes StorageClass name for the persistent volume.
  additionalProperties: false

ResourceOverlay:
  type: object
  description: Raw strategic-merge-patch YAML for provisioned resources (transcribed from v1alpha1.ResourceOverlay).
  properties:
    statefulSet:
      type: string
      description: Strategic-merge-patch YAML applied to the Jenkins StatefulSet.
    service:
      type: string
      description: Strategic-merge-patch YAML applied to the controller Service.
    ingress:
      type: string
      description: Strategic-merge-patch YAML applied to the controller Ingress.
  additionalProperties: false

ProbesSpec:
  type: object
  description: Health probe tuning (transcribed from v1alpha1.ProbesSpec).
  properties:
    startup:
      $ref: '#/ProbeSpec'
    readiness:
      $ref: '#/ProbeSpec'
    liveness:
      $ref: '#/ProbeSpec'
  additionalProperties: false

ProbeSpec:
  type: object
  description: Curated probe timing knobs (transcribed from corev1.Probe subset).
  properties:
    disabled:
      type: boolean
      description: Removes this probe entirely. Default false (probe enabled with defaults).
    initialDelaySeconds:
      type: integer
      description: Number of seconds before the first probe attempt.
    periodSeconds:
      type: integer
      description: How often (in seconds) to perform the probe.
    timeoutSeconds:
      type: integer
      description: Number of seconds after which the probe times out.
    failureThreshold:
      type: integer
      description: Minimum consecutive failures for the probe to be considered failed.
    successThreshold:
      type: integer
      description: Minimum consecutive successes for the probe to be considered successful.
  additionalProperties: false

CellSpec:
  type: object
  description: >-
    Marks a controller as a shared cell that hosts tenant pipelines. enabled is
    immutable after creation; maxTenants bounds placement.
  properties:
    enabled:
      type: boolean
    maxTenants:
      type: integer
      format: int32
  required: [enabled]
  additionalProperties: false

HibernationSpec:
  type: object
  description: Automatic hibernation configuration (transcribed from v1alpha1.HibernationSpec).
  properties:
    enabled:
      type: boolean
      description: Enables automatic hibernation. When enabled, the controller parks (scales to 0) after inactivity.
    gracePeriodMinutes:
      type: integer
      description: Minutes of inactivity before the controller hibernates. Minimum 5. Default 60.
    activityIgnoreRegex:
      type: string
      description: Regular expression matched against request paths to exclude them from activity tracking.
  additionalProperties: false

ControllerSummary:
  type: object
  description: Summary entry for each controller in the list.
  required: [name, namespace, cluster, phase, endpoint, headless, miteConnected, routingMode, kind, createdAt]
  properties:
    name:
      type: string
    namespace:
      type: string
    cluster:
      type: string
    phase:
      type: string
    endpoint:
      type: string
      description: External URL of the controller. A row of another cluster carries that cluster's own status.endpoint, or a URL from an explicit ingress host. It is empty when the host is not known or the controller is headless.
    kind:
      type: string
      enum: [cell, stateful]
      description: >-
        Mirrors v1alpha1.IsCell. Always present, so a client never reads the
        kind from an absent field.
    cellPool:
      type: string
      description: The controller's varroa.dev/cell-pool label. Absent while no label is set.
    tenantCount:
      type: integer
      format: int32
      description: >-
        The length of status.cell.tenants, never of status.cell.appliedTenants.
        Absent for a controller that is not a cell.
    maxTenants:
      type: integer
      format: int32
      description: >-
        The same effective cap the cell usage read resolves. Absent for a
        controller that is not a cell.
    warm:
      type: boolean
      description: status.cell.warm. Absent for a controller that is not a cell.
    createdAt:
      type: string
      format: date-time
      description: metadata.creationTimestamp, RFC 3339. Present for every controller.
    unreadySince:
      type: string
      format: date-time
      description: status.cell.unreadySince, RFC 3339. Absent while the cell is ready.
    headless:
      type: boolean
      description: >-
        Mirrors v1alpha1.IsHeadless. When true, endpoint is always the empty
        string, whatever the controller's Status.Endpoint carries.
    version:
      type: string
      description: Desired Jenkins version (from spec.version).
    miteConnected:
      type: boolean
    miteVersion:
      type: string
    jenkinsVersion:
      type: string
    jenkinsHealth:
      type: string
    composedBundleRef:
      $ref: '#/ComposedBundleRef'
    effectiveBundle:
      $ref: '#/EffectiveBundle'
    routingMode:
      type: string
      description: 'Either "subdomain" or "path".'
    appliedBundleHash:
      type: string
    rolloutWave:
      type: integer
      description: RolloutWave from the reconciliation policy.
    attention:
      $ref: '#/ControllerAttention'
    lastSeen:
      type: string
      description: Last mite heartbeat, RFC3339 UTC. Absent when no mite has reported.
  additionalProperties: false

ControllerAttention:
  type: object
  description: >-
    Why the controller needs an operator's attention, if it does. Exactly one kind is
    reported, chosen by precedence failed > reconcileBlocked > bootFailed >
    pluginRollFailed > applyFailed > miteUnreachable.
  required: [kind]
  properties:
    kind:
      type: string
      enum: [failed, reconcileBlocked, bootFailed, pluginRollFailed, applyFailed, miteUnreachable]
    reason:
      type: string
    message:
      type: string
    since:
      type: string
      format: date-time
  additionalProperties: false

ReconciliationPolicy:
  type: object
  description: Reconciliation policy for a controller.
  properties:
    mode:
      type: string
    interval:
      type: string
    maxDeferSeconds:
      type: integer
    drainTimeoutSeconds:
      type: integer
  additionalProperties: false

PendingRestart:
  type: object
  description: Pending restart information.
  required: [detectedAt, desiredStateHash]
  properties:
    detectedAt:
      type: string
    desiredStateHash:
      type: string
    contentHash:
      type: string
      description: Hash of the JCasC, RBAC, and items of the pending change. Send it as expectedContentHash to approve this change only.
    changes:
      type: array
      items:
        type: string
  additionalProperties: false

PendingPluginRoll:
  type: object
  description: Pending plugin roll information.
  required: [targetChecksum, since]
  properties:
    targetChecksum:
      type: string
    since:
      type: string
    changes:
      type: array
      items:
        type: string
  additionalProperties: false

PendingDeletion:
  type: object
  description: Pending item deletion.
  required: [path]
  properties:
    path:
      type: string
    reason:
      type: string
    detectedAt:
      type: string
  additionalProperties: false

ApplySectionResult:
  type: object
  description: Result for one apply section.
  required: [name, ok]
  properties:
    name:
      type: string
    ok:
      type: boolean
    error:
      type: string
  additionalProperties: false

ApplyResult:
  type: object
  description: Result of an apply operation with RFC3339 timestamp.
  required: [timestamp, succeeded, sections]
  properties:
    hash:
      type: string
    timestamp:
      type: string
    succeeded:
      type: boolean
    sections:
      type: array
      items:
        $ref: '#/ApplySectionResult'
  additionalProperties: false

LiveDrift:
  type: object
  description: Live-drift status for a controller.
  required: [detected]
  properties:
    detected:
      type: boolean
    liveConfigHash:
      type: string
    detectedAt:
      type: string
  additionalProperties: false

ReconcileBlocked:
  type: object
  description: Read-only projection of whether the controller's reconcile loop is currently blocked by an unresolved error.
  required: [blocked]
  properties:
    blocked:
      type: boolean
    reason:
      type: string
    message:
      type: string
    since:
      type: string
  additionalProperties: false

Rollout:
  type: object
  description: Rollout gate status for a controller.
  required: [blocked]
  properties:
    targetBundleHash:
      type: string
    blocked:
      type: boolean
    paused:
      type: boolean
    waitingOn:
      type: array
      items:
        type: string
    blockedSince:
      type: string
  additionalProperties: false

VersionStatus:
  type: object
  description: Read-only projection of version-related controller conditions.
  properties:
    rollPending:
      type: boolean
    rollReason:
      type: string
    rollMessage:
      type: string
    upgradeBlocked:
      type: boolean
    blockedReason:
      type: string
    blockedMessage:
      type: string
  additionalProperties: false

PluginConflict:
  type: object
  description: Read-only projection of the plugin-lock-conflict controller condition (ConditionPluginConflict).
  properties:
    active:
      type: boolean
    reason:
      type: string
    message:
      type: string
  additionalProperties: false

MiteImageStatus:
  type: object
  description: Read-only projection of mite image staleness.
  properties:
    image:
      type: string
      nullable: true
    stale:
      type: boolean
      nullable: true
  additionalProperties: false

SourceJSON:
  type: object
  description: Observability source status.
  required: [provider, status]
  properties:
    provider:
      type: string
    status:
      type: string
    error:
      type: string
    hints:
      type: object
      additionalProperties:
        type: string
  additionalProperties: false

FreshnessJSON:
  type: object
  description: Observability freshness information.
  required: [stale]
  properties:
    observedAt:
      type: string
    miteTTL:
      type: integer
    stale:
      type: boolean
  additionalProperties: false

RecentBuild:
  type: object
  description: A recent build entry.
  required: [jobName, buildNumber, status]
  properties:
    jobName:
      type: string
    buildNumber:
      type: integer
    status:
      type: string
    startedAt:
      type: string
    durationSeconds:
      type: integer
    url:
      type: string
  additionalProperties: false

SummaryJSON:
  type: object
  description: Observability summary.
  properties:
    totalJobs:
      type: integer
    runningBuilds:
      type: integer
    recentBuilds:
      type: array
      items:
        $ref: '#/RecentBuild'
  additionalProperties: false

ControllerObservability:
  type: object
  description: Normalized observability model for a controller.
  required: [sources, capabilities, level, levelName, freshness]
  properties:
    sources:
      type: array
      items:
        $ref: '#/SourceJSON'
    capabilities:
      type: array
      items:
        type: string
    level:
      type: integer
    levelName:
      type: string
    warnings:
      type: array
      items:
        type: object
    freshness:
      $ref: '#/FreshnessJSON'
    summary:
      $ref: '#/SummaryJSON'
  additionalProperties: false

ControllerDetail:
  type: object
  description: Full controller detail including status and sub-resources.
  required: [name, namespace, cluster, phase, endpoint, headless, version, miteConnected, routingMode, reconcileBlocked, spec, kind]
  properties:
    spec:
      $ref: '#/ControllerSpec'
    kind:
      type: string
      enum: [cell, stateful]
      description: Mirrors v1alpha1.IsCell. Present for every controller.
    cell:
      $ref: '#/CellStatusProjection'
    name:
      type: string
    namespace:
      type: string
    cluster:
      type: string
    phase:
      type: string
    endpoint:
      type: string
      description: External URL of the controller. A row of another cluster carries that cluster's own status.endpoint, or a URL from an explicit ingress host. It is empty when the host is not known or the controller is headless.
    headless:
      type: boolean
      description: >-
        Mirrors v1alpha1.IsHeadless. When true, endpoint is always the empty
        string, whatever the controller's Status.Endpoint carries.
    version:
      type: string
    powerState:
      type: string
      description: The controller's spec.powerState intent (Running or Stopped).
    hibernated:
      type: boolean
      description: Whether the controller is currently hibernated (status.hibernated).
    hibernatedAt:
      type: string
      description: When the controller was last hibernated (status.hibernatedAt, RFC 3339).
    miteConnected:
      type: boolean
    miteVersion:
      type: string
    jenkinsVersion:
      type: string
    jenkinsHealth:
      type: string
    lastSeen:
      type: string
    certExpiry:
      type: string
    desiredStateHash:
      type: string
    configHash:
      type: string
    rbacHash:
      type: string
    reconciliationPolicy:
      $ref: '#/ReconciliationPolicy'
    pendingRestart:
      $ref: '#/PendingRestart'
    pendingPluginRoll:
      $ref: '#/PendingPluginRoll'
    pendingItemDeletions:
      type: array
      items:
        $ref: '#/PendingDeletion'
    firstConnectedAt:
      type: string
    lastReconciledAt:
      type: string
    lastApplyResult:
      $ref: '#/ApplyResult'
    applyHistory:
      type: array
      items:
        $ref: '#/ApplyResult'
    composedBundleRef:
      $ref: '#/ComposedBundleRef'
    effectiveBundle:
      $ref: '#/EffectiveBundle'
    podOverrides:
      type: object
    resourceOverlay:
      type: object
    observability:
      $ref: '#/ControllerObservability'
    routingMode:
      type: string
    liveDrift:
      $ref: '#/LiveDrift'
    rollout:
      $ref: '#/Rollout'
    appliedBundleHash:
      type: string
    versionStatus:
      $ref: '#/VersionStatus'
    miteImageStatus:
      $ref: '#/MiteImageStatus'
    reconcileBlocked:
      $ref: '#/ReconcileBlocked'
    attention:
      $ref: '#/ControllerAttention'
    pluginConflict:
      $ref: '#/PluginConflict'
    pluginInventory:
      $ref: '#/PluginInventorySummary'
    unappliedRemovals:
      type: array
      description: >
        Requested spec removals (explicit JSON nulls) that did not take effect:
        another field manager also owns the field, so server-side apply retains
        it. Present only on the PATCH response, and only when at least one
        removal was blocked — an empty or absent array leaves the ordinary
        success path unchanged.
      items:
        $ref: '#/UnappliedRemoval'
  additionalProperties: false

UnappliedRemoval:
  type: object
  description: One requested spec removal that did not take effect.
  required: [field]
  properties:
    field:
      type: string
      description: Spec-relative path that could not be removed, e.g. spec.composedBundleRef.
  additionalProperties: false

CreateControllerRequest:
  type: object
  description: Request body for creating a controller. Wraps a Controller CR with optional inline bundle.
  properties:
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      $ref: '#/ControllerSpec'
    bundle:
      type: object
      description: Optional inline ComposedBundleSpec.
  additionalProperties: false

ControllerPatch:
  type: object
  description: >
    Patch body for PATCH /controllers/{ns}/{name}. Exactly one top-level key
    `spec` is allowed — any other key returns 400 (N5).
  properties:
    spec:
      $ref: '#/ControllerSpec'
  additionalProperties: false

Check:
  type: object
  description: Result of a single preflight validation check.
  required: [id, status, message]
  properties:
    id:
      type: string
    status:
      type: string
      enum: [pass, warn, fail]
    message:
      type: string
  additionalProperties: false

PreviewRequest:
  type: object
  description: Request body for POST /controllers/{ns}/{name}/preview.
  properties:
    podOverrides:
      type: object
    resourceOverlay:
      type: object
    baseline:
      type: string
      description: '"live" (default) or "base".'
  additionalProperties: false

WarningItem:
  type: object
  description: A single preview warning about a protected resource path.
  required: [resource, path, message]
  properties:
    resource:
      type: string
    path:
      type: string
    message:
      type: string
  additionalProperties: false

PreviewResponse:
  type: object
  description: Response from a controller preview operation.
  properties:
    merged:
      type: object
      description: Map of resource type to merged YAML.
      additionalProperties:
        type: string
    diff:
      type: object
      description: Map of resource type to diff output.
      additionalProperties:
        type: string
    warnings:
      type: array
      nullable: true
      items:
        $ref: '#/WarningItem'
    baselineUsed:
      type: string
  additionalProperties: false

LogEntry:
  type: object
  description: A single structured log line from a controller.
  required: [timestamp, level, source, message]
  properties:
    timestamp:
      type: string
      format: date-time
    level:
      type: string
      enum: [ERROR, WARN, DEBUG, INFO]
    source:
      type: string
    message:
      type: string
  additionalProperties: false

ControllerDiff:
  type: object
  description: >-
    Diff between incoming bundle content and last-applied content. The
    jcasc and items text of both sides is redacted: each secret value
    shows as the marker "<redacted>". A key that contains password,
    secret, passphrase, privatekey, or token, and does not end in id,
    marks every value below it as a secret. Inside a domainCredentials or folderCredentials
    store, every value is a secret except id, scope, description,
    username, name, includes, excludes, and schemes. A jcasc value that is one whole ${...} reference to a named
    entry, a file, or a system property stays visible. Text that does
    not parse shows as "<redacted: unparseable content>". Every YAML
    comment is removed. No caller
    gets an unredacted value, and a rotated secret shows no difference.
  properties:
    incoming:
      type: object
      properties:
        jcasc:
          type: string
        items:
          type: string
        plugins:
          type: string
    applied:
      type: object
      properties:
        jcasc:
          type: string
        items:
          type: string
        plugins:
          type: string
    appliedUnavailable:
      type: boolean
  additionalProperties: false

# --- 3.4 RBAC schemas ---

APIRule:
  type: object
  description: An API rule defining resource access.
  required: [resources, verbs]
  properties:
    resources:
      type: array
      items:
        type: string
    verbs:
      type: array
      items:
        type: string
  additionalProperties: false

VarroaRoleSpec:
  type: object
  description: Spec for a VarroaRole (API-level RBAC).
  properties:
    apiRules:
      type: array
      items:
        $ref: '#/APIRule'
    jenkinsPermissions:
      type: array
      items:
        type: string
      description: Jenkins plugin/controller-level permissions.
    jenkinsRoleRef:
      type: string
      description: Reference to a JenkinsRole.
  additionalProperties: false

VarroaRoleBindingScope:
  type: object
  description: Scope for a VarroaRoleBinding.
  properties:
    namespaces:
      type: array
      items:
        type: string
    controllerSelector:
      type: object
      description: Label selector (metav1.LabelSelector).
    tenants:
      type: array
      maxItems: 64
      items:
        $ref: '#/TenantScope'
      description: An allow-list of pipelines tenants. A scope names one dimension; tenants never combines with namespaces or controllerSelector.
  additionalProperties: false

VarroaRoleBindingSpec:
  type: object
  description: Spec for a VarroaRoleBinding.
  required: [subjects, roleRef]
  properties:
    subjects:
      type: array
      items:
        $ref: '#/SubjectRef'
    roleRef:
      type: string
    scope:
      $ref: '#/VarroaRoleBindingScope'
  additionalProperties: false

JenkinsRoleSpec:
  type: object
  description: Spec for a JenkinsRole (Jenkins-level RBAC).
  required: [permissions]
  properties:
    roleType:
      type: string
      enum: [Global, Item, Agent]
    permissions:
      type: array
      items:
        type: string
    description:
      type: string
  additionalProperties: false

JenkinsScope:
  type: object
  description: Jenkins-level scope for a binding.
  required: [type]
  properties:
    type:
      type: string
      enum: [Global, Folder, Pattern]
    folder:
      type: string
    propagate:
      type: string
      enum: [None, Children, Subtree]
    pattern:
      type: string
  additionalProperties: false

JenkinsRoleBindingSpec:
  type: object
  description: Spec for a JenkinsRoleBinding.
  required: [subjects, roleRef]
  properties:
    subjects:
      type: array
      items:
        $ref: '#/SubjectRef'
    roleRef:
      type: string
    controllerScope:
      $ref: '#/VarroaRoleBindingScope'
    jenkinsScope:
      $ref: '#/JenkinsScope'
  additionalProperties: false

APICapabilitySet:
  type: object
  description: Resource-to-verb-to-allowed capability map.
  additionalProperties:
    type: object
    additionalProperties:
      type: boolean

TenantScope:
  type: object
  description: One pipelines tenant name and the folder-relative job globs a binding covers. An absent jobs list covers every job.
  required: [name]
  properties:
    name:
      type: string
      maxLength: 253
      description: A tenant is a Team name.
    jobs:
      type: array
      maxItems: 64
      items:
        type: string
        maxLength: 512
      description: Jobs are folder-relative globs. An absent jobs list covers every job.
  additionalProperties: false

ScopedCapabilities:
  type: object
  description: The capability set granted by bindings that carry one scope, plus the scope descriptor. Scoped grants are never flattened into the global partition.
  required: [namespaces, hasControllerSelector, capabilities]
  properties:
    namespaces:
      type: array
      nullable: true
      items:
        type: string
      description: The scope's namespace allowlist. Null or empty means the scope is not namespace-bounded.
    hasControllerSelector:
      type: boolean
      description: True when the scope carries a controller label selector, which the client cannot evaluate.
    tenants:
      type: array
      nullable: true
      items:
        $ref: '#/TenantScope'
      description: The scope's canonicalized pipelines-tenant allowlist. Null or empty means the scope names no tenant.
    capabilities:
      $ref: '#/APICapabilitySet'
  additionalProperties: false

TenantCapabilities:
  type: object
  description: One grant the caller holds on one pipelines tenant. A tenant name may appear in more than one entry, because the caller can hold two grants on it with different job globs; they are never merged.
  required: [tenant, jobs, capabilities]
  properties:
    tenant:
      type: string
    jobs:
      type: array
      items:
        type: string
      description: Folder-relative job globs the grant covers. Always an array, never null; an empty array means every job.
    capabilities:
      $ref: '#/APICapabilitySet'
  additionalProperties: false

PermissionScopes:
  type: object
  description: Scope-aware introspection result for /me/permissions.
  required: [global, scopes, tenants]
  properties:
    global:
      allOf:
        - $ref: '#/APICapabilitySet'
      description: Capabilities from cluster-wide (nil-scope) bindings only.
    scopes:
      type: array
      nullable: true
      items:
        $ref: '#/ScopedCapabilities'
      description: One entry per distinct scoped binding scope.
    tenants:
      type: array
      items:
        $ref: '#/TenantCapabilities'
      description: One entry per pipelines-tenant grant the caller holds. Always an array, never null.
  additionalProperties: false

# --- 3.4 Catalog schemas ---

CatalogSourceSpec:
  type: object
  description: Spec for a CatalogSource (bundle catalog repository).
  properties:
    repoURL:
      type: string
    ociRef:
      type: string
      description: OCI artifact reference; mutually exclusive with repoURL.
    revision:
      type: string
    path:
      type: string
    syncIntervalSeconds:
      type: integer
      description: Catalog poll cadence in seconds. 0 or an omitted field means the default (300); any other value must be between 30 and 31536000.
      oneOf:
        - enum: [0]
        - minimum: 30
          maximum: 31536000
    secretRef:
      type: string
    trusted:
      type: boolean
  additionalProperties: false

CatalogVariable:
  type: object
  description: A variable definition for a catalog item.
  required: [name]
  properties:
    name:
      type: string
    default:
      type: string
    description:
      type: string
    required:
      type: boolean
    type:
      type: string
      description: Parameter type. Omitting the field means "string".
      enum: [string, number, boolean, credentials]
    allowedValues:
      type: array
      description: Populates a choice/dropdown widget. Only valid when type is "string" or "number".
      items:
        type: string
  additionalProperties: false

CatalogItemSpec:
  type: object
  description: Spec for a CatalogItem.
  required: [sourceRef, type, path]
  properties:
    sourceRef:
      type: string
    type:
      type: string
      enum: [podtemplate, plugin, item, jcasc, rbac, pipeline-template, groovy]
    displayName:
      type: string
    description:
      type: string
    path:
      type: string
    version:
      type: string
    tags:
      type: array
      items:
        type: string
    variables:
      type: array
      items:
        $ref: '#/CatalogVariable'
    requires:
      type: array
      items:
        type: string
  additionalProperties: false

# --- 3.4 ComposedBundle schemas ---

ComposedItemRef:
  type: object
  description: Reference to a catalog item composing a bundle.
  required: [name]
  properties:
    name:
      type: string
    namespace:
      type: string
    pinnedContentHash:
      type: string
    variables:
      type: object
      additionalProperties:
        type: string
  additionalProperties: false

GitBundleSource:
  type: object
  description: Git source for a composed bundle input.
  required: [repoURL, path]
  properties:
    repoURL:
      type: string
    path:
      type: string
    revision:
      type: string
    secretRef:
      type: string
  additionalProperties: false

OCIBundleSource:
  type: object
  description: OCI artifact source for a composed bundle input.
  required: [ref]
  properties:
    ref:
      type: string
      description: OCI artifact reference.
    secretRef:
      type: string
      description: Optional pull-credential Secret name.
    path:
      type: string
      description: Optional sub-path within the artifact.
  additionalProperties: false

ComposedInput:
  type: object
  description: A single input to a composed bundle.
  properties:
    itemRef:
      $ref: '#/ComposedItemRef'
    gitSource:
      $ref: '#/GitBundleSource'
    ociSource:
      $ref: '#/OCIBundleSource'
  additionalProperties: false

ComposedBundleSpec:
  type: object
  description: Spec for a ComposedBundle.
  required: [inputs]
  properties:
    displayName:
      type: string
    description:
      type: string
    inputs:
      type: array
      items:
        $ref: '#/ComposedInput'
    variables:
      type: object
      additionalProperties:
        type: string
    jcascMergeStrategy:
      type: string
      enum: [errorOnConflict, override]
  additionalProperties: false

ComposedBundlePreview:
  type: object
  description: Response from a composed bundle preview.
  required: [bundleYaml, jenkinsYaml, pluginsYaml, itemsYaml, rbacYaml, pipelineTemplatesYaml, missing, drifted, warnings, unresolvedVariables, pinPreflight, pipelineTemplates]
  properties:
    bundleYaml:
      type: string
    jenkinsYaml:
      type: string
    pluginsYaml:
      type: string
    itemsYaml:
      type: string
    rbacYaml:
      type: string
    pipelineTemplatesYaml:
      type: string
      description: >
        The composed pipeline-template content, never resolved by ${var}
        substitution. Empty for a bundle with no pipeline-template input.
    missing:
      type: array
      items:
        type: string
    drifted:
      type: array
      items:
        type: string
    warnings:
      type: array
      items:
        type: string
    unresolvedVariables:
      type: array
      items:
        type: string
    pinPreflight:
      $ref: '#/PinPreflightReport'
    pipelineTemplates:
      type: array
      description: One entry per template the composition delivered, in input order.
      items:
        $ref: '#/PipelineTemplateSummary'
  additionalProperties: false

PipelineTemplateSummary:
  type: object
  description: One pipeline-template a composition delivered.
  required: [name, version]
  properties:
    name:
      type: string
    version:
      type: string
    displayName:
      type: string
    description:
      type: string
  additionalProperties: false

ComposedBundleValidateResponse:
  type: object
  description: Response from a composed bundle validation.
  required: [valid, unresolvedVariables, pinPreflight, pipelineTemplates]
  properties:
    valid:
      type: boolean
    pipelineTemplates:
      type: array
      description: One entry per template the composition delivered, in input order.
      items:
        $ref: '#/PipelineTemplateSummary'
    errors:
      type: array
      items:
        type: string
    warnings:
      type: array
      items:
        type: string
    unresolvedVariables:
      type: array
      items:
        type: string
    pinPreflight:
      $ref: '#/PinPreflightReport'
  additionalProperties: false

PinConflict:
  type: object
  description: A composed bundle's plugin pin whose version conflicts with the resolved plugin set.
  required: [artifactId, bundleVersion, setVersion]
  properties:
    artifactId:
      type: string
    bundleVersion:
      type: string
    setVersion:
      type: string
  additionalProperties: false

MissingPlugin:
  type: object
  description: A composed bundle's plugin pin absent from the resolved plugin set.
  required: [artifactId, bundleVersion]
  properties:
    artifactId:
      type: string
    bundleVersion:
      type: string
  additionalProperties: false

PinPreflightReport:
  type: object
  description: Plugin-pin preflight result comparing a composed bundle's pins against the resolved plugin set.
  required: [conflicts, missing]
  properties:
    conflicts:
      type: array
      items:
        $ref: '#/PinConflict'
    missing:
      type: array
      items:
        $ref: '#/MissingPlugin'
  additionalProperties: false

# --- 3.5 Provisioning schemas ---

SizePreset:
  type: object
  description: A size preset for provisioning defaults.
  required: [name, cpu, memory, storage]
  properties:
    name:
      type: string
    cpu:
      type: string
    memory:
      type: string
    storage:
      type: string
  additionalProperties: false

ProvisioningDefaultsSpec:
  type: object
  description: Spec for ProvisioningDefaults CRD.
  properties:
    rootDomain:
      type: string
    ingressAnnotations:
      type: object
      additionalProperties:
        type: string
    defaultCPU:
      type: string
    defaultMemory:
      type: string
    defaultStorage:
      type: string
    defaultVersion:
      type: string
    storageClass:
      type: string
    storageSizeGB:
      type: integer
    ingressClassName:
      type: string
    imagePullSecrets:
      type: array
      items:
        type: string
    provisioningTimeoutSec:
      type: integer
    commandDeadlineSec:
      type: integer
    liveFingerprintIntervalSec:
      type: integer
    defaultReconciliationPolicy:
      $ref: '#/ReconciliationPolicy'
    defaultNamespace:
      type: string
    namespaces:
      type: array
      items:
        type: string
    sizePresets:
      type: array
      items:
        $ref: '#/SizePreset'
    pluginUpdateCenterURL:
      type: string
    pluginUpdateCenterDownloadURL:
      type: string
    pluginInfoURL:
      type: string
    broodPolicy:
      $ref: '#/BroodPolicy'
  additionalProperties: false

BroodPolicy:
  type: object
  description: >-
    Cluster-wide constraints on brood operation verbs. Enforced by the operator,
    not the API: kubectl and GitOps create BroodOperation objects directly.
  properties:
    executeGroovy:
      $ref: '#/ExecuteGroovyPolicy'
  additionalProperties: false

ExecuteGroovyPolicy:
  type: object
  description: >-
    Governs the executeGroovy verb. Every field absent means enabled — a policy
    object that only some clusters carry must not change behaviour by its absence.
  properties:
    enabled:
      type: boolean
      description: Absent means enabled.
    allowedNamespaces:
      type: array
      description: >-
        Namespaces that may host an executeGroovy BroodOperation, matched against
        the operation's own namespace rather than its targets'. Empty means all,
        when enabled is not false.
      items:
        type: string
  additionalProperties: false

EffectiveBundle:
  type: object
  description: >-
    The ComposedBundle a controller is actually using, resolved. Read-only, and
    deliberately separate from composedBundleRef: that field is the raw spec
    value the dashboard writes back, so resolving into it would materialize an
    explicit reference to the starter bundle on the next save.
  required: [name, namespace, builtIn]
  properties:
    name:
      type: string
    namespace:
      type: string
    builtIn:
      type: boolean
      description: >-
        True when the controller names no bundle and resolved to the built-in
        starter bundle.
  additionalProperties: false

VersionCatalogEntry:
  type: object
  description: Entry in the version catalog.
  required: [version, channel, name]
  properties:
    version:
      type: string
    channel:
      type: string
    recommended:
      type: boolean
    eol:
      type: string
    name:
      type: string
    pluginSetReady:
      type: boolean
    pluginCount:
      type: integer
  additionalProperties: false

VersionProfileCondition:
  type: object
  description: Status condition for a version profile.
  required: [type, status]
  properties:
    type:
      type: string
    status:
      type: string
    reason:
      type: string
    message:
      type: string
    lastTransitionTime:
      type: string
  additionalProperties: false

VersionProfileDetail:
  type: object
  description: Full per-profile detail for version profiles.
  required: [name, version, channel, hasJcasc, conditions]
  properties:
    name:
      type: string
    version:
      type: string
    channel:
      type: string
    recommended:
      type: boolean
    eol:
      type: string
    pluginSetRef:
      type: string
    contentRef:
      type: string
    pluginCount:
      type: integer
    resolveVersion:
      type: string
    plugins:
      type: array
      items:
        type: string
    hasJcasc:
      type: boolean
    requiredPlugins:
      type: array
      items:
        type: string
    conditions:
      type: array
      items:
        $ref: '#/VersionProfileCondition'
  additionalProperties: false

ControllerClass:
  type: object
  description: A ControllerClass CRD (cluster-scoped). Layers cluster-level defaults between ProvisioningDefaults and each Controller via spec.className.
  required: [apiVersion, kind, metadata]
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      type: object
      additionalProperties: true
    spec:
      $ref: '#/ControllerClassSpec'
    status:
      type: object
      description: ControllerClassStatus with conditions.
      properties:
        conditions:
          type: array
          items:
            $ref: '#/ObjectMeta'
      additionalProperties: true
  additionalProperties: true

ControllerClassSpec:
  type: object
  description: Desired state of a ControllerClass. Fields that map to a corev1 concept use the literal Kubernetes types.
  properties:
    nodeSelector:
      type: object
      description: Node selector constraints.
      additionalProperties:
        type: string
    tolerations:
      type: array
      description: Pod tolerations.
      items:
        type: object
    affinity:
      type: object
      description: Pod scheduling affinity.
    securityContext:
      type: object
      description: Pod-level security context.
    podLabels:
      type: object
      description: Pod labels merged onto the controller pod template.
      additionalProperties:
        type: string
    podAnnotations:
      type: object
      description: Pod annotations merged onto the controller pod template.
      additionalProperties:
        type: string
    ingressClassName:
      type: string
      description: Default ingress class name for controllers in this class.
    ingressAnnotations:
      type: object
      description: Ingress annotations merged onto the controller ingress.
      additionalProperties:
        type: string
    resources:
      type: object
      description: CPU/memory resource requests and limits for the Jenkins container.
    persistence:
      type: object
      description: Persistent volume claim defaults (transcribed from v1alpha1.PersistenceSpec).
    probes:
      type: object
      description: Health probe tuning (transcribed from v1alpha1.ProbesSpec).
    mite:
      $ref: '#/ClassMiteSpec'
    imagePullSecrets:
      type: array
      description: Image-pull secret names.
      items:
        type: string
    jvmOpts:
      type: string
      description: JVM options prepended to JAVA_OPTS.
  additionalProperties: false

ClassMiteSpec:
  type: object
  description: Mite sidecar configuration for a ControllerClass.
  properties:
    image:
      type: string
      description: Mite sidecar container image.
    imagePullPolicy:
      type: string
      description: Mite sidecar image pull policy.
  additionalProperties: false

JenkinsVersionProfile:
  type: object
  description: A JenkinsVersionProfile CRD (cluster-scoped).
  required: [apiVersion, kind, metadata, spec]
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      type: object
      additionalProperties: true
    spec:
      type: object
      additionalProperties: true
    status:
      type: object
      additionalProperties: true
  additionalProperties: true

ProfileCandidate:
  type: object
  description: A ProfileCandidate CRD (cluster-scoped) — a discovered upstream patch/LTS-line candidate for a JenkinsVersionProfile, pending validation and promotion.
  required: [apiVersion, kind, metadata, spec]
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      type: object
      additionalProperties: true
    spec:
      type: object
      additionalProperties: true
    status:
      type: object
      additionalProperties: true
  additionalProperties: true

ProvisioningConfig:
  type: object
  description: Aggregate provisioning read surface.
  required: [rootDomain, dashboardHost, defaultNamespace, namespaces, defaultVersion, versions, sizePresets, injectedVariables]
  properties:
    rootDomain:
      type: string
    dashboardHost:
      type: string
      description: >-
        Hostname of the Varroa dashboard. Path-mode ingress requires the
        controller's ingress host to equal this value; empty when the BFF
        cannot derive it from its auth configuration.
    defaultNamespace:
      type: string
    namespaces:
      type: array
      items:
        type: string
    defaultVersion:
      type: string
    versions:
      type: array
      items:
        $ref: '#/VersionCatalogEntry'
    sizePresets:
      type: array
      items:
        $ref: '#/SizePreset'
    injectedVariables:
      type: array
      items:
        type: string
  additionalProperties: false

DeployableNamespaces:
  type: object
  description: The caller's create-authorized namespaces.
  required: [namespaces, defaultNamespace, allowFreeform, degraded]
  properties:
    namespaces:
      type: array
      items:
        type: string
    defaultNamespace:
      type: string
    allowFreeform:
      type: boolean
    degraded:
      type: boolean
      description: True only when a remote target's inputs were unavailable.
  additionalProperties: false

# --- 3.5 Activity schemas ---

ActivityEvent:
  type: object
  description: A single activity feed event.
  required: [timestamp, type, source, severity, message]
  properties:
    timestamp:
      type: string
      format: date-time
    type:
      type: string
    source:
      type: string
      enum: [mite, operator, user, api, jenkins, mcp, assistant, team_agent]
    severity:
      type: string
      enum: [info, warning, error]
    actor:
      type: string
    controller:
      type: string
    namespace:
      type: string
    cluster:
      type: string
    message:
      type: string
    phase:
      type: string
    reason:
      type: string
    itemPath:
      type: string
    buildNumber:
      type: integer
      format: int64
    result:
      type: string
    url:
      type: string
  additionalProperties: false

# --- 3.5 Streams schemas ---

SearchResult:
  type: object
  description: A single search result entry.
  required: [type, name, link]
  properties:
    type:
      type: string
      enum: [controller, namespace, group, catalogitem, job, run, activity]
      x-enum-varnames: [ComponentsSchemasSearchResultTypeController, ComponentsSchemasSearchResultTypeNamespace, ComponentsSchemasSearchResultTypeGroup, ComponentsSchemasSearchResultTypeCatalogitem, ComponentsSchemasSearchResultTypeJob, ComponentsSchemasSearchResultTypeRun, ComponentsSchemasSearchResultTypeActivity]
      description: >-
        controller, namespace, group, and catalogitem come from a live
        Kubernetes read; job, run, and activity come from the record store
        and are absent when it is not wired.
    name:
      type: string
    cluster:
      type: string
    namespace:
      type: string
    description:
      type: string
    link:
      type: string
  additionalProperties: false

StreamTicketResponse:
  type: object
  description: Response from POST /stream/ticket.
  required: [ticket, expiresInSeconds]
  properties:
    ticket:
      type: string
    expiresInSeconds:
      type: integer
  additionalProperties: false

# --- 3.4/3.5 CRD wrapper schemas (restored from typed transcription) ---

TemplateCatalogCondition:
  type: object
  description: Status condition for catalog/composedbundle resources.
  required: [type, status]
  properties:
    type:
      type: string
    status:
      type: string
    lastTransitionTime:
      type: string
    reason:
      type: string
    message:
      type: string

VarroaRole:
  type: object
  description: A VarroaRole CRD (cluster-scoped, API-level RBAC).
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      $ref: '#/VarroaRoleSpec'
    status:
      $ref: '#/VarroaRoleStatus'

VarroaRoleStatus:
  type: object
  readOnly: true
  description: >-
    Federation faults of the role on each hive. The core BFF federation pass
    writes it. A create or update request cannot set it.
  properties:
    observedGeneration:
      type: integer
      format: int64
      description: Spec generation the federation entries describe.
    federation:
      type: array
      description: >-
        One entry for each hive where the delete of a stale federated
        JenkinsRole failed. A hive with no fault has no entry.
      items:
        $ref: '#/BindingFederationStatus'

VarroaRoleBinding:
  type: object
  description: A VarroaRoleBinding CRD (cluster-scoped).
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      $ref: '#/VarroaRoleBindingSpec'
    status:
      $ref: '#/VarroaRoleBindingStatus'

VarroaRoleBindingStatus:
  type: object
  readOnly: true
  description: >-
    Federation outcome of the binding on each hive. The core BFF federation
    pass writes it. A create or update request cannot set it.
  properties:
    observedGeneration:
      type: integer
      format: int64
      description: Spec generation the federation entries describe.
    federation:
      type: array
      description: One entry for each hive cluster. The core cluster has no entry.
      items:
        $ref: '#/BindingFederationStatus'

BindingFederationStatus:
  type: object
  description: >-
    Federation outcome of a binding on one hive, or a federation fault of a
    role on one hive.
  required: [cluster, state, lastTransitionTime]
  properties:
    cluster:
      type: string
      description: Hive cluster name.
    state:
      type: string
      enum: [federated, skipped, failed]
    reason:
      type: string
      description: >-
        CamelCase code for the state. Skipped codes are NoSubjects, TenantScope,
        RoleNotFound, NoJenkinsProjection, JenkinsRoleNotFound,
        NonGlobalJenkinsRole, and ReservedRole. Failed codes are
        HiveUnavailable, JenkinsRoleCollision, JenkinsRoleWriteFailed,
        JenkinsRoleBindingCollision, JenkinsRoleBindingWriteFailed,
        StaleJenkinsRoleBindingDeleteFailed, and StaleJenkinsRoleDeleteFailed.
        StaleJenkinsRoleDeleteFailed occurs only on a VarroaRole. The
        federated code is Federated.
    message:
      type: string
      description: Human-readable detail for the state.
    lastTransitionTime:
      type: string
      format: date-time
      description: Time the state, reason, or message last changed.

JenkinsRole:
  type: object
  description: A JenkinsRole CRD (cluster-scoped, data-plane permissions).
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      $ref: '#/JenkinsRoleSpec'

JenkinsRoleBinding:
  type: object
  description: A JenkinsRoleBinding CRD (cluster-scoped).
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      $ref: '#/JenkinsRoleBindingSpec'

CatalogSourceStatus:
  type: object
  description: Observed state of a CatalogSource.
  properties:
    phase:
      type: string
      enum: [Pending, Syncing, Ready, Error]
    observedRevision:
      type: string
    lastSyncTime:
      type: string
    itemCount:
      type: integer
    message:
      type: string
    conditions:
      type: array
      items:
        $ref: '#/TemplateCatalogCondition'

CatalogSource:
  type: object
  description: A CatalogSource CRD.
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      $ref: '#/CatalogSourceSpec'
    status:
      $ref: '#/CatalogSourceStatus'

CatalogItemStatus:
  type: object
  description: Observed state of a CatalogItem.
  properties:
    content:
      type: string
    contentHash:
      type: string
    observedRevision:
      type: string
    valid:
      type: boolean
    message:
      type: string
    closure:
      type: array
      description: >-
        The resolver's own record of what it pinned, for items derived from the
        update-center store. status.content is a flat plugins.yaml fragment and
        can express none of these facts.
      items:
        $ref: '#/CatalogItemClosureEntry'
    compat:
      type: array
      description: One advisory verdict per JenkinsVersionProfile. Never blocks anything.
      items:
        $ref: '#/CatalogItemCompat'
    conditions:
      type: array
      items:
        $ref: '#/TemplateCatalogCondition'

CatalogItemClosureEntry:
  type: object
  description: One pinned member of a derived item's dependency closure.
  required: [artifactId, version]
  properties:
    artifactId:
      type: string
    version:
      type: string
    direct:
      type: boolean
      description: Declared by the root, as opposed to pulled in transitively.
    provenance:
      type: string
      description: Where the selected version came from.
      enum: [store, lock]
    minimum:
      type: string
      description: The effective minimum in force, when one was declared.
  additionalProperties: false

CatalogItemCompat:
  type: object
  description: One profile's advisory compatibility verdict for a catalog item.
  required: [profile, verdict]
  properties:
    profile:
      type: string
    jenkinsVersion:
      type: string
      description: The profile's effective deployed core — resolveVersion when set, else version.
    verdict:
      type: string
      enum: [compatible, core-too-old, dep-below-minimum, lock-too-old, unknown]
    message:
      type: string
  additionalProperties: false

CatalogItemLockPins:
  type: object
  description: >-
    One profile's lock pins for a derived item's closure entries. A closure
    entry the lock does not mention has no key in pins, which is distinct from
    the lock pinning it at the same version.
  required: [profile, pins]
  properties:
    profile:
      type: string
    pins:
      type: object
      additionalProperties:
        type: string
  additionalProperties: false

CatalogItemDetailResponse:
  type: object
  description: >-
    A CatalogItem plus the per-profile lock-pin projection joined from the
    JenkinsVersionProfile locks at read time. The pins are cluster state and are
    deliberately not stored on the item, where they would go stale.
  required: [item]
  properties:
    item:
      $ref: '#/CatalogItem'
    lockPins:
      type: array
      items:
        $ref: '#/CatalogItemLockPins'
  additionalProperties: false

CatalogItem:
  type: object
  description: A CatalogItem CRD.
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      $ref: '#/CatalogItemSpec'
    status:
      $ref: '#/CatalogItemStatus'

CatalogItemSummary:
  type: object
  description: Summary projection returned by catalog item list responses.
  required: [name, namespace, type, sourceRef, valid]
  properties:
    name:
      type: string
    namespace:
      type: string
    displayName:
      type: string
    type:
      type: string
    sourceRef:
      type: string
    version:
      type: string
    description:
      type: string
    tags:
      type: array
      items:
        type: string
    valid:
      type: boolean
    message:
      type: string
    contentHash:
      type: string
    variables:
      type: array
      description: The item's declared variables, so list consumers can render typed inputs without a per-item detail fetch.
      items:
        $ref: '#/CatalogVariable'
    pluginName:
      type: string
      description: >-
        The update-center plugin this item was derived for. The browser collapses
        rows by it, so a plugin stored at three versions is one row with a version
        selector. Absent for items that are not update-center-derived.
    compat:
      type: array
      description: >-
        The item's advisory per-profile verdicts, so a row can be badged without a
        per-item detail fetch. A badge never disables selection.
      items:
        $ref: '#/CatalogItemCompat'
  additionalProperties: false

InputSummaryEntry:
  type: object
  description: Mirror of a single ComposedBundle input for list rendering.
  required: [kind, type]
  properties:
    kind:
      type: string
    type:
      type: string
    namespace:
      type: string

ComposedBundleStatus:
  type: object
  description: Observed state of a ComposedBundle.
  properties:
    phase:
      type: string
      enum: [Pending, Ready, Drifted, Invalid]
    itemCount:
      type: integer
    resolvedHash:
      type: string
    missingItems:
      type: array
      items:
        type: string
    driftedItems:
      type: array
      items:
        type: string
    message:
      type: string
    conditions:
      type: array
      items:
        $ref: '#/TemplateCatalogCondition'
    contentRef:
      type: string
    observedRevisions:
      type: object
      additionalProperties:
        type: string
    observedGeneration:
      type: integer
      format: int64
    errors:
      type: array
      items:
        type: string
    warnings:
      type: array
      items:
        type: string
    inputSummary:
      type: array
      items:
        $ref: '#/InputSummaryEntry'

ComposedBundle:
  type: object
  description: A ComposedBundle CRD.
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      $ref: '#/ComposedBundleSpec'
    status:
      $ref: '#/ComposedBundleStatus'

ProvisioningDefaultsCondition:
  type: object
  description: Status condition for ProvisioningDefaults.
  required: [type, status]
  properties:
    type:
      type: string
    status:
      type: string
    lastTransitionTime:
      type: string
    reason:
      type: string
    message:
      type: string

ProvisioningDefaultsStatus:
  type: object
  description: Observed state of ProvisioningDefaults.
  properties:
    conditions:
      type: array
      items:
        $ref: '#/ProvisioningDefaultsCondition'

ProvisioningDefaults:
  type: object
  description: A ProvisioningDefaults CRD (cluster-scoped).
  properties:
    apiVersion:
      type: string
    kind:
      type: string
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      $ref: '#/ProvisioningDefaultsSpec'
    status:
      $ref: '#/ProvisioningDefaultsStatus'

# --- Brood operations ---

BroodOperationDetail:
  type: object
  description: Full brood operation resource with spec and status.
  properties:
    metadata:
      $ref: '#/ObjectMeta'
    spec:
      type: object
      properties:
        action:
          type: object
          properties:
            verb:
              type: string
              enum: [restart, reprovision, reconcile, stop, start, executeGroovy, upgrade]
            groovy:
              type: object
              description: Script selection for verb=executeGroovy. Exactly one of script or itemRef.
              properties:
                script:
                  type: string
                itemRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                    pinnedContentHash:
                      type: string
                    variables:
                      type: object
                      additionalProperties:
                        type: string
            upgrade:
              type: object
              description: Granularity selection for verb=upgrade. An absent targetVersion releases each target's own held promoted revision; a set targetVersion bulk-writes that version to every target.
              properties:
                targetVersion:
                  type: string
        targets:
          type: object
          properties:
            names:
              type: array
              items:
                type: string
            selector:
              type: object
            namespaces:
              type: array
              items:
                type: string
            filters:
              type: object
              properties:
                phase:
                  type: string
                version:
                  type: string
                bundle:
                  type: string
        execution:
          type: object
          properties:
            maxParallel:
              type: integer
              format: int32
            order:
              type: string
              enum: [rolloutWave, name]
            failurePolicy:
              type: string
              enum: [FailFast, FailTidy, FailAtEnd]
        suspend:
          type: boolean
        ttlSecondsAfterFinished:
          type: integer
          format: int32
    status:
      type: object
      properties:
        phase:
          type: string
          enum: [Pending, Running, Suspended, Succeeded, Failed, Canceled]
        startedBy:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        reason:
          type: string
        scriptSnapshotRef:
          type: string
          description: Name of the owner-referenced ConfigMap holding the once-resolved script content for a catalog-sourced executeGroovy operation. Empty for inline scripts and every other verb.
        targets:
          type: array
          items:
            type: object
            properties:
              namespace:
                type: string
              name:
                type: string
              wave:
                type: integer
                format: int32
              state:
                type: string
                enum: [Pending, Dispatched, Succeeded, Failed, Skipped]
              reason:
                type: string
              dispatchedAt:
                type: string
                format: date-time
              finishedAt:
                type: string
                format: date-time
              output:
                type: string
                description: Verb-specific dispatch output (currently executeGroovy only), truncated to 4096 bytes on a UTF-8-safe boundary.
        summary:
          type: object
          properties:
            total:
              type: integer
              format: int32
            succeeded:
              type: integer
              format: int32
            failed:
              type: integer
              format: int32
            skipped:
              type: integer
              format: int32
        observedGeneration:
          type: integer
          format: int64
  additionalProperties: false

CreateBroodRequest:
  type: object
  description: Request body to create or preview a brood operation.
  properties:
    namespace:
      type: string
      description: Target namespace. Defaults to operator namespace.
    spec:
      type: object
      description: BroodOperationSpec (action, targets, execution).
    clusters:
      type: array
      items:
        type: string
      description: Target clusters, or ["all"] for all known clusters. Defaults to the local cluster.
  additionalProperties: false

BroodRunClusterStatus:
  type: object
  description: Per-cluster fan-out outcome row.
  required: [cluster, ok]
  properties:
    cluster:
      type: string
    ok:
      type: boolean
    error:
      type: string

BroodRunCluster:
  type: object
  description: Per-cluster detail section within a BroodRun.
  required: [cluster, ok]
  properties:
    cluster:
      type: string
    ok:
      type: boolean
    error:
      type: string
    op:
      $ref: '#/BroodOperationDetail'

BroodRun:
  type: object
  description: Aggregated logical run view across clusters.
  required: [namespace, name, verb, phase, summary, clusters]
  properties:
    namespace:
      type: string
    name:
      type: string
    verb:
      type: string
      enum: [restart, reprovision, reconcile, stop, start, executeGroovy, upgrade]
    phase:
      type: string
      enum: [Pending, Running, Suspended, Succeeded, Failed, Canceled]
    summary:
      type: object
      properties:
        total:
          type: integer
          format: int32
        succeeded:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
    startedBy:
      type: string
    createdAt:
      type: string
      format: date-time
    clusters:
      type: array
      items:
        $ref: '#/BroodRunCluster'

BroodRunSummaryRow:
  type: object
  description: Summary row for a logical run in list responses.
  required: [namespace, name, verb, phase, summary, clusters]
  properties:
    namespace:
      type: string
    name:
      type: string
    verb:
      type: string
      enum: [restart, reprovision, reconcile, stop, start, executeGroovy, upgrade]
    phase:
      type: string
      enum: [Pending, Running, Suspended, Succeeded, Failed, Canceled]
    summary:
      type: object
      properties:
        total:
          type: integer
          format: int32
        succeeded:
          type: integer
          format: int32
        failed:
          type: integer
          format: int32
        skipped:
          type: integer
          format: int32
    startedBy:
      type: string
    createdAt:
      type: string
      format: date-time
    clusters:
      type: array
      items:
        type: string

BroodCreateFailure:
  type: object
  description: Error body when zero clusters succeed on create.
  required: [error, clusters]
  properties:
    error:
      type: string
    clusters:
      type: array
      items:
        $ref: '#/BroodRunClusterStatus'

BroodPreviewResponse:
  type: object
  description: Per-cluster preview result with targets.
  required: [clusters]
  properties:
    clusters:
      type: array
      items:
        type: object
        required: [cluster, ok]
        properties:
          cluster:
            type: string
          ok:
            type: boolean
          error:
            type: string
          targets:
            type: array
            items:
              type: object
              required: [namespace, name, wave, applicable]
              properties:
                namespace:
                  type: string
                name:
                  type: string
                wave:
                  type: integer
                  format: int32
                applicable:
                  type: boolean
                reason:
                  type: string

SuspendBroodRequest:
  type: object
  description: Request body to toggle suspend on a brood operation.
  required: [suspend]
  properties:
    suspend:
      type: boolean
  additionalProperties: false

ClusterInfo:
  type: object
  description: Status information for a known cluster.
  required: [name, core, healthy, lastHeartbeat, operatorVersion, k8sVersion, controllerCount, connectedCount, state]
  properties:
    name:
      type: string
    core:
      type: boolean
      description: "true on exactly one row: the BFF's own cluster"
    healthy:
      type: boolean
    lastHeartbeat:
      type: string
      format: date-time
    operatorVersion:
      type: string
    k8sVersion:
      type: string
    operatorNamespace:
      type: string
      description: Namespace of the cluster's operator.
    controllerCount:
      type: integer
      format: int32
    connectedCount:
      type: integer
      format: int32
    state:
      type: string
      enum: [active, draining, drained]
    drainStartedAt:
      type: string
      format: date-time
  additionalProperties: false

ClusterFanoutStatus:
  type: object
  description: Per-cluster result of a fan-out list operation.
  required: [name, ok]
  properties:
    name:
      type: string
    ok:
      type: boolean
    error:
      type: string
  additionalProperties: false

# --- Brood schedules ---

BroodScheduleSpec:
  type: object
  description: Desired state of a BroodSchedule.
  required: [schedule, template]
  properties:
    schedule:
      type: string
      description: Cron expression for when to trigger the operation.
    suspend:
      type: boolean
      description: Suspends the schedule.
    concurrencyPolicy:
      type: string
      enum: [Allow, Forbid, Replace]
      description: How to handle overlapping executions.
    startingDeadlineSeconds:
      type: integer
      format: int64
      description: Deadline in seconds for starting the job if it misses its scheduled time.
    successfulJobsHistoryLimit:
      type: integer
      format: int32
      description: Number of successful finished jobs to retain.
    failedJobsHistoryLimit:
      type: integer
      format: int32
      description: Number of failed finished jobs to retain.
    waitForCompletion:
      type: boolean
      description: Whether the CronJob should wait for the brood operation to complete.
    template:
      type: object
      description: Template for the brood operation.
      properties:
        targets:
          type: object
          additionalProperties: true
          description: Target selection (names or selector).
        action:
          type: object
          properties:
            verb:
              type: string
              description: Brood operation verb.
        clusters:
          type: array
          items:
            type: string
          description: Target clusters.
        execution:
          type: object
          additionalProperties: true
          description: Execution parameters (order, maxParallel, failurePolicy).
        ttlSecondsAfterFinished:
          type: integer
          format: int32
          description: TTL after the operation finishes.

BroodScheduleResponse:
  type: object
  description: Response envelope for a brood schedule create, get, or list.
  properties:
    namespace:
      type: string
    name:
      type: string
    cluster:
      type: string
    spec:
      $ref: '#/BroodScheduleSpec'
    status:
      type: object
      additionalProperties: true
      description: Observed schedule status (lastScheduleTime, lastSuccessfulTime, active, reason).
    error:
      type: string
      description: Error message if the operation failed.

UpdateCenterStatus:
  type: object
  description: Update center status response.
  properties:
    enabled:
      type: boolean
    phase:
      type: string
    conditions:
      type: array
      items:
        $ref: '#/UpdateCenterCondition'
    pluginCount:
      type: integer
    storeBytes:
      type: integer
      format: int64
    gapCount:
      type: integer
    gaps:
      type: array
      items:
        $ref: '#/UpdateCenterGap'
    unservable:
      type: array
      items:
        $ref: '#/UpdateCenterGap'
    unservableCount:
      type: integer
    unknownDependencyCount:
      type: integer
    unknownDependencies:
      type: array
      description: The first 50 stored plugin versions whose dependency list is unknown.
      items:
        $ref: '#/UpdateCenterPluginRef'
    lastSyncTime:
      type: string
      format: date-time
      nullable: true
    storageType:
      type: string
    pullThroughEnabled:
      type: boolean

UpdateCenterPluginRef:
  type: object
  properties:
    plugin:
      type: string
    version:
      type: string

UpdateCenterCondition:
  type: object
  properties:
    type:
      type: string
    status:
      type: string
    lastTransitionTime:
      type: string
      format: date-time
      nullable: true
    reason:
      type: string
    message:
      type: string

UpdateCenterGap:
  type: object
  properties:
    plugin:
      type: string
    version:
      type: string
    requiredBy:
      type: string
    core:
      type: string
      description: Lowest Jenkins core that requests a latest entry. Empty for a pinned version.
    reason:
      type: string

UpdateCenterPlugins:
  type: object
  description: Update center plugin inventory response.
  properties:
    enabled:
      type: boolean
    plugins:
      type: array
      items:
        $ref: '#/UpdateCenterPlugin'

UpdateCenterPlugin:
  type: object
  properties:
    name:
      type: string
    version:
      type: string
    sha256:
      type: string
    sizeBytes:
      type: integer
      format: int64

UpdateCenterUploadResult:
  type: object
  description: >
    A successful plugin upload, or the plan a dry run produced. Every mandatory
    dependency in the transitive closure is listed with how it resolved.
  required: [plugin, dryRun, closure, optionalDependencies, warnings]
  properties:
    plugin:
      $ref: '#/UpdateCenterUploadedPlugin'
    dryRun:
      type: boolean
      description: True when nothing was written.
    packRef:
      type: string
      description: The store ref of the pack holding the uploaded plugin. Empty on a dry run.
    closure:
      type: array
      items:
        $ref: '#/UpdateCenterClosureEntry'
    optionalDependencies:
      type: array
      description: Recorded but never resolved.
      items:
        $ref: '#/UpdateCenterOptionalDependency'
    warnings:
      type: array
      items:
        $ref: '#/UpdateCenterUploadWarning'

UpdateCenterUploadedPlugin:
  type: object
  required: [name, version, sha256]
  properties:
    name:
      type: string
    version:
      type: string
    sha256:
      type: string
      description: 'The computed content digest, "sha256:<hex>".'
    displayName:
      type: string
    requiredCore:
      type: string

UpdateCenterClosureEntry:
  type: object
  description: One mandatory dependency and how it resolved.
  required: [name, min, status]
  properties:
    name:
      type: string
    min:
      type: string
      description: The highest minimum any path in the closure required.
    status:
      type: string
      enum:
        - satisfied-store
        - lock-too-old
        - declared-not-yet-stored
        - planned-fetch
        - not-in-store
        - unreachable
        - metadata-unavailable
        - closure-unverifiable
    resolvedVersion:
      type: string
    source:
      type: string
      enum: [store, declared, upstream]
    fetched:
      type: boolean
      description: True when the upload downloaded and stored these bytes.

UpdateCenterOptionalDependency:
  type: object
  required: [name, min]
  properties:
    name:
      type: string
    min:
      type: string

UpdateCenterUploadWarning:
  type: object
  description: A non-rejecting finding about the closure.
  required: [code, plugin, message]
  properties:
    code:
      type: string
      enum: [lock-too-old, declared-not-yet-stored]
    plugin:
      type: string
    min:
      type: string
    message:
      type: string

UpdateCenterUnresolvedDependency:
  type: object
  description: >
    One rejecting dependency. The foundInStore/foundDeclared/foundUpstream
    triple is what makes the diff actionable.
  required: [name, min, reason]
  properties:
    name:
      type: string
    min:
      type: string
    reason:
      type: string
      enum: [not-in-store, unreachable, metadata-unavailable, closure-unverifiable]
    foundInStore:
      type: string
      nullable: true
    foundDeclared:
      type: string
      nullable: true
    foundUpstream:
      type: string
      nullable: true
    remediation:
      type: string

UpdateCenterUploadRejection:
  type: object
  description: A closure that could not be validated. Every rejecting dependency is listed.
  required: [error]
  properties:
    error:
      type: string
      enum:
        - unresolved-dependencies
        - closure-unverifiable
        - closure-too-deep
        - metadata-unavailable
        - declared-set-unavailable
    message:
      type: string
    unresolved:
      type: array
      items:
        $ref: '#/UpdateCenterUnresolvedDependency'

PluginInventorySummary:
  type: object
  description: Bounded plugin inventory summary from Controller.status.pluginInventory.
  required: [hash, source, stale, degraded, bootstrapApproximate, optionalEdgesDropped, truncated, total, driftTruncated, pendingCollect]
  properties:
    hash:
      type: string
    collectedAt:
      type: string
    observedAt:
      type: string
    source:
      type: string
    stale:
      type: boolean
    degraded:
      type: boolean
    bootstrapApproximate:
      type: boolean
    optionalEdgesDropped:
      type: boolean
    truncated:
      type: boolean
    total:
      type: integer
    counts:
      type: object
      additionalProperties:
        type: integer
    drift:
      type: array
      items:
        $ref: '#/PluginInventoryDriftEntry'
    versionDrift:
      type: array
      items:
        $ref: '#/PluginInventoryDriftEntry'
    driftTruncated:
      type: boolean
    pendingCollect:
      $ref: '#/PluginInventoryPendingCollect'
  additionalProperties: false

PluginInventoryDriftEntry:
  type: object
  description: One row of the drift or version-drift list.
  required: [name]
  properties:
    name:
      type: string
    version:
      type: string
    class:
      type: string
    verdict:
      type: string
    message:
      type: string
  additionalProperties: false

PluginInventoryPendingCollect:
  type: object
  description: An in-flight COLLECT_PLUGIN_INVENTORY command.
  required: [commandId, issuedAt]
  properties:
    commandId:
      type: string
    issuedAt:
      type: string
  additionalProperties: false

ClassifiedPluginInventory:
  type: object
  description: Full classified plugin inventory from the plugins sub-resource.
  required: [hash, source, stale, degraded, bootstrapApproximate, optionalEdgesDropped, truncated, total, driftTruncated, detailAvailable]
  properties:
    hash:
      type: string
    collectedAt:
      type: string
    observedAt:
      type: string
    source:
      type: string
    stale:
      type: boolean
    degraded:
      type: boolean
    bootstrapApproximate:
      type: boolean
    optionalEdgesDropped:
      type: boolean
    truncated:
      type: boolean
    total:
      type: integer
    counts:
      type: object
      additionalProperties:
        type: integer
    driftTruncated:
      type: boolean
    plugins:
      type: array
      items:
        $ref: '#/ClassifiedPlugin'
    advisories:
      type: array
      items:
        $ref: '#/PluginAdvisory'
    detailStale:
      type: boolean
    detailAvailable:
      type: boolean
  additionalProperties: false

ClassifiedPlugin:
  type: object
  description: One classified installed plugin from the read model.
  required: [name, version, class]
  properties:
    name:
      type: string
    version:
      type: string
    class:
      type: string
    declaredBy:
      type: string
    contributors:
      type: array
      items:
        type: string
    impliedBy:
      type: array
      items:
        type: string
    versionVerdict:
      type: string
    enabled:
      type: string
    detached:
      type: string
    bundled:
      type: string
  additionalProperties: false

PluginAdvisory:
  type: object
  description: A non-classification finding (e.g. dependencyMinimumUnsatisfied).
  required: [code, plugin, dependency, min, version]
  properties:
    code:
      type: string
    plugin:
      type: string
    dependency:
      type: string
    min:
      type: string
    version:
      type: string
  additionalProperties: false

# --- Fleet plugin inventory (T2.2) ---

FleetPluginVersionCount:
  type: object
  required: [version, controllerCount]
  properties:
    version:
      type: string
    controllerCount:
      type: integer
      minimum: 0
  additionalProperties: false

FleetPluginClassCount:
  type: object
  required: [class, controllerCount]
  properties:
    class:
      type: string
    controllerCount:
      type: integer
      minimum: 0
  additionalProperties: false

FleetPluginRollupItem:
  type: object
  required: [name, controllerCount, versions, classes]
  properties:
    name:
      type: string
    controllerCount:
      type: integer
      minimum: 0
    versions:
      type: array
      items:
        $ref: '#/FleetPluginVersionCount'
    classes:
      type: array
      items:
        $ref: '#/FleetPluginClassCount'
  additionalProperties: false

FleetPluginMissingController:
  type: object
  required: [cluster, namespace, name, reason]
  properties:
    cluster:
      type: string
    namespace:
      type: string
    name:
      type: string
    reason:
      type: string
  additionalProperties: false

FleetPluginCoverage:
  type: object
  required:
    [complete, controllersTotal, controllersReporting,
     controllersStale, controllersDegraded, controllersTruncated,
     controllersDetailStale, controllersMissing, clustersNotCovered]
  properties:
    complete:
      type: boolean
    controllersTotal:
      type: integer
      minimum: 0
    controllersReporting:
      type: integer
      minimum: 0
    controllersStale:
      type: integer
      minimum: 0
    controllersDegraded:
      type: integer
      minimum: 0
    controllersTruncated:
      type: integer
      minimum: 0
    controllersDetailStale:
      type: integer
      minimum: 0
    controllersMissing:
      type: array
      items:
        $ref: '#/FleetPluginMissingController'
    clustersNotCovered:
      type: integer
      minimum: 0
  additionalProperties: false

FleetPluginsRollup:
  type: object
  required: [items, coverage, clusters]
  properties:
    items:
      type: array
      items:
        $ref: '#/FleetPluginRollupItem'
    coverage:
      $ref: '#/FleetPluginCoverage'
    clusters:
      type: array
      items:
        $ref: '#/ClusterFanoutStatus'
  additionalProperties: false

FleetPluginDrillItem:
  type: object
  required:
    [cluster, namespace, controller, version, class, source,
     collectedAt, detailPath, detailStale, stale, degraded,
     truncated, optionalEdgesDropped, bootstrapApproximate]
  properties:
    cluster:
      type: string
    namespace:
      type: string
    controller:
      type: string
    version:
      type: string
    class:
      type: string
    source:
      type: string
    collectedAt:
      type: string
    detailPath:
      type: string
    detailStale:
      type: boolean
    stale:
      type: boolean
    degraded:
      type: boolean
    truncated:
      type: boolean
    optionalEdgesDropped:
      type: boolean
    bootstrapApproximate:
      type: boolean
  additionalProperties: false

FleetPluginDrilldown:
  type: object
  required: [name, items, versions, coverage, clusters]
  properties:
    name:
      type: string
    items:
      type: array
      items:
        $ref: '#/FleetPluginDrillItem'
    versions:
      type: array
      items:
        $ref: '#/FleetPluginVersionCount'
    coverage:
      $ref: '#/FleetPluginCoverage'
    clusters:
      type: array
      items:
        $ref: '#/ClusterFanoutStatus'
  additionalProperties: false

# --- Pipelines schemas (add-pipelines-ui) ---

ChangeRequest:
  type: object
  description: >
    The change request (pull request) a multibranch run builds. Absent
    for a branch run.
  required: [id]
  properties:
    id:
      type: string
      description: The forge's change request number or identifier.
    title:
      type: string
    sourceBranch:
      type: string
      description: The branch that carries the change.
    targetBranch:
      type: string
      description: The branch the change merges into.
    url:
      type: string
      description: Web link to the change request on the forge.
  additionalProperties: false

JobBranchList:
  type: object
  description: >
    GET /pipelines/{team}/jobs/{job}/branches. The inventory is up to
    ten minutes stale. A hibernated cell keeps its last export.
  required: [jobPath, truncated, branches, changeRequests, tags, repositories]
  properties:
    jobPath:
      type: string
    observedAt:
      type: string
      format: date-time
      description: When the cell last exported this job. Absent before the first export.
    indexedAt:
      type: string
      format: date-time
      description: When Jenkins last indexed the multibranch job.
    indexResult:
      type: string
      description: The result of the last Jenkins index.
    truncated:
      type: boolean
      description: True when the cell capped the number of heads it exported.
    branches:
      type: array
      items:
        $ref: '#/JobBranchHead'
    changeRequests:
      type: array
      description: Sorted by numeric change request id, newest first.
      items:
        $ref: '#/JobBranchHead'
    tags:
      type: array
      items:
        $ref: '#/JobBranchHead'
    repositories:
      type: array
      description: >
        The repositories of an organization folder, sorted by name. A
        multibranch job has none.
      items:
        $ref: '#/JobBranchHead'
    lastScan:
      $ref: '#/BranchScan'
  additionalProperties: false

JobBranchHead:
  type: object
  description: One branch, change request, or tag of a multibranch job.
  required: [name, jobPath, orphaned]
  properties:
    name:
      type: string
    jobPath:
      type: string
      description: The head's own job path, which its runs carry.
    orphaned:
      type: boolean
      description: True when Jenkins no longer discovers the head as buildable.
    revision:
      type: string
      description: The last seen SCM revision of the head.
    changeRequest:
      $ref: '#/ChangeRequest'
    lastRun:
      $ref: '#/RunSummary'
  additionalProperties: false

ScanMultibranchRequest:
  type: object
  description: POST /pipelines/{team}/jobs/{job}/scan. Every field is optional.
  properties:
    cluster:
      type: string
      description: >
        Breaks a tie when the job path lies in more than one surviving
        tenant.
  additionalProperties: false

BranchScanResponse:
  type: object
  description: 202 response for a scan request. The scan identifier is the lastScan.scanId of the branch inventory.
  required: [scanId, state]
  properties:
    scanId:
      type: string
    state:
      type: string
      enum: [requested]
  additionalProperties: false

BranchScan:
  type: object
  description: The last requested scan of a multibranch job. Absent until a scan runs.
  required: [scanId, state, newHeads, changedHeads, orphanedHeads]
  properties:
    scanId:
      type: string
    state:
      type: string
      enum: [running, completed, failed, timeout, refused]
    actor:
      type: string
    requestedAt:
      type: string
      format: date-time
    endedAt:
      type: string
      format: date-time
    result:
      type: string
    newHeads:
      type: array
      items:
        type: string
    changedHeads:
      type: array
      items:
        type: string
    orphanedHeads:
      type: array
      items:
        type: string
    message:
      type: string
  additionalProperties: false

RunSummary:
  type: object
  description: One run, condensed for a list or a card.
  required: [runId, status]
  properties:
    runId:
      type: string
    buildNumber:
      type: integer
      format: int64
    jobPath:
      type: string
    status:
      type: string
    result:
      type: string
    branch:
      type: string
    scmRevision:
      type: string
    actor:
      type: string
    cause:
      type: string
    scmUrl:
      type: string
      description: Repository URL of the run, from the SCM source. Absent when Jenkins reports none.
    scmForge:
      type: string
      enum: [github, gitlab, gitea]
      description: >
        The forge that hosts scmUrl. A Forgejo host reads gitea. The field
        is absent when the forge is unknown.
    triggerSource:
      type: string
      enum: [user, webhook, cron, upstream, replay, restart, scm, other]
      x-enum-varnames: [User, Webhook, Cron, Upstream, Replay, Restart, Scm, Other]
      description: >
        Kind of cause that started the run. Absent when Jenkins reports no cause list.
    changeRequest:
      $ref: '#/ChangeRequest'
    queuedAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    endedAt:
      type: string
      format: date-time
    durationMs:
      type: integer
      format: int64
  additionalProperties: false

RunningRun:
  type: object
  description: >
    One unfinished run for the team home's Running now card. currentStage
    names the top-level stage in progress. It is absent when no top-level
    stage is in progress: before the first stage, between two stages, and
    for a queued run.
  required: [runId, jobPath, status]
  properties:
    runId:
      type: string
    jobPath:
      type: string
    buildNumber:
      type: integer
      format: int64
    status:
      type: string
    currentStage:
      type: string
    branch:
      type: string
    scmRevision:
      type: string
    changeRequest:
      $ref: '#/ChangeRequest'
    changeSummary:
      type: string
      description: The last commit's short message.
    queuedAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    typicalDurationMs:
      type: integer
      format: int64
      description: The job's usual duration, from its duration trend.
  additionalProperties: false

PipelineSummary:
  type: object
  description: >
    One job's run-history summary for the Pipelines table. A job that has
    never run carries no lastBuild.
  required: [jobPath, health, kind, pending]
  properties:
    jobPath:
      type: string
    health:
      type: string
      enum: [clear, cloudy, rain, unknown]
      description: >
        The weather glyph, computed from the last five runs: clear when
        all passed, cloudy when one or two failed, rain when three or
        more failed, unknown for a job that has never run.
    kind:
      type: string
      enum: [pipeline, multibranch, organizationFolder, branch, unknown]
      description: >
        The job's kind. A declared pipeline, multibranch, or organization
        folder item sets it. Otherwise a child of a multibranch job or of a
        project the inventory reports is a branch, and a project the
        inventory reports is a multibranch job. A run alone marks a pipeline
        job. Any other job reports unknown.
    pending:
      type: boolean
      description: >
        True when every tenant that declares this job reports a complete job
        list that lacks it. False when a declaring tenant has an unknown
        inventory, when a declaring tenant holds the job, when the job has a
        run, and when no tenant declares the job.
    lastBuild:
      $ref: '#/RunSummary'
    durationTrendMs:
      type: array
      description: The most recent runs' duration, newest first.
      items:
        type: integer
        format: int64
    medianQueueWaitMs:
      type: integer
      format: int64
      description: >
        The median wait between a build's queued moment and its started
        moment, in milliseconds, over the trailing 30 days. Absent when the
        job started no build in that window.
  additionalProperties: false

PipelineRetention:
  type: object
  description: The record-store windows that apply to one pipelines team.
  required: [storeDays, effectiveDays, jobs]
  properties:
    storeDays:
      type: integer
      description: The store-wide runs window, in days. It caps every other window.
    tenantDays:
      type: integer
      description: The tenant window, in days. Absent when the tenant sets none.
    effectiveDays:
      type: integer
      description: The window a job without a matching rule gets, in days.
    jobs:
      type: array
      items:
        $ref: '#/PipelineJobRetention'
      description: The per-job rules, in match order.
  additionalProperties: false

PipelineJobRetention:
  type: object
  description: One per-job window rule of a pipelines team.
  required: [job, days, effectiveDays]
  properties:
    job:
      type: string
      description: The folder-relative job glob.
    days:
      type: integer
      description: The window the rule names, in days, before the store cap.
    effectiveDays:
      type: integer
      description: The window the rule gives, in days, after the store cap.
  additionalProperties: false

PipelineListResponse:
  type: object
  description: >
    GET /pipelines/{team}: the job list, unioned with the catalog's
    declared jobs, plus the running-now strip.
  required: [items, runningNow, truncated, tenantFolder, retention]
  properties:
    retention:
      $ref: '#/PipelineRetention'
    items:
      type: array
      items:
        $ref: '#/PipelineSummary'
    runningNow:
      type: array
      items:
        $ref: '#/RunningRun'
    tenantFolder:
      type: string
      description: >
        The Jenkins folder that prefixes every job path in the response.
        It is the Team name for a placed pipelines tenant. It is the empty
        string for a controller tenant. The field is always present.
    truncated:
      type: boolean
      description: >
        True when any tenant's running-now page was full (50 rows), so
        the strip does not claim completeness.
  additionalProperties: false

PipelineDefinition:
  type: object
  description: >
    Where a job's pipeline script comes from. The catalog template, when one
    exists, is reported separately on PipelineJobDetail.template — see
    PipelineTemplateInfo.
  required: [source]
  properties:
    source:
      type: string
      enum: [jenkinsfile, inline, template]
      description: >
        jenkinsfile when the script is read from source control, inline
        when the bundle item carries the script itself, and template when
        the item's definition names a catalog template (varroaTemplate).
        A marker-defined multibranch job reads its marker from a
        repository, so it reports jenkinsfile; its template is on
        PipelineJobDetail.template.
    jenkinsfileRepo:
      type: string
    jenkinsfileCommit:
      type: string
      description: The last build's checked-out commit, from its run record.
    jenkinsfileForge:
      type: string
      enum: [github, gitlab, gitea]
      description: >
        The forge that hosts jenkinsfileRepo. A Forgejo host reads gitea.
        The field is absent when the forge is unknown.
    profile:
      type: string
      description: The version profile in effect for this job's controller.
    definitionPath:
      type: string
      description: >
        The Jenkinsfile's script path within its own repository, from the
        job's last run. Present only when source is jenkinsfile and the
        run recorded one.
    declaredBy:
      $ref: '#/JobDeclaredBy'
  additionalProperties: false

JobDeclaredBy:
  type: object
  description: >
    Which input of the job's composed bundle declared it. Present when one
    bundle input resolved as the declarer. Absent when the bundle or every
    candidate input is unresolved.
  required: [kind, name, bundle]
  properties:
    kind:
      type: string
      enum: [gitSource, ociSource, itemRef]
    name:
      type: string
      description: >
        gitSource: the input's repoURL. ociSource: the input's ociRef.
        itemRef: the CatalogItem name.
    revision:
      type: string
      description: >
        A git SHA (gitSource), an OCI manifest digest (ociSource), or a
        CatalogItem content hash (itemRef). Absent when the composed
        bundle has not resolved this input yet.
    bundle:
      $ref: '#/BundleRef'
    repoURL:
      type: string
      description: Present only for kind gitSource.
    forge:
      type: string
      enum: [github, gitlab, gitea]
      description: >
        gitSource only: the forge that hosts repoURL. A Forgejo host reads
        gitea. The field is absent when the forge is unknown.
    path:
      type: string
      description: The input's sub-path. Absent when the input declares no sub-path.
    ociRef:
      type: string
      description: Present only for kind ociSource.
    catalogItem:
      $ref: '#/CatalogItemRef'
  additionalProperties: false

BundleRef:
  type: object
  required: [namespace, name]
  properties:
    namespace:
      type: string
    name:
      type: string
  additionalProperties: false

CatalogItemRef:
  type: object
  required: [name, namespace]
  properties:
    name:
      type: string
    namespace:
      type: string
  additionalProperties: false

PipelineTemplateInfo:
  type: object
  description: >
    The resolved catalog template for a job, read from the record store
    (marker-defined) or the items engine and catalog (items-declared).
    Absent from PipelineJobDetail for a job with no catalog template.

    For source "marker": name, version, and asOfBuild are absent before
    the job's first run — markerPath and source are always present.
    markerRevision is the trusted revision the cell read the marker from,
    not the branch tip. For source "items": only name, version, and
    source are set.
  required: [source]
  properties:
    name:
      type: string
    version:
      type: string
    markerPath:
      type: string
    markerRevision:
      type: string
    source:
      type: string
      enum: [marker, items]
    asOfBuild:
      type: integer
      format: int64
  additionalProperties: false

PipelineTriggers:
  type: object
  properties:
    push:
      type: boolean
    pullRequest:
      type: boolean
    webhook:
      type: boolean
      description: "True when the job declares a genericTrigger. The token is not returned."
    schedule:
      type: string
    concurrency:
      type: integer
  additionalProperties: false

PipelineParameter:
  type: object
  description: >
    One declared build parameter, converted from the items engine's
    parameter kind into a JSON Schema fragment the frontend's form
    renders directly.
  required: [name, kind, schema]
  properties:
    name:
      type: string
    description:
      type: string
    kind:
      type: string
      enum: [string, boolean, choice, text, password]
    schema:
      type: object
      description: A JSON Schema fragment for this one field.
    uiWidget:
      type: string
      enum: [textarea, password]
    defaultValue:
      type: string
  additionalProperties: false

PipelineJobDetail:
  type: object
  description: GET /pipelines/{team}/jobs/{job}.
  required: [jobPath, kind, pending, health, last30Days, tenantFolder, tenant, dependencies]
  properties:
    jobPath:
      type: string
    kind:
      type: string
      enum: [pipeline, multibranch, organizationFolder, branch, unknown]
      description: >
        The job's kind. A declared pipeline, multibranch, or organization
        folder item sets it. Otherwise a child of a multibranch job or of a
        project the inventory reports is a branch, and a project the
        inventory reports is a multibranch job. A run alone marks a
        pipeline job.
    pending:
      type: boolean
      description: >
        True when every tenant that declares this job reports a complete job
        list that lacks it. False when a declaring tenant has an unknown
        inventory, when a declaring tenant holds the job, when the job has a
        run, and when no tenant declares the job.
    health:
      type: string
      enum: [clear, cloudy, rain, unknown]
    tenantFolder:
      type: string
      description: >
        The tenant's Jenkins folder prefix, from TenantRef.Folder. Empty
        for a root-hosted tenant.
    tenant:
      type: string
      description: >
        The tenant noun the server authorizes against, from
        TenantRef.Tenant: a Team name for a Team tenant, or
        "<namespace>/<controller>" for a synthetic tenant.
    lastBuild:
      $ref: '#/RunSummary'
    durationTrendMs:
      type: array
      items:
        type: integer
        format: int64
    definition:
      $ref: '#/PipelineDefinition'
    triggers:
      $ref: '#/PipelineTriggers'
    parameters:
      type: array
      items:
        $ref: '#/PipelineParameter'
    template:
      allOf:
        - $ref: '#/PipelineTemplateInfo'
      description: Absent for a job with no catalog template (a Jenkinsfile job).
    last30Days:
      allOf:
        - $ref: '#/PipelineLast30Days'
      nullable: true
      description: >
        Null when the record store could not answer the window query;
        the rest of the job page still renders.
    dependencies:
      $ref: '#/PipelineDependencies'
    waiting:
      type: array
      maxItems: 50
      items:
        $ref: '#/RunWaitEntry'
      description: Queued runs of this job that a concurrency cap holds. Absent when none waits.
  additionalProperties: false

PipelineDependencies:
  type: object
  description: >
    The job's cross-tenant dependency edges (design D13). Both arrays are
    empty, never omitted, for a job that declares no cross-tenant trigger
    and has no subscriber.
  required: [upstream, downstream]
  properties:
    upstream:
      type: array
      description: The varroa-upstream trigger rows this job declares.
      items:
        $ref: '#/PipelineDependencyEdge'
    downstream:
      type: array
      description: The varroa-upstream rows naming this job as their producer.
      items:
        $ref: '#/PipelineDependencyEdge'
  additionalProperties: false

PipelineDependencyEdge:
  type: object
  description: >
    One cross-tenant dependency edge: a producer tenant and job, the
    result threshold the edge fires on, and whether the producer's
    exports currently grant it. A declared edge whose grant is missing
    is not hidden; it appears with granted false.
  required: [tenant, job, jobPath, result, granted]
  properties:
    tenant:
      type: string
      description: The producer tenant's identifier.
    job:
      type: string
      description: The job's name, relative to the other tenant's folder.
    jobPath:
      type: string
      description: >
        The job's path with its tenant folder. The job page route takes this path.
    result:
      type: string
      description: The result threshold the edge fires on.
      enum: [SUCCESS, UNSTABLE, FAILURE]
    granted:
      type: boolean
      description: >
        The grant evaluator's fanout-path verdict, read from the
        producer's exports.
    lastRun:
      description: >
        The edge's most recent run within the last 30 days. Absent when no
        such run exists. A run the caller may not read carries its tenant alone.
      allOf:
        - $ref: '#/RunLink'
  additionalProperties: false

PipelineLast30Days:
  type: object
  description: The job's "Last 30 days" card, GET /pipelines/{team}/jobs/{job}.
  required: [builds]
  properties:
    builds:
      type: integer
      format: int64
      description: Every run created in the window, whatever its status.
    passRate:
      type: number
      format: double
      nullable: true
      description: The share of finished runs whose result is SUCCESS. Null when the window holds no finished run.
    medianDurationMs:
      type: integer
      format: int64
      nullable: true
      description: The median duration_ms over finished runs. Null when the window holds no finished run.
    medianQueueWaitMs:
      type: integer
      format: int64
      description: The median wait between a build's queued moment and its started moment, in milliseconds. Absent when the job started no build in that window.
    slowestStage:
      allOf:
        - $ref: '#/PipelineSlowestStage'
      nullable: true
      description: Null when no run in the window carries a finished stage.
  additionalProperties: false

PipelineSlowestStage:
  type: object
  description: The stage with the greatest median duration across the window's runs.
  required: [name, durationMs]
  properties:
    name:
      type: string
    durationMs:
      type: integer
      format: int64
  additionalProperties: false

RunListResponse:
  type: object
  description: GET /pipelines/{team}/jobs/{job}/runs, cross-tenant cursor-merged.
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/RunSummary'
    nextCursor:
      type: string
  additionalProperties: false

# --- Fleet lock schemas (add-fleet-locks-view) ---

FleetLock:
  type: object
  description: >
    One fleet lock row, from a varroa.lock step. tenant and jobPath are
    always present, whichever tenant the row belongs to. runLink is
    present only when the reading caller can read that row's own run. A
    waiting row reports its own waitingSince. A held or a releasing row
    reports its own acquiredAt and no waitingSince. The row carries no
    queue position and no derived holder: a consumer groups the rows it
    already has by name.
  required: [name, cluster, tenant, jobPath, state, runId]
  properties:
    name:
      type: string
      description: >
        The qualified lock name: the owner tenant, a slash, and the bare
        lock name. A controller tenant holds a slash of its own, so do not
        split this value to find the owner.
    cluster:
      type: string
      description: The cluster of the run that holds or waits on the lock.
    tenant:
      type: string
      description: The tenant of the run that holds or waits on the lock.
    jobPath:
      type: string
      description: The job path of the run that holds or waits on the lock.
    state:
      type: string
      enum: [waiting, held, releasing]
    runId:
      type: string
    runLink:
      type: string
      description: >
        The run's own page path,
        /pipelines/{team}/{jobPath}/{runId}, the same link a run search
        result carries. Absent, not null, when the caller's own grant
        cannot read the row's own run.
    waitingSince:
      type: string
      format: date-time
      description: >
        The time the run began to wait. Present only on a waiting row.
    acquiredAt:
      type: string
      format: date-time
      description: >
        The time the run acquired the lock. Present on a held or a
        releasing row.
  additionalProperties: false

PipelineTeam:
  type: object
  description: >
    One row of GET /pipelines. cell and cellNamespace are set only on a
    placed row.
  required: [name, cluster, placed]
  properties:
    name:
      type: string
      description: The Team name, which is also its tenant name.
    cluster:
      type: string
      description: >
        The cluster that holds the tenant's cell. An unplaced local Team
        names the local cluster. A local Team whose namespaces hold a
        controller, and which has no spec.pipelines, also names the local
        cluster.
    cell:
      type: string
      description: The slot-0 cell Controller that holds the tenant.
    cellNamespace:
      type: string
      description: The namespace of that cell Controller.
    placed:
      type: boolean
      description: >
        True when a cell holds the tenant. A controller-namespace Team
        answers false.
  additionalProperties: false

PipelineTeamList:
  type: object
  description: >
    GET /pipelines. The rows are in (name, cluster) order.
  required: [items, recordStore]
  properties:
    items:
      type: array
      items:
        $ref: '#/PipelineTeam'
    recordStore:
      type: boolean
      description: >
        False when the record store is off or its schema is too old. The
        list then carries no Team that another cluster holds.
  additionalProperties: false

FleetLockListResponse:
  type: object
  description: >
    GET /pipelines/{team}/locks and GET /locks. Both routes answer the
    rows in lock name order. In one name, the holder comes first, and
    the waiters follow in the order they began to wait.
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/FleetLock'
  additionalProperties: false

FleetLockReleaseRequest:
  type: object
  description: >
    POST /locks/release. name and runId identify the lock row. reason is
    stored in the audit record, so it is required.
  required: [name, runId, reason]
  properties:
    name:
      type: string
      minLength: 1
      description: The qualified lock name, as the lock reads answer it.
    runId:
      type: string
      minLength: 1
      description: The run that holds the releasing lock.
    reason:
      type: string
      minLength: 1
      description: Why the operator releases the lock. The activity row carries it.
  additionalProperties: false

FleetLockReleaseResponse:
  type: object
  description: >
    The released row. It names the owner of the run that held the lock.
  required: [name, runId, cluster, tenant, jobPath, state]
  properties:
    name:
      type: string
    runId:
      type: string
    cluster:
      type: string
    tenant:
      type: string
    jobPath:
      type: string
    cellInstance:
      type: string
      description: The cell instance that held the lock.
    state:
      type: string
      enum: [released]
  additionalProperties: false

FleetLockReleaseConflict:
  type: object
  description: >
    The 409 body of POST /locks/release. holderCell is present only when a
    live pod still runs the lock's holder.
  required: [error]
  properties:
    error:
      type: string
      description: Human-readable refusal message.
    holderCell:
      $ref: '#/FleetLockHolderCell'
  additionalProperties: false

FleetLockHolderCell:
  type: object
  description: >
    The cell that still runs a releasing lock's holder. A restart of that
    cell ends the holder, and the lock then releases.
  required: [cluster, namespace, name]
  properties:
    cluster:
      type: string
    namespace:
      type: string
    name:
      type: string
  additionalProperties: false

CreateRunRequest:
  type: object
  description: >
    POST /pipelines/{team}/jobs/{job}/runs. clientToken, a UUIDv7, makes
    the request idempotent: the BFF uses it as the run identifier. A
    request with no clientToken is not idempotent.
  properties:
    clientToken:
      type: string
      format: uuid
    parameters:
      type: object
      additionalProperties:
        type: string
    cluster:
      type: string
      description: >
        Breaks a tie when the job path lies in more than one surviving
        tenant.
  additionalProperties: false

RunActionResponse:
  type: object
  description: >
    202 response for a run request, a rerun, or a replay. The BFF does not wait for
    the cell's admission decision; the caller polls the run.
  required: [runId, intentKey, state]
  properties:
    runId:
      type: string
    intentKey:
      type: string
    state:
      type: string
      enum: [requested]
  additionalProperties: false

CancelRunResponse:
  type: object
  description: >
    202 response for a fire-and-forget run action: a cancel, an input
    proceed, or an input abort. The BFF publishes one command and waits
    for no result.
  required: [state]
  properties:
    state:
      type: string
      enum: [requested]
  additionalProperties: false

PipelineMarkerValidateRequest:
  type: object
  description: POST /pipelines/{team}/markers/validate.
  required: [marker]
  properties:
    marker:
      type: string
      description: The marker file's raw text, at most 64 KiB.
  additionalProperties: false

PipelineMarkerFinding:
  type: object
  description: One line of the lint table's SEVERITY, PATH, and MESSAGE columns.
  required: [severity, message]
  properties:
    severity:
      type: string
      enum: [error]
    path:
      type: string
    message:
      type: string
  additionalProperties: false

PipelineMarkerValidateResponse:
  type: object
  description: >
    findings is empty when the marker resolved against the team's
    delivered set and its values validated; templateName and
    templateVersion are then present.
  required: [findings]
  properties:
    findings:
      type: array
      items:
        $ref: '#/PipelineMarkerFinding'
    templateName:
      type: string
    templateVersion:
      type: string
  additionalProperties: false

RunStage:
  type: object
  required: [stageId, name, status]
  properties:
    stageId:
      type: string
    parentId:
      type: string
    name:
      type: string
    nodeType:
      type: string
    status:
      type: string
    startedAt:
      type: string
      format: date-time
    endedAt:
      type: string
      format: date-time
    durationMs:
      type: integer
      format: int64
    error:
      type: string
  additionalProperties: false

RunInputParameter:
  type: object
  description: One parameter an input step declares, read from its definition.
  required: [name]
  properties:
    name:
      type: string
      description: The definition's name.
    type:
      type: string
      description: >
        The Java simple name of the parameter definition, such as
        StringParameterDefinition or ChoiceParameterDefinition.
    description:
      type: string
      description: The definition's description. Absent when the definition declares none.
    defaultValue:
      type: string
      description: >
        The definition's default value, rendered as text. Absent when
        the definition declares none.
    choices:
      type: array
      items:
        type: string
      description: The definition's choices. Absent when the definition declares none.
  additionalProperties: false

RunInput:
  type: object
  description: One input step a run waits on, read from the run's stored inputs column.
  required: [id]
  properties:
    id:
      type: string
      description: The input step's own identifier. Both input routes address this value.
    message:
      type: string
      description: The message the step shows. Absent when the step declares none.
    ok:
      type: string
      description: The label of the step's proceed control. Absent when the step declares none.
    submitter:
      type: string
      description: >
        The users and groups the step admits. Absent when the step
        declares none.
    submitterParameter:
      type: string
      description: >
        The parameter name that holds the answering user's name. Absent
        when the step declares none.
    parameters:
      type: array
      items:
        $ref: '#/RunInputParameter'
      description: >
        The step's own parameter definitions, in declaration order.
        Absent when the step declares none.
  additionalProperties: false

RunDetail:
  type: object
  description: GET /runs/{run}.
  required: [runId, jobPath, status, tenantFolder, tenant]
  properties:
    runId:
      type: string
    jobPath:
      type: string
    tenantFolder:
      type: string
      description: >
        The tenant's Jenkins folder prefix, from TenantRef.Folder. Empty
        for a root-hosted tenant.
    tenant:
      type: string
      description: >
        The tenant noun the server authorizes against: the run row's
        stored tenant column. A Team name for a Team tenant, or
        "<namespace>/<controller>" for a synthetic tenant.
    buildNumber:
      type: integer
      format: int64
    branch:
      type: string
    scmRevision:
      type: string
    status:
      type: string
    result:
      type: string
    queuedAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    endedAt:
      type: string
      format: date-time
    durationMs:
      type: integer
      format: int64
    actor:
      type: string
    cause:
      type: string
    scmUrl:
      type: string
      description: Repository URL of the run, from the SCM source. Absent when Jenkins reports none.
    scmForge:
      type: string
      enum: [github, gitlab, gitea]
      description: >
        The forge that hosts scmUrl. A Forgejo host reads gitea. The field
        is absent when the forge is unknown.
    triggerSource:
      type: string
      enum: [user, webhook, cron, upstream, replay, restart, scm, other]
      x-enum-varnames: [User, Webhook, Cron, Upstream, Replay, Restart, Scm, Other]
      description: >
        Kind of cause that started the run. Absent when Jenkins reports no cause list.
    changeRequest:
      $ref: '#/ChangeRequest'
    params:
      type: object
      additionalProperties:
        type: string
    testsTotal:
      type: integer
    testsFailed:
      type: integer
    testsSkipped:
      type: integer
    logFinalized:
      type: boolean
      description: LogSummary.finalized, read from the run's payload column.
    logComplete:
      type: boolean
      description: The negation of LogSummary.incomplete.
    interruptedReason:
      type: string
      description: Set only when result is INTERRUPTED.
    triggerError:
      type: string
      description: The error text a refused build trigger reported. Set only when result is TRIGGER_FAILED.
    triggerReasonCode:
      type: string
      description: >-
        Why no build exists for the trigger. One of JOB_NOT_FOUND,
        JOB_NOT_BUILDABLE, TRIGGER_REJECTED, TRIGGER_UNREACHABLE,
        CLAIM_EXPIRED, CLAIM_ABANDONED, FENCED, CROSS_TENANT, INVALID_KEY,
        THROTTLED, and NOT_HOME. The first three name a refusal from the
        controller. TRIGGER_UNREACHABLE names a trigger that reached no
        Jenkins. CLAIM_EXPIRED names an accepted trigger that no build claim
        followed. CLAIM_ABANDONED names a granted build claim that started no
        build. The last five name a build claim that the record store refused.
        NOT_HOME names a replay or a restart whose job home moved to another
        slot before it claimed. Set only when result is TRIGGER_FAILED.
    retryRunId:
      type: string
      description: An existing retry's run id, when one already exists.
    source:
      type: object
      description: >
        How the run was defined, read from the run's stored source column.
        This field is absent until a run.source event arrives.
      additionalProperties: false
      properties:
        definitionPath:
          type: string
          description: >
            The pipeline script path in the run's own repository. A run that a
            template defines reports no value here.
        libraries:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              version:
                type: string
                description: The version the run loaded. Absent when the library declares none.
              revision:
                type: string
                description: >
                  The commit the run loaded. Absent when the library loaded
                  from the cache.
              repositoryUrl:
                type: string
                description: >
                  The library repository URL. It carries no credentials. The
                  field is absent when the current library configuration does
                  not name a repository.
              repositoryForge:
                type: string
                enum: [github, gitlab, gitea]
                description: >
                  The forge that hosts repositoryUrl. The field is absent when
                  the forge is unknown.
        podTemplates:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
              label:
                type: string
              image:
                type: string
    replayOf:
      type: string
      description: >
        The identifier of the run whose script this build replayed. The
        field is absent for a build that is not a replay.
    restartOf:
      type: string
      description: >
        The identifier of the run this build restarted from. The field is
        absent for a build that is not a restart.
    restartStage:
      type: string
      description: >
        The stage this restarted build began at. The field is absent for a
        build that is not a restart.
    restart:
      $ref: '#/RunRestart'
    rejectedSignature:
      type: string
      description: >
        Set only when result is FAILURE and the script sandbox refused a
        signature.
    commandRefusal:
      $ref: '#/RunCommandRefusal'
    summary:
      type: string
      description: >
        The one-line text the run attached to itself through
        varroa.summary. The plugin cuts the text at 512 UTF-8 bytes.
        This field is absent until the run calls varroa.summary.
    digest:
      type: object
      description: >
        Why a run that did not succeed failed. The server computes this
        object on every read, from the stored rows and the stored log.
        The field is absent for a run with no result, for a SUCCESS or
        TRIGGER_FAILED result, or for a run with no start time. The
        field is also absent when no part has a value.
      additionalProperties: false
      properties:
        stage:
          type: string
          description: >
            The name of the innermost stage whose status is FAILURE,
            in stage-start order. A stage or a parallel branch that
            holds a failed stage is never the answer. A parallel branch
            shows its branch name. Absent when no stage failed.
        error:
          type: string
          description: >
            The stored error text of that stage. Absent when no stage
            failed, and when the stage carries no error.
        logTail:
          type: string
          description: >
            The last 50 console log lines that carry the attribution of
            the failed stage or of a stage nested under it. The field
            falls back to the last 50 lines of the whole log when no
            log-index entry names one of those stages. The lines carry
            no ANSI escape sequence. It is absent when the server holds no blob store and
            when a log-index entry fails to decode. Absent for an INTERRUPTED run.
        failedTests:
          type: object
          description: >
            The run's aggregate test counts. The field is present only
            when the run reports at least one failed test.
          additionalProperties: false
          required: [failed]
          properties:
            failed:
              type: integer
            skipped:
              type: integer
            total:
              type: integer
            cases:
              type: array
              description: >
                The first ten failed cases of the run, in the order the
                record store answers. A skipped case is not in the list.
                The field is absent when the run holds no stored case.
              items:
                type: object
                additionalProperties: false
                required: [suite, className, name, caseKey]
                properties:
                  suite:
                    type: string
                  className:
                    type: string
                  name:
                    type: string
                  caseKey:
                    type: string
                    description: >
                      The opaque case key. Do not parse it. Percent-encode
                      the whole key as one path segment before you use it
                      as {case} on the case history read.
    inputs:
      type: array
      description: >
        The input steps the run waits on, read from the run's stored
        inputs column. This field is absent until a run.input event
        arrives, and absent for a run that holds no pending input.
      items:
        $ref: '#/RunInput'
    testReport:
      $ref: '#/RunDetailTestReport'
    cases:
      type: array
      description: >
        The run's stored failed and skipped test cases, the same entries
        GET /runs/{run}/tests serves. The field is absent when the run
        holds no stored case.
      items:
        $ref: '#/RunTestCase'
    stages:
      type: array
      items:
        $ref: '#/RunStage'
    upstream:
      $ref: '#/RunLink'
    downstream:
      $ref: '#/RunLinkPage'
    waiting:
      $ref: '#/RunWait'
  additionalProperties: false

RunWait:
  type: object
  description: >-
    The concurrency cap that holds a queued run. Absent from a run that no
    cap holds.
  required: [kind, max, running, since]
  properties:
    kind:
      type: string
      enum: [tenant, cell]
      description: tenant when a tenant limit holds the run; cell when the tenant cap of its cell does.
    limit:
      type: string
      description: The tenant limit's name. Absent for a cell cap.
    max:
      type: integer
      format: int32
    running:
      type: integer
      format: int32
      description: The builds the cap counted when it last held the run.
    cell:
      type: string
    since:
      type: string
      format: date-time
  additionalProperties: false

RunWaitEntry:
  type: object
  description: A waiting run of a job, with its reason.
  required: [runId, kind, max, running, since]
  properties:
    runId:
      type: string
    kind:
      type: string
      enum: [tenant, cell]
    limit:
      type: string
    max:
      type: integer
      format: int32
    running:
      type: integer
      format: int32
    cell:
      type: string
    since:
      type: string
      format: date-time
  additionalProperties: false

RunLink:
  type: object
  description: >
    One run on the far side of a run link: the run that started this
    run, a run this run started, or a dependency edge's last run. A run
    the caller may not read carries its tenant alone.
  required: [tenant]
  properties:
    tenant:
      type: string
      description: The tenant that holds the run.
    jobPath:
      type: string
      description: The run's job path, qualified with its tenant folder.
    runId:
      type: string
      format: uuid
      description: The run's identifier. Absent when no run matched.
    buildNumber:
      type: integer
      format: int64
      description: The build number of the run.
    status:
      type: string
      description: The run's status. Absent on an upstream link.
    result:
      type: string
      description: The run's result, when it has one. Absent on an upstream link.
  additionalProperties: false

RunLinkPage:
  type: object
  description: One page of the runs a run started, newest first.
  required: [items]
  properties:
    items:
      type: array
      description: The runs on this page. Never null.
      items:
        $ref: '#/RunLink'
    nextCursor:
      type: string
      description: The cursor of the next page. Absent on the last page.
  additionalProperties: false

RunCommandRefusal:
  type: object
  description: >
    The newest cancel or input answer the Jenkins plugin refused for this
    run, on GET /runs/{run}. The field is absent when no such refusal
    exists. A later successful command does not remove it. The notice
    carries its own time, so a reader compares it with the run state.
  required: [command, refusedAt]
  properties:
    command:
      type: string
      enum: [cancel, proceed_input, abort_input]
      description: The refused command.
    actor:
      type: string
      description: The person or service that sent the command.
    httpStatus:
      type: integer
      description: The HTTP status the plugin answered.
    error:
      type: string
      description: >
        The refusal text. The mite keeps the title of a Jenkins error
        page, and the gateway cuts the text at 512 characters.
    refusedAt:
      type: string
      format: date-time
      description: The time the gateway received the refusal.
  additionalProperties: false

RunDetailTestReport:
  type: object
  description: >
    The run's stored test report, on GET /runs/{run}. The field is absent
    when the run holds no stored report. sizeBytes and caseCount are
    always present, and zero is a valid value.
  required: [blobKey, sizeBytes, caseCount]
  properties:
    blobKey:
      type: string
      description: >
        The blob key of the archived report file. The value is empty when
        Jenkins stored the file locally.
    sizeBytes:
      type: integer
      format: int64
      description: The length of the report file in bytes.
    caseCount:
      type: integer
      format: int32
      description: >
        The number of cases the report file holds. The file holds every
        case, including a passed case.
  additionalProperties: false

RunArtifact:
  type: object
  required: [path, sizeBytes, downloadable]
  properties:
    path:
      type: string
    sizeBytes:
      type: integer
      format: int64
    digest:
      type: string
    contentType:
      type: string
    downloadable:
      type: boolean
      description: >
        False when the stored blob key is empty (local artifact mode);
        the download path then answers 409.
  additionalProperties: false

RunArtifactListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/RunArtifact'
  additionalProperties: false

RunTestSuite:
  type: object
  required: [suite, total, failed, skipped]
  properties:
    suite:
      type: string
    total:
      type: integer
    failed:
      type: integer
    skipped:
      type: integer
    durationMs:
      type: integer
      format: int64
  additionalProperties: false

RunTestCase:
  type: object
  description: >
    One stored test case of a run. The record store holds only failed
    and skipped cases, at most 500 for each run.
  required: [suite, className, name, status, caseKey]
  properties:
    suite:
      type: string
    className:
      type: string
    name:
      type: string
    status:
      type: string
      description: >
        The reporter's own status name, for example FAILED or REGRESSION.
        A skipped case carries SKIPPED.
    durationMs:
      type: integer
      format: int64
      description: The case's duration in milliseconds. Absent when the value is zero.
    errorDetails:
      type: string
      description: >
        The case's error detail text, cut at 512 bytes. Absent when the
        case carries no error detail.
    caseKey:
      type: string
      description: >
        The opaque case key the server makes from the class name and the
        test name. Do not parse it. Percent-encode the whole key as one
        path segment before you use it as {case} on
        GET /pipelines/{team}/jobs/{job}/tests/{case}.
  additionalProperties: false

RunTestReport:
  type: object
  description: >
    The run's archived test report, on GET /runs/{run}/tests. The field
    is absent when the run holds no stored report. sizeBytes and
    caseCount are always present, and zero is a valid value.
  required: [path, sizeBytes, caseCount, downloadable]
  properties:
    path:
      type: string
      description: >
        The archived path of the report file, always .varroa/tests.json.
        Download the file through GET /runs/{run}/artifacts/{path}.
    sizeBytes:
      type: integer
      format: int64
      description: The length of the report file in bytes.
    caseCount:
      type: integer
      format: int32
      description: >
        The number of cases the report file holds. The file holds every
        case, including a passed case.
    downloadable:
      type: boolean
      description: >
        False when the stored blob key is empty, because Jenkins stored
        the file locally. The download path then answers 409.
  additionalProperties: false

RunTestTotals:
  type: object
  description: >
    The run's aggregate test counters. Jenkins reports them. They count
    every suite, including a suite the items list omits.
  required: [total, failed, skipped]
  properties:
    total:
      type: integer
    failed:
      type: integer
    skipped:
      type: integer
  additionalProperties: false

RunTestListResponse:
  type: object
  description: >
    GET /runs/{run}/tests. items holds one row per suite, at most 500, the
    most failed suites first, then by suite name. items is empty when the
    run reported no suite. totals holds the run's aggregate counters, and
    it is absent when the run reported no test result. cases holds the
    run's stored failed and skipped cases, failed cases first. cases is
    always present, and an empty array is a valid value.
  required: [items, cases]
  properties:
    items:
      type: array
      items:
        $ref: '#/RunTestSuite'
    totals:
      $ref: '#/RunTestTotals'
    cases:
      type: array
      items:
        $ref: '#/RunTestCase'
    report:
      $ref: '#/RunTestReport'
  additionalProperties: false

RunRestart:
  type: object
  description: >
    GET /runs/{run}/restart. Whether a completed declarative run restarts
    from a stage. The stages list is always present, and it is empty when
    the run does not restart.
  required: [restartable, stages]
  properties:
    restartable:
      type: boolean
    reason:
      type: string
      description: >
        Why the run does not restart. The field is absent when restartable
        is true. The value is one of not-terminal, template-defined,
        not-recorded, not-declarative, disabled, unavailable,
        no-restartable-stage, or home-moved. The job moved and no restart
        copy is kept.
    stages:
      type: array
      description: The stages the restart can begin at, in run order.
      items:
        type: string
  additionalProperties: false

RestartRunRequest:
  type: object
  description: POST /runs/{run}/restart. The stage the restart begins at.
  required: [stage]
  additionalProperties: false
  properties:
    stage:
      type: string
      description: A stage name from the restart object of the run detail.

RunScript:
  type: object
  description: >
    GET /runs/{run}/script. The run's own Groovy script, read from the
    build record the run retains in the blob tier. Every field is always
    present. A run that does not replay answers an empty script and an
    empty loadedScripts object.
  required: [script, loadedScripts, definitionKind, replayable, reason]
  properties:
    script:
      type: string
      description: >
        The main script of the run's flow execution. The value is empty
        when replayable is false.
    loadedScripts:
      type: object
      description: >
        The library scripts the run loaded, as a map of name to script
        text. A caller cannot edit them, and a replay loads them again
        from their library. The object is empty when the run loaded no script or when
        replayable is false.
      additionalProperties:
        type: string
    definitionKind:
      type: string
      enum: [template, script]
      description: >
        template when the run's stored payload names a pipeline template
        or a marker file, and script otherwise.
    replayable:
      type: boolean
      description: True only when the run passes every eligibility rule.
    reason:
      type: string
      description: >
        The name of the first eligibility rule the run fails. The rules
        run in this order: not-terminal, template-defined,
        masked-parameter, no-replica, unreadable, not-sandbox, and
        script-too-large. A replayable run answers the empty string.
  additionalProperties: false

TestCaseOutcome:
  type: object
  description: >
    One outcome of one test case in one run of the job. A row names its
    own suite, because two suites can report one class and one name.
  required: [runId, suite, status, createdAt, runLink]
  properties:
    runId:
      type: string
    buildNumber:
      type: integer
      format: int64
    suite:
      type: string
    status:
      type: string
      description: >
        The reporter's own status name. A skipped case carries SKIPPED.
    durationMs:
      type: integer
      format: int64
      description: The case's duration in milliseconds. Absent when the case reports no duration.
    errorDetails:
      type: string
      description: >
        The case's error detail text, cut at 512 bytes. Absent when the
        case carries no error detail.
    createdAt:
      type: string
      format: date-time
      description: The creation time of the run.
    result:
      type: string
      description: The run's own result. Absent when the run holds no result.
    runLink:
      type: string
      description: >
        The run's own page path, /pipelines/{team}/{jobPath}/{runId}, the
        same link a fleet lock row carries.
  additionalProperties: false

TestCaseHistoryResponse:
  type: object
  description: >
    GET /pipelines/{team}/jobs/{job}/tests/{case}. items holds the case's
    recent outcomes, newest first, within the record store retention
    window. The response holds no rate, no trend, and no flake score.
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/TestCaseOutcome'
  additionalProperties: false

RunChange:
  type: object
  description: One SCM change entry, passed through from the run's changes column.
  additionalProperties: true

RunChangeListResponse:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/RunChange'
  additionalProperties: false

BreakGlassRequest:
  type: object
  description: Request body for a break-glass grant.
  required: [reason]
  properties:
    reason:
      type: string
      description: Required. At most 256 characters. Recorded on the audit event.
      maxLength: 256
    ttlSeconds:
      type: integer
      description: Token lifetime in seconds. Defaults to 900. Must be between 300 and 3600.
      minimum: 300
      maximum: 3600
  additionalProperties: false

BreakGlassTarget:
  type: object
  description: The in-cluster Service a break-glass token reaches.
  required: [service, namespace, port]
  properties:
    service:
      type: string
    namespace:
      type: string
    port:
      type: integer
  additionalProperties: false

BreakGlassResponse:
  type: object
  description: A granted break-glass session.
  required: [token, expiresAt, target, locationUrl]
  properties:
    token:
      type: string
      description: A short-lived Jenkins user token minted for the caller's own identity.
    expiresAt:
      type: string
      format: date-time
    target:
      $ref: '#/BreakGlassTarget'
    locationUrl:
      type: string
      description: The location URL of a headless controller, with a trailing slash. This is the dashboard door URL when the operator has a dashboard origin, and the in-cluster Service URL otherwise.
  additionalProperties: false

JenkinsLink:
  type: object
  description: The Varroa page that a Jenkins item path resolves to.
  required: [link]
  properties:
    link:
      type: string
      description: A dashboard path, such as /pipelines/team/job/runId.
  additionalProperties: false

CellPoolSpec:
  type: object
  description: >-
    A CellPool's configuration (spec.*). profileRef is immutable, because a
    pool's cells carry the profile label they were created with.
  required: [profileRef]
  properties:
    profileRef:
      type: string
      minLength: 1
      description: The JenkinsVersionProfile the pool's cells run. Immutable.
    warm:
      type: integer
      format: int32
      minimum: 0
      description: Target count of free cells the pool keeps ready.
    maxCells:
      type: integer
      format: int32
      minimum: 0
      description: >-
        Cap on the pool's cells, placed cells included. 0 means unlimited.
    maxTenantsPerCell:
      type: integer
      format: int32
      minimum: 1
      description: >-
        Capacity a pool cell uses when its own spec.cell.maxTenants is zero.
    maxRunsPerTenant:
      type: integer
      format: int32
      minimum: 0
      maximum: 10000
      description: >-
        Cap on the builds one tenant runs at once on one cell of the pool.
        Zero means no cap. Set it on the CellPool object, not through the
        scale API.
    unreadyGracePeriod:
      type: string
      description: >-
        How long a pool cell may stay unready before the operator rolls its
        pod. A Go duration string.
    cellTemplate:
      type: object
      description: >-
        resources, miteResources, and podOverrides for the cells the pool
        creates. resources and podOverrides go to the Jenkins container and
        the pod; miteResources goes to the mite sidecar. The pool exposes no
        raw strategic-merge overlay.
      additionalProperties: true
    libraries:
      type: array
      maxItems: 16
      description: >-
        Trusted shared libraries that every cell of the pool serves as global
        libraries. Names are unique.
      items:
        $ref: '#/CellPoolLibrary'
    approvedSignatures:
      type: array
      maxItems: 256
      uniqueItems: true
      description: >-
        Script-security signatures that every cell of the pool approves. A
        cell renders this list with its own bundle list, sorted. Read-only
        through the API; edit the CellPool with kubectl or GitOps.
      items:
        type: string
        maxLength: 1024
        pattern: '^(method|staticMethod|new|field|staticField) \S.*$'
    mail:
      $ref: '#/CellPoolMail'
    giteaServers:
      type: array
      maxItems: 16
      description: >-
        Gitea and Forgejo servers that every cell of the pool declares. Each
        server has hooks off and no credential. Read-only through the API;
        edit the CellPool with kubectl or GitOps. Server URLs are unique.
      items:
        $ref: '#/CellPoolGiteaServer'
  additionalProperties: false

CellPoolGiteaServer:
  type: object
  description: >-
    One Gitea or Forgejo server of a pool. The operator renders it with
    manageHooks false and no credential.
  required: [serverUrl]
  properties:
    serverUrl:
      type: string
      minLength: 8
      maxLength: 2048
      description: The base URL of the forge.
    displayName:
      type: string
      maxLength: 100
      description: >-
        The server name in Jenkins. Unset means the plugin derives it from
        the URL.
    aliasUrl:
      type: string
      maxLength: 2048
      description: >-
        The URL the forge reports in webhook payloads, when it differs from
        serverUrl.
  additionalProperties: false

CellPoolMail:
  type: object
  description: >-
    The SMTP setting of a pool. Every cell of the pool renders it for the
    mailer and email-ext plugins. Read-only through the API; edit the CellPool
    with kubectl or GitOps. The read carries the login Secret name, never its
    value.
  required: [host, from]
  properties:
    host:
      type: string
      minLength: 1
      maxLength: 253
      description: The SMTP server name.
    port:
      type: integer
      format: int32
      minimum: 1
      maximum: 65535
      description: The SMTP server port. Unset means 587.
    security:
      type: string
      enum: [none, starttls, tls]
      description: The transport mode. Unset means starttls.
    from:
      type: string
      maxLength: 254
      description: The sender address of every message.
    replyTo:
      type: string
      maxLength: 254
      description: The reply-to address of every message.
    defaultSuffix:
      type: string
      maxLength: 254
      description: The domain that a bare recipient name gets.
    credentialRef:
      type: string
      maxLength: 253
      description: >-
        The Secret in the operator namespace that holds the SMTP username and
        password. The name only; the value is never returned.
  additionalProperties: false

CellPoolLibrary:
  type: object
  description: >-
    A trusted shared library of a pool. Jenkins runs its code outside the
    script sandbox. Only the operator declares it.
  required: [name, remote, defaultVersion]
  properties:
    name:
      type: string
      maxLength: 63
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
      description: The library name. A pipeline loads the library by this name.
    remote:
      type: string
      maxLength: 2048
      description: The repository URL of the library. It must not hold a variable token.
    defaultVersion:
      type: string
      minLength: 1
      maxLength: 255
      description: The branch, tag, or commit a pipeline loads when it names no version.
    credentialRef:
      type: string
      maxLength: 253
      description: >-
        The name of the Secret in the operator namespace that holds the login.
        Required for an ssh remote.
    implicit:
      type: boolean
      description: Loads the library in every job of every cell in the pool.
    allowVersionOverride:
      type: boolean
      description: >-
        Lets a pipeline load another version of the library. Any user who can
        push to the library repository then runs trusted code on every cell.
  additionalProperties: false

CellPoolStatus:
  type: object
  description: A CellPool's reported cell and tenant counts.
  required: [warmCells, placedCells, unreadyCells, freeTenantSlots]
  properties:
    observedGeneration:
      type: integer
      format: int64
    warmCells:
      type: integer
      format: int32
      description: Owned cells that hold no tenant.
    placedCells:
      type: integer
      format: int32
      description: Owned cells that hold at least one tenant.
    unreadyCells:
      type: integer
      format: int32
      description: Owned cells whose CellReady condition is not True.
    freeTenantSlots:
      type: integer
      format: int32
      description: >-
        Spare capacity of the placed cells only. warmCells already reports
        the empty ones.
    tenants:
      type: array
      items:
        type: string
      description: Every tenant on the pool, sorted.
    conditions:
      type: array
      items:
        $ref: '#/CellPoolCondition'
  additionalProperties: false

CellPoolCondition:
  type: object
  description: >-
    Status condition for a CellPool. Type PoolReady, with exactly the
    reasons Ready, CellCapReached, ProfileMissing, RecordStoreUnsupported,
    BlobTierUnsupported, ArtifactSecretMissing, ArtifactPluginMissing, and
    SecretsMissing.
  required: [type, status]
  properties:
    type:
      type: string
    status:
      type: string
    lastTransitionTime:
      type: string
      description: ISO 8601 last transition time.
    reason:
      type: string
    message:
      type: string
    observedGeneration:
      type: integer
      format: int64
  additionalProperties: false

CellPool:
  type: object
  description: Full cell-pool object returned from get and list operations.
  required: [cluster, name, spec, status]
  properties:
    cluster:
      type: string
      description: The cluster that holds the pool. A pool name is unique inside one cluster only.
    name:
      type: string
    spec:
      $ref: '#/CellPoolSpec'
    status:
      $ref: '#/CellPoolStatus'
  additionalProperties: false

CellPoolScaleRequest:
  type: object
  description: >-
    Request body for PATCH /cellpools/{name}. It declares the four scale
    dials and nothing else, so the contract itself states that a structural
    edit is not an API operation.
  required: [spec]
  properties:
    spec:
      type: object
      properties:
        warm:
          type: integer
          format: int32
          minimum: 0
        maxCells:
          type: integer
          format: int32
          minimum: 0
        maxTenantsPerCell:
          type: integer
          format: int32
          minimum: 1
        unreadyGracePeriod:
          type: string
      additionalProperties: false
  additionalProperties: false

CellStatusProjection:
  type: object
  description: >-
    The controller detail's projection of status.cell. It declares twelve
    properties. It declares no rehydration property: the cell-controllers
    capability keeps that key inside the operator.
  properties:
    tenants:
      type: array
      items:
        type: string
    warm:
      type: boolean
    evacuate:
      type: boolean
      description: >-
        Operator-written state. No API accepts a write to it, so no surface
        offers an evacuate action.
    unreadySince:
      type: string
      format: date-time
    rolledAt:
      type: string
      format: date-time
    appliedTenants:
      type: array
      description: >-
        The tenant set of the last apply that passed. A tenant named in
        tenants and absent here is still rehydrating.
      items:
        type: string
    tenantWarnings:
      type: array
      items:
        $ref: '#/CellTenantWarning'
    instance:
      type: string
    previousInstance:
      type: string
    previousInstanceLastSeen:
      type: string
      format: date-time
    pendingSignatures:
      type: array
      description: >-
        The script signatures the sandbox refused in this cell and no
        operator approved. Carries at most 25 entries.
      items:
        $ref: '#/CellPendingSignature'
    pendingSignaturesTotal:
      type: integer
      description: The number of pending signatures. It can exceed the list length.
  additionalProperties: false

CellPendingSignature:
  type: object
  description: One script signature the sandbox refused in a cell.
  required: [signature]
  properties:
    signature:
      type: string
    dangerous:
      type: boolean
    requesters:
      type: array
      description: Up to three tenant jobs that hit this signature, newest first.
      items:
        $ref: '#/CellSignatureRequester'
  additionalProperties: false

CellSignatureRequester:
  type: object
  description: One tenant job that requested a refused script signature.
  required: [jobPath]
  properties:
    tenant:
      type: string
    jobPath:
      type: string
    buildNumber:
      type: integer
    runId:
      type: string
  additionalProperties: false

CellTenantWarning:
  type: object
  description: One non-blocking finding the reconciler recorded about a tenant.
  required: [tenant, reason, message]
  properties:
    tenant:
      type: string
    reason:
      type: string
    message:
      type: string
  additionalProperties: false

CellGrantSubject:
  type: object
  description: One subject of a grant.
  required: [kind, name]
  properties:
    kind:
      type: string
    name:
      type: string
  additionalProperties: false

CellGrant:
  type: object
  description: >-
    One grant that reaches a tenant. The jobs field is absent when the grant
    narrows nothing. An absent jobs and an empty jobs mean different things,
    so the field is never an empty array.
  required: [source, roleRef, subjects, verbs]
  properties:
    source:
      type: string
      enum: [teamMembership, tenantScopedBinding, clusterWideBinding]
    binding:
      type: string
      description: The VarroaRoleBinding name. Absent for the teamMembership source.
    roleRef:
      type: string
    subjects:
      type: array
      items:
        $ref: '#/CellGrantSubject'
    verbs:
      type: array
      description: The pipelines verbs of the grant's role, never the whole capability set.
      items:
        type: string
    jobs:
      type: array
      minItems: 1
      items:
        type: string
  additionalProperties: false

CellMemberRole:
  type: object
  description: >-
    One generated Jenkins member role of a tenant. The role holds the person
    checks of the acting-user routes for its subjects.
  required: [name, pattern, permissions, subjects]
  properties:
    name:
      type: string
    pattern:
      type: string
    binding:
      type: string
      description: The narrowing VarroaRoleBinding. Absent for the role on the whole folder subtree.
    permissions:
      type: array
      items:
        type: string
    subjects:
      type: array
      items:
        $ref: '#/CellGrantSubject'
  additionalProperties: false

CellTenantGrants:
  type: object
  description: >-
    Every grant that reaches one tenant of a cell, with the tenant's
    generated Jenkins item role and its generated member roles. The item role
    and its pattern come from the tenant name, so the read opens no
    JenkinsRole object.
  required: [tenant, itemRole, itemPattern, truncated, grants, memberRoles]
  properties:
    tenant:
      type: string
    itemRole:
      type: string
    itemPattern:
      type: string
    truncated:
      type: boolean
      description: True only when the 50-grant cap dropped a grant of this tenant.
    grants:
      type: array
      items:
        $ref: '#/CellGrant'
    memberRoles:
      type: array
      description: >-
        The generated Jenkins member roles of the tenant. Each subject with
        pipelines write gets the person checks of the acting-user routes. The
        list is never capped.
      items:
        $ref: '#/CellMemberRole'
  additionalProperties: false

CellGrants:
  type: object
  description: One entry for each tenant of a cell, naming the subjects that may build on it.
  required: [cluster, namespace, cell, tenants]
  properties:
    cluster:
      type: string
    namespace:
      type: string
    cell:
      type: string
    tenants:
      type: array
      items:
        $ref: '#/CellTenantGrants'
  additionalProperties: false

CellUsageCounts:
  type: object
  description: >-
    The four load counts of one tenant on a cell, or the same four summed
    over the cell. runningNow carries no time bound, so a build that runs
    longer than a day still counts. runsLast24h and failedLast24h count
    inside the fixed 24-hour window. jobs counts distinct job paths. A run
    whose result is TRIGGER_FAILED counts in no value.
  required: [runningNow, runsLast24h, failedLast24h, jobs]
  properties:
    runningNow:
      type: integer
      format: int64
    runsLast24h:
      type: integer
      format: int64
    failedLast24h:
      type: integer
      format: int64
    jobs:
      type: integer
      format: int64
  additionalProperties: false

CellTenantUsage:
  type: object
  description: One tenant on a cell, with that tenant's role and four counts.
  required: [tenant, placementGeneration, runningNow, runsLast24h, failedLast24h, jobs]
  properties:
    tenant:
      type: string
    role:
      type: string
      description: >-
        That tenant's role on this cell: "slot <n>" for an active member
        and "standby" for a standby. A standby holds the tenant folder and
        runs no build, so its running count is zero.
    agentNamespace:
      type: string
      description: >-
        The namespace that holds the tenant's build agents, as the
        tenant's own cluster last announced it. Absent when no
        announcement named one.
    placementGeneration:
      type: integer
      format: int64
      description: The generation of the tenant's placement row.
    runningNow:
      type: integer
      format: int64
    runsLast24h:
      type: integer
      format: int64
    failedLast24h:
      type: integer
      format: int64
    jobs:
      type: integer
      format: int64
  additionalProperties: false

CellUsage:
  type: object
  description: >-
    One cell's load, tenant by tenant. An absent optional field is absent
    from the object, never a null and never a zero: queueLength reads as
    zero only for an empty queue, and a cell in a remote cluster carries
    no queueLength at all.
  required: [cluster, namespace, name, windowStart, tenants, totals, maxTenants, freeSlots]
  properties:
    cluster:
      type: string
    namespace:
      type: string
    name:
      type: string
    windowStart:
      type: string
      format: date-time
      description: The start of the fixed 24-hour window the counts used.
    cellPool:
      type: string
      description: The cell's varroa.dev/cell-pool label. Absent while no label is set.
    profile:
      type: string
      description: The cell's varroa.dev/cell-profile label.
    jenkinsVersion:
      type: string
    jenkinsHealth:
      type: string
    queueLength:
      type: integer
      format: int64
      description: >-
        The Jenkins queue length from the latest mite heartbeat. Absent for
        a remote cluster and absent while no heartbeat has arrived.
    queueLengthAt:
      type: string
      format: date-time
      description: The heartbeat time the queue length came from.
    tenants:
      type: array
      items:
        $ref: '#/CellTenantUsage'
    totals:
      $ref: '#/CellUsageCounts'
    maxTenants:
      type: integer
      format: int32
      description: >-
        The effective tenant cap this surface resolves: the cell's own
        spec.cell.maxTenants when that value is not zero, else the chart
        value, else ten. It is never a minimum over the tiers.
    freeSlots:
      type: integer
      format: int32
      description: maxTenants minus the placed tenant count, never below zero.
  additionalProperties: false

TeamCell:
  type: object
  description: >-
    The tenant's own view of the cell that hosts it. For the state
    notCellHosted only state is present. For the state unplaced every
    field other than state, reason, and warning is absent. The body
    carries no other tenant's name, job path, run, or count.
  required: [state, canOpenCell]
  properties:
    state:
      type: string
      enum: [placed, moving, rehydrating, unplaced, notCellHosted]
    reason:
      type: string
      description: The Team's Placed condition reason, verbatim.
    cell:
      type: string
    namespace:
      type: string
    cluster:
      type: string
    cellPool:
      type: string
    profile:
      type: string
    jenkinsVersion:
      type: string
    freeSlots:
      type: integer
      format: int32
    queueLength:
      type: integer
      format: int64
    runningNow:
      type: integer
      format: int64
    runsLast24h:
      type: integer
      format: int64
    failedLast24h:
      type: integer
      format: int64
    jobs:
      type: integer
      format: int64
    otherTenantCount:
      type: integer
      format: int32
      description: >-
        The number of other tenants on the cell. It is a count, never a
        list.
    canOpenCell:
      type: boolean
      description: >-
        True when the caller also holds the controller read grant on the
        cell. The hint gates no other field of this body.
    members:
      type: array
      items:
        $ref: '#/TeamCellMember'
      description: >-
        One entry for each member of the tenant, ordered by role: active
        members by ascending slot first, then standbys by cell name. It is
        absent for unplaced and notCellHosted. Every other field of this
        body describes the tenant's slot 0.
    warning:
      $ref: '#/TeamCellWarning'
  additionalProperties: false

TeamCellWarning:
  type: object
  description: >-
    The Team's TenantWarnings condition, verbatim, while its status is
    True. It is absent otherwise.
  required: [reason, message]
  properties:
    reason:
      type: string
      description: >-
        The warning reason. One of ItemsHeld, ItemsApplyFailed,
        BundleKeysIgnored, PodTemplateSkipped, CredentialSkipped, or
        HibernationIgnored.
    message:
      type: string
      description: The warning message, which names the fault.
  additionalProperties: false

TeamCellMember:
  type: object
  description: >-
    One member of the tenant, with that member's own four load counts. The
    counts apply the same grant narrowing the top-level counts apply. No
    entry names another tenant.
  required: [cell, namespace, cluster, role, runningNow, runsLast24h, failedLast24h, jobs]
  properties:
    cell:
      type: string
    namespace:
      type: string
    cluster:
      type: string
    role:
      type: string
      description: >-
        "slot <n>" for an active member and "standby" for a standby.
    runningNow:
      type: integer
      format: int64
    runsLast24h:
      type: integer
      format: int64
    failedLast24h:
      type: integer
      format: int64
    jobs:
      type: integer
      format: int64
  additionalProperties: false

# Assistant schemas. The assistant routes are in paths/assistant.yaml.

AssistantError:
  type: object
  required: [error, code]
  description: An assistant refusal. The code names the cause, and error gives the text.
  properties:
    error:
      type: string
    code:
      type: string
      enum: [assistant_disabled, assistant_key_unavailable, assistant_off, assistant_busy, prompt_not_startable, kill_switch]
  additionalProperties: false

ProposePipelineRequest:
  type: object
  required: [repo]
  description: The repository to propose a first Jenkinsfile for.
  properties:
    repo:
      type: string
      maxLength: 2048
  additionalProperties: false

ProposePipelineResponse:
  type: object
  required: [sessionId, state, repo, forge, baseBranch, credentialId]
  description: The session that the proposal started, and the forge facts of the check.
  properties:
    sessionId:
      type: string
    state:
      type: string
    repo:
      type: string
    forge:
      type: string
      enum: [github, gitea]
    baseBranch:
      type: string
    credentialId:
      type: string
  additionalProperties: false

ProposePipelineError:
  type: object
  required: [error, code]
  description: A refusal of a proposal. The code names the cause, and error gives the text.
  properties:
    error:
      type: string
    code:
      type: string
      enum: [assistant_disabled, assistant_off, assistant_busy, kill_switch, repo_url_invalid, data_sharing_too_low, no_matching_credential, forge_unsupported, forge_auth_failed, forge_write_denied, forge_unreachable, jenkinsfile_exists, proposal_branch_exists, not_found, invalid_request, internal]
  additionalProperties: false

AssistantSessionContext:
  type: object
  description: The client context of a session. Each key names one object the session is about.
  properties:
    route: {type: string}
    team: {type: string}
    job: {type: string}
    run: {type: string}
    controller: {type: string}
    cell: {type: string}
  additionalProperties: false

AssistantSessionCreateRequest:
  type: object
  description: Send either message or prompt, never both.
  properties:
    context:
      $ref: '#/AssistantSessionContext'
    message: {type: string, maxLength: 8000}
    prompt: {type: string, description: 'The id of a fixed prompt, such as explain-failure.'}
    provider: {type: string}
    model: {type: string}
  additionalProperties: false

AssistantSession:
  type: object
  required: [id, kind, principal, cluster, state, context, keySource, dataSharing, promptTokens, completionTokens, steps, startedAt]
  properties:
    id: {type: string}
    kind: {type: string, enum: [assistant, team_agent]}
    principal: {type: string}
    team: {type: string}
    cluster: {type: string}
    trigger: {type: string}
    context: {type: object, additionalProperties: true}
    provider: {type: string}
    model: {type: string}
    keySource: {type: string, enum: [chart, user]}
    dataSharing: {type: string, enum: [none, metadata, logs]}
    state: {type: string, enum: [running, waiting_approval, completed, failed, cancelled, skipped, expired]}
    skipReason:
      type: string
      nullable: true
      enum: [budget_day, kill_switch, data_sharing_none, provider_unavailable]
    promptTokens: {type: integer, format: int64}
    completionTokens: {type: integer, format: int64}
    steps: {type: integer}
    startedAt: {type: string, format: date-time}
    endedAt: {type: string, format: date-time, nullable: true}

AssistantSessionList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/AssistantSession'
    nextCursor: {type: string}

AssistantApproval:
  type: object
  required: [id, sessionId, callId, tool, arguments, targetKind, state, requestedAt, expiresAt]
  properties:
    id: {type: string}
    sessionId: {type: string}
    callId: {type: string}
    tool: {type: string}
    arguments: {type: object, additionalProperties: true}
    targetKind: {type: string}
    targetRef: {type: string}
    state: {type: string, enum: [pending, approved, denied, expired]}
    requestedAt: {type: string, format: date-time}
    expiresAt: {type: string, format: date-time}
    resolvedBy: {type: string}
    resolvedAt: {type: string, format: date-time, nullable: true}
    reason: {type: string}
    result:
      type: string
      nullable: true

AssistantApprovalList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/AssistantApproval'
    nextCursor: {type: string}

AssistantSessionDetail:
  type: object
  required: [session, approvals]
  properties:
    session:
      $ref: '#/AssistantSession'
    approvals:
      type: array
      items:
        $ref: '#/AssistantApproval'

AssistantMessageRequest:
  type: object
  required: [message]
  properties:
    message: {type: string, minLength: 1, maxLength: 8000}
  additionalProperties: false

AssistantAcceptedState:
  type: object
  required: [state]
  properties:
    state: {type: string}

AssistantDenyRequest:
  type: object
  properties:
    reason: {type: string, maxLength: 500}
  additionalProperties: false

AssistantApprovalOutcome:
  type: object
  required: [approval, result]
  properties:
    approval:
      $ref: '#/AssistantApproval'
    result:
      type: object
      required: [content, isError]
      properties:
        content: {type: string}
        isError: {type: boolean}

AssistantLimits:
  type: object
  properties:
    budgets:
      type: object
      properties:
        session: {type: integer, format: int64}
        userDay: {type: integer, format: int64}
        teamDay: {type: integer, format: int64}
        steps: {type: integer}
    externalDataSharing: {type: string}
    approvalExpiry: {type: string}
    egress:
      type: object
      additionalProperties: true

AssistantSettings:
  type: object
  required: [paused]
  properties:
    paused: {type: boolean}
    pausedBy: {type: string}
    pausedAt: {type: string, format: date-time, nullable: true}
    defaultProvider: {type: string}
    defaultModel: {type: string}
    tenantDataSharing:
      type: object
      additionalProperties: {type: string, enum: [none, metadata, logs]}
    updatedAt: {type: string, format: date-time}
    updatedBy: {type: string}
    limits:
      $ref: '#/AssistantLimits'

AssistantSettingsUpdate:
  type: object
  properties:
    paused: {type: boolean}
    defaultProvider: {type: string}
    defaultModel: {type: string}
    tenantDataSharing:
      type: object
      properties:
        set:
          type: object
          required: [tenant, level]
          properties:
            tenant: {type: string}
            level: {type: string, enum: [none, metadata, logs]}
        remove: {type: string}
  additionalProperties: false

AssistantProvider:
  type: object
  required: [name, kind, models, trust, default, available]
  properties:
    name: {type: string}
    kind: {type: string, enum: [anthropic, openai-compatible]}
    models:
      type: array
      items: {type: string}
    trust: {type: string, enum: [internal, external]}
    default: {type: boolean}
    available: {type: boolean}
    baseURL: {type: string, description: 'Shown to admins only.'}

AssistantProviderList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/AssistantProvider'

MyAssistant:
  type: object
  required: [available]
  properties:
    available: {type: boolean}
    enabled: {type: boolean}
    provider: {type: string}
    model: {type: string}
    dataSharing: {type: string, enum: [none, metadata, logs]}
    sessionKey:
      type: object
      nullable: true
      properties:
        provider: {type: string}
    effectiveLevels:
      type: object
      additionalProperties: {type: string, enum: [none, metadata, logs]}
    dayTokens: {type: integer, format: int64}
    dayBudget: {type: integer, format: int64}

MyAssistantUpdate:
  type: object
  properties:
    enabled: {type: boolean}
    provider: {type: string}
    model: {type: string}
    dataSharing: {type: string, enum: [none, metadata, logs]}
  additionalProperties: false

MyAssistantKeyRequest:
  type: object
  required: [provider, apiKey]
  properties:
    provider: {type: string}
    apiKey: {type: string, minLength: 1, writeOnly: true}
  additionalProperties: false

RunNote:
  type: object
  description: A note on one build, or on one job. A session note carries the session id.
  required: [id, runId, cluster, team, jobPath, principal, sessionId, body, createdAt]
  properties:
    id: {type: string, format: uuid}
    runId: {type: string, format: uuid, nullable: true}
    cluster: {type: string}
    team: {type: string}
    jobPath: {type: string}
    principal: {type: string}
    sessionId: {type: string, format: uuid, nullable: true}
    body: {type: string}
    createdAt: {type: string, format: date-time}
    buildNumber:
      type: integer
      format: int64
      nullable: true
      description: The build number of the note's run. Set on the job read only.
  additionalProperties: false

RunNoteList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/RunNote'
  additionalProperties: false

CreateRunNoteRequest:
  type: object
  description: Send exactly one of body and sessionId.
  properties:
    body: {type: string, maxLength: 16384}
    sessionId: {type: string, format: uuid}
  additionalProperties: false

RunNoteError:
  type: object
  required: [error, code]
  description: A note refusal. The code names the cause when one applies.
  properties:
    error: {type: string}
    code:
      type: string
      enum: [note_too_long, note_session_invalid]
  additionalProperties: false

TeamAgentSpec:
  type: object
  description: The desired state of one TeamAgent. The acceptance rule picks the one object of a Team that runs.
  required: [teamRef]
  properties:
    teamRef:
      type: object
      required: [name]
      properties:
        name: {type: string}
    enabled: {type: boolean}
    provider: {type: string}
    model: {type: string}
    instructions:
      type: object
      required: [source]
      properties:
        source: {type: string}
        path: {type: string}
    triggers:
      type: array
      items:
        type: object
        required: [type]
        properties:
          type:
            type: string
            enum: [run.failed, run.interrupted, cron.missed, signature.refused, scan.failed, lock.held, placement.moved, manual]
          debounce: {type: string, description: "A Go duration, such as 10m."}
    unattendedWrites:
      type: array
      items: {type: string}
    outputs:
      type: object
      properties:
        notes: {type: boolean}
        issues:
          type: object
          required: [repo, forge]
          properties:
            repo: {type: string}
            forge: {type: string}
            labels:
              type: array
              items: {type: string}
        webhook: {type: boolean}
    budgets:
      type: object
      properties:
        session: {type: integer, format: int64}
        day: {type: integer, format: int64}
    dataSharing:
      type: string
      enum: [none, metadata, logs]

TeamAgentCondition:
  type: object
  required: [type, status, reason, lastTransitionTime]
  properties:
    type: {type: string}
    status: {type: string, enum: ["True", "False", "Unknown"]}
    reason: {type: string}
    message: {type: string}
    lastTransitionTime: {type: string, format: date-time}
    observedGeneration: {type: integer, format: int64}

TeamAgent:
  type: object
  required: [namespace, name, team, cluster, spec, status, accepted, pendingApprovals, spendToday, dayLimit]
  properties:
    namespace: {type: string}
    name: {type: string}
    team: {type: string}
    cluster: {type: string}
    spec:
      $ref: '#/TeamAgentSpec'
    status:
      type: object
      properties:
        conditions:
          type: array
          items:
            $ref: '#/TeamAgentCondition'
        instructionsSHA: {type: string}
        lastSession:
          type: object
          properties:
            id: {type: string}
            trigger: {type: string}
            state: {type: string}
            at: {type: string, format: date-time}
        spendToday: {type: integer, format: int64}
        observedGeneration: {type: integer, format: int64}
    accepted: {type: boolean}
    pendingApprovals: {type: integer}
    spendToday: {type: integer, format: int64}
    dayLimit: {type: integer, format: int64}

TeamAgentSession:
  type: object
  description: One Team agent session. It carries the AssistantSession fields and its pending approvals.
  allOf:
    - $ref: '#/AssistantSession'
    - type: object
      required: [pendingApprovals]
      properties:
        pendingApprovals:
          type: array
          items:
            $ref: '#/AssistantApproval'

TeamAgentSessionList:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/TeamAgentSession'
    nextCursor: {type: string}

TeamAgentCapability:
  type: object
  required: [name, description, kind]
  properties:
    name: {type: string}
    description: {type: string}
    kind:
      type: string
      description: The tool class read or write, or the output kind note, issue, or webhook on an output tool.

TeamAgentCapabilities:
  type: object
  required: [reads, writesByApproval, unattended, never]
  properties:
    reads:
      type: array
      items: {$ref: '#/TeamAgentCapability'}
    writesByApproval:
      type: array
      items: {$ref: '#/TeamAgentCapability'}
    unattended:
      type: array
      items: {$ref: '#/TeamAgentCapability'}
    never:
      type: array
      items: {$ref: '#/TeamAgentCapability'}

TeamAgentRunRequest:
  type: object
  properties:
    job: {type: string, description: A job path under the Team. Empty names the whole Team.}
    run: {type: string, description: A run id to note in the request.}

TeamAgentError:
  type: object
  required: [error, code]
  description: A Team agent refusal. The code names the cause, and error gives the text.
  properties:
    error: {type: string}
    code:
      type: string
      enum: [team_agent_session, not_accepted, disabled, manual_not_enabled, nothing_to_grant]
  additionalProperties: false

TeamAgentPaused:
  type: object
  required: [reason, message]
  properties:
    reason: {type: string}
    message: {type: string}

TeamAgentItem:
  type: object
  required: [namespace, name, team, cluster, enabled, sessionsToday, spendToday, failedToday, conditions, unattendedRequested, unattendedGranted]
  properties:
    namespace: {type: string}
    name: {type: string}
    team: {type: string}
    cluster: {type: string}
    enabled: {type: boolean}
    paused:
      nullable: true
      allOf:
        - $ref: '#/TeamAgentPaused'
    sessionsToday: {type: integer}
    spendToday: {type: integer, format: int64}
    failedToday: {type: integer}
    conditions:
      type: array
      description: The conditions whose status is not True.
      items:
        $ref: '#/TeamAgentCondition'
    unattendedRequested:
      type: array
      items: {type: string}
    unattendedGranted:
      type: array
      items: {type: string}

TeamAgentItemList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/TeamAgentItem'

TeamAgentUnattendedRequest:
  type: object
  required: [enabled]
  properties:
    enabled: {type: boolean}
  additionalProperties: false

TeamAgentUnattendedResult:
  type: object
  required: [namespace, name, enabled, unattendedGranted]
  properties:
    namespace: {type: string}
    name: {type: string}
    enabled: {type: boolean}
    unattendedGranted:
      type: array
      items: {type: string}
