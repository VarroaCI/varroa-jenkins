# pipelines - the landing-page tenant list, tenant-scoped job listing, job
# detail, and the run list/create.
/api/v1/pipelines:
  get:
    operationId: listPipelineTenants
    tags: [Pipelines]
    summary: Lists the pipelines Tenants the caller may read.
    description: >
      Answers each local Tenant that carries spec.pipelines, and each live
      record-store placement row of another cluster. A row of the local
      cluster, a row with no cell, and a row at placement generation 0
      are not listed. A name that a local Tenant holds lists only the local
      Tenant. One name placed on two other clusters lists one row for each
      cluster. It also answers each local Tenant without spec.pipelines
      whose spec.namespaces hold a controller the caller may read. The
      route has no gate of its own: the tenant read check
      drops each row the caller may not read, so a caller who can read
      no row gets an empty list. When the record store is off or its
      schema is too old, the list carries the local Tenants alone and
      recordStore is false.
    responses:
      "200":
        description: The pipelines Tenants the caller may read.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PipelineTenantList'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "500":
        $ref: '../components/responses.yaml#/Internal'

/api/v1/pipelines/{tenant}:
  get:
    operationId: listPipelines
    tags: [Pipelines]
    summary: Lists a tenant's pipelines and its unfinished runs.
    description: >
      Resolves {tenant} onto one or more record-store tenants, unions each
      tenant's job summaries with the catalog's declared jobs, and reads
      each tenant's unfinished runs for the Running now strip.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    responses:
      "200":
        description: The tenant's pipelines and running-now strip.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PipelineListResponse'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        description: The tenant name is ambiguous across clusters.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      "422":
        description: The tenant resolves to more tenants than the fan-out ceiling.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/jobs/{job}:
  get:
    operationId: getPipelineJob
    tags: [Pipelines]
    summary: Returns one job's summary, definition, triggers, parameters, and dependency edges.
    description: >
      dependencies.upstream and dependencies.downstream carry the job's
      cross-tenant varroa-upstream trigger edges (design D13), each
      marked granted or not. The route authorizes with CanReadPipeline,
      never a controller-scoped check, because a cell hosts many
      tenants.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
      - $ref: '../components/parameters.yaml#/job'
    responses:
      "200":
        description: The job's detail.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PipelineJobDetail'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/jobs/{job}/branches:
  get:
    operationId: listJobBranches
    tags: [Pipelines]
    summary: Lists the branches, change requests, and tags a multibranch job has discovered.
    description: >
      The inventory is exported by the cell that holds the job's home
      slot, so it can be up to ten minutes stale. A cell that is down or
      hibernated keeps its last export, and the response shows that last
      export. A job with no export yet answers an empty list with no
      observedAt. Each head is listed only when the caller may read its
      job path.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
      - $ref: '../components/parameters.yaml#/job'
    responses:
      "200":
        description: The job's branch and change-request inventory.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/JobBranchList'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/jobs/{job}/badge:
  get:
    operationId: getJobBadge
    tags: [Pipelines]
    summary: Reports whether the anonymous build badge of a job is on, and its URL path.
    description: >
      The badge door itself sits at the host root and is not part of this
      operation. The path in the answer is the host-root path of that door.
      The token in the path is the badge credential, so a caller that reads
      the job may copy the URL. The path is absent while the tenant's badge
      switch is off.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
      - $ref: '../components/parameters.yaml#/job'
    responses:
      "200":
        description: The badge state of the job.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/JobBadge'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/jobs/{job}/scan:
  post:
    operationId: scanMultibranch
    tags: [Pipelines]
    summary: Requests a scan of a multibranch job's branches and pull requests, or of an organization folder's repositories.
    description: >
      The job must be a multibranch job or an organization folder. The
      route answers 409 for any other job before it publishes the command.
      The command goes to the cell that holds the job's home slot. The
      route reports no outcome. The result arrives in lastScan of the
      branch inventory, within about one minute during the fifteen
      minutes after the request.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
      - $ref: '../components/parameters.yaml#/job'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ScanMultibranchRequest'
    responses:
      "202":
        description: The scan request was published. The state is requested.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/BranchScanResponse'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        $ref: '../components/responses.yaml#/Conflict'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/jobs/{job}/runs:
  get:
    operationId: listRuns
    tags: [Pipelines]
    summary: Lists a job's runs, filtered and paged across every tenant of the tenant.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
      - $ref: '../components/parameters.yaml#/job'
      - {name: branch, in: query, schema: {type: string}}
      - {name: result, in: query, schema: {type: string}}
      - {name: actor, in: query, schema: {type: string}}
      - {name: cause, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: cursor, in: query, schema: {type: string}}
    responses:
      "200":
        description: A page of the job's runs, newest first.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RunListResponse'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'
  post:
    operationId: createRun
    tags: [Pipelines]
    summary: Requests a new build. Fire and forget — the BFF does not claim the build number.
    description: >
      job may omit or repeat the tenant's folder segment; both forms
      resolve to the same job.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
      - $ref: '../components/parameters.yaml#/job'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreateRunRequest'
    responses:
      "202":
        description: The run was requested.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RunActionResponse'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        description: The job path lies in two or more tenants and no cluster value breaks the tie.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/jobs/{job}/tests/{case}:
  get:
    operationId: listJobTestCaseHistory
    tags: [Pipelines]
    summary: Lists the recent outcomes of one test case of a job, across every tenant of the tenant.
    description: >
      Resolves {tenant} onto one or more record-store tenants and applies
      the tenant read check to each, with the decoded job path. Reads the
      case history of each admitted tenant, merges the rows newest first,
      and cuts the list to limit. The history is keyed by class name and
      test name, so two suites that report one class and one name merge.
      A job that holds no stored case answers an empty items list. The
      read answers the record store retention window.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
      - $ref: '../components/parameters.yaml#/job'
      - $ref: '../components/parameters.yaml#/case'
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
    responses:
      "200":
        description: The case's recent outcomes, newest first.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TestCaseHistoryResponse'
      "400":
        description: The server cannot split or decode the case key.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        description: The tenant resolves no tenant, or the caller may not read any of its tenants.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/locks:
  get:
    operationId: listTenantFleetLocks
    tags: [Pipelines]
    summary: Lists the fleet locks a tenant's tenants own, hold, or wait on.
    description: >
      Resolves {tenant} onto one or more record-store tenants, applies the
      tenant read check to each, reads each tenant's locks, and merges the
      answers in lock name order, the holder before its waiters. Each row
      carries its own tenant and jobPath, whichever tenant it belongs to.
      A row carries
      runLink only when the caller's own grant can read that row's own
      run. A waiting row reports its own waitingSince. A held or a
      releasing row reports its own acquiredAt. It carries no queue
      position.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    responses:
      "200":
        description: The tenant's fleet locks, the holder of each name before its waiters.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FleetLockListResponse'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/markers/validate:
  post:
    operationId: validatePipelineMarker
    tags: [Pipelines]
    summary: Lints a marker file against the tenant's delivered pipeline templates.
    description: >
      Resolves {tenant} onto its delivered pipeline-template set (design
      pipeline-marker-file) and validates the posted marker text against
      it. Contacts no cell and no record store, so it works while a cell
      is down and while the record store is disabled.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PipelineMarkerValidateRequest'
    responses:
      "200":
        description: The lint findings. An empty list means the marker is valid.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PipelineMarkerValidateResponse'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/lint:
  post:
    operationId: lintJenkinsfile
    tags: [Pipelines]
    summary: Lints a Jenkinsfile on the tenant's cell.
    description: >
      Resolves {tenant} onto its slot-0 cell and sends the Jenkinsfile text
      to the cell's declarative linter. A member-placed tenant is linted by
      its member cluster's operator. The route writes no state and publishes
      no command. It never wakes a cell: a hibernated or stopped cell answers
      409. A cell-hosted tenant also
      runs the Varroa cell script rules, which report with source varroa.
      The linter checks declarative syntax only. A lint failure is data in
      a 200 answer, not a transport error.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/JenkinsfileLintRequest'
    responses:
      "200":
        description: The lint result. valid is true when errors is empty.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/JenkinsfileLintResponse'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        $ref: '../components/responses.yaml#/Conflict'
      "413":
        $ref: '../components/responses.yaml#/PayloadTooLarge'
      "502":
        $ref: '../components/responses.yaml#/BadGateway'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/cell:
  get:
    operationId: getTenantCell
    tags: [Pipelines]
    summary: Returns the tenant's own view of the cell that hosts it.
    description: >
      Reads the Tenant object first, so a pipelines tenant that waits for its
      first cell answers 200 with the state unplaced. The body carries
      this tenant's own counts and a neighbour count. It carries no other
      tenant's name, job path, run, or count. canOpenCell is a hint that
      gates no field: a caller the controller read check refuses still
      receives the whole body.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    responses:
      "200":
        description: The tenant's cell view.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TenantCell'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{tenant}/propose:
  post:
    operationId: proposePipeline
    tags: [Pipelines]
    summary: Starts an assistant session that proposes a first Jenkinsfile for a repository.
    description: >
      Checks the repository, then starts an assistant session with the fixed
      prompt propose-pipeline. The session reads the repository and asks for
      one approval before it opens a pull request. The checks run in this
      order, and nothing is written before the last one. Each refusal answers
      its code and creates no session.
      1. The assistant is on the server (503 assistant_disabled).
      2. The caller holds assistant use (403).
      3. The body is valid (400).
      4. The user's assistant switch is on (409 assistant_off).
      5. The Tenant is a pipelines tenant the caller reads (404), and the caller
         holds the tenant write check (403).
      6. The repo is an https URL on port 443 (400 repo_url_invalid).
      7. The data level of the tenant and provider shows read_repo_file
         (409 data_sharing_too_low).
      8. The operator finds a credential that reaches the forge and a
         Jenkinsfile and a proposal branch are absent (422, 409, 502, or 404
         by the code of the forge reply, 504 operator_timeout when the
         operator does not answer in time, or 503 operator_unavailable when
         no operator receives the check).
      9. The assistant is not busy (429 assistant_busy).
      Codes from the forge check: no_matching_credential, forge_unsupported,
      forge_auth_failed, forge_write_denied (422); jenkinsfile_exists and
      proposal_branch_exists (409); not_found (404); forge_unreachable (502);
      operator_timeout (504); operator_unavailable (503).
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/ProposePipelineRequest'
    responses:
      "201":
        description: The session started. The state is running, waiting_approval, or skipped.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ProposePipelineResponse'
      "400":
        description: A bad body, or a repo_url_invalid, invalid_request, or forge code of a bad request.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ProposePipelineError'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        description: The assistant is off, the data level hides read_repo_file, or the forge found a Jenkinsfile or a proposal branch.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ProposePipelineError'
      "422":
        description: No credential reaches the forge, or the credential may not write.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ProposePipelineError'
      "429":
        description: The user has too many running sessions (assistant_busy).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ProposePipelineError'
      "502":
        description: The forge did not answer, or the forge relay failed (forge_unreachable).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ProposePipelineError'
      "503":
        description: The assistant is disabled, its kill switch is set, or no operator received the forge check (operator_unavailable).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ProposePipelineError'
      "504":
        description: The operator did not answer in time (operator_timeout).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/ProposePipelineError'

/api/v1/pipelines/{tenant}/stream:
  get:
    operationId: streamTenantRuns
    tags: [Pipelines]
    summary: Streams live run notifications for one tenant via Server-Sent Events.
    description: >
      Streams one frame per live run notification, with the event name run,
      stage, lock, input, or wait and the notification body as data. The stream writes no
      initial frame and replays nothing, so a page refetches its own reads
      when the stream reports itself open. It uses `?ticket=` for browser
      EventSource auth, and the ticket carries the scope pipelines:{tenant}.
    x-sse: true
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    responses:
      "200":
        description: The event stream (event kinds run, stage, lock, input, and wait).
        content:
          text/event-stream:
            schema:
              type: string
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'
