# pipelines - team-scoped job listing, job detail, and the run list/create.
/api/v1/pipelines/{team}:
  get:
    operationId: listPipelines
    tags: [Pipelines]
    summary: Lists a team's pipelines and its unfinished runs.
    description: >
      Resolves {team} onto one or more record-store tenants, unions each
      tenant's job summaries with the catalog's declared jobs, and reads
      each tenant's unfinished runs for the Running now strip.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
    responses:
      "200":
        description: The team's pipelines and running-now strip.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PipelineListResponse'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        description: The team name is ambiguous across clusters.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      "422":
        description: The team resolves to more tenants than the fan-out ceiling.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{team}/jobs/{job}:
  get:
    operationId: getPipelineJob
    tags: [Pipelines]
    summary: Returns one job's summary, definition, triggers, parameters, and dependency edges.
    description: >
      dependencies.upstream and dependencies.downstream carry the job's
      cross-tenant varroa-upstream trigger edges (design D13), each
      marked granted or not. The route authorizes with CanReadPipeline,
      never a controller-scoped check, because a cell hosts many
      tenants.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
      - $ref: '../components/parameters.yaml#/job'
    responses:
      "200":
        description: The job's detail.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PipelineJobDetail'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{team}/jobs/{job}/runs:
  get:
    operationId: listRuns
    tags: [Pipelines]
    summary: Lists a job's runs, filtered and paged across every tenant of the team.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
      - $ref: '../components/parameters.yaml#/job'
      - {name: branch, in: query, schema: {type: string}}
      - {name: result, in: query, schema: {type: string}}
      - {name: actor, in: query, schema: {type: string}}
      - {name: cause, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
      - {name: cursor, in: query, schema: {type: string}}
    responses:
      "200":
        description: A page of the job's runs, newest first.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RunListResponse'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'
  post:
    operationId: createRun
    tags: [Pipelines]
    summary: Requests a new build. Fire and forget — the BFF does not claim the build number.
    description: >
      job may omit or repeat the tenant's folder segment; both forms
      resolve to the same job.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
      - $ref: '../components/parameters.yaml#/job'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/CreateRunRequest'
    responses:
      "202":
        description: The run was requested.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/RunActionResponse'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        description: The job path lies in two or more tenants and no cluster value breaks the tie.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{team}/locks:
  get:
    operationId: listTeamFleetLocks
    tags: [Pipelines]
    summary: Lists the fleet locks a team's tenants own, hold, or wait on.
    description: >
      Resolves {team} onto one or more record-store tenants, applies the
      tenant read check to each, reads each tenant's locks, and merges the
      answers by (name, waitingSince, runId). Each row carries its own
      tenant and jobPath, whichever tenant it belongs to. A row carries
      runLink only when the caller's own grant can read that row's own
      run. A row reports its own state and its own waitingSince or
      acquiredAt. It carries no queue position.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
    responses:
      "200":
        description: The team's fleet locks, in (name, waitingSince, runId) order.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FleetLockListResponse'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{team}/markers/validate:
  post:
    operationId: validatePipelineMarker
    tags: [Pipelines]
    summary: Lints a marker file against the team's delivered pipeline templates.
    description: >
      Resolves {team} onto its delivered pipeline-template set (design
      pipeline-marker-file) and validates the posted marker text against
      it. Contacts no cell and no record store, so it works while a cell
      is down and while the record store is disabled.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/PipelineMarkerValidateRequest'
    responses:
      "200":
        description: The lint findings. An empty list means the marker is valid.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/PipelineMarkerValidateResponse'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{team}/cell:
  get:
    operationId: getTeamCell
    tags: [Pipelines]
    summary: Returns the tenant's own view of the cell that hosts it.
    description: >
      Reads the Team object first, so a pipelines team that waits for its
      first cell answers 200 with the state unplaced. The body carries
      this tenant's own counts and a neighbour count. It carries no other
      tenant's name, job path, run, or count. canOpenCell is a hint that
      gates no field: a caller the controller read check refuses still
      receives the whole body.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
    responses:
      "200":
        description: The tenant's cell view.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TeamCell'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/pipelines/{team}/stream:
  get:
    operationId: streamTeamRuns
    tags: [Pipelines]
    summary: Streams live run notifications for one team via Server-Sent Events.
    description: >
      Streams one frame per live run notification, with the event name run
      or stage and the notification body as data. The stream writes no
      initial frame and replays nothing, so a page refetches its own reads
      when the stream reports itself open. It uses `?ticket=` for browser
      EventSource auth, and the ticket carries the scope pipelines:{team}.
    x-sse: true
    parameters:
      - $ref: '../components/parameters.yaml#/team'
    responses:
      "200":
        description: The event stream (event kinds run and stage).
        content:
          text/event-stream:
            schema:
              type: string
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'
