# locks: the fleet-wide read over the record store's varroa.fleet_locks
# table. The route is cluster-wide, like /cellpools: it names no team and no
# namespace segment. It is read-only, so it carries no POST and no DELETE.
/api/v1/locks:
  get:
    operationId: listAllFleetLocks
    tags: [Pipelines]
    summary: >-
      Lists every fleet lock of one cluster, across every tenant. Requires
      the fleetlocks:read verb on a cluster-wide binding.
    description: >
      Reads the cluster the optional cluster query parameter names, and the
      BFF's own local cluster when the parameter is absent. Each row
      carries its own tenant and jobPath, whichever tenant it belongs to. A
      row carries runLink only when the caller's own grant can read that
      row's own run. A waiting row reports its own waitingSince. A held or
      a releasing row reports its own acquiredAt. It carries no queue
      position and no derived holder.
    parameters:
      - $ref: '../components/parameters.yaml#/clusterQuery'
    responses:
      "200":
        description: Every fleet lock of the cluster (items envelope).
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/FleetLockListResponse'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'
