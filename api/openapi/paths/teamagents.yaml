# teamagents: the Team agent view of a pipelines tenant, its sessions, its
# capabilities, a manual run request, and the cluster-wide list with the
# unattended grant. The routes answer the tenant read check or write check
# on {team}, except /agents, which needs agentsessions:read.

/api/v1/pipelines/{team}/agent:
  get:
    operationId: getTeamAgent
    tags: [TeamAgents]
    summary: Returns the accepted Team agent of a pipelines tenant.
    description: >
      Answers the TeamAgent object that the acceptance rule selects for the
      Team, its status, the pending approval count of its sessions, and the
      spend of the current UTC day against the day limit. Answers 404 when
      the Team has no accepted TeamAgent or the caller may not read the Team.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
    responses:
      "200":
        description: The accepted Team agent.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TeamAgent'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'

/api/v1/pipelines/{team}/agent/sessions:
  get:
    operationId: listTeamAgentSessions
    tags: [TeamAgents]
    summary: Lists the Team agent sessions of a pipelines tenant, newest first.
    description: >
      Pages the sessions of kind team_agent for the Team. Each item carries
      its pending approvals. The Approvals tab reads state
      waiting_approval.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum: [running, waiting_approval, completed, failed, cancelled, skipped, expired]
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
    responses:
      "200":
        description: One page of Team agent sessions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TeamAgentSessionList'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        description: The assistant is off.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AssistantError'

/api/v1/pipelines/{team}/agent/capabilities:
  get:
    operationId: getTeamAgentCapabilities
    tags: [TeamAgents]
    summary: Lists what the Team agent may do, in four groups.
    description: >
      The groups are reads, writesByApproval, unattended, and never. The
      lists hold only the tools the object's data level and grant make
      visible. Hidden tools are absent.
    parameters:
      - $ref: '../components/parameters.yaml#/team'
    responses:
      "200":
        description: The four capability groups.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TeamAgentCapabilities'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        description: The assistant is off.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AssistantError'

/api/v1/pipelines/{team}/agent/run:
  post:
    operationId: runTeamAgent
    tags: [TeamAgents]
    summary: Requests a manual Team agent run.
    description: >
      Publishes a teamagent.run_requested activity for the placement cluster
      of the Team. The run starts later, on the runner. A kill switch or a
      spent day budget still answers 202, and the session ends skipped.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TeamAgentRunRequest'
    parameters:
      - $ref: '../components/parameters.yaml#/team'
    responses:
      "202":
        description: The run request is published.
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [requested]}
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        description: The Team agent cannot run now.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TeamAgentError'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/agents:
  get:
    operationId: listAgents
    tags: [TeamAgents]
    summary: Lists every TeamAgent with its state, spend, and unattended grant.
    description: The cluster-wide view. It needs agentsessions:read.
    responses:
      "200":
        description: Every TeamAgent.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TeamAgentItemList'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'

/api/v1/agents/{namespace}/{name}/unattended:
  put:
    operationId: putAgentUnattended
    tags: [TeamAgents]
    summary: Grants or revokes the unattended writes of one TeamAgent.
    description: >
      A true grant copies the object's current unattendedWrites, pinned to
      its UID. A later spec edit does not extend the grant. It needs
      teamagents:unattended.
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TeamAgentUnattendedRequest'
    responses:
      "200":
        description: The grant after the change.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TeamAgentUnattendedResult'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        description: Nothing can be granted, because the object names no unattended writes.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TeamAgentError'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'
