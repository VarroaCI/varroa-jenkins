# auth & session — authentication, login, logout, user profile.
/api/v1/auth-config:
  get:
    operationId: getAuthConfig
    tags: [auth]
    summary: Returns the configured authentication mode.
    security: []
    responses:
      "200":
        description: Auth mode.
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [local, ldap, oidc]
              additionalProperties: false

/api/v1/login:
  post:
    operationId: login
    tags: [auth]
    summary: Authenticate with username/password. Returns a JWT and sets a secure cookie.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/LoginRequest'
    responses:
      "200":
        description: Successful login — returns id_token and expires_in.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/LoginResponse'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "429":
        description: Rate-limited — too many login attempts.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Error'
      "501":
        $ref: '../components/responses.yaml#/MethodNotAllowed'

/api/v1/auth/login:
  get:
    operationId: authLogin
    tags: [auth]
    summary: Initiate OIDC authorization flow. Sets signed state cookie and redirects to provider.
    description: >
      Sets a signed HttpOnly oidc_state cookie containing nonce and return path,
      then redirects to the provider. Consumes the interactive_login marker when
      present and adds prompt=login&max_age=0.
    security: []
    parameters:
      - name: return
        in: query
        schema:
          type: string
        description: Optional normalized return path (default /).
    responses:
      "302":
        description: Redirect to OIDC provider authorization URL.
      "501":
        $ref: '../components/responses.yaml#/MethodNotAllowed'

/api/v1/callback:
  get:
    operationId: authCallback
    tags: [auth]
    summary: OIDC provider callback endpoint.
    description: >
      Validates the signed oidc_state cookie (signature, nonce, expiry), exchanges
      the authorization code for tokens, sets the varroa_token session cookie,
      and renders server-side progress HTML.
    security: []
    parameters:
      - name: code
        in: query
        schema:
          type: string
        description: Authorization code from OIDC provider.
      - name: state
        in: query
        schema:
          type: string
        description: OAuth state nonce echoed back from provider.
      - name: error
        in: query
        schema:
          type: string
        description: OIDC error returned by the provider (e.g. access_denied).
    responses:
      "200":
        description: Login progress page with server-side redirect.
        content:
          text/html: {}
      "302":
        description: Redirect to /login when state validation fails or provider error.
      "400":
        description: Missing required parameters.
      "500":
        description: Token exchange or validation failed.
      "501":
        $ref: '../components/responses.yaml#/MethodNotAllowed'

/api/v1/logout:
  post:
    operationId: logout
    tags: [auth]
    summary: Logs out the current session. Clears cookie, sets interactive marker, returns JSON redirect.
    description: >
      Clears the varroa_token cookie, sets a five-minute interactive_login marker
      (Path=/api/v1/auth), and returns JSON {"redirect":"..."} with no Location header.
      In OIDC mode, when the provider supports RP-initiated logout, the redirect URL
      includes id_token_hint and post_logout_redirect_uri.
    responses:
      "200":
        description: Logged out successfully. JSON redirect only.
        content:
          application/json:
            schema:
              type: object
              required: [redirect]
              properties:
                redirect:
                  type: string
              additionalProperties: false
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'

/api/v1/me:
  get:
    operationId: getMe
    tags: [auth]
    summary: Returns the current user's profile, enriched from User CRD.
    description: >
      Also accepts the `varroa_token` cookie when no bearer token is
      present (browser path).
    responses:
      "200":
        description: Current user profile.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Me'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'

/api/v1/me/preferences:
  put:
    operationId: updateMyPreferences
    tags: [auth]
    summary: Updates the current user's UI preferences.
    description: CLI-excluded — browser-only feature.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/Preferences'
    responses:
      "200":
        description: Echo of the saved preferences.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/Preferences'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'

/api/v1/me/password:
  put:
    operationId: changeMyPassword
    tags: [auth]
    summary: Changes the current user's password (local auth only).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [oldPassword, newPassword]
            properties:
              oldPassword:
                type: string
              newPassword:
                type: string
            additionalProperties: false
    responses:
      "200":
        description: Password changed.
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
              additionalProperties: false
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "501":
        $ref: '../components/responses.yaml#/MethodNotAllowed'

/api/v1/me/permissions:
  get:
    operationId: getMyPermissions
    tags: [auth]
    summary: Returns the current user's effective permissions.
    responses:
      "200":
        description: Effective capabilities (Authorizer.EffectivePermissions DTO).
        content:
          application/json:
            schema:
              type: object
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
