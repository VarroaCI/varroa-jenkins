# RBAC — VarroaRole/VarroaRoleBinding stay core-only (flat paths).
# JenkinsRole/JenkinsRoleBinding move under /clusters/{cluster}/.
/api/v1/roles:
  get:
    operationId: listVarroaRoles
    tags: [rbac]
    summary: Lists VarroaRoles.
    responses:
      "200":
        description: VarroaRole list (N6 envelope).
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: '../components/schemas.yaml#/VarroaRole'
              additionalProperties: false
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
  post:
    operationId: createVarroaRole
    tags: [rbac]
    summary: Creates a VarroaRole.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/VarroaRole'
    responses:
      "201":
        description: VarroaRole created.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/VarroaRole'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'

/api/v1/roles/{name}:
  get:
    operationId: getVarroaRole
    tags: [rbac]
    summary: Gets a VarroaRole.
    parameters:
      - $ref: '../components/parameters.yaml#/name'
    responses:
      "200":
        description: VarroaRole detail.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/VarroaRole'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
  put:
    operationId: updateVarroaRole
    tags: [rbac]
    summary: Updates a VarroaRole.
    parameters:
      - $ref: '../components/parameters.yaml#/name'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/VarroaRole'
    responses:
      "200":
        description: VarroaRole updated.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/VarroaRole'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
  delete:
    operationId: deleteVarroaRole
    tags: [rbac]
    summary: Deletes a VarroaRole.
    parameters:
      - $ref: '../components/parameters.yaml#/name'
    responses:
      "204":
        description: VarroaRole deleted.
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'

