# tenantagents: the Tenant agent view of a pipelines tenant, its sessions, its
# capabilities, a manual run request, and the cluster-wide list with the
# unattended grant. The routes answer the tenant read check or write check
# on {tenant}, except /agents, which needs agentsessions:read.

/api/v1/pipelines/{tenant}/agent:
  get:
    operationId: getTenantAgent
    tags: [TenantAgents]
    summary: Returns the accepted Tenant agent of a pipelines tenant.
    description: >
      Answers the TenantAgent object that the acceptance rule selects for the
      Tenant, its status, the pending approval count of its sessions, and the
      spend of the current UTC day against the day limit. Answers 404 when
      the Tenant has no accepted TenantAgent or the caller may not read the Tenant.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    responses:
      "200":
        description: The accepted Tenant agent.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TenantAgent'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'

/api/v1/pipelines/{tenant}/agent/sessions:
  get:
    operationId: listTenantAgentSessions
    tags: [TenantAgents]
    summary: Lists the Tenant agent sessions of a pipelines tenant, newest first.
    description: >
      Pages the sessions of kind tenant_agent for the Tenant. Each item carries
      its pending approvals. The Approvals tab reads state
      waiting_approval.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
      - name: state
        in: query
        required: false
        schema:
          type: string
          enum: [running, waiting_approval, completed, failed, cancelled, skipped, expired]
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
    responses:
      "200":
        description: One page of Tenant agent sessions.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TenantAgentSessionList'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        description: The assistant is off.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AssistantError'

/api/v1/pipelines/{tenant}/agent/capabilities:
  get:
    operationId: getTenantAgentCapabilities
    tags: [TenantAgents]
    summary: Lists what the Tenant agent may do, in four groups.
    description: >
      The groups are reads, writesByApproval, unattended, and never. The
      lists hold only the tools the object's data level and grant make
      visible. Hidden tools are absent.
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    responses:
      "200":
        description: The four capability groups.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TenantAgentCapabilities'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "503":
        description: The assistant is off.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/AssistantError'

/api/v1/pipelines/{tenant}/agent/run:
  post:
    operationId: runTenantAgent
    tags: [TenantAgents]
    summary: Requests a manual Tenant agent run.
    description: >
      Publishes a tenantagent.run_requested activity for the placement cluster
      of the Tenant. The run starts later, on the runner. A kill switch or a
      spent day budget still answers 202, and the session ends skipped.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TenantAgentRunRequest'
    parameters:
      - $ref: '../components/parameters.yaml#/tenant'
    responses:
      "202":
        description: The run request is published.
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: {type: string, enum: [requested]}
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        description: The Tenant agent cannot run now.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TenantAgentError'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'

/api/v1/agents:
  get:
    operationId: listAgents
    tags: [TenantAgents]
    summary: Lists every TenantAgent with its state, spend, and unattended grant.
    description: The cluster-wide view. It needs agentsessions:read.
    responses:
      "200":
        description: Every TenantAgent.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TenantAgentItemList'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'

/api/v1/agents/{namespace}/{name}/unattended:
  put:
    operationId: putAgentUnattended
    tags: [TenantAgents]
    summary: Grants or revokes the unattended writes of one TenantAgent.
    description: >
      A true grant copies the object's current unattendedWrites, pinned to
      its UID. A later spec edit does not extend the grant. It needs
      tenantagents:unattended.
    parameters:
      - name: namespace
        in: path
        required: true
        schema:
          type: string
      - name: name
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas.yaml#/TenantAgentUnattendedRequest'
    responses:
      "200":
        description: The grant after the change.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TenantAgentUnattendedResult'
      "400":
        $ref: '../components/responses.yaml#/BadRequest'
      "401":
        $ref: '../components/responses.yaml#/Unauthorized'
      "403":
        $ref: '../components/responses.yaml#/Forbidden'
      "404":
        $ref: '../components/responses.yaml#/NotFound'
      "409":
        description: Nothing can be granted, because the object names no unattended writes.
        content:
          application/json:
            schema:
              $ref: '../components/schemas.yaml#/TenantAgentError'
      "503":
        $ref: '../components/responses.yaml#/ServiceUnavailable'
