openapi: "3.0.3"
info:
  title: Varroa BFF API
  description: >
    Varroa is a Jenkins operator that manages controllers, RBAC,
    API keys, and identity within a Kubernetes cluster.

    ## Authentication

    **Bearer token (primary).** All API calls (except those explicitly
    marked unauthenticated) require an `Authorization: Bearer <token>`
    header. The token may be a session JWT obtained from
    `POST /api/v1/login` (local/LDAP) or via the OIDC flow, or a
    long-lived `vk_`-prefixed API key. The server routes `vk_`-prefixed
    tokens to the API-key verifier and everything else to the JWT
    provider.

    **Cookie (browser only).** On successful login the BFF sets an
    httpOnly `varroa_token` cookie. Browser-based clients (the Varroa
    dashboard) may use this cookie instead of a bearer header; the
    `GET /api/v1/me` endpoint accepts it as a fallback when no bearer
    token is present.

    **SSE ticket (browser EventSource).** Server-Sent Event streams
    use query-parameter authentication via `?ticket=<stream-ticket>`
    because the JavaScript `EventSource` API does not support custom
    headers. A short-lived ticket is obtained from
    `POST /api/v1/stream/ticket`.

    The CLI and generated Go client use the bearer header exclusively.
  version: "1.0.0"
  x-varroa-flows:
    cli-auth:
      description: >
        Browser-based CLI authentication flow. The CLI opens
        `https://<server>/cli-auth?port=<p>&state=<nonce>&name=<keyName>`,
        the user approves the request on the frontend page, which POSTs
        `/api/v1/me/apikeys {"name": "<keyName>"}` and then redirects the
        browser to `http://127.0.0.1:<p>/callback?state=<nonce>&token=<vk_>`
        to deliver the token to the CLI's loopback listener.
      query-params:
        port: Loopback listener port on 127.0.0.1.
        state: Anti-CSRF nonce, echoed back in the callback.
        name: Optional key display name; default "varroactl".
      callback: "http://127.0.0.1:{port}/callback?state={state}&token={token}"
servers:
  - url: "/"
    description: Host-relative — the client prepends the base URL.
security:
  - bearerAuth: []
