    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Session JWT (from POST /api/v1/login or the OIDC flow) or a
        long-lived vk_ API key. The server routes vk_-prefixed tokens
        to the API-key verifier and everything else to the JWT provider.
  schemas:
    APIRule:
