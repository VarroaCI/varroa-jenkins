  - name: teams
    description: Team management (admin).
  - name: runners
    description: External agent (runner) registration for a pipelines tenant.
  - name: identity
    description: Identity settings and built-in roles (admin).
  - name: controllers
    description: Full controller lifecycle management.
  - name: clusters
    description: Cluster membership and health.
  - name: rbac
    description: Role-based access control CRDs.
  - name: catalog
    description: Bundle catalog sources and items.
  - name: composedbundles
    description: Composed bundle management.
  - name: provisioning
    description: Provisioning configuration and defaults.
  - name: activity
    description: Activity feed and event streams.
  - name: streams
    description: Search, brood streams, and stream tickets.
  - name: mcp
    description: MCP Streamable HTTP endpoint.
  - name: broodops
    description: Brood operation management.
  - name: broodschedules
    description: Brood schedule management.
  - name: updatecenter
    description: Update center status and plugin inventory.
  - name: fleetplugins
    description: Fleet-wide installed-plugin inventory and version-range queries.
  - name: upgrade-tracking
    description: Upstream Jenkins version observation and upgrade candidate promotion.
  - name: Pipelines
    description: Team-scoped pipeline, run, log, and artifact surfaces.
  - name: CellPools
    description: Cell-pool capacity read and scale control.
  - name: Cells
    description: Cell load, tenant by tenant, for the operator surfaces.
