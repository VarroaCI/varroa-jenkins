name: Set up CI tools
description: >
  Installs CLI tools that the GitHub-hosted runner images preinstall but a
  self-hosted runner image may not. Every tool is a no-op when a suitable
  version is already on PATH, so this stays correct on both.

inputs:
  yq:
    description: Install mikefarah/yq v4 (a v3 on PATH is treated as missing).
    required: false
    default: "false"
  gh:
    description: Install the GitHub CLI.
    required: false
    default: "false"
  rg:
    description: Install ripgrep.
    required: false
    default: "false"
  make:
    description: Install GNU make (apt).
    required: false
    default: "false"
  helm:
    description: Install Helm v3.
    required: false
    default: "false"
  shellcheck:
    description: Install shellcheck (apt).
    required: false
    default: "false"
  envsubst:
    description: Install envsubst (apt gettext-base).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install yq (mikefarah v4)
      if: inputs.yq == 'true'
      shell: bash
      run: |
        set -euo pipefail
        # Scripts assert `yq --version` reports v4; a v3 binary must be replaced,
        # not accepted, so the check matches on the major version rather than
        # mere presence.
        if command -v yq >/dev/null 2>&1 && yq --version 2>&1 | grep -q ' v4\.'; then
          echo "yq already present: $(yq --version 2>&1)"
          exit 0
        fi
        # Pinned, not `latest`: the scripts assert v4, so the day yq v5 ships a
        # `latest` download would install it and break every workflow at once.
        ver=4.53.3
        sudo curl -sSL -o /usr/local/bin/yq \
          "https://github.com/mikefarah/yq/releases/download/v${ver}/yq_linux_amd64"
        sudo chmod +x /usr/local/bin/yq
        yq --version
        yq --version 2>&1 | grep -q " v${ver}\$" || {
          echo "ERROR: installed yq is not v${ver}: $(yq --version 2>&1)" >&2
          exit 1
        }

    - name: Install GitHub CLI
      if: inputs.gh == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v gh >/dev/null 2>&1; then
          echo "gh already present: $(gh --version | head -1)"
          exit 0
        fi
        # Installed from the release tarball rather than apt: no repo/key setup,
        # and it matches how yq is installed above.
        ver=2.96.0
        curl -sSL -o /tmp/gh.tar.gz \
          "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_amd64.tar.gz"
        sudo tar -xzf /tmp/gh.tar.gz -C /usr/local/bin --strip-components=2 \
          "gh_${ver}_linux_amd64/bin/gh"
        rm -f /tmp/gh.tar.gz
        gh --version

    - name: Install ripgrep
      if: inputs.rg == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v rg >/dev/null 2>&1; then
          echo "rg already present: $(rg --version | head -1)"
          exit 0
        fi
        # Pinned release tarball, matching how yq/gh are installed above.
        ver=14.1.1
        curl -sSL -o /tmp/rg.tar.gz \
          "https://github.com/BurntSushi/ripgrep/releases/download/${ver}/ripgrep-${ver}-x86_64-unknown-linux-musl.tar.gz"
        sudo tar -xzf /tmp/rg.tar.gz -C /usr/local/bin --strip-components=1 \
          "ripgrep-${ver}-x86_64-unknown-linux-musl/rg"
        rm -f /tmp/rg.tar.gz
        rg --version | head -1

    - name: Install make
      if: inputs.make == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v make >/dev/null 2>&1; then
          echo "make already present: $(make --version | head -1)"
          exit 0
        fi
        sudo apt-get update -qq
        sudo apt-get install -y -qq make
        make --version | head -1

    - name: Install Helm v3
      if: inputs.helm == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v helm >/dev/null 2>&1 && helm version --short 2>/dev/null | grep -q '^v3\.'; then
          echo "helm already present: $(helm version --short)"
          exit 0
        fi
        # Pinned tarball, matching how yq/gh are installed above.
        ver=3.19.0
        curl -sSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-v${ver}-linux-amd64.tar.gz"
        sudo tar -xzf /tmp/helm.tar.gz -C /usr/local/bin --strip-components=1 linux-amd64/helm
        rm -f /tmp/helm.tar.gz
        helm version --short

    - name: Install shellcheck
      if: inputs.shellcheck == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v shellcheck >/dev/null 2>&1; then
          echo "shellcheck already present: $(shellcheck --version | grep version:)"
          exit 0
        fi
        sudo apt-get update -qq
        sudo apt-get install -y -qq shellcheck
        shellcheck --version | grep version:

    - name: Install envsubst (gettext-base)
      if: inputs.envsubst == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if command -v envsubst >/dev/null 2>&1; then
          echo "envsubst already present"
          exit 0
        fi
        sudo apt-get update -qq
        sudo apt-get install -y -qq gettext-base
        command -v envsubst
