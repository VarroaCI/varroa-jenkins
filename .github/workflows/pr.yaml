name: PR

on:
  pull_request:
    branches: [main]
    # A draft is the local review phase. Only a ready pull request runs CI.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# One group per pull request. A new push cancels the run of the previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    # A draft skips this job, so every job that needs it also skips.
    if: github.event.pull_request.draft == false
    # GitHub-hosted on purpose: a docs-only PR must not wait for a runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.base.outputs.go == 'true' || steps.paths.outputs.goextra == 'true' }}
      charts: ${{ steps.paths.outputs.charts }}
      docker: ${{ steps.paths.outputs.docker }}
      frontend: ${{ steps.paths.outputs.frontend }}
      outbound: ${{ steps.base.outputs.outbound }}
    steps:
      # A changed file sets "go" only when it matches every rule. The negated
      # rules exclude the paths that no Go build, test, or lint reads. The same
      # step also sets "outbound" for frontend source that the outbound check reads.
      - id: base
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            go:
              - '**'
              - '!frontend/**'
              - '!**/*.md'
              - '!*.md'
              - '!docs/**'
              - '!charts/**'
            outbound:
              - 'frontend/{src/**,public/**,index.html}'
              - '!**/*.test.ts'
              - '!**/*.test.tsx'
              - '!**/*.spec.ts'
              - '!**/*.spec.tsx'
              - '!**/*.test.js'
              - '!**/*.test.jsx'
              - '!**/*.test.mjs'
              - '!**/*.spec.js'
              - '!**/*.spec.jsx'
              - '!**/*.spec.mjs'
              - '!frontend/src/test/**'
      # A changed file sets an output here when it matches one rule.
      # goextra lists the files under excluded paths that Go code reads.
      # Every docker path must also set "go": the image build needs Lint and Test.
      - id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            goextra:
              - 'charts/varroa/values.yaml'
              - 'charts/varroa/crds/**'
              - 'docs/security/outbound-connections.md'
              - 'docs/install/examples/**'
              - 'internal/jenkins/items/testdata/challenge/**'
            charts:
              - 'charts/**'
              - 'frontend/nginx.conf'
              - 'Makefile'
              - '.github/actions/**'
              - '.github/workflows/pr.yaml'
            docker:
              - 'Dockerfile*'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/**'
              - 'plugin/**'
              - 'hack/build-image-binaries.sh'
              - '.github/workflows/pr.yaml'
            frontend:
              - 'frontend/**'
              - 'api/openapi/**'
              - '.github/workflows/pr.yaml'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Pinned deliberately. With @latest, a golangci-lint release lands mid-week
      # and every open PR goes red on pre-existing code nobody touched. Bump this
      # on purpose, in its own PR, with the resulting findings fixed in the same
      # change — and keep it in step with release.yaml so a push to main cannot
      # fail a check a PR just passed.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - run: golangci-lint run --timeout 10m ./...

  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.charts == 'true' || needs.changes.outputs.outbound == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Each check step also runs after a failed check, so one failure does not hide the next.
      - name: Check comments
        run: go run ./hack/checkcomments .
      - name: Check outbound connections
        if: ${{ !cancelled() }}
        run: make check-outbound
      - name: Check generated-file helper
        if: ${{ !cancelled() }}
        run: |
          shellcheck hack/check-generated.sh hack/check-generated_test.sh
          make check-generated-test
      - name: Check varroactl platforms
        # Only a Go change can break the varroactl build, so the step needs the go output.
        # A separate build cache keeps the cross-compile output out of the saved setup-go cache.
        if: ${{ !cancelled() && needs.changes.outputs.go == 'true' }}
        env:
          GOCACHE: ${{ runner.temp }}/cross-gocache
        run: |
          shellcheck hack/check-varroactl-platforms.sh
          make check-varroactl-platforms
      - name: Check image binaries for arm64
        # The release images publish linux/arm64. The Lint and Test jobs compile only the host arch.
        # The step shares the cross-compile build cache of the varroactl step.
        if: ${{ !cancelled() && needs.changes.outputs.go == 'true' }}
        env:
          GOCACHE: ${{ runner.temp }}/cross-gocache
        run: |
          shellcheck hack/build-image-binaries.sh
          make check-image-binaries
      - name: Check Proto
        if: ${{ !cancelled() }}
        run: make check-proto
      - name: Check API client
        if: ${{ !cancelled() }}
        run: make check-client
      - name: Check challenge bundle
        if: ${{ !cancelled() }}
        # The committed bundle must equal the generator output of the case set.
        run: make challenge-bundle-check
      - name: Check bootstrap closure
        if: ${{ !cancelled() }}
        # Offline: re-verifies the committed bootstrap block against the committed
        # plugin set. A lock edit that drops or moves a varroa-mite-auth
        # dependency breaks authentication on every controller, and this is where
        # that gets caught instead of at Jenkins boot. Recomputing the closure
        # needs network + a built HPI, which is plugin-lock-refresh's job.
        run: go run ./cmd/bootstrapdeps --check
      # check-crds runs before "helm dependency build", which writes under charts/varroa/charts/.
      - name: Check CRDs
        if: ${{ !cancelled() }}
        run: make check-crds
      - name: Fetch chart dependencies
        if: ${{ !cancelled() }}
        # charts/varroa/charts/ is gitignored — the NATS subchart must be
        # fetched (pinned by Chart.lock) before lint/template. helm v3 needs
        # the repo registered first.
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/ --force-update
          helm dependency build charts/varroa
      - name: Helm lint (localdev overlay)
        if: ${{ !cancelled() }}
        run: helm lint charts/varroa -f charts/varroa/values-localdev.yaml
      - name: Helm template (localdev overlay renders)
        if: ${{ !cancelled() }}
        run: |
          helm template varroa charts/varroa \
            -f charts/varroa/values-localdev.yaml \
            --set operator.miteImage=ci-check \
            --set operator.image.tag=ci --set gateway.image.tag=ci \
            --set bff.image.tag=ci --set frontend.image.tag=ci \
            > /dev/null
          # NOTE: bare `helm template` mints fresh random NATS credentials each
          # run (no cluster for lookup()) — expected, render-only validation.
      - name: Shellcheck localdev driver
        if: ${{ !cancelled() }}
        run: shellcheck hack/localdev/localdev.sh
      - name: Validate localdev manifests
        if: ${{ !cancelled() }}
        # Core resources are schema-validated by kubeconform; Varroa CRs
        # (varroa.dev/v1alpha1) use -ignore-missing-schemas because deriving
        # JSON schemas from charts/varroa/crds/ in CI is brittle — CR field
        # correctness is covered by the live localdev e2e instead.
        # The kubeconform version is pinned. A new release can fail this step on code that did not change.
        # Bump it on purpose, in its own pull request.
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          export LOCALDEV_BUNDLE_HASH=ci LOCALDEV_MITE_IMAGE=ci-check LOCALDEV_GIT_IMAGE=ci-check
          for f in hack/localdev/manifests/*.yaml; do
            envsubst '$LOCALDEV_BUNDLE_HASH $LOCALDEV_MITE_IMAGE $LOCALDEV_GIT_IMAGE' < "$f"
            echo '---'
          done | "$(go env GOPATH)/bin/kubeconform" -strict -summary -ignore-missing-schemas
      - name: Validate OCI-layout fixture structure
        if: ${{ !cancelled() }}
        # Structural check: hack/localdev/pluginpack-fixture/ must be a valid
        # OCI image-layout (if present). Skips gracefully when the fixture
        # hasn't been generated yet. Requires no live cluster or registry.
        run: |
          go run ./hack/localdev/cmd/validate-oci-layout \
            --dir hack/localdev/pluginpack-fixture

  chart-tests:
    name: Chart tests
    needs: changes
    if: needs.changes.outputs.charts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ci-tools
        with:
          helm: "true"
          yq: "true"
          envsubst: "true"
          python3: "true"
          make: "true"
      - name: Fetch chart dependencies
        run: |
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/ --force-update
          helm dependency build charts/varroa
      - name: Run the chart golden tests
        run: make chart-test

  govulncheck:
    name: Vulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The govulncheck version is pinned. A new release can fail the scan on code that did not change.
      # Bump it on purpose, in its own pull request.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # Exit code 3 means that the code calls a vulnerable symbol. The step fails at once.
      # Exit codes 137 and 143 mean that the kernel or the runner killed the scan. The step fails at once.
      # Any other failure means that the scan did not finish. The step then tries again.
      - name: Run govulncheck
        run: |
          for attempt in 1 2 3; do
            rc=0
            govulncheck ./... || rc=$?
            case "$rc" in
              0) exit 0 ;;
              3)
                echo "::error title=Vulncheck::The code calls a vulnerable symbol. The report above names the fixed version."
                exit 3
                ;;
              # The kernel or the runner killed the scan (heap cap, cgroup limit).
              # A retry meets the same cap on the same runner.
              137|143)
                echo "::error title=Vulncheck::govulncheck was killed (exit $rc). Reduce the memory the scan needs, or raise the runner memory limit. A rerun on the same runner repeats this."
                exit "$rc"
                ;;
            esac
            echo "::warning title=Vulncheck::govulncheck stopped with exit code $rc before the scan finished. Attempt $attempt of 3."
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo "::error title=Vulncheck::govulncheck did not finish in 3 attempts. A network error such as \"tls: bad record MAC\" causes this. Run the failed jobs again."
          exit 1

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: go vet ./...
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc libc6-dev
      - run: CGO_ENABLED=1 go test -v -race -count=1 ./...

  build-backend:
    name: Build backend image
    needs: [changes, lint, test]
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          tags: varroa-jenkins:pr-${{ github.event.number || github.sha }}
          # A pull request uses no build cache. The release writes its cache on a tag ref,
          # and a pull request cannot read it.

  build-frontend:
    name: Build frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: varroa-frontend:pr-${{ github.event.number || github.sha }}
          # A pull request uses no build cache. The release writes its cache on a tag ref,
          # and a pull request cannot read it.

  frontend-test:
    name: Frontend test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run coverage
      - run: npm run build

  required:
    name: Required checks
    if: always()
    needs: [changes, lint, checks, chart-tests, govulncheck, test, frontend-test]
    # GitHub-hosted: this job only reads the results of the jobs it needs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A draft skips every job. A pass here could merge a pull request before CI runs.
      - name: Fail on a draft pull request
        if: github.event.pull_request.draft
        run: |
          echo "This pull request is a draft. CI runs when the pull request is ready for review."
          exit 1
      - name: Fail when a needed job did not succeed or skip
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error title=Required checks::These needed jobs did not pass: $failed."
            echo "Read the log of each failed job."
            echo "If a failed job shows a network error such as \"tls: bad record MAC\", the runner caused it. Run the failed jobs again: gh run rerun $RUN_ID --failed"
            echo "If the log shows a compile error, a test failure, or a finding, fix the code. A rerun does not help."
            exit 1
          fi
