items:
  - kind: folder
    name: folder-libraries
    displayName: "Folder with Libraries"
    description: "Folder with folderLibraries property and a modern-SCM retriever"
    properties:
      - folderLibraries:
          libraries:
            - libraryConfiguration:
                name: my-shared-lib
                implicit: false
                allowVersionOverride: true
                retriever:
                  modernSCM:
                    scm:
                      github:
                        repoOwner: fake-org
                        repository: shared-library
                        traits:
                          - gitHubBranchDiscovery:
                              strategyId: 3
