---
# Starter bundle — JCasC.
#
# This is what a Controller gets when spec.composedBundleRef is unset. It is
# deliberately the smallest configuration that yields a Jenkins you can actually
# build on: a system message that says where the config came from, and a
# Kubernetes cloud so builds get agents without any further setup.
#
# Constraints this file must keep (see bundles/AGENTS.md):
#   - No `plugins:` block. The plugin set comes from the resolved
#     JenkinsVersionProfile lock; pinning versions here would drift against it.
#   - No `securityRealm`. The OIDC realm needs a client-secret variable that the
#     bundle author supplies and Varroa does not inject, so naming it here would
#     fail the unresolved-variable check on every zero-config Controller.
#   - No `authorizationStrategy`. Varroa owns the authorization strategy and
#     strips that key during composition.
#   - Only variables the operator always injects may appear, and the
#     unresolved-variable scan does not skip comments: writing a dollar-brace
#     placeholder in a comment here fails provisioning exactly as a real one
#     would.
jenkins:
  systemMessage: >-
    This controller is running Varroa's built-in starter bundle. Replace it by
    setting spec.composedBundleRef on the Controller — see
    docs/tutorials/custom-bundle.md.
  clouds:
    - kubernetes:
        name: "kubernetes"
        # Empty serverUrl means "the cluster I am running in".
        serverUrl: ""
        namespace: "${varroa_controller_namespace}"
        jenkinsUrl: "${varroa_controller_endpoint}"
        # WebSocket agents connect back over HTTP(S) and need no inbound
        # agent port to be reachable from the pod network (see #315).
        webSocket: true
        connectTimeout: 5
        readTimeout: 15
        containerCap: 10
        maxRequestsPerHost: 32
        templates:
          - name: "default"
            namespace: "${varroa_controller_namespace}"
            nodeUsageMode: "NORMAL"
            containers:
              - name: "jnlp"
                # Pinned, not `latest-jdk21`. A moving tag would let the agent
                # change independently of the pinned core and plugin lock, and
                # an air-gapped cluster can only mirror an image it can name.
                # Refresh alongside the plugin lock; mirror this exact tag when
                # running without egress.
                image: "jenkins/inbound-agent:3384.v60d89463d9e0-1-jdk21"
                resourceRequestCpu: "100m"
                resourceRequestMemory: "256Mi"
                resourceLimitCpu: "500m"
                resourceLimitMemory: "512Mi"
                workingDir: "/home/jenkins/agent"
