version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
  settings:
    revive:
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    rules:
      - linters:
          - bodyclose
          - errcheck
        path: _test\.go
      - linters:
          - revive
        path: zz_generated\..*\.go
      - linters:
          - errcheck
        text: Error return value of `.*\.(Write|Encode|Fprintf)` is not checked
    paths:
      - third_party$
      - builtin$
      - examples$
      - \.cache/
      - \.claude/
      - internal/mite/proto/mitev1/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/varroaci/varroa-jenkins
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - \.cache/
      - internal/mite/proto/mitev1/
